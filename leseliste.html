            ${b.kurz ? `<span class="ak">${esc(b.kurz)}</span>` : ''}
            <span class="am">
              <span>${esc(b.autor)}</span>
              ${b.jahr != null ? `<span class="num">${esc(jahrText(b.jahr))}</span>` : ''}
              ${b.seiten ? `<span class="num">${b.seitenUnsicher ? '~' : ''}${b.seiten} S.</span>` : ''}
              ${b.schwierigkeit ? stufeHtml(b.schwierigkeit) : ''}
            </span>
          </span>
          <span class="chev">${ICON.chev}</span>
        </summary>
        <div class="ab">${b.beschreibung ? esc(b.beschreibung).replace(/\n/g, '<br>') : '<em style="color:var(--text-3)">Noch keine Beschreibung.</em>'}</div>`;
      d.querySelector('.ab').addEventListener('click', () => buchOeffnen(b.id));
      wrap.appendChild(d);
    });
  });
}

/* Alle Autoren der aktiven leseliste mit Lebensdaten und Biographie. */
function autorenMalen(root) {
  const map = new Map();
  buecherAktiv().forEach(b => {
    const name = (b.autor || '').trim() || 'Ohne Autor';
    if (!map.has(name)) map.set(name, { name, buecher: [], geb: b.autorGeb, gest: b.autorGest, bio: b.autorBio || '' });
    const e = map.get(name);
    e.buecher.push(b);
    if (!e.bio && b.autorBio) e.bio = b.autorBio;
    if (e.geb == null && b.autorGeb != null) e.geb = b.autorGeb;
    if (e.gest == null && b.autorGest != null) e.gest = b.autorGest;
  });
  const liste = Array.from(map.values()).sort((a, b) => b.buecher.length - a.buecher.length || a.name.localeCompare(b.name, 'de'));
  if (!liste.length) {
    root.innerHTML = `<div class="empty"><strong>Noch keine Autoren</strong>Sie ergeben sich aus den Büchern deiner Liste.</div>`;
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'section';
  wrap.insertAdjacentHTML('beforeend',
    `<div class="section-head"><h2>Autoren</h2><span class="eyebrow">${liste.length}</span></div>`);
  root.appendChild(wrap);
  liste.forEach(a => {
    const lebt = lebensdaten(a.geb, a.gest);
    const d = document.createElement('details');
    d.className = 'akk';
    d.innerHTML = `
      <summary>
        <span style="flex:1;min-width:0">
          <span class="at">${esc(a.name)}</span>
          <span class="am">
            ${lebt ? `<span class="num">${esc(lebt)}</span>` : ''}
            <span>${pl(a.buecher.length, 'Werk', 'Werke')}</span>
            <span>${a.buecher.filter(b => b.status === 'gelesen').length} gelesen</span>
          </span>
        </span>
        <span class="chev">${ICON.chev}</span>
      </summary>
      <div class="ab">
        ${a.bio ? esc(a.bio).replace(/\n/g, '<br>') : '<em style="color:var(--text-3)">Noch keine Biographie hinterlegt.</em>'}
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px" data-werke></div>
      </div>`;
    const w = $('[data-werke]', d);
    a.buecher.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.style.cssText = 'justify-content:flex-start;text-align:left;white-space:normal';
      btn.innerHTML = `${esc(b.titel)}${b.jahr != null ? ' <span class="num" style="color:var(--text-3)">' + esc(jahrText(b.jahr)) + '</span>' : ''}`;
      btn.onclick = () => buchOeffnen(b.id);
      w.appendChild(btn);
    });
    wrap.appendChild(d);
  });
}

/* Tagesprotokolle: was an welchem Tag gelesen wurde. */
function tageMalen(root) {
  const tage = tageMitSitzungen();
  const ziel = +DB.einstellungen.zielSeiten || 0;
  const wrap = document.createElement('div');
  wrap.className = 'section';
  root.appendChild(wrap);

  const z = zielHeute();
  wrap.insertAdjacentHTML('beforeend', `
    <div class="list-card" style="margin-bottom:16px">
      <div class="rowline">
        <span class="grow">
          <span class="rn">Tagesziel</span>
          <span class="rm">${ziel ? ziel + ' Seiten pro Tag · heute ' + z.gelesen : 'Noch keins gesetzt'}</span>
        </span>
        <button class="btn btn-sm" data-ziel>${ziel ? 'Ändern' : 'Setzen'}</button>
      </div>
    </div>`);
  $('[data-ziel]', wrap).onclick = () => zielBearbeiten();

  if (!tage.length) {
    wrap.insertAdjacentHTML('beforeend',
      `<div class="empty" style="margin:0"><strong>Noch keine Tage</strong>Jede Lese-Sitzung schreibt einen Eintrag. Starte die Stoppuhr oder trage eine Sitzung von Hand ein.</div>`);
    return;
  }

  /* Balken der letzten drei Wochen */
  const heuteD = new Date();
  const punkte = [];
  for (let i = 20; i >= 0; i--) {
    const d = new Date(heuteD.getFullYear(), heuteD.getMonth(), heuteD.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    const t = tage.find(x => x.datum === iso);
    punkte.push({ label: fmtDatum(iso), kurz: String(d.getDate()), wert: t ? t.seiten : 0 });
  }
  wrap.appendChild(karte('Seiten pro Tag', 'Die letzten drei Wochen.' + (ziel ? ' Die gestrichelte Linie ist dein Ziel.' : ''),
    zeitBalken(punkte, v => fmtZahl(v) + ' Seiten'), '',
    tabelleHtml(['Tag', 'Seiten'], punkte.map(x => [x.label, fmtZahl(x.wert)]))));

  const geschaffte = ziel ? tage.filter(t => t.seiten >= ziel).length : 0;
  const summe = tage.reduce((s, t) => s + t.seiten, 0);
  const tiles = document.createElement('div');
  tiles.className = 'tiles';
  tiles.innerHTML = [
    ['Lesetage', String(tage.length), 'mit mindestens einer Sitzung'],
    ['Seiten je Lesetag', fmtZahl(Math.round(summe / tage.length)), 'im Schnitt'],
    ziel ? ['Ziel erreicht', geschaffte + ' <small>/ ' + tage.length + '</small>', Math.round(geschaffte / tage.length * 100) + ' % der Lesetage'] : null
  ].filter(Boolean).map(([k, v, sub]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${esc(sub)}</div></div>`).join('');
  wrap.appendChild(tiles);

  wrap.insertAdjacentHTML('beforeend', `<div class="section-head" style="margin:18px 0 9px"><h2>Protokoll</h2><span class="eyebrow">${tage.length}</span></div>`);
  const karteEl = document.createElement('div');
  karteEl.className = 'list-card';
  tage.slice(0, 120).forEach(t => {
    const geschafft = ziel && t.seiten >= ziel;
    const r = document.createElement('div');
    r.className = 'rowline';
    r.innerHTML = `
      <span class="grow">
        <span class="rn num">${fmtDatum(t.datum)}${geschafft ? ' <span style="color:var(--good)">✓</span>' : ''}</span>
        <span class="rm">${t.seiten ? t.seiten + ' Seiten · ' : ''}${fmtDauer(t.minuten)} · ${pl(t.buecher, 'Buch', 'Bücher')}</span>
      </span>
      ${ziel ? `<span class="zbar" style="width:64px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden">
        <i style="display:block;height:100%;border-radius:99px;background:${geschafft ? 'var(--good)' : 'var(--accent)'};width:${clamp(t.seiten / ziel * 100, 0, 100)}%"></i></span>` : ''}`;
    karteEl.appendChild(r);
  });
  wrap.appendChild(karteEl);
}

function zahlenMalen(root) {
  root.innerHTML = '';
  if (!DB.buecher.length) {
    root.innerHTML = `<div class="empty"><strong>Nichts auszuwerten</strong>Sobald Bücher im Plan stehen, entstehen hier die Graphen.</div>`;
    return;
  }
  const plan = aktiverPlan();
  const ueberAlles = uebersichtAllePlaene || !plan;
  const bloecke = ueberAlles ? alleBloeckeSortiert() : bloeckeVonPlan(plan.id);

  if (DB.lesepleane.length > 1) {
    const chips = document.createElement('div');
    chips.className = 'chiprow';
    chips.style.marginBottom = '12px';
    chips.innerHTML = `
      <button class="chip" data-u="plan" aria-pressed="${!ueberAlles}">${esc(plan ? plan.name : 'leseliste')}</button>
      <button class="chip" data-u="alle" aria-pressed="${ueberAlles}">Alle leselisten</button>`;
    $$('[data-u]', chips).forEach(c => c.onclick = () => { uebersichtAllePlaene = c.dataset.u === 'alle'; viewMalen(); });
    root.appendChild(chips);
  }

  const wrap = document.createElement('div');
  wrap.className = 'section';
  root.appendChild(wrap);

  const alle = ueberAlles ? DB.buecher : buecherImPlan(plan.id);
  if (!alle.length) {
    wrap.innerHTML = `<div class="empty" style="margin:0"><strong>„${esc(plan.name)}" ist leer</strong>Lege Bücher an, dann entstehen hier die Graphen.</div>`;
    return;
  }
  const gelesen = alle.filter(b => b.status === 'gelesen');
  const seitenGes = alle.reduce((s, b) => s + (b.seiten || 0), 0);
  const seitenGelesen = gelesen.reduce((s, b) => s + (b.seiten || 0), 0);
  const minGes = alle.reduce((s, b) => s + buchMinuten(b), 0);
  const seitenAusSessions = alle.reduce((s, b) => s + buchSeitenGelesen(b), 0);
  const tempoGes = (minGes > 30 && seitenAusSessions) ? seitenAusSessions / (minGes / 60) : null;
  const kosten = alle.reduce((s, b) => s + (b.preis || 0), 0);
  const mitPreis = alle.filter(b => b.preis != null);
  const notizen = alle.reduce((s, b) => s + b.notizen.length, 0);

  /* Prognose aus dem Tempo der letzten Sitzungen */
  const sess = [];
  alle.forEach(b => b.sessions.forEach(s => sess.push(s)));
  sess.sort((a, b) => a.datum < b.datum ? -1 : 1);
  let prognose = '–';
  if (sess.length >= 2 && seitenAusSessions > 0) {
    const tage = Math.max(1, (new Date(sess[sess.length - 1].datum) - new Date(sess[0].datum)) / 86400000);
    const proTag = seitenAusSessions / tage;
    const rest = Math.max(0, seitenGes - seitenGelesen);
    if (proTag > 0.2 && rest > 0) {
      const d = new Date(Date.now() + rest / proTag * 86400000);
      prognose = d.getFullYear() > new Date().getFullYear() + 40 ? 'sehr fern' : MONATE[d.getMonth()] + ' ' + d.getFullYear();
    } else if (!rest) prognose = 'geschafft';
  }

  const tiles = document.createElement('div');
  tiles.className = 'tiles';
  tiles.innerHTML = [
    ['Gelesen', gelesen.length + ' <small>/ ' + alle.length + '</small>', Math.round(alle.length ? gelesen.length / alle.length * 100 : 0) + ' % der Liste'],
    ['Seiten gelesen', fmtZahl(seitenGelesen), 'von ' + fmtZahl(seitenGes)],
    ['Lesezeit', fmtDauerKurz(minGes), pl(sess.length, 'Sitzung', 'Sitzungen')],
    ['Tempo', tempoGes ? fmtZahl(tempoGes) + ' <small>S./h</small>' : '–', 'aus den Sitzungen'],
    ['Kosten', kosten ? fmtGeld(kosten) : '–', mitPreis.length + ' von ' + alle.length + ' mit Preis'],
    ['Notizen', fmtZahl(notizen), pl(DB.themen.length, 'Themenfeld', 'Themenfelder')],
    ['Fehlt mir', String(alle.filter(fehltMir).length), (() => {
      const s = alle.filter(fehltMir).reduce((x, b) => x + (b.preis || 0), 0);
      return s ? fmtGeld(s) + ' eingetragen' : 'ohne Preisangabe';
    })()],
    ['Fertig etwa', prognose, 'bei bisherigem Tempo']
  ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join('');
  wrap.appendChild(tiles);

  /* --- Fortschritt über die Zeit --- */
  if (sess.length) {
    const von = new Date(sess[0].datum), bis = new Date();
    const monate = monatsListe(von, bis);
    const proMonat = {};
    sess.forEach(s => {
      const k = s.datum.slice(0, 7);
      const seiten = (s.von != null && s.bis != null && s.bis > s.von) ? s.bis - s.von : 0;
      proMonat[k] = (proMonat[k] || 0) + seiten;
    });
    const punkte = monate.map(m => ({ label: m.label, kurz: m.kurz, wert: proMonat[m.key] || 0 }));
    wrap.appendChild(karte('Seiten pro Monat', 'Aus den Lese-Sitzungen, also nur dort, wo du Seite von und bis eingetragen hast.',
      zeitBalken(punkte, v => fmtZahl(v) + ' Seiten'), '',
      tabelleHtml(['Monat', 'Seiten'], punkte.map(p => [p.label, fmtZahl(p.wert)]))));

    /* Bücher kumuliert – Abschluss aus der letzten Sitzung eines gelesenen Buches */
    const fertig = gelesen.map(b => {
      const ss = b.sessions.slice().sort((x, y) => x.datum < y.datum ? -1 : 1);
      return ss.length ? ss[ss.length - 1].datum : null;
    }).filter(Boolean).sort();
    if (fertig.length) {
      let k = 0;
      const punkte2 = monate.map(m => {
        k += fertig.filter(d => d.slice(0, 7) === m.key).length;
        return { label: m.label, kurz: m.kurz, wert: k };
      });
      wrap.appendChild(karte('Gelesene Bücher, aufsummiert',
        `Abgeleitet aus der letzten Sitzung je Buch. ${gelesen.length - fertig.length > 0 ? (gelesen.length - fertig.length) + ' gelesene Bücher ohne Sitzung fehlen in dieser Kurve.' : ''}`,
        linie(punkte2, v => fmtZahl(v) + ' Bücher'), '',
        tabelleHtml(['Monat', 'Bücher'], punkte2.map(p => [p.label, fmtZahl(p.wert)]))));
    }
  } else {
    wrap.appendChild(karte('Fortschritt über die Zeit', '',
      `<div class="hinweis">Noch keine Lese-Sitzung erfasst. Starte im Buch unter „Lesen“ die Stoppuhr oder trage eine Sitzung von Hand ein – danach entsteht hier die Kurve.</div>`));
  }

  /* --- Blöcke im Vergleich --- */
  const bl = bloecke.map(blk => {
    const bs = buecherIn(blk.id);
    const g = bs.filter(x => x.status === 'gelesen').reduce((s, x) => s + (x.seiten || 0), 0);
    const o = bs.reduce((s, x) => s + (x.seiten || 0), 0) - g;
    return { label: blk.name, segmente: [{ wert: g, farbe: 'var(--good)', name: 'gelesen' }, { wert: o, farbe: 'var(--border-strong)', name: 'offen' }], wert: g + o, anzeige: fmtZahl(g + o) + ' S.', gelesen: g, offen: o, werke: bs.length };
  }).filter(x => x.wert > 0);
  if (bl.length) {
    wrap.appendChild(karte('Blöcke nach Seitenumfang', 'Wie viel Papier hinter jedem Block steckt – und wie viel davon schon gelesen ist.',
      balken(bl, { fmt: v => fmtZahl(v) + ' S.' }),
      `<span><i style="background:var(--good)"></i>gelesen</span><span><i style="background:var(--border-strong)"></i>offen</span>`,
      tabelleHtml(['Block', 'Werke', 'Gelesen (S.)', 'Offen (S.)'], bl.map(x => [x.label, x.werke, fmtZahl(x.gelesen), fmtZahl(x.offen)]))));
  }

  /* --- Kosten --- */
  if (mitPreis.length) {
    const proBlock = bloecke.map(blk => ({
      label: blk.name,
      wert: buecherIn(blk.id).reduce((s, b) => s + (b.preis || 0), 0)
    })).filter(x => x.wert > 0).sort((a, b) => b.wert - a.wert);
    const seitenMitPreis = mitPreis.reduce((s, b) => s + (b.seiten || 0), 0);
    const centProSeite = seitenMitPreis ? kosten / seitenMitPreis * 100 : null;
    const teuerste = mitPreis.slice().sort((a, b) => (b.preis || 0) - (a.preis || 0)).slice(0, 8)
      .map(b => ({ label: b.titel, wert: b.preis, farbe: 'var(--s2)' }));
    wrap.appendChild(karte('Kosten je Block', `Summe ${fmtGeld(kosten)}, im Schnitt ${fmtGeld(kosten / mitPreis.length)} je Buch${centProSeite ? ', ' + fmtZahl(centProSeite, 1) + ' Cent je Seite' : ''}. Ein Kaufdatum wird nicht erfasst, deshalb gibt es keine Kostenkurve über die Zeit.`,
      balken(proBlock, { fmt: fmtGeld }), '',
      tabelleHtml(['Block', 'Kosten'], proBlock.map(x => [x.label, fmtGeld(x.wert)]))));
    if (teuerste.length > 1) {
      wrap.appendChild(karte('Teuerste Bücher', '', balken(teuerste, { fmt: fmtGeld }), '',
        tabelleHtml(['Buch', 'Preis'], teuerste.map(x => [x.label, fmtGeld(x.wert)]))));
    }
  }

  /* --- Lesetempo --- */
  const tempi = alle.map(b => ({ b, t: buchTempo(b) })).filter(x => x.t)
    .sort((a, b) => b.t - a.t).slice(0, 12)
    .map(x => ({ label: x.b.titel, wert: x.t, farbe: 'var(--s7)' }));
  if (tempi.length) {
    wrap.appendChild(karte('Lesetempo je Buch', 'Seiten pro Stunde, aus deinen Sitzungen. Wo du langsam liest, steckt meist die Arbeit.',
      balken(tempi, { fmt: v => fmtZahl(v) + ' S./h' }), '',
      tabelleHtml(['Buch', 'Seiten/h'], tempi.map(x => [x.label, fmtZahl(x.wert)]))));
  }

  /* --- Notizen --- */
  const nachArt = DB.arten.map(a => ({
    label: a.name, farbe: 'var(--' + a.farbe + ')',
    wert: alle.reduce((s, b) => s + b.notizen.filter(n => n.artId === a.id).length, 0)
  })).filter(x => x.wert > 0).sort((a, b) => b.wert - a.wert);
  if (nachArt.length) {
    wrap.appendChild(karte('Notizen nach Art', 'Was für Spuren du hinterlässt.',
      balken(nachArt), nachArt.map(x => `<span><i style="background:${x.farbe}"></i>${esc(x.label)}</span>`).join(''),
      tabelleHtml(['Art', 'Notizen'], nachArt.map(x => [x.label, x.wert]))));
  }
  const nachThema = DB.themen.map(t => ({
    label: t.name, farbe: 'var(--s1)',
    wert: alle.reduce((s, b) => s + b.notizen.filter(n => n.themaId === t.id).length, 0)
  })).filter(x => x.wert > 0).sort((a, b) => b.wert - a.wert);
  if (nachThema.length) {
    const top = nachThema.slice(0, 8);
    const rest = nachThema.slice(8).reduce((s, x) => s + x.wert, 0);
    if (rest) top.push({ label: 'Weitere ' + (nachThema.length - 8), wert: rest, farbe: 'var(--text-3)' });
    wrap.appendChild(karte('Notizen nach Themenfeld', 'Buchübergreifend – das sind die Fäden, an denen du ziehst.',
      balken(top), '', tabelleHtml(['Themenfeld', 'Notizen'], nachThema.map(x => [x.label, x.wert]))));
  }
}
/* ============================================================
   Themenfelder über alle Bücher hinweg
   ============================================================ */
let notizenUnter = 'themen';

function notizenTabMalen(root) {
  const unter = [['themen', 'Themenfelder'], ['arten', 'Arten'], ['alle', 'Alle Notizen'], ['galerie', 'Galerie']];
  root.innerHTML = `
    <div class="chiprow">
      ${unter.map(([k, l]) => `<button class="chip" data-unter="${k}" aria-pressed="${notizenUnter === k}">${l}</button>`).join('')}
    </div>
    <div id="notizenInhalt" style="margin-top:14px"></div>`;
  $$('[data-unter]', root).forEach(c => c.onclick = () => { notizenUnter = c.dataset.unter; viewMalen(); });

  const ziel = $('#notizenInhalt', root);
  if (notizenUnter === 'themen') gruppenGlobal(ziel, 'thema');
  else if (notizenUnter === 'arten') gruppenGlobal(ziel, 'art');
  else if (notizenUnter === 'alle') alleNotizenGlobal(ziel);
  else galerieGlobal(ziel);
}

/* Themenfelder oder Arten über alle Bücher hinweg. */
function gruppenGlobal(root, art) {
  const nachThema = art === 'thema';
  const zaehl = new Map();
  alleNotizen().forEach(({ buch, notiz }) => {
    const k = (nachThema ? notiz.themaId : notiz.artId) || '__ohne';
    if (!zaehl.has(k)) zaehl.set(k, { n: 0, buecher: new Set() });
    const e = zaehl.get(k); e.n++; e.buecher.add(buch.id);
  });
  const liste = Array.from(zaehl.entries()).map(([k, v]) => ({
    id: k === '__ohne' ? null : k,
    name: k === '__ohne' ? (nachThema ? 'Ohne Themenfeld' : 'Ohne Art') : (nachThema ? themaName(k) : artName(k)),
    farbe: (!nachThema && k !== '__ohne') ? artFarbe(k) : null,
    n: v.n, b: v.buecher.size
  })).sort((a, b) => b.n - a.n);

  root.innerHTML = `
    <div class="section">
      <div class="section-head">
        <h2>${nachThema ? 'Themenfelder' : 'Arten'}</h2>
        <button class="btn btn-sm btn-ghost" data-verwalten>Verwalten</button>
      </div>
      ${liste.length ? '<div data-liste></div>' : `<div class="empty"><strong>Noch nichts da</strong>${nachThema
      ? 'Gib deinen Notizen ein Themenfeld – dann laufen hier die Fäden aus allen Büchern zusammen.'
      : 'Sobald Notizen eine Art tragen, sammeln sie sich hier über alle Bücher.'}</div>`}
    </div>`;
  $('[data-verwalten]', root).onclick = nachThema ? themenVerwalten : artenVerwalten;

  const l = $('[data-liste]', root);
  if (!l) return;
  liste.forEach(t => {
    const row = document.createElement('button');
    row.className = 'grouprow';
    row.innerHTML = `
      ${t.farbe ? `<span class="swatch" style="width:11px;height:11px;border-radius:4px;background:${t.farbe};flex:0 0 auto"></span>` : ''}
      <span class="grow">
        <span class="gname">${esc(t.name)}</span>
        <span class="gmeta">${pl(t.n, 'Notiz', 'Notizen')} aus ${pl(t.b, 'Buch', 'Büchern')}</span>
      </span><span class="count num">${t.n}</span><span class="chev">${ICON.chev}</span>`;
    row.onclick = () => sammlungOeffnen(t.name, nachThema
      ? n => (n.themaId || null) === t.id
      : n => (n.artId || null) === t.id);
    l.appendChild(row);
  });
}

/* Alle Notizen aller Bücher, nach Buch und Seite. */
function alleNotizenGlobal(root) {
  const gesamt = alleNotizen().length;
  root.innerHTML = `
    <div class="section">
      <div class="section-head"><h2>Alle Notizen</h2><span class="eyebrow">${gesamt}</span></div>
      <div data-l></div>
    </div>`;
  const l = $('[data-l]', root);
  if (!gesamt) {
    l.innerHTML = `<div class="empty"><strong>Noch keine Notizen</strong>Öffne ein Buch und schreib die erste.</div>`;
    return;
  }
  buecherNachPlan().forEach(b => {
    if (!b.notizen.length) return;
    const h = document.createElement('div');
    h.className = 'section-head';
    h.style.margin = '16px 0 8px';
    h.innerHTML = `<h2 class="serif" style="font-weight:600">${esc(b.titel)}</h2><span class="eyebrow">${pl(b.notizen.length, 'Notiz', 'Notizen')}</span>`;
    l.appendChild(h);
    b.notizen.slice().sort((a, c) => seiteZahl(a.seite) - seiteZahl(c.seite))
      .forEach(n => l.appendChild(notizKarte(b, n, () => viewMalen())));
  });
}

/* Alle Fotos aller Bücher. */
function galerieGlobal(root) {
  const bilder = [];
  buecherNachPlan().forEach(b => {
    b.notizen.slice().sort((a, c) => seiteZahl(a.seite) - seiteZahl(c.seite))
      .forEach(n => n.bilder.forEach(x => bilder.push({ src: x.src, seite: n.seite, notiz: n, buch: b })));
  });
  root.innerHTML = `
    <div class="section">

      $('[data-ok]', s2).onclick = () => {

        if (!neu) return;
        aendern(() => {

            DB.themen = DB.themen.filter(x => x.id !== t.id);

      };
    });

    });

      const s2 = blatt('Neues Themenfeld', `<div class="field"><input type="text" data-n placeholder="z.B. Entfremdung"></div>

        if (!n) return;
        aendern(() => themaFindenOderAnlegen(n));
        layerSchliessen(); malen(); viewMalen();

    };
  };
  malen();
}

function sucheOeffnen() {
  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><input type="text" data-q placeholder="Bücher, Autoren, Notizen, Themen …" autocomplete="off"></div>
    </div>
    <div class="ovl-body" style="padding:12px 14px 40px" data-erg>
      <p class="hinweis">Tippe los. Gesucht wird in Titeln, Autoren, Beschreibungen, Notizen und Themenfeldern.</p>
    </div>`;
  const erg = $('[data-erg]', node);
  const suchen = () => {
    const q = $('[data-q]', node).value.trim().toLowerCase();
    if (q.length < 2) { erg.innerHTML = `<p class="hinweis">Mindestens zwei Zeichen.</p>`; return; }
    const buecher = DB.buecher.filter(b =>
      [b.titel, b.autor, b.beschreibung, b.ausgabe].some(x => (x || '').toLowerCase().includes(q)));
    const notizen = alleNotizen().filter(({ notiz }) =>
      (notiz.text || '').toLowerCase().includes(q) || themaName(notiz.themaId).toLowerCase().includes(q));
    erg.innerHTML = '';
    if (!buecher.length && !notizen.length) { erg.innerHTML = `<div class="empty"><strong>Nichts gefunden</strong>Für „${esc(q)}“ gibt es keinen Treffer.</div>`; return; }
    if (buecher.length) {
      erg.insertAdjacentHTML('beforeend', `<div class="eyebrow" style="margin:4px 0 8px">${buecher.length} ${buecher.length === 1 ? 'Buch' : 'Bücher'}</div>`);
      buecher.slice(0, 30).forEach(b => {
        const r = document.createElement('button');
        r.className = 'grouprow';
        r.innerHTML = `<span class="grow"><span class="gname serif">${esc(b.titel)}</span><span class="gmeta">${esc(b.autor)}${b.jahr != null ? ' · ' + esc(jahrText(b.jahr)) : ''}</span></span><span class="chev">${ICON.chev}</span>`;
        r.onclick = () => buchOeffnen(b.id);
        erg.appendChild(r);
      });
    }
    if (notizen.length) {
      erg.insertAdjacentHTML('beforeend', `<div class="eyebrow" style="margin:16px 0 8px">${notizen.length} ${notizen.length === 1 ? 'Notiz' : 'Notizen'}</div>`);
      notizen.slice(0, 40).forEach(({ buch, notiz }) => {
        const k = notizKarte(buch, notiz, suchen);
        k.insertAdjacentHTML('afterbegin', `<div class="eyebrow" style="margin-bottom:6px">${esc(buch.titel)}</div>`);
        erg.appendChild(k);
      });
    }
  };
  let t;
  $('[data-q]', node).oninput = () => { clearTimeout(t); t = setTimeout(suchen, 180); };
  $('[data-back]', node).onclick = () => layerSchliessen();
  layerOeffnen(node);
  setTimeout(() => $('[data-q]', node).focus(), 80);
}

/* ============================================================
   Einkaufsliste: was fehlt und was als Nächstes drankommt
   ============================================================ */
const fehltMir = b => b.besitz === 'fehlt' || b.besitz === 'bestellt';
function einkaufDaten() {
  const alle = buecherNachPlan().filter(fehltMir);
  const naechste = alle.filter(b => b.einkauf);
  const rest = alle.filter(b => !b.einkauf);
  const summe = l => l.reduce((s, b) => s + (b.preis || 0), 0);
  return { alle, naechste, rest, summeNaechste: summe(naechste), summeAlle: summe(alle) };
}

async function dateiAnbieten(name, text, typ) {
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data: text }); toast('Gesichert: ' + name); return; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Abgebrochen.'); return; }
      console.error(e);
    }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: typ || 'text/plain' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Gesichert: ' + name);
  } catch (e) { toast('Kein Weg zum Speichern verfügbar.', 3500); }
}

function einkaufText() {
  const { naechste, rest, summeNaechste, summeAlle } = einkaufDaten();
  const zeile = b => {
    const teile = ['– ' + b.titel + ' — ' + (b.autor || 'ohne Autor')];
    const zusatz = [];
    if (b.ausgabe) zusatz.push(b.ausgabe);
    if (b.seiten) zusatz.push((b.seitenUnsicher ? 'ca. ' : '') + b.seiten + ' S.');
    if (b.besitz === 'bestellt') zusatz.push('bestellt');
    if (zusatz.length) teile.push('  (' + zusatz.join(', ') + ')');
    if (b.preis != null) teile.push('  ' + fmtGeld(b.preis));
    return teile.join('');
  };
  const heuteText = new Date().toLocaleDateString('de-DE');
  let out = 'Einkaufsliste – leseliste\nStand: ' + heuteText + '\n';
  if (naechste.length) {
    out += '\nALS NÄCHSTES (' + naechste.length + ')\n' + naechste.map(zeile).join('\n') + '\n';
    if (summeNaechste) out += 'Zwischensumme: ' + fmtGeld(summeNaechste) + '\n';
  }
  if (rest.length) out += '\nFEHLT AUSSERDEM (' + rest.length + ')\n' + rest.map(zeile).join('\n') + '\n';
  out += '\nSumme der eingetragenen Preise: ' + fmtGeld(summeAlle) + '\n';
  out += '(Bücher ohne Preis sind darin nicht enthalten.)\n';
  return out;
}

function einkaufslisteOeffnen() {
  const node = document.createElement('div');
  node.className = 'overlay';

    <div class="ovl-head">

    </div>

  const malen = () => {
    const { alle, naechste, rest, summeNaechste, summeAlle } = einkaufDaten();
    $('[data-sub]', node).textContent = alle.length
      ? pl(alle.length, 'Buch', 'Bücher') + (summeAlle ? ' · ' + fmtGeld(summeAlle) : '')

    if (!alle.length) {
      body.innerHTML = `<div class="empty"><strong>Nichts zu besorgen</strong>Alle Bücher deiner Listen sind als vorhanden oder aus der Bibliothek geführt.</div>`;
      return;
    }

    const abschnitt = (titel, liste, summe, hinweis) => {
      if (!liste.length) return;
      const h = document.createElement('div');
      h.className = 'section-head';
      h.style.margin = '6px 0 8px';
      h.innerHTML = `<h2>${esc(titel)} <span class="eyebrow" style="margin-left:6px">${liste.length}</span></h2>
        <span class="eyebrow">${summe ? fmtGeld(summe) : ''}</span>`;
      body.appendChild(h);
      if (hinweis) body.insertAdjacentHTML('beforeend', `<p class="hinweis" style="padding:0 0 8px">${hinweis}</p>`);
      const karte = document.createElement('div');
      karte.className = 'list-card';
      karte.style.marginBottom = '18px';
      liste.forEach(b => {
        const bes = BESITZ[b.besitz] || BESITZ.fehlt;
        const r = document.createElement('div');
        r.className = 'rowline';
        r.innerHTML = `
          <button data-mark="${b.id}" class="status-btn" style="width:26px;height:26px;${b.einkauf ? 'border-color:var(--accent);color:var(--accent);background:var(--accent-soft)' : ''}">${b.einkauf ? ICON.check : ''}</button>
          <button class="grow" data-oeffne="${b.id}" style="text-align:left">
            <span class="rn serif">${esc(b.titel)}</span>
            <span class="rm">${esc(b.autor)}${b.ausgabe ? ' · ' + esc(b.ausgabe) : ''}${b.besitz === 'bestellt' ? ' · bestellt' : ''}</span>
          </button>
          <span class="bval">${b.preis != null ? fmtGeld(b.preis) : '–'}</span>`;
        $('[data-mark]', r).onclick = () => { aendern(() => { b.einkauf = !b.einkauf; }); malen(); viewMalen(); };
        $('[data-oeffne]', r).onclick = () => buchOeffnen(b.id);
        karte.appendChild(r);
      });
      body.appendChild(karte);
    };

    abschnitt('Als Nächstes', naechste, summeNaechste,
      'Angetippt wandert ein Buch zwischen „Als Nächstes“ und der übrigen Liste.');
    abschnitt('Fehlt außerdem', rest, 0, naechste.length ? '' :
      'Tippe den Kreis an, um ein Buch für den nächsten Einkauf vorzumerken.');

    body.insertAdjacentHTML('beforeend',
      `<p class="hinweis">Bücher ohne Preis zählen nicht in die Summe. Den Preis trägst du im Buch unter „Bearbeiten“ ein.</p>`);
  };

  $('[data-back]', node).onclick = () => layerSchliessen();
  $('[data-ausgeben]', node).onclick = () => {
    const s = blatt('Einkaufsliste ausgeben', `
      <div class="btn-row">
        <button class="btn btn-primary" data-txt style="flex:1">Als Textdatei</button>
        <button class="btn" data-kopieren style="flex:1">In die Zwischenablage</button>
      </div>
      <pre style="margin-top:14px;max-height:36vh;overflow:auto;font-size:11px;color:var(--text-2);white-space:pre-wrap;font-family:'IBM Plex Mono',monospace">${esc(einkaufText())}</pre>`,
      { fokus: false });
    $('[data-txt]', s).onclick = () => { dateiAnbieten('einkaufsliste-' + heute() + '.txt', einkaufText()); layerSchliessen(); };
    $('[data-kopieren]', s).onclick = async () => {
      try { await navigator.clipboard.writeText(einkaufText()); toast('Kopiert.'); }
      catch (e) { toast('Kopieren ging nicht – nimm die Textdatei.', 3500); }
      layerSchliessen();
    };
  };
  layerOeffnen(node, () => viewMalen());
  malen();
}

    </div>

    <div class="section">
      <p class="hinweis">
        Diese Seite enthält selbst keine Daten – alles liegt in deinem Speicherort. Wenn du das Gerät wechselst,
        sichere eine Datei und lade sie drüben über „Daten aus Datei laden“.
      </p>
    </div>`;

  const vollBtn = $('[data-voll]', root);
  if (vollBtn) vollBtn.onclick = () => { vollbildUmschalten(); setTimeout(viewMalen, 300); };
  $('[data-vollstart]', root).onclick = () => {
    aendern(() => { DB.einstellungen.vollbildStart = !DB.einstellungen.vollbildStart; });
    viewMalen();
  };
  $$('[data-akzent]', root).forEach(b => b.onclick = () => {
    aendern(() => { DB.einstellungen.akzent = b.dataset.akzent; });
    themeAnwenden();
    viewMalen();
  });
  $('[data-plaene]', root).onclick = planWechsler;
  $('[data-einkauf]', root).onclick = einkaufslisteOeffnen;
  $('[data-einf]', root).onclick = einfuehrungZeigen;
  $('[data-zielx]', root).onclick = () => zielBearbeiten();
  $('[data-save]', root).onclick = () => Store.alsDateiSichern(false);
  $('[data-export]', root).onclick = () => Store.alsDateiSichern(false);
  $('[data-import]', root).onclick = () => importDialog(false);
  $('[data-wechseln]', root).onclick = () => setupZeigen(true);
  $('[data-theme]', root).onclick = () => { themeUmschalten(); viewMalen(); };
  $('[data-arten]', root).onclick = artenVerwalten;
  $('[data-auto]', root).onchange = e => {
    const v = clamp(Math.round(num(e.target.value) || 60), 15, 600);
    aendern(() => { DB.einstellungen.autosaveSek = v; });
    Store.autosaveStarten();
    viewMalen();
    toast('Sichert jetzt alle ' + v + ' Sekunden.');
  };
  $('[data-reset]', root).onclick = async () => {
    const ok = await bestaetigen('Wirklich alles löschen?',
      `${DB.buecher.length} Bücher, ${alleNotizen().length} Notizen und alle Fotos an diesem Speicherort werden gelöscht. Danach beginnst du wieder bei der Wahl des Speicherorts.`,
      'Alles löschen', true);
    if (!ok) return;
    const theme = DB.einstellungen.theme;
    DB = leereDb();
    DB.einstellungen.theme = theme;
    try {
      /* Erst den bisherigen Speicher wirklich leeren, dann die Verknüpfung lösen. */
      if (Store.modus === 'datei' && Store.handle) await Store.schreiben();
      await IDB.del('daten');
      await IDB.del('meta');
    } catch (e) { console.error(e); }
    clearInterval(Store.timer);
    clearTimeout(Store._kurz);
    Store.modus = null; Store.handle = null; Store.dirty = false;
    Store.letzteSicherung = 0; Store.fehler = null;
    themeAnwenden();
    setupZeigen(false);
    toast('Zurückgesetzt.');
  };
}

function artenVerwalten() {
  const s = blatt('Notiz-Arten', '<div data-l></div>', { fokus: false });
  const malen = () => {
    const l = $('[data-l]', s);
    const benutzt = id => alleNotizen().filter(x => x.notiz.artId === id).length;
    l.innerHTML = `<div class="list-card">${DB.arten.map(a => `
      <div class="rowline">
        <span class="swatch" style="width:12px;height:12px;border-radius:4px;background:var(--${a.farbe})"></span>
        <span class="grow"><span class="rn">${esc(a.name)}</span><span class="rm">${benutzt(a.id)} Notizen</span></span>
        <button class="icon-btn" data-farbe="${a.id}" aria-label="Farbe">◐</button>
        <button class="icon-btn" data-um="${a.id}" aria-label="Umbenennen">${ICON.edit}</button>
        <button class="icon-btn" data-del="${a.id}" aria-label="Löschen">${ICON.trash}</button>
      </div>`).join('')}</div>
      <button class="btn btn-block" style="margin-top:12px" data-neu>${ICON.plus} Art anlegen</button>`;

    $$('[data-farbe]', l).forEach(b => b.onclick = () => {
      const a = artById(b.dataset.farbe);
      aendern(() => { a.farbe = ART_FARBEN[(ART_FARBEN.indexOf(a.farbe) + 1) % ART_FARBEN.length]; });
      malen(); viewMalen();
    });
    $$('[data-um]', l).forEach(b => b.onclick = () => {
      const a = artById(b.dataset.um);
      const s2 = blatt('Umbenennen', `<div class="field"><input type="text" data-n value="${esc(a.name)}"></div>
        <button class="btn btn-primary btn-block" data-ok>Sichern</button>`);
      $('[data-ok]', s2).onclick = () => {
        const n = $('[data-n]', s2).value.trim();
        if (!n) return;
        aendern(() => { a.name = n; });
        layerSchliessen(); malen(); viewMalen();
      };
    });
    $$('[data-del]', l).forEach(b => b.onclick = async () => {
      const a = artById(b.dataset.del);
      const ok = await bestaetigen('Art löschen?', `„${esc(a.name)}“ verschwindet. Die ${benutzt(a.id)} Notizen bleiben und stehen dann unter „Ohne Art“.`, 'Löschen', true);
      if (!ok) return;
      aendern(() => {
        DB.buecher.forEach(x => x.notizen.forEach(n => { if (n.artId === a.id) n.artId = null; }));
        DB.arten = DB.arten.filter(x => x.id !== a.id);
      });
      malen(); viewMalen();
    });
    $('[data-neu]', l).onclick = () => {
      const s2 = blatt('Neue Art', `<div class="field"><input type="text" data-n placeholder="z.B. Sonstiges"></div>
        <button class="btn btn-primary btn-block" data-ok>Anlegen</button>`);
      $('[data-ok]', s2).onclick = () => {
        const n = $('[data-n]', s2).value.trim();
        if (!n) return;
        aendern(() => DB.arten.push({ id: uid(), name: n, farbe: ART_FARBEN[DB.arten.length % 8] }));
        layerSchliessen(); malen(); viewMalen();
      };
    };
  };
  malen();
}

   Los geht's
   ============================================================ */
$('#btnSuche').innerHTML = ICON.search;
$('#btnSuche').onclick = sucheOeffnen;
vollbildAutostart();
boot();




</script>
