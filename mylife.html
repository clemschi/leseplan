}

function autorBearbeiten(a, nachher) {
  const betroffen = DB.buecher.filter(b => buchAutoren(b).some(x => x.name === a.name));
  const s = blatt(a.name, `
    <div class="field">
      <label>Biographie</label>
      <textarea data-bio style="min-height:170px;font-family:'Literata',Georgia,serif;line-height:1.65">${esc(a.bio || '')}</textarea>
    </div>
    <div class="field">
      <label>Beeinflusst von</label>
      <textarea data-ein style="min-height:64px" placeholder="Namen mit Komma trennen">${esc((a.einfluss || []).join(', '))}</textarea>
      <span class="hint">Wer auf wen wirkt, ergibt sich daraus von selbst: Steht hier ein Name aus deiner Liste, taucht dieser Autor drüben unter „Wirkt auf“ auf.</span>
    </div>
    <p class="hinweis" style="padding:0 0 10px">Gilt für alle ${pl(betroffen.length, 'Eintrag', 'Einträge')} dieses Autors.</p>
    <button class="btn btn-primary btn-block" data-ok>Sichern</button>`, { fokus: false });
  $('[data-ok]', s).onclick = () => {
    const bio = $('[data-bio]', s).value.trim();
    const ein = $('[data-ein]', s).value.split(',').map(x => x.trim()).filter(Boolean);
    aendern(() => betroffen.forEach(b => {
      b.autoren = buchAutoren(b).map(x => x.name === a.name ? Object.assign({}, x, { bio, einfluss: ein.slice() }) : x);
      if (b.autoren[0] && b.autoren[0].name === a.name) { b.autorBio = bio; b.autorEinfluss = ein.slice(); }
    }));
    layerSchliessen();
    if (nachher) nachher();
  };
}

/* Der Steckbrief eines Autors: Einflüsse in beide Richtungen und seine Werke.
   Vernetzung und Zeitstrahl zeigen denselben Kasten. */
function autorSteckbriefMalen(name, alle, inv, info, aufloesen) {
  const a = alle.get(name);
  if (!a) { info.innerHTML = ''; return; }
  const von = a.einfluss.filter(q => autorAufloesen(alle, q));
  const auf = inv.get(name) || [];
  const nurText = a.einfluss.filter(q => !autorAufloesen(alle, q));
  /* Wer in beiden Reihen steht, steht in einer gegenseitigen Beziehung. */
  const aufgeloest = von.map(q => autorAufloesen(alle, q));
  const beide = new Set(auf.filter(n => aufgeloest.includes(n)));
  const kl = q => {
    const n = autorAufloesen(alle, q) || q;
    return 'en link' + (beide.has(n) ? ' beides' : '');
  };
  const lebt = lebensdaten(a.geb, a.gest);
  info.innerHTML = `
    <div class="section-head"><h2>${esc(name)}</h2>
      ${lebt ? `<span class="eyebrow num">${esc(lebt)}</span>` : ''}
      <button class="btn btn-sm btn-ghost" data-weg>Auswahl lösen</button></div>
    <div class="einfluss">
      <div><div class="eg">Beeinflusst von</div><div class="er">${(von.length || nurText.length)
      ? von.map(n => `<span class="${kl(n)}" data-waehl="${esc(n)}">${esc(n)}</span>`).join('')
      + nurText.map(n => `<span class="en">${esc(n)}</span>`).join('')
      : '<span class="en" style="opacity:.6">niemandem hier</span>'}</div></div>
      <div class="wirkt"><div class="eg">Wirkt auf</div><div class="er">${auf.length
      ? auf.map(n => `<span class="${kl(n)}" data-waehl="${esc(n)}">${esc(n)}</span>`).join('')
      : '<span class="en" style="opacity:.6">niemanden hier</span>'}</div></div>
      ${beide.size ? `<p class="hinweis" style="padding:2px 0 0;color:var(--beides)">
        Gegenseitig: ${Array.from(beide).map(esc).join(', ')}</p>` : ''}
    </div>
    <div class="section-head" style="margin:18px 0 9px"><h2>Werke in deinen Listen</h2><span class="eyebrow">${a.buecher.length}</span></div>
    <div data-werke></div>`;
  const weg = $('[data-weg]', info);
  if (weg) weg.onclick = () => aufloesen();
  const w = $('[data-werke]', info);
  a.buecher.forEach(x => {
    const r = document.createElement('button');
    r.className = 'grouprow';
    r.innerHTML = `<span class="grow">
        <span class="gname serif">${esc(x.titel)}</span>
        <span class="gmeta">${x.jahr != null ? esc(jahrText(x.jahr)) + ' · ' : ''}${STATUS[x.status]}${x.seiten ? ' · ' + x.seiten + ' S.' : ''}</span>
      </span><span class="chev">${ICON.chev}</span>`;
    r.onclick = () => buchOeffnen(x.id);
    w.appendChild(r);
  });
}

/* Alle Einflusslinien einer Autorenmenge, aufgelöst auf tatsächliche Namen. */
function einflussKanten(alle) {
  const kanten = [];
  alle.forEach(a => a.einfluss.forEach(q => {
    const von = autorAufloesen(alle, q);
    if (von && von !== a.name) kanten.push({ von, auf: a.name });
  }));
  return kanten;
}

/* ---------- Vernetzung: wer wirkt auf wen ---------- */
function netzOeffnen() {
  const alle = autorenIndex(buecherAktiv());
  const inv = einflussAufIndex(alle);
  const namen = Array.from(alle.values())
    .sort((a, b) => (a.geb == null ? 9999 : a.geb) - (b.geb == null ? 9999 : b.geb));
  const kanten = einflussKanten(alle);

  let gewaehlt = null;
  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif">Vernetzung</div>
        <div class="ovl-sub">${pl(kanten.length, 'Linie', 'Linien')} zwischen ${pl(namen.length, 'Autor', 'Autoren')}</div></div>
    </div>
    <div class="ovl-body" style="padding:12px 14px 40px">
      <p class="hinweis" style="padding:0 0 10px">
        Nach Geburtsjahr gereiht. Eine Linie führt von dem, der wirkt, zu dem, auf den gewirkt wird.
        Tippe einen Namen an, um nur seine Linien zu sehen.
      </p>
      <div class="netzlegende">
        <span><i style="background:var(--accent)"></i>beeinflusst von</span>
        <span><i style="background:var(--wirkt)"></i>wirkt auf</span>
        <span><i style="background:var(--beides)"></i>gegenseitig</span>
      </div>
      <div class="netz" data-netz></div>
      <div data-info style="margin-top:14px"></div>
    </div>`;

  const behaelter = $('[data-netz]', node);
  const H = 28, GUT = 118;
  /* Zwei Autoren, die einander beeinflusst haben: beide Linien gehören dann
     zusammen und bekommen die dritte Farbe. */
  const paare = new Set(kanten.map(k => k.von + '\u0000' + k.auf));
  const gegenseitig = k => paare.has(k.auf + '\u0000' + k.von);

  const malen = () => {
    behaelter.innerHTML = '';
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'netzsvg');
    svg.setAttribute('width', GUT);
    svg.setAttribute('height', namen.length * H);
    svg.setAttribute('viewBox', '0 0 ' + GUT + ' ' + (namen.length * H));
    behaelter.appendChild(svg);

    namen.forEach((a, i) => {
      const z = document.createElement('div');
      z.className = 'netzzeile';
      const beteiligt = !gewaehlt || gewaehlt === a.name ||
        kanten.some(k => (k.von === gewaehlt && k.auf === a.name) || (k.auf === gewaehlt && k.von === a.name));
      if (gewaehlt === a.name) z.classList.add('aktiv');
      if (!beteiligt) z.classList.add('blass');
      z.innerHTML = `<span class="nj num">${a.geb != null ? esc(jahrText(a.geb)).replace(' v. Chr.', ' v') : '–'}</span>
        <span class="nn">${esc(a.name)}</span>`;
      z.style.marginRight = GUT + 'px';
      z.onclick = () => { gewaehlt = (gewaehlt === a.name) ? null : a.name; malen(); };
      behaelter.appendChild(z);
    });

    const y = n => namen.findIndex(a => a.name === n) * H + H / 2;
    kanten.forEach(k => {
      const y1 = y(k.von), y2 = y(k.auf);
      if (y1 < 0 || y2 < 0) return;
      const aktiv = gewaehlt && (k.von === gewaehlt || k.auf === gewaehlt);
      /* Dieselben Farben wie die Namenschips darunter: was auf den Gewählten
         wirkt, im Akzent – was von ihm ausgeht, in der Gegenfarbe. Geht es in
         beide Richtungen, gilt die dritte Farbe. */
      const farbe = !aktiv ? (gegenseitig(k) ? 'color-mix(in srgb,var(--beides) 55%,var(--border-strong))' : 'var(--border-strong)')
        : gegenseitig(k) ? 'var(--beides)'
          : (k.von === gewaehlt ? 'var(--wirkt)' : 'var(--accent)');
      const bauch = Math.min(GUT - 8, 14 + Math.abs(y2 - y1) * 0.32);
      const pfad = document.createElementNS(svgNS, 'path');
      pfad.setAttribute('d', `M 2 ${y1} Q ${bauch} ${(y1 + y2) / 2} 2 ${y2}`);
      pfad.setAttribute('fill', 'none');
      pfad.setAttribute('stroke', farbe);
      pfad.setAttribute('stroke-width', aktiv ? 1.8 : 1);
      pfad.setAttribute('opacity', gewaehlt ? (aktiv ? 1 : 0.12) : 0.5);
      svg.appendChild(pfad);
      const punkt = document.createElementNS(svgNS, 'circle');
      punkt.setAttribute('cx', 2); punkt.setAttribute('cy', y2); punkt.setAttribute('r', aktiv ? 3 : 2);
      punkt.setAttribute('fill', farbe);
      punkt.setAttribute('opacity', gewaehlt ? (aktiv ? 1 : 0.12) : 0.6);
      svg.appendChild(punkt);
    });

    const info = $('[data-info]', node);
    if (!gewaehlt) {
      const zaehl = namen.map(a => ({ n: a.name, w: (inv.get(a.name) || []).length })).filter(x => x.w > 0)
        .sort((a, b) => b.w - a.w).slice(0, 5);
      const isoliert = namen.filter(a =>
        !a.einfluss.some(q => autorAufloesen(alle, q)) && !(inv.get(a.name) || []).length);
      info.innerHTML = (zaehl.length
        ? `<div class="section-head"><h2>Wirkt am weitesten</h2></div>
           <div class="list-card">${zaehl.map(x => `<button class="rowline" data-waehl="${esc(x.n)}" style="width:100%;text-align:left">
             <span class="grow"><span class="rn">${esc(x.n)}</span>
             <span class="rm">wirkt auf ${pl(x.w, 'Autor', 'Autoren')} dieser Liste</span></span>
             <span class="chev">${ICON.chev}</span></button>`).join('')}</div>`
        : `<p class="hinweis">Noch keine Einflüsse eingetragen. Du findest das Feld beim Autor unter „Biographie &amp; Einfluss“.</p>`)
        + (isoliert.length
          ? `<div class="section-head" style="margin-top:18px"><h2>Ohne Vernetzung in dieser Liste</h2><span class="eyebrow">${isoliert.length}</span></div>
             <div class="list-card">${isoliert.map(a => `<button class="rowline" data-waehl="${esc(a.name)}" style="width:100%;text-align:left">
               <span class="grow"><span class="rn">${esc(a.name)}</span>
               <span class="rm">${a.einfluss.length ? 'beeinflusst von ' + a.einfluss.map(esc).join(', ') : 'keine Einflüsse eingetragen'}</span></span>
               <span class="chev">${ICON.chev}</span></button>`).join('')}</div>`
          : '');
    } else {
      autorSteckbriefMalen(gewaehlt, alle, inv, info, () => { gewaehlt = null; malen(); });
    }
    /* Ein Name unten wählt oben aus und holt die Zeile ins Bild. */
    $$('[data-waehl]', info).forEach(x => x.onclick = () => {
      const ziel = autorAufloesen(alle, x.dataset.waehl);
      if (!ziel) return;
      gewaehlt = ziel;
      malen();
      const i = namen.findIndex(a => a.name === ziel);
      const zeile = behaelter.children[i + 1];
      if (zeile && zeile.scrollIntoView) zeile.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
  };

  $('[data-back]', node).onclick = () => layerSchliessen();
  layerOeffnen(node);
  malen();
}

/* ---------- Zeitstrahl: Lebzeiten und Erscheinungsjahre ----------
   Die Skala wird aus den Daten gebaut: belegte Zeitspannen bekommen Platz,
   leere Jahrhunderte werden zu einem Bruch zusammengezogen. So passt die
   Antike neben die Neuzeit, ohne dass dazwischen Leere steht. */
function zeitSkala(spannen, px, minLuecke, bruchBreite) {
  const s = spannen.filter(x => x && x.von != null && x.bis != null)
    .map(x => ({ von: Math.min(x.von, x.bis) - 6, bis: Math.max(x.von, x.bis) + 6 }))
    .sort((a, b) => a.von - b.von);
  const teile = [];
  s.forEach(x => {
    const letzt = teile[teile.length - 1];
    if (letzt && x.von - letzt.bis <= minLuecke) letzt.bis = Math.max(letzt.bis, x.bis);
    else teile.push({ von: x.von, bis: x.bis });
  });
  let cursor = 0;
  teile.forEach((t, i) => {
    t.x0 = cursor;
    t.breite = Math.max(30, (t.bis - t.von) * px);
    cursor += t.breite;
    t.x1 = cursor;
    if (i < teile.length - 1) { t.bruchX = cursor; cursor += bruchBreite; }
  });
  const x = jahr => {
    for (const t of teile) {
      if (jahr >= t.von && jahr <= t.bis) return t.x0 + (jahr - t.von) * px;
    }
    /* Zwischen zwei Abschnitten: an den nächstgelegenen Rand legen. */
    let best = teile[0], dist = Infinity;
    teile.forEach(t => {
      const d = jahr < t.von ? t.von - jahr : jahr - t.bis;
      if (d < dist) { dist = d; best = t; }
    });
    return jahr < best.von ? best.x0 : best.x1;
  };
  return { teile, x, breite: cursor };
}

function zeitstrahlOeffnen() {
  const alle = autorenIndex(buecherAktiv());
  const jetzt = new Date().getFullYear();
  const liste = Array.from(alle.values()).filter(a => a.geb != null).sort((a, b) => a.geb - b.geb);
  const ohne = Array.from(alle.values()).filter(a => a.geb == null);

  if (!liste.length) {
    toast('Noch keine Lebensdaten eingetragen.');
    return;
  }

  const PX = 2.9, LUECKE = 60, BRUCH = 18;
  const spannen = [];
  liste.forEach(a => {
    spannen.push({ von: a.geb, bis: a.gest != null ? a.gest : jetzt });
    a.buecher.forEach(b => { if (b.jahr != null) spannen.push({ von: b.jahr, bis: b.jahr }); });
  });
  const skala = zeitSkala(spannen, PX, LUECKE, BRUCH);
  const breite = Math.max(700, Math.round(skala.breite) + 20);

  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif">Zeitstrahl</div>
        <div class="ovl-sub">${pl(liste.length, 'Autor', 'Autoren')} · ${pl(skala.teile.length, 'Abschnitt', 'Abschnitte')}</div></div>
    </div>
    <div class="ovl-body" style="padding:12px 14px 40px">
      <p class="hinweis" style="padding:0 0 10px">
        Der Balken ist die Lebenszeit, jeder Punkt ein Buch im Jahr seiner Erstveröffentlichung –
        grün heißt gelesen. Wo Jahrhunderte ohne Einträge liegen, ist die Skala schraffiert
        zusammengezogen. Seitlich wischen, Punkte antippen. Ein Tipp auf einen Namen hebt ihn
        samt seiner Einflüsse hervor.
      </p>
      <div class="zsRahmen"><div class="zsInner" style="width:${breite}px" data-zs></div></div>
      <div data-info style="margin-top:14px"></div>
      <div data-rest style="margin-top:14px"></div>
    </div>`;

  /* Achse: der feinste Takt, bei dem die Zahlen noch nebeneinander passen –
     bei der jetzigen Auflösung sind das Zwanzigerschritte. */
  const ABSTAND = 52;
  const schritt = [10, 20, 25, 50, 100, 200, 250, 500, 1000].find(x => x * PX >= ABSTAND) || 1000;
  let html = '<div class="zsAchse">';
  const striche = [];
  skala.teile.forEach(t => {
    const start = Math.ceil(t.von / schritt) * schritt;
    for (let j = start; j <= t.bis; j += schritt) {
      const x = skala.x(j);
      /* Ganz am linken Rand würde die zentrierte Zahl halb abgeschnitten. */
      html += `<span class="${x < 18 ? 'links' : ''}" style="left:${x < 18 ? 2 : x}px">${esc(jahrText(j).replace(' v. Chr.', ' v'))}</span>`;
      striche.push(x);
    }
  });
  html += '</div>';
  striche.forEach(x => { html += `<div class="zsGitter" style="left:${x}px"></div>`; });
  skala.teile.forEach(t => { if (t.bruchX != null) html += `<div class="zsBruch" style="left:${t.bruchX}px"></div>`; });

  liste.forEach((a, reihe) => {
    const ende = a.gest != null ? a.gest : jetzt;
    const l = skala.x(a.geb), b = Math.max(18, skala.x(ende) - l);
    html += `<div class="zsZeile${reihe % 2 ? ' alt' : ''}" data-zeile="${esc(a.name)}">
      <div class="zsBalken" style="left:${l}px;width:${b}px"></div>
      <button class="zsName" data-autor="${esc(a.name)}" style="left:${l + 4}px">${esc(a.name)}</button>`;
    a.buecher.filter(x => x.jahr != null).forEach(b2 => {
      html += `<div class="zsPunkt${b2.status === 'gelesen' ? ' gelesen' : ''}" style="left:${skala.x(b2.jahr)}px"
        data-buch="${b2.id}" title="${esc(b2.titel)} (${esc(jahrText(b2.jahr))})"></div>`;
    });
    html += '</div>';
  });

  const inner = $('[data-zs]', node);
  inner.innerHTML = html;
  $$('[data-buch]', inner).forEach(p => p.onclick = () => {
    const b = buchById(p.dataset.buch);
    if (b) toast(b.titel + ' · ' + jahrText(b.jahr) + ' · zweimal tippen öffnet das Buch');
  });
  $$('[data-buch]', inner).forEach(p => p.ondblclick = () => buchOeffnen(p.dataset.buch));

  /* Ein Name im Strahl wählt den Autor: seine Zeile tritt hervor, die
     Autoren am anderen Ende einer Einflusslinie bleiben mitbetont, der
     Rest tritt zurück. Darunter derselbe Steckbrief wie in der Vernetzung. */
  const inv = einflussAufIndex(alle);
  const kanten = einflussKanten(alle);
  const info = $('[data-info]', node);
  let gewaehlt = null;

  const markieren = () => {
    $$('[data-zeile]', inner).forEach(z => {
      const n = z.dataset.zeile;
      const verbunden = !!gewaehlt && n !== gewaehlt &&
        kanten.some(k => (k.von === gewaehlt && k.auf === n) || (k.auf === gewaehlt && k.von === n));
      z.classList.toggle('aktiv', gewaehlt === n);
      z.classList.toggle('verbunden', verbunden);
      z.classList.toggle('blass', !!gewaehlt && n !== gewaehlt && !verbunden);
    });
    if (!gewaehlt) { info.innerHTML = ''; return; }
    autorSteckbriefMalen(gewaehlt, alle, inv, info, () => { gewaehlt = null; markieren(); });
    /* Aus dem Steckbrief heraus zum nächsten Autor springen. */
    $$('[data-waehl]', info).forEach(x => x.onclick = () => {
      const ziel = autorAufloesen(alle, x.dataset.waehl);
      if (!ziel) return;
      gewaehlt = ziel;
      markieren();
      const z = $(`[data-zeile="${CSS.escape(ziel)}"]`, inner);
      if (z) z.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
  };

  $$('[data-autor]', inner).forEach(n => n.onclick = () => {
    gewaehlt = (gewaehlt === n.dataset.autor) ? null : n.dataset.autor;
    markieren();
  });

  if (ohne.length) {
    $('[data-rest]', node).innerHTML = `<div class="section-head"><h2>Ohne Lebensdaten</h2></div>
      <p class="hinweis" style="padding:0">${ohne.map(a => esc(a.name)).join(' · ')}</p>`;
  }

  $('[data-back]', node).onclick = () => layerSchliessen();
  layerOeffnen(node);
}

/* Tagesprotokolle: was an welchem Tag gelesen wurde. */
function tageMalen(root) {
  const tage = tageMitSitzungen();
  const ziel = +DB.einstellungen.zielSeiten || 0;
  const wrap = document.createElement('div');
  wrap.className = 'section';
  root.appendChild(wrap);

  const z = zielHeute();
  wrap.insertAdjacentHTML('beforeend', `
    <div class="list-card" style="margin-bottom:16px">
      <div class="rowline">
        <span class="grow">
          <span class="rn">Tagesziel</span>
          <span class="rm">${ziel ? ziel + ' Seiten pro Tag · heute ' + z.gelesen : 'Noch keins gesetzt'}</span>
        </span>
        <button class="btn btn-sm" data-ziel>${ziel ? 'Ändern' : 'Setzen'}</button>
      </div>
    </div>`);
  $('[data-ziel]', wrap).onclick = () => zielBearbeiten();

  if (!tage.length) {
    wrap.insertAdjacentHTML('beforeend',
      `<div class="empty" style="margin:0"><strong>Noch keine Tage</strong>Jede Lese-Sitzung schreibt einen Eintrag. Starte die Stoppuhr oder trage eine Sitzung von Hand ein.</div>`);
    return;
  }

  /* Balken der letzten drei Wochen */
  const heuteD = new Date();
  const punkte = [];
  for (let i = 20; i >= 0; i--) {
    const d = new Date(heuteD.getFullYear(), heuteD.getMonth(), heuteD.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    const t = tage.find(x => x.datum === iso);
    punkte.push({ label: fmtDatum(iso), kurz: String(d.getDate()), wert: t ? t.seiten : 0 });
  }
  wrap.appendChild(karte('Seiten pro Tag', 'Die letzten drei Wochen.' + (ziel ? ' Die gestrichelte Linie ist dein Ziel.' : ''),
    zeitBalken(punkte, v => fmtZahl(v) + ' Seiten'), '',
    tabelleHtml(['Tag', 'Seiten'], punkte.map(x => [x.label, fmtZahl(x.wert)]))));

  const geschaffte = ziel ? tage.filter(t => t.seiten >= ziel).length : 0;
  const summe = tage.reduce((s, t) => s + t.seiten, 0);
  const tiles = document.createElement('div');
  tiles.className = 'tiles';
  tiles.innerHTML = [
    ['Lesetage', String(tage.length), 'mit mindestens einer Sitzung'],
    ['Seiten je Lesetag', fmtZahl(Math.round(summe / tage.length)), 'im Schnitt'],
    ziel ? ['Ziel erreicht', geschaffte + ' <small>/ ' + tage.length + '</small>', Math.round(geschaffte / tage.length * 100) + ' % der Lesetage'] : null
  ].filter(Boolean).map(([k, v, sub]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${esc(sub)}</div></div>`).join('');
  wrap.appendChild(tiles);

  wrap.insertAdjacentHTML('beforeend', `<div class="section-head" style="margin:18px 0 9px"><h2>Protokoll</h2><span class="eyebrow">${tage.length}</span></div>`);
  const karteEl = document.createElement('div');
  karteEl.className = 'list-card';
  tage.slice(0, 120).forEach(t => {
    const geschafft = ziel && t.seiten >= ziel;
    const r = document.createElement('div');
    r.className = 'rowline';
    r.innerHTML = `
      <span class="grow">
        <span class="rn num">${fmtDatum(t.datum)}${geschafft ? ' <span style="color:var(--good)">✓</span>' : ''}</span>
        <span class="rm">${t.seiten ? t.seiten + ' Seiten · ' : ''}${fmtDauer(t.minuten)} · ${pl(t.buecher, 'Buch', 'Bücher')}</span>
      </span>
      ${ziel ? `<span class="zbar" style="width:64px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden">
        <i style="display:block;height:100%;border-radius:99px;background:${geschafft ? 'var(--good)' : 'var(--accent)'};width:${clamp(t.seiten / ziel * 100, 0, 100)}%"></i></span>` : ''}`;
    karteEl.appendChild(r);
  });
  wrap.appendChild(karteEl);
}

function zahlenMalen(root) {
  root.innerHTML = '';
  if (!DB.buecher.length) {
    root.innerHTML = `<div class="empty"><strong>Nichts auszuwerten</strong>Sobald Bücher im Plan stehen, entstehen hier die Graphen.</div>`;
    return;
  }
  const plan = aktiverPlan();
  const ueberAlles = uebersichtAllePlaene || !plan;
  const bloecke = ueberAlles ? alleBloeckeSortiert() : bloeckeVonPlan(plan.id);

  if (DB.lesepleane.length > 1) {
    const chips = document.createElement('div');
    chips.className = 'chiprow';
    chips.style.marginBottom = '12px';
    chips.innerHTML = `
      <button class="chip" data-u="plan" aria-pressed="${!ueberAlles}">${esc(plan ? plan.name : 'leseliste')}</button>
      <button class="chip" data-u="alle" aria-pressed="${ueberAlles}">Alle leselisten</button>`;
    $$('[data-u]', chips).forEach(c => c.onclick = () => { uebersichtAllePlaene = c.dataset.u === 'alle'; viewMalen(); });
    root.appendChild(chips);
  }

  const wrap = document.createElement('div');
  wrap.className = 'section';
  root.appendChild(wrap);

  const alle = ueberAlles ? DB.buecher : buecherImPlan(plan.id);
  if (!alle.length) {
    wrap.innerHTML = `<div class="empty" style="margin:0"><strong>„${esc(plan.name)}" ist leer</strong>Lege Bücher an, dann entstehen hier die Graphen.</div>`;
    return;
  }
  const gelesen = alle.filter(b => b.status === 'gelesen');
  const seitenGes = alle.reduce((s, b) => s + (b.seiten || 0), 0);
  const seitenGelesen = gelesen.reduce((s, b) => s + (b.seiten || 0), 0);
  const minGes = alle.reduce((s, b) => s + buchMinuten(b), 0);
  const seitenAusSessions = alle.reduce((s, b) => s + buchSeitenGelesen(b), 0);
  const tempoGes = (minGes > 30 && seitenAusSessions) ? seitenAusSessions / (minGes / 60) : null;
  const kosten = alle.reduce((s, b) => s + (b.preis || 0), 0);
  const mitPreis = alle.filter(b => b.preis != null);
  const notizen = alle.reduce((s, b) => s + b.notizen.length, 0);

  /* Prognose aus dem Tempo der letzten Sitzungen */
  const sess = [];
  alle.forEach(b => b.sessions.forEach(s => sess.push(s)));
  sess.sort((a, b) => a.datum < b.datum ? -1 : 1);
  let prognose = '–';
  if (sess.length >= 2 && seitenAusSessions > 0) {
    const tage = Math.max(1, (new Date(sess[sess.length - 1].datum) - new Date(sess[0].datum)) / 86400000);
    const proTag = seitenAusSessions / tage;
    const rest = Math.max(0, seitenGes - seitenGelesen);
    if (proTag > 0.2 && rest > 0) {
      const d = new Date(Date.now() + rest / proTag * 86400000);
      prognose = d.getFullYear() > new Date().getFullYear() + 40 ? 'sehr fern' : MONATE[d.getMonth()] + ' ' + d.getFullYear();
    } else if (!rest) prognose = 'geschafft';
  }

  const tiles = document.createElement('div');
  tiles.className = 'tiles';
  tiles.innerHTML = [
    ['Gelesen', gelesen.length + ' <small>/ ' + alle.length + '</small>', Math.round(alle.length ? gelesen.length / alle.length * 100 : 0) + ' % der Liste'],
    ['Seiten gelesen', fmtZahl(seitenGelesen), 'von ' + fmtZahl(seitenGes)],
    ['Lesezeit', fmtDauerKurz(minGes), pl(sess.length, 'Sitzung', 'Sitzungen')],
    ['Tempo', tempoGes ? fmtZahl(tempoGes) + ' <small>S./h</small>' : '–', 'aus den Sitzungen'],
    ['Kosten', kosten ? fmtGeld(kosten) : '–', mitPreis.length + ' von ' + alle.length + ' mit Preis'],
    ['Notizen', fmtZahl(notizen), pl(DB.themen.length, 'Themenfeld', 'Themenfelder')],
    ['Fehlt mir', String(alle.filter(fehltMir).length), (() => {
      const s = alle.filter(fehltMir).reduce((x, b) => x + (b.preis || 0), 0);
      return s ? fmtGeld(s) + ' eingetragen' : 'ohne Preisangabe';
    })()],
    ['Fertig etwa', prognose, 'bei bisherigem Tempo']
  ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join('');
  wrap.appendChild(tiles);

  /* --- Fortschritt über die Zeit --- */
  if (sess.length) {
    const von = new Date(sess[0].datum), bis = new Date();
    const monate = monatsListe(von, bis);
    const proMonat = {};
    sess.forEach(s => {
      const k = s.datum.slice(0, 7);
      const seiten = (s.von != null && s.bis != null && s.bis > s.von) ? s.bis - s.von : 0;
      proMonat[k] = (proMonat[k] || 0) + seiten;
    });
    const punkte = monate.map(m => ({ label: m.label, kurz: m.kurz, wert: proMonat[m.key] || 0 }));
    wrap.appendChild(karte('Seiten pro Monat', 'Aus den Lese-Sitzungen, also nur dort, wo du Seite von und bis eingetragen hast.',
      zeitBalken(punkte, v => fmtZahl(v) + ' Seiten'), '',
      tabelleHtml(['Monat', 'Seiten'], punkte.map(p => [p.label, fmtZahl(p.wert)]))));

    /* Bücher kumuliert – Abschluss aus der letzten Sitzung eines gelesenen Buches */
    const fertig = gelesen.map(b => {
      const ss = b.sessions.slice().sort((x, y) => x.datum < y.datum ? -1 : 1);
      return ss.length ? ss[ss.length - 1].datum : null;
    }).filter(Boolean).sort();
    if (fertig.length) {
      let k = 0;
      const punkte2 = monate.map(m => {
        k += fertig.filter(d => d.slice(0, 7) === m.key).length;
        return { label: m.label, kurz: m.kurz, wert: k };
      });
      wrap.appendChild(karte('Gelesene Bücher, aufsummiert',
        `Abgeleitet aus der letzten Sitzung je Buch. ${gelesen.length - fertig.length > 0 ? (gelesen.length - fertig.length) + ' gelesene Bücher ohne Sitzung fehlen in dieser Kurve.' : ''}`,
        linie(punkte2, v => fmtZahl(v) + ' Bücher'), '',
        tabelleHtml(['Monat', 'Bücher'], punkte2.map(p => [p.label, fmtZahl(p.wert)]))));
    }
  } else {
    wrap.appendChild(karte('Fortschritt über die Zeit', '',
      `<div class="hinweis">Noch keine Lese-Sitzung erfasst. Starte im Buch unter „Lesen“ die Stoppuhr oder trage eine Sitzung von Hand ein – danach entsteht hier die Kurve.</div>`));
  }

  /* --- Blöcke im Vergleich --- */
  const bl = bloecke.map(blk => {
    const bs = buecherIn(blk.id);
    const g = bs.filter(x => x.status === 'gelesen').reduce((s, x) => s + (x.seiten || 0), 0);
    const o = bs.reduce((s, x) => s + (x.seiten || 0), 0) - g;
    return { label: blk.name, segmente: [{ wert: g, farbe: 'var(--good)', name: 'gelesen' }, { wert: o, farbe: 'var(--border-strong)', name: 'offen' }], wert: g + o, anzeige: fmtZahl(g + o) + ' S.', gelesen: g, offen: o, werke: bs.length };
  }).filter(x => x.wert > 0);
  if (bl.length) {
    wrap.appendChild(karte('Blöcke nach Seitenumfang', 'Wie viel Papier hinter jedem Block steckt – und wie viel davon schon gelesen ist.',
      balken(bl, { fmt: v => fmtZahl(v) + ' S.' }),
      `<span><i style="background:var(--good)"></i>gelesen</span><span><i style="background:var(--border-strong)"></i>offen</span>`,
      tabelleHtml(['Block', 'Werke', 'Gelesen (S.)', 'Offen (S.)'], bl.map(x => [x.label, x.werke, fmtZahl(x.gelesen), fmtZahl(x.offen)]))));
  }

  /* --- Kosten --- */
  if (mitPreis.length) {
    const proBlock = bloecke.map(blk => ({
      label: blk.name,
      wert: buecherIn(blk.id).reduce((s, b) => s + (b.preis || 0), 0)
    })).filter(x => x.wert > 0).sort((a, b) => b.wert - a.wert);
    const seitenMitPreis = mitPreis.reduce((s, b) => s + (b.seiten || 0), 0);
    const centProSeite = seitenMitPreis ? kosten / seitenMitPreis * 100 : null;
    const teuerste = mitPreis.slice().sort((a, b) => (b.preis || 0) - (a.preis || 0)).slice(0, 8)
      .map(b => ({ label: b.titel, wert: b.preis, farbe: 'var(--s2)' }));
    wrap.appendChild(karte('Kosten je Block', `Summe ${fmtGeld(kosten)}, im Schnitt ${fmtGeld(kosten / mitPreis.length)} je Buch${centProSeite ? ', ' + fmtZahl(centProSeite, 1) + ' Cent je Seite' : ''}. Ein Kaufdatum wird nicht erfasst, deshalb gibt es keine Kostenkurve über die Zeit.`,
      balken(proBlock, { fmt: fmtGeld }), '',
      tabelleHtml(['Block', 'Kosten'], proBlock.map(x => [x.label, fmtGeld(x.wert)]))));
    if (teuerste.length > 1) {
      wrap.appendChild(karte('Teuerste Bücher', '', balken(teuerste, { fmt: fmtGeld }), '',
        tabelleHtml(['Buch', 'Preis'], teuerste.map(x => [x.label, fmtGeld(x.wert)]))));
    }
  }

  /* --- Lesetempo --- */
  const tempi = alle.map(b => ({ b, t: buchTempo(b) })).filter(x => x.t)
    .sort((a, b) => b.t - a.t).slice(0, 12)
    .map(x => ({ label: x.b.titel, wert: x.t, farbe: 'var(--s7)' }));
  if (tempi.length) {
    wrap.appendChild(karte('Lesetempo je Buch', 'Seiten pro Stunde, aus deinen Sitzungen. Wo du langsam liest, steckt meist die Arbeit.',
      balken(tempi, { fmt: v => fmtZahl(v) + ' S./h' }), '',
      tabelleHtml(['Buch', 'Seiten/h'], tempi.map(x => [x.label, fmtZahl(x.wert)]))));
  }

  /* --- Notizen --- */
  const nachArt = DB.arten.map(a => ({
    label: a.name, farbe: 'var(--' + a.farbe + ')',
    wert: alle.reduce((s, b) => s + b.notizen.filter(n => n.artId === a.id).length, 0)
  })).filter(x => x.wert > 0).sort((a, b) => b.wert - a.wert);
  if (nachArt.length) {
    wrap.appendChild(karte('Notizen nach Art', 'Was für Spuren du hinterlässt.',
      balken(nachArt), nachArt.map(x => `<span><i style="background:${x.farbe}"></i>${esc(x.label)}</span>`).join(''),
      tabelleHtml(['Art', 'Notizen'], nachArt.map(x => [x.label, x.wert]))));
  }
  const nachThema = DB.themen.map(t => ({
    label: t.name, farbe: 'var(--s1)',
    wert: alle.reduce((s, b) => s + b.notizen.filter(n => n.themaId === t.id).length, 0)
  })).filter(x => x.wert > 0).sort((a, b) => b.wert - a.wert);
  if (nachThema.length) {
    const top = nachThema.slice(0, 8);
    const rest = nachThema.slice(8).reduce((s, x) => s + x.wert, 0);
    if (rest) top.push({ label: 'Weitere ' + (nachThema.length - 8), wert: rest, farbe: 'var(--text-3)' });
    wrap.appendChild(karte('Notizen nach Themenfeld', 'Buchübergreifend – das sind die Fäden, an denen du ziehst.',
      balken(top), '', tabelleHtml(['Themenfeld', 'Notizen'], nachThema.map(x => [x.label, x.wert]))));
  }
}
/* ============================================================
   Themenfelder über alle Bücher hinweg
   ============================================================ */
let notizenUnter = 'themen';

function notizenTabMalen(root) {
  const unter = [['themen', 'Themenfelder'], ['arten', 'Arten'], ['alle', 'Alle Notizen'], ['galerie', 'Galerie']];
  root.innerHTML = `
    <div class="chiprow">
      ${unter.map(([k, l]) => `<button class="chip" data-unter="${k}" aria-pressed="${notizenUnter === k}">${l}</button>`).join('')}
    </div>
    <div id="notizenInhalt" style="margin-top:14px"></div>`;
  $$('[data-unter]', root).forEach(c => c.onclick = () => { notizenUnter = c.dataset.unter; viewMalen(); });

  const ziel = $('#notizenInhalt', root);
  if (notizenUnter === 'themen') gruppenGlobal(ziel, 'thema');
  else if (notizenUnter === 'arten') gruppenGlobal(ziel, 'art');
  else if (notizenUnter === 'alle') alleNotizenGlobal(ziel);
  else galerieGlobal(ziel);
}

/* Themenfelder oder Arten über alle Bücher hinweg. */
function gruppenGlobal(root, art) {
  const nachThema = art === 'thema';
  const zaehl = new Map();
  alleNotizen().forEach(({ buch, notiz }) => {
    const k = (nachThema ? notiz.themaId : notiz.artId) || '__ohne';
    if (!zaehl.has(k)) zaehl.set(k, { n: 0, buecher: new Set() });
    const e = zaehl.get(k); e.n++; e.buecher.add(buch.id);
  });
  const liste = Array.from(zaehl.entries()).map(([k, v]) => ({
    id: k === '__ohne' ? null : k,
    name: k === '__ohne' ? (nachThema ? 'Ohne Themenfeld' : 'Ohne Art') : (nachThema ? themaName(k) : artName(k)),
    farbe: (!nachThema && k !== '__ohne') ? artFarbe(k) : null,
    n: v.n, b: v.buecher.size
  })).sort((a, b) => b.n - a.n);

  root.innerHTML = `
    <div class="section">
      <div class="section-head">
        <h2>${nachThema ? 'Themenfelder' : 'Arten'}</h2>
        <button class="btn btn-sm btn-ghost" data-verwalten>Verwalten</button>
      </div>
      ${liste.length ? '<div data-liste></div>' : `<div class="empty"><strong>Noch nichts da</strong>${nachThema
      ? 'Gib deinen Notizen ein Themenfeld – dann laufen hier die Fäden aus allen Büchern zusammen.'
      : 'Sobald Notizen eine Art tragen, sammeln sie sich hier über alle Bücher.'}</div>`}
    </div>`;
  $('[data-verwalten]', root).onclick = nachThema ? themenVerwalten : artenVerwalten;

  const l = $('[data-liste]', root);
  if (!l) return;
  liste.forEach(t => {
    const row = document.createElement('button');
    row.className = 'grouprow';
    row.innerHTML = `
      ${t.farbe ? `<span class="swatch" style="width:11px;height:11px;border-radius:4px;background:${t.farbe};flex:0 0 auto"></span>` : ''}
      <span class="grow">
        <span class="gname">${esc(t.name)}</span>
        <span class="gmeta">${pl(t.n, 'Notiz', 'Notizen')} aus ${pl(t.b, 'Buch', 'Büchern')}</span>
      </span><span class="count num">${t.n}</span><span class="chev">${ICON.chev}</span>`;
    row.onclick = () => sammlungOeffnen(t.name, nachThema
      ? n => (n.themaId || null) === t.id
      : n => (n.artId || null) === t.id);
    l.appendChild(row);
  });
}

/* Alle Notizen aller Bücher, nach Buch und Seite. */

  root.innerHTML = `
    <div class="section">
      <div class="section-head"><h2>Alle Notizen</h2><span class="eyebrow">${gesamt}</span></div>
      <div data-l></div>

/* Alle Fotos aller Bücher. */
function galerieGlobal(root) {
  const bilder = [];
  buecherNachPlan().forEach(b => {
    b.notizen.slice().sort((a, c) => seiteZahl(a.seite) - seiteZahl(c.seite))
      .forEach(n => n.bilder.forEach(x => bilder.push({ src: x.src, seite: n.seite, notiz: n, buch: b })));
  });
  root.innerHTML = `
    <div class="section">
      <div class="section-head"><h2>Galerie</h2><span class="eyebrow">${pl(bilder.length, 'Foto', 'Fotos')}</span></div>

  const g = $('[data-g]', root);
  if (!g) return;
  bilder.forEach((bi, i) => {
    const btn = document.createElement('button');
    btn.innerHTML = `<img src="${bi.src}" alt="Foto aus ${esc(bi.buch.titel)}">
      <span class="cap">${bi.seite ? 'S. ' + esc(seiteText(bi.seite)) : ''}</span>`;
    btn.onclick = () => bildGrossMitNotiz(bi.buch, bilder, i, () => viewMalen());
    g.appendChild(btn);
  });
}

/* Notizen aus allen Büchern, die einem Filter entsprechen. */
function sammlungOeffnen(name, passt) {
  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif">${esc(name)}</div><div class="ovl-sub">alle Bücher</div></div>
    </div>

function sucheOeffnen() {
  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><input type="text" data-q placeholder="Bücher, Autoren, Notizen, Themen …" autocomplete="off"></div>
    </div>
    <div class="ovl-body" style="padding:12px 14px 40px" data-erg>
      <p class="hinweis">Tippe los. Gesucht wird in Titeln, Autoren, Beschreibungen, Notizen und Themenfeldern.</p>
    </div>`;
  const erg = $('[data-erg]', node);
  const suchen = () => {
    const q = $('[data-q]', node).value.trim().toLowerCase();
    if (q.length < 2) { erg.innerHTML = `<p class="hinweis">Mindestens zwei Zeichen.</p>`; return; }
    const buecher = DB.buecher.filter(b =>
      [b.titel, b.autor, b.beschreibung, b.ausgabe].some(x => (x || '').toLowerCase().includes(q)));
    const notizen = alleNotizen().filter(({ notiz }) =>
      (notiz.text || '').toLowerCase().includes(q) || themaName(notiz.themaId).toLowerCase().includes(q));
    erg.innerHTML = '';
    if (!buecher.length && !notizen.length) { erg.innerHTML = `<div class="empty"><strong>Nichts gefunden</strong>Für „${esc(q)}“ gibt es keinen Treffer.</div>`; return; }
    if (buecher.length) {
      erg.insertAdjacentHTML('beforeend', `<div class="eyebrow" style="margin:4px 0 8px">${buecher.length} ${buecher.length === 1 ? 'Buch' : 'Bücher'}</div>`);
      buecher.slice(0, 30).forEach(b => {
        const r = document.createElement('button');
        r.className = 'grouprow';
        r.innerHTML = `<span class="grow"><span class="gname serif">${esc(b.titel)}</span><span class="gmeta">${esc(b.autor)}${b.jahr != null ? ' · ' + esc(jahrText(b.jahr)) : ''}</span></span><span class="chev">${ICON.chev}</span>`;
        r.onclick = () => buchOeffnen(b.id);
        erg.appendChild(r);
      });
    }
    if (notizen.length) {
      erg.insertAdjacentHTML('beforeend', `<div class="eyebrow" style="margin:16px 0 8px">${notizen.length} ${notizen.length === 1 ? 'Notiz' : 'Notizen'}</div>`);
      notizen.slice(0, 40).forEach(({ buch, notiz }) => {
        const k = notizKarte(buch, notiz, suchen);
        k.insertAdjacentHTML('afterbegin', `<div class="eyebrow" style="margin-bottom:6px">${esc(buch.titel)}</div>`);
        erg.appendChild(k);
      });
    }
  };
  let t;
  $('[data-q]', node).oninput = () => { clearTimeout(t); t = setTimeout(suchen, 180); };
  $('[data-back]', node).onclick = () => layerSchliessen();
  layerOeffnen(node);
  setTimeout(() => $('[data-q]', node).focus(), 80);
}

/* ============================================================
   Einkaufsliste: was fehlt und was als Nächstes drankommt
   ============================================================ */
const fehltMir = b => b.besitz === 'fehlt' || b.besitz === 'bestellt';
function einkaufDaten() {
  const alle = buecherNachPlan().filter(fehltMir);
  const naechste = alle.filter(b => b.einkauf);
  const rest = alle.filter(b => !b.einkauf);
  const summe = l => l.reduce((s, b) => s + (b.preis || 0), 0);
  return { alle, naechste, rest, summeNaechste: summe(naechste), summeAlle: summe(alle) };
}

/* Kopieren, das auch dort geht, wo navigator.clipboard fehlt oder abweist:
   über file://, in eingebetteten Ansichten und in älteren Safari-Fassungen.
   Dann übernimmt das alte execCommand mit einem Hilfsfeld. */
async function inZwischenablage(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* weiter zum Notweg */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    /* Sichtbar, aber winzig und durchsichtig – aus einem versteckten Feld
       lässt sich nichts markieren, und ohne Markierung kopiert execCommand nicht. */
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2em;height:2em;padding:0;'
      + 'border:none;outline:none;box-shadow:none;background:transparent;color:transparent;';
    document.body.appendChild(ta);
    const sel = window.getSelection();
    const vorher = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length); /* iOS braucht das ausdrücklich */
    const ok = document.execCommand('copy');
    ta.remove();
    if (vorher && sel) { sel.removeAllRanges(); sel.addRange(vorher); }
    return !!ok;
  } catch (e) { return false; }
}

/* Letzter Ausweg: den Text markieren, dann genügt langes Drücken → Kopieren. */
function textMarkieren(el) {
  if (!el) return false;
  try {
    const r = document.createRange();
    r.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    return true;
  } catch (e) { return false; }
}

/* Kopierknopf mit allen Rückfällen – gibt es nichts zu kopieren, wird markiert. */
async function kopierenMitRueckfall(text, preEl) {
  if (await inZwischenablage(text)) { toast('Kopiert.'); return; }
  if (textMarkieren(preEl)) {
    toast('Der Browser lässt kein Kopieren zu. Der Text ist jetzt markiert – halte ihn gedrückt und wähle „Kopieren“.', 6000);
  } else {
    toast('Kopieren ging nicht – nimm die Textdatei.', 4000);
  }
}

async function dateiAnbieten(name, text, typ) {
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data: text }); toast('Gesichert: ' + name); return; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Abgebrochen.'); return; }
      console.error(e);
    }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: typ || 'text/plain' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Gesichert: ' + name);
  } catch (e) { toast('Kein Weg zum Speichern verfügbar.', 3500); }
}

function einkaufText() {
  const { naechste, rest, summeNaechste, summeAlle } = einkaufDaten();
  const zeile = b => {
    const teile = ['– ' + b.titel + ' — ' + (b.autor || 'ohne Autor')];
    const zusatz = [];
    if (b.ausgabe) zusatz.push(b.ausgabe);
    if (b.seiten) zusatz.push((b.seitenUnsicher ? 'ca. ' : '') + b.seiten + ' S.');
    if (b.besitz === 'bestellt') zusatz.push('bestellt');
    if (zusatz.length) teile.push('  (' + zusatz.join(', ') + ')');
    if (b.preis != null) teile.push('  ' + fmtGeld(b.preis));
    return teile.join('');
  };
  const heuteText = new Date().toLocaleDateString('de-DE');
  let out = 'Einkaufsliste – leseliste\nStand: ' + heuteText + '\n';
  if (naechste.length) {
    out += '\nALS NÄCHSTES (' + naechste.length + ')\n' + naechste.map(zeile).join('\n') + '\n';
    if (summeNaechste) out += 'Zwischensumme: ' + fmtGeld(summeNaechste) + '\n';
  }
  if (rest.length) out += '\nFEHLT AUSSERDEM (' + rest.length + ')\n' + rest.map(zeile).join('\n') + '\n';
  out += '\nSumme der eingetragenen Preise: ' + fmtGeld(summeAlle) + '\n';
  out += '(Bücher ohne Preis sind darin nicht enthalten.)\n';
  return out;
}

      body.appendChild(h);
      if (hinweis) body.insertAdjacentHTML('beforeend', `<p class="hinweis" style="padding:0 0 8px">${hinweis}</p>`);
      const karte = document.createElement('div');

          <button class="grow" data-oeffne="${b.id}" style="text-align:left">

    abschnitt('Als Nächstes', naechste, summeNaechste,
      'Angetippt wandert ein Buch zwischen „Als Nächstes“ und der übrigen Liste.');
    abschnitt('Fehlt außerdem', rest, 0, naechste.length ? '' :
      'Tippe den Kreis an, um ein Buch für den nächsten Einkauf vorzumerken.');

    body.insertAdjacentHTML('beforeend',
      `<p class="hinweis">Bücher ohne Preis zählen nicht in die Summe. Den Preis trägst du im Buch unter „Bearbeiten“ ein.</p>`);
  };

  $('[data-back]', node).onclick = () => layerSchliessen();
  $('[data-ausgeben]', node).onclick = () => {
    const s = blatt('Einkaufsliste ausgeben', `
      <div class="btn-row">

      { fokus: false });
    $('[data-txt]', s).onclick = () => { dateiAnbieten('einkaufsliste-' + heute() + '.txt', einkaufText()); layerSchliessen(); };
    $('[data-kopieren]', s).onclick = () => kopierenMitRueckfall(einkaufText(), $('pre', s));
  };

  malen();

- Nur hohe Qualität: peer-reviewed, in angesehenen Fachzeitschriften, möglichst viel zitiert oder als Standardreferenz des Feldes anerkannt. Lieber wenige einschlägige als viele beliebige.
- Bei Artikeln ist die Sprache gleichgültig – englische sind ausdrücklich erwünscht, entscheidend ist allein die Qualität.
- "ausgabe" beginnt bei Artikeln mit \`Fachartikel · \` und nennt dann Zeitschrift, Jahrgang, Heft, Seiten und DOI, z. B.:
  \`Fachartikel · Econometrica 47(2), S. 263–291, DOI: 10.2307/1914185\`
- "seiten" ist bei Artikeln der Umfang in Seiten, "besitz" setzt du bei Artikeln auf \`"bibliothek"\` – dann landen sie nicht auf der Einkaufsliste.
- **"link" ist bei jedem Fachartikel Pflicht**: die auflösbare DOI-Adresse in der Form \`https://doi.org/10.xxxx/yyyy\`. Nur wenn es nachweislich keine DOI gibt, die feste Seite der Zeitschrift oder des Repositoriums. Keine Suchlinks, keine erfundenen Adressen – im Zweifel nimm ein anderes Werk, zu dem du die Fundstelle sicher kennst.
- Bei Büchern bleibt "link" leer, es sei denn, das Werk ist frei und dauerhaft online zu lesen; dann darf die Adresse hinein.` : ''}${regeln ? '\n' + regeln : ''}`;
}

/* Ein Werk aus der Datei auf die Felder bringen, die die App kennt.
   Fremde Dateien dürfen unvollständig sein; fehlt etwas, bleibt es leer. */
function stoWerkNorm(roh, i) {
  const b = roh || {};
  const autoren = normAutoren(b);
  return {
    id: 'w' + i,
    titel: String(b.titel || b.title || 'Ohne Titel').trim(),
    thema: String(b.thema || b.themenfeld || b.kategorie || 'Ohne Thema').trim() || 'Ohne Thema',
    autor: String(b.autor || (autoren.length ? autoren.map(a => a.name).join(', ') : '')).trim(),
    autoren,
    jahr: b.jahr == null ? null : b.jahr,
    seiten: b.seiten == null ? null : b.seiten,
    seitenUnsicher: !!b.seitenUnsicher,
    ausgabe: b.ausgabe || '',
    link: String(b.link || b.doi || b.url || '').trim(),
    beschreibung: b.beschreibung || '',
    kurz: b.kurz || '',
    schwierigkeit: (b.schwierigkeit >= 1 && b.schwierigkeit <= 5) ? +b.schwierigkeit : null,
    besitz: BESITZ[b.besitz] ? b.besitz : 'fehlt'
  };
}

/* Aus einer Datei die Werke ziehen – die Sammlung selbst, aber notfalls
   auch eine gewöhnliche leseliste, deren Bücher dann den Vorrat bilden. */
function stoWerkeAus(roh) {
  if (!roh) return [];
  const liste = Array.isArray(roh) ? roh
    : Array.isArray(roh.werke) ? roh.werke
      : Array.isArray(roh.buecher) ? roh.buecher : [];
  /* Kommt eine leseliste, liefern ihre Blöcke die Themen. */
  const blockNamen = {};
  if (Array.isArray(roh.bloecke)) roh.bloecke.forEach(bl => { blockNamen[bl.id] = bl.name; });
  return liste.map((w, i) => {
    const n = stoWerkNorm(w, i);
    if (n.thema === 'Ohne Thema' && w && blockNamen[w.blockId]) n.thema = blockNamen[w.blockId];
    return n;
  }).filter(w => w.titel && w.titel !== 'Ohne Titel');
}

/* Aus einem gemerkten Werk ein Buch der leseliste machen. */
function stoBuchAus(w, blockId, ord) {
  return {
    id: uid(), blockId, ord,
    titel: w.titel, autor: w.autor,
    autorGeb: null, autorGest: null, autorBio: '', autorEinfluss: [],
    autoren: w.autoren,
    schwierigkeit: w.schwierigkeit,
    jahr: w.jahr, seiten: w.seiten, seitenUnsicher: w.seitenUnsicher,
    ausgabe: w.ausgabe, link: w.link, beschreibung: w.beschreibung, kurz: w.kurz,
    preis: null, status: 'offen', besitz: w.besitz, einkauf: false,
    sessions: [], notizen: []
  };
}

function stoWerkZeile(w, ohneJahr) {
  const a = w.autoren[0];
  const lebt = a ? lebensdaten(a.geb, a.gest) : '';
  return [w.autor || 'ohne Autor', lebt,
    (ohneJahr || w.jahr == null) ? '' : jahrText(w.jahr),
    w.seiten ? (w.seitenUnsicher ? 'ca. ' : '') + w.seiten + ' S.' : '']
    .filter(Boolean).join(' · ');
}

function stoebernOeffnen() {
  let werke = [], themen = [], gewaehlteThemen = new Set();
  let stapel = [], zeiger = 0, gemerkt = [], verlauf = [];
  let bloecke = [], frei = [], listenName = '';
  let schritt = 'laden';

  /* Der Durchgang wird laufend im Speicher abgelegt: Werke einmal, alles
     andere als Verweis darauf. So steht beim nächsten Mal derselbe Stand. */
  const nachId = id => werke.find(w => w.id === id) || null;
  const merken = () => {
    if (!werke.length) return;
    aendern(() => {
      DB.stoebern = {
        werke,
        themen,
        gewaehlt: Array.from(gewaehlteThemen),
        stapel: stapel.map(w => w.id),
        zeiger,
        gemerkt: gemerkt.map(w => w.id),
        verlauf: verlauf.map(v => ({ id: v.werk.id, mochte: v.mochte })),
        bloecke: bloecke.map(b => ({ id: b.id, name: b.name, werke: b.werke.map(w => w.id) })),
        frei: frei.map(w => w.id),
        name: listenName,
        schritt
      };
    });
  };
  const wiederherstellen = () => {
    const g = DB.stoebern;
    if (!g || !Array.isArray(g.werke) || !g.werke.length) return false;
    werke = g.werke;
    themen = Array.isArray(g.themen) ? g.themen : [];
    gewaehlteThemen = new Set(Array.isArray(g.gewaehlt) ? g.gewaehlt : themen);
    stapel = (g.stapel || []).map(nachId).filter(Boolean);
    zeiger = clamp(+g.zeiger || 0, 0, stapel.length);
    gemerkt = (g.gemerkt || []).map(nachId).filter(Boolean);
    verlauf = (g.verlauf || []).map(v => ({ werk: nachId(v.id), mochte: !!v.mochte })).filter(v => v.werk);
    bloecke = (g.bloecke || []).map(b => ({
      id: b.id || uid(), name: b.name || '', werke: (b.werke || []).map(nachId).filter(Boolean)
    }));
    frei = (g.frei || []).map(nachId).filter(Boolean);
    listenName = g.name || '';
    schritt = ['themen', 'wischen', 'sammlung', 'bloecke'].includes(g.schritt) ? g.schritt : 'themen';
    if (schritt === 'wischen' && !stapel.length) schritt = 'themen';
    /* Wer zurückkommt, will an die Karte, nicht noch einmal durch Laden und
       Themen – auch wenn er beim Weggehen über diese Schritte gegangen ist. */
    if (stapel.length && (schritt === 'laden' || schritt === 'themen')) {
      schritt = zeiger < stapel.length ? 'wischen' : (gemerkt.length ? 'sammlung' : 'wischen');
    }
    return true;
  };

  const node = document.createElement('div');
  node.className = 'sto';
  node.innerHTML = `
    <div class="ovl-head sto-kopf">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="t" data-t>Stöbern</div><div class="u" data-u></div></div>
      <span class="sto-zaehler" data-zaehler hidden>${ICON.herz}<span data-zahl>0</span></span>
    </div>
    <div class="sto-fort"><i data-fort style="width:0%"></i></div>
    <div class="sto-inhalt" style="flex:1;min-height:0;display:flex;flex-direction:column" data-inhalt></div>`;

  const inhalt = $('[data-inhalt]', node);
  const kopfT = $('[data-t]', node), kopfU = $('[data-u]', node);
  const zaehler = $('[data-zaehler]', node), zahl = $('[data-zahl]', node);
  const fort = $('[data-fort]', node);

  const zaehlerAuffrischen = (puls) => {
    zaehler.hidden = !(schritt === 'wischen' || schritt === 'sammlung');
    zahl.textContent = String(gemerkt.length);
    if (puls) {
      zaehler.classList.remove('puls');
      void zaehler.offsetWidth;
      zaehler.classList.add('puls');
    }
  };

  /* ---------- Schritt 1: laden ---------- */
  const schrittLaden = () => {
    kopfT.textContent = 'Stöbern';
    kopfU.textContent = 'Eine Sammlung laden';
    fort.style.width = '0%';
    inhalt.innerHTML = `
      <div class="sto-body">
        <div class="empty" style="margin:0 0 14px">
          <strong>Werke sichten statt Listen bauen</strong>
          Lade einen Vorrat an Werken. Du bekommst sie einzeln gezeigt und wischst nach rechts,
          was dich interessiert – nach links, was nicht. Aus dem Gemerkten baust du danach die Blöcke.
        </div>
        <button class="btn btn-primary btn-block" data-waehlen>${ICON.books} Sammlung wählen</button>
        <input type="file" accept=".json,application/json" data-file hidden>
        <p class="hinweis" style="padding:14px 0 8px">
          Noch keine Sammlung? Die App baut dir den Prompt dafür – mehrere Themen hinein,
          rund hundert Werke heraus.
        </p>
        <button class="btn btn-block" data-prompt>${ICON.tags} Prompt für eine Sammlung</button>
      </div>`;
    if (werke.length) {
      /* Ein angefangener Durchgang liegt noch da – nur der Vollständigkeit
         halber, denn beim Öffnen wird er ohnehin gleich fortgesetzt. */
      $('.sto-body', inhalt).insertAdjacentHTML('afterbegin',
        `<button class="btn btn-block" style="margin-bottom:14px" data-weiter>${ICON.rueck} Angefangenes fortsetzen</button>`);
      $('[data-weiter]', inhalt).onclick = () => { schritt = 'themen'; malen(); };
    }
    const datei = $('[data-file]', inhalt);
    $('[data-waehlen]', inhalt).onclick = () => datei.click();
    $('[data-prompt]', inhalt).onclick = () => stoebernPromptOeffnen();
    datei.onchange = async () => {
      const f = datei.files[0];
      if (!f) return;
      let roh;
      try { roh = JSON.parse(await f.text()); }
      catch (e) { toast('Die Datei ist kein gültiges JSON.', 4000); return; }
      const gefunden = stoWerkeAus(roh);
      if (!gefunden.length) { toast('Darin stecken keine Werke.', 4000); return; }
      werke = gefunden;
      themen = [];
      werke.forEach(w => { if (!themen.includes(w.thema)) themen.push(w.thema); });
      gewaehlteThemen = new Set(themen);
      stapel = []; zeiger = 0; gemerkt = []; verlauf = [];
      bloecke = []; frei = []; listenName = '';
      schritt = 'themen';
      merken();
      malen();
    };
  };

  /* ---------- Schritt 2: Themen ---------- */
  const schrittThemen = () => {
    kopfT.textContent = 'Woraus stöbern?';
    kopfU.textContent = pl(werke.length, 'Werk', 'Werke') + ' in ' + pl(themen.length, 'Thema', 'Themen');
    fort.style.width = '8%';
    const zaehle = t => werke.filter(w => w.thema === t).length;
    inhalt.innerHTML = `
      <div class="sto-body">
        <p class="hinweis" style="padding:0 0 12px">Tippe ein Thema an, um es aus dem Stapel zu nehmen.</p>
        <div class="list-card">${themen.map(t => `
          <button class="rowline" data-thema="${esc(t)}" style="width:100%;text-align:left">
            <span class="status-btn" data-hk style="width:24px;height:24px"></span>
            <span class="grow"><span class="rn">${esc(t)}</span>
              <span class="rm">${pl(zaehle(t), 'Werk', 'Werke')}</span></span>
          </button>`).join('')}</div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn btn-sm" data-alle style="flex:1">Alle</button>
          <button class="btn btn-sm" data-keine style="flex:1">Keines</button>
        </div>
        <label class="optzeile" style="display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text-2);margin-top:16px">
          <input type="checkbox" data-mischen checked style="width:auto;margin-top:3px">
          <span><strong style="color:var(--text)">Durchmischen</strong><br>Die Themen wechseln sich ab, statt blockweise zu kommen.</span>
        </label>
      </div>
      <div class="sto-fuss">
        <button class="btn btn-primary btn-block" data-los></button>
      </div>`;

    const auffrischen = () => {
      $$('[data-thema]', inhalt).forEach(b => {
        const an = gewaehlteThemen.has(b.dataset.thema);
        const hk = $('[data-hk]', b);
        hk.innerHTML = an ? ICON.check : '';
        hk.style.cssText = 'width:24px;height:24px;' + (an
          ? 'border-color:var(--accent);color:var(--accent);background:var(--accent-soft)' : '');
      });
      const n = werke.filter(w => gewaehlteThemen.has(w.thema)).length;
      const los = $('[data-los]', inhalt);
      los.textContent = n ? 'Losstöbern · ' + pl(n, 'Werk', 'Werke') : 'Kein Thema gewählt';
      los.disabled = !n;
    };
    $$('[data-thema]', inhalt).forEach(b => b.onclick = () => {
      const t = b.dataset.thema;
      gewaehlteThemen.has(t) ? gewaehlteThemen.delete(t) : gewaehlteThemen.add(t);
      auffrischen();
    });
    $('[data-alle]', inhalt).onclick = () => { gewaehlteThemen = new Set(themen); auffrischen(); };
    $('[data-keine]', inhalt).onclick = () => { gewaehlteThemen.clear(); auffrischen(); };
    $('[data-los]', inhalt).onclick = () => {
      stapel = werke.filter(w => gewaehlteThemen.has(w.thema));
      if ($('[data-mischen]', inhalt).checked) stapel = stoMischen(stapel);
      zeiger = 0; gemerkt = []; verlauf = [];
      schritt = 'wischen';
      malen();
    };
    auffrischen();
  };

  /* Die Themen abwechselnd ziehen, damit nicht alles am Stück kommt. */
  const stoMischen = (liste) => {
    const faecher = new Map();
    liste.forEach(w => {
      if (!faecher.has(w.thema)) faecher.set(w.thema, []);
      faecher.get(w.thema).push(w);
    });
    const reihen = Array.from(faecher.values());
    const out = [];
    let i = 0;
    while (out.length < liste.length) {
      const r = reihen[i % reihen.length];
      if (r.length) out.push(r.shift());
      i++;
      if (reihen.every(x => !x.length)) break;
    }
    return out;
  };

  /* ---------- Schritt 3: wischen ---------- */
  const schrittWischen = () => {
    kopfT.textContent = 'Stöbern';
    inhalt.innerHTML = `
      <div class="stoBuehne">
        <div class="stoDeck" data-deck>
          <div class="stoHerz" data-herz>${ICON.herz}</div>
        </div>
      </div>
      <div class="sto-fuss">
        <div class="stoKnoepfe">
          <button class="nein" data-nein aria-label="Weg">${ICON.x}</button>
          <button class="rueck" data-rueck aria-label="Zurück">${ICON.rueck}</button>
          <button class="ja" data-ja aria-label="Merken">${ICON.herz}</button>
        </div>
        <button class="btn btn-block btn-ghost btn-sm" style="margin-top:10px" data-fertig></button>
      </div>`;
    const deck = $('[data-deck]', inhalt);
    const herz = $('[data-herz]', inhalt);
    let karten = [];
    let sperre = false;

    const tiefeSetzen = (el, t, f) => {
      const s = 1 - t * 0.04 + f * 0.04, y = t * 26 - f * 26;
      el.style.transform = `translateY(${y}px) scale(${s})`;
    };

    const kopfAuffrischen = () => {
      kopfU.textContent = Math.min(zeiger + 1, stapel.length) + ' von ' + stapel.length;
      fort.style.width = (zeiger / Math.max(1, stapel.length) * 100) + '%';
      $('[data-rueck]', inhalt).disabled = !verlauf.length;
      const f = $('[data-fertig]', inhalt);
      f.textContent = gemerkt.length
        ? 'Fertig – ' + pl(gemerkt.length, 'Werk gemerkt', 'Werke gemerkt')
        : 'Noch nichts gemerkt';
      f.disabled = !gemerkt.length;
      zaehlerAuffrischen(false);
    };

    const karteBauen = (w) => {
      const el = document.createElement('div');
      el.className = 'stoKarte';
      el.innerHTML = `
        <span class="kStempel kJa">MERKEN</span>
        <span class="kStempel kNein">WEG</span>
        <div class="kKopf">
          <span class="kThema">${esc(w.thema)}</span>
          <span class="kJahr num">${w.jahr != null ? esc(jahrText(w.jahr)) : ''}</span>
        </div>
        <div class="kTitel">${esc(w.titel)}</div>
        <div class="kAutor">${esc(stoWerkZeile(w, true))}</div>
        ${w.kurz ? `<div class="kKurz">${esc(w.kurz)}</div>` : ''}
        ${w.beschreibung ? `<div class="kText">${esc(w.beschreibung)}</div>` : '<div class="kText"></div>'}
        ${w.beschreibung && w.beschreibung.length > 260 ? '<button class="kMehr" data-mehr>Ganzen Text lesen</button>' : ''}
        <div class="kFuss">
          ${w.schwierigkeit ? stufeHtml(w.schwierigkeit) : ''}
          ${w.ausgabe ? `<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.ausgabe)}</span>` : ''}
        </div>`;
      const mehr = $('[data-mehr]', el);
      if (mehr) mehr.onclick = e => { e.stopPropagation(); stoWerkBlatt(w); };
      return el;
    };

    const deckMalen = () => {
      deck.querySelectorAll('.stoKarte').forEach(n => n.remove());
      karten = [];
      const rest = stapel.length - zeiger;
      if (rest <= 0) { schritt = 'sammlung'; malen(); return; }
      for (let t = Math.min(2, rest - 1); t >= 0; t--) {
        const el = karteBauen(stapel[zeiger + t]);
        el.style.zIndex = String(10 - t);
        if (t > 0) el.classList.add('hinten');
        tiefeSetzen(el, t, 0);
        deck.appendChild(el);
        karten.unshift({ el, werk: stapel[zeiger + t] });
      }
      if (karten[0]) ziehenBinden(karten[0].el);
      kopfAuffrischen();
    };

    /* Die Entscheidung festhalten und zur nächsten Karte gehen. */
    const entscheiden = (mochte) => {
      const w = stapel[zeiger];
      if (!w) return;
      verlauf.push({ werk: w, mochte });
      if (mochte) { gemerkt.push(w); zaehlerAuffrischen(true); }
      zeiger++;
      deckMalen();
      merken();
    };

    const wegfliegen = (richtung) => {
      if (sperre || !karten[0]) return;
      sperre = true;
      const el = karten[0].el;
      const b = deck.clientWidth || 320;
      el.style.transition = 'transform .38s cubic-bezier(.3,.6,.4,1),opacity .38s ease';
      el.style.transform = `translate(${richtung * b * 1.5}px,${richtung * 40}px) rotate(${richtung * 26}deg)`;
      el.style.opacity = '0';
      const st = $('.' + (richtung > 0 ? 'kJa' : 'kNein'), el);
      if (st) st.style.opacity = '1';
      if (richtung > 0) {
        herz.classList.remove('los');
        void herz.offsetWidth;
        herz.classList.add('los');
      }
      if (karten[1]) tiefeSetzen(karten[1].el, 1, 1);
      setTimeout(() => { sperre = false; entscheiden(richtung > 0); }, 300);
    };

    const zurueck = () => {
      if (sperre || !verlauf.length) return;
      const letzt = verlauf.pop();
      if (letzt.mochte) {
        const i = gemerkt.lastIndexOf(letzt.werk);
        if (i >= 0) gemerkt.splice(i, 1);
        zaehlerAuffrischen(false);
      }
      zeiger = Math.max(0, zeiger - 1);
      deckMalen();
      merken();
      /* Von der Seite wieder hereinschieben, aus der sie verschwunden ist. */
      const el = karten[0] && karten[0].el;
      if (el) {
        const b = deck.clientWidth || 320;
        el.style.transition = 'none';
        el.style.transform = `translate(${(letzt.mochte ? 1 : -1) * b * 1.2}px,0) rotate(${(letzt.mochte ? 1 : -1) * 18}deg)`;
        void el.offsetWidth;
        el.style.transition = 'transform .34s cubic-bezier(.2,.7,.3,1)';
        tiefeSetzen(el, 0, 0);
      }
    };

    /* Ziehen mit dem Finger: die Karte folgt, kippt und stempelt sich. */
    const ziehenBinden = (el) => {
      let x0 = 0, y0 = 0, dx = 0, dy = 0, zieht = false, zeigerId = null;
      const stJa = $('.kJa', el), stNein = $('.kNein', el);
      const schwelle = () => Math.max(70, (deck.clientWidth || 320) * 0.26);

      const setzen = () => {
        el.style.transform = `translate(${dx}px,${dy * 0.35}px) rotate(${dx * 0.05}deg)`;
        const f = clamp(Math.abs(dx) / schwelle(), 0, 1);
        if (stJa) stJa.style.opacity = dx > 0 ? String(f) : '0';
        if (stNein) stNein.style.opacity = dx < 0 ? String(f) : '0';
        if (karten[1]) tiefeSetzen(karten[1].el, 1, f);
      };

      el.addEventListener('pointerdown', e => {
        if (sperre || (e.target.closest && e.target.closest('[data-mehr]'))) return;
        zieht = true; zeigerId = e.pointerId;
        x0 = e.clientX; y0 = e.clientY; dx = dy = 0;
        el.style.transition = 'none';
        window.__zieht = true;
        try { el.setPointerCapture(zeigerId); } catch (err) { }
      });
      el.addEventListener('pointermove', e => {
        if (!zieht || e.pointerId !== zeigerId) return;
        dx = e.clientX - x0; dy = e.clientY - y0;
        setzen();
      });
      const loslassen = () => {
        if (!zieht) return;
        zieht = false;
        window.__zieht = false;
        try { el.releasePointerCapture(zeigerId); } catch (err) { }
        el.style.transition = '';
        if (Math.abs(dx) > schwelle()) { wegfliegen(dx > 0 ? 1 : -1); return; }
        el.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1)';
        tiefeSetzen(el, 0, 0);
        if (stJa) stJa.style.opacity = '0';
        if (stNein) stNein.style.opacity = '0';
        if (karten[1]) tiefeSetzen(karten[1].el, 1, 0);
      };
      el.addEventListener('pointerup', loslassen);
      el.addEventListener('pointercancel', loslassen);
      /* Ein Tipp öffnet die ganze Beschreibung. */
      el.addEventListener('click', e => {
        if (Math.abs(dx) > 6 || (e.target.closest && e.target.closest('[data-mehr]'))) return;
        const w = karten[0] && karten[0].werk;
        if (w) stoWerkBlatt(w);
      });
    };

    $('[data-nein]', inhalt).onclick = () => wegfliegen(-1);
    $('[data-ja]', inhalt).onclick = () => wegfliegen(1);
    $('[data-rueck]', inhalt).onclick = zurueck;
    $('[data-fertig]', inhalt).onclick = () => { schritt = 'sammlung'; malen(); };
    deckMalen();
  };

  /* ---------- Schritt 4: Sammlung ---------- */
  const schrittSammlung = () => {
    kopfT.textContent = 'Gemerkt';
    kopfU.textContent = pl(gemerkt.length, 'Werk', 'Werke')
      + (zeiger < stapel.length ? ' · ' + (stapel.length - zeiger) + ' ungesichtet' : '');
    fort.style.width = '66%';
    if (!gemerkt.length) {
      inhalt.innerHTML = `
        <div class="sto-body">
          <div class="empty" style="margin:0">
            <strong>Noch nichts gemerkt</strong>
            Wische nach rechts, was dich interessiert – daraus entsteht die leseliste.
          </div>
        </div>
        <div class="sto-fuss"><button class="btn btn-block" data-weiter>Weiter stöbern</button></div>`;
      $('[data-weiter]', inhalt).onclick = () => { schritt = 'wischen'; malen(); };
      return;
    }
    const nachThema = [];
    gemerkt.forEach(w => {
      let g = nachThema.find(x => x.thema === w.thema);
      if (!g) { g = { thema: w.thema, werke: [] }; nachThema.push(g); }
      g.werke.push(w);
    });
    inhalt.innerHTML = `
      <div class="sto-body">
        ${nachThema.map(g => `
          <div class="section-head" style="padding:0"><h2>${esc(g.thema)}</h2>
            <span class="eyebrow">${g.werke.length}</span></div>
          <div class="list-card" style="margin-bottom:16px">${g.werke.map(w => `
            <div class="stoWerk">
              <span class="grow"><span class="wn">${esc(w.titel)}</span>
                <span class="wm">${esc(stoWerkZeile(w))}</span></span>
              <button class="icon-btn" data-raus="${w.id}" aria-label="Verwerfen">${ICON.x}</button>
            </div>`).join('')}</div>`).join('')}
      </div>
      <div class="sto-fuss">
        ${zeiger < stapel.length ? '<button class="btn btn-block btn-sm" style="margin-bottom:8px" data-weiter>Weiter stöbern · ' + (stapel.length - zeiger) + ' offen</button>' : ''}
        <button class="btn btn-primary btn-block" data-bloecke>Zu Blöcken ordnen</button>
      </div>`;
    $$('[data-raus]', inhalt).forEach(b => b.onclick = () => {
      const i = gemerkt.findIndex(w => w.id === b.dataset.raus);
      if (i >= 0) gemerkt.splice(i, 1);
      zaehlerAuffrischen(false);
      malen();
    });
    const w8 = $('[data-weiter]', inhalt);
    if (w8) w8.onclick = () => { schritt = 'wischen'; malen(); };
    $('[data-bloecke]', inhalt).onclick = () => {
      /* Vorschlag: jedes Thema wird ein Block, in der Reihenfolge des Vorrats. */
      bloecke = [];
      frei = [];
      gemerkt.forEach(w => {
        let bl = bloecke.find(x => x.name === w.thema);
        if (!bl) { bl = { id: uid(), name: w.thema, werke: [] }; bloecke.push(bl); }
        bl.werke.push(w);
      });
      if (!listenName) listenName = bloecke.length === 1 ? bloecke[0].name : 'Meine Auswahl';
      schritt = 'bloecke';
      malen();
    };
  };

  /* ---------- Schritt 5: Blöcke ---------- */
  const schrittBloecke = () => {
    kopfT.textContent = 'Blöcke ordnen';
    const n = bloecke.reduce((s, b) => s + b.werke.length, 0) + frei.length;
    kopfU.textContent = pl(bloecke.length, 'Block', 'Blöcke') + ' · ' + pl(n, 'Werk', 'Werke');
    fort.style.width = '100%';

    const werkZeile = (w, blockId) => `
      <div class="stoWerk">
        <span class="grow"><span class="wn">${esc(w.titel)}</span>
          <span class="wm">${esc(stoWerkZeile(w))}</span></span>
        <button class="icon-btn" data-schieb="${w.id}" data-von="${blockId}" aria-label="In anderen Block">${ICON.schieben}</button>
        <button class="icon-btn" data-raus="${w.id}" data-von="${blockId}" aria-label="Verwerfen">${ICON.x}</button>
      </div>`;

    inhalt.innerHTML = `
      <div class="sto-body">
        <div class="field">
          <label>Name der neuen leseliste</label>
          <input type="text" data-name value="${esc(listenName)}" placeholder="z. B. Meine Auswahl">
        </div>
        ${bloecke.map((bl, i) => `
          <div class="stoBlock${bl.werke.length ? '' : ' leer'}">
            <div class="bk">
              <input type="text" data-bname="${bl.id}" value="${esc(bl.name)}" placeholder="Blockname">
              <span class="bz">${bl.werke.length}</span>
              <button class="icon-btn" data-hoch="${bl.id}" aria-label="Nach oben"${i ? '' : ' disabled'}>${ICON.up}</button>
              <button class="icon-btn" data-runter="${bl.id}" aria-label="Nach unten"${i < bloecke.length - 1 ? '' : ' disabled'}>${ICON.down}</button>
              <button class="icon-btn" data-blweg="${bl.id}" aria-label="Block auflösen">${ICON.trash}</button>
            </div>
            <div class="bw">${bl.werke.length
        ? bl.werke.map(w => werkZeile(w, bl.id)).join('')
        : '<div class="stoLeer">Leer – verschiebe Werke hierher oder löse den Block auf.</div>'}</div>
          </div>`).join('')}
        <button class="btn btn-block btn-sm" data-neublock>${ICON.plus} Block anlegen</button>
        ${frei.length ? `
          <div class="section-head" style="margin-top:20px;padding:0"><h2>Ohne Block</h2>
            <span class="eyebrow">${frei.length}</span></div>
          <div class="list-card">${frei.map(w => werkZeile(w, '')).join('')}</div>
          <p class="hinweis" style="padding:8px 0 0">Was hier stehen bleibt, kommt als Block „Weitere“ mit.</p>` : ''}
      </div>
      <div class="sto-fuss">
        <button class="btn btn-primary btn-block" data-anlegen></button>
      </div>`;

    const anlegen = $('[data-anlegen]', inhalt);
    anlegen.textContent = n ? 'leseliste anlegen · ' + pl(n, 'Werk', 'Werke') : 'Nichts zu übernehmen';
    anlegen.disabled = !n;

    $('[data-name]', inhalt).oninput = e => { listenName = e.target.value; merken(); };
    $$('[data-bname]', inhalt).forEach(i => i.oninput = () => {
      const bl = bloecke.find(x => x.id === i.dataset.bname);
      if (bl) { bl.name = i.value; merken(); }
    });
    $$('[data-hoch]', inhalt).forEach(b => b.onclick = () => {
      const i = bloecke.findIndex(x => x.id === b.dataset.hoch);
      if (i > 0) { bloecke.splice(i - 1, 0, bloecke.splice(i, 1)[0]); malen(); }
    });
    $$('[data-runter]', inhalt).forEach(b => b.onclick = () => {
      const i = bloecke.findIndex(x => x.id === b.dataset.runter);
      if (i >= 0 && i < bloecke.length - 1) { bloecke.splice(i + 1, 0, bloecke.splice(i, 1)[0]); malen(); }
    });
    $$('[data-blweg]', inhalt).forEach(b => b.onclick = () => {
      const i = bloecke.findIndex(x => x.id === b.dataset.blweg);
      if (i < 0) return;
      frei = frei.concat(bloecke[i].werke);
      bloecke.splice(i, 1);
      malen();
    });
    $('[data-neublock]', inhalt).onclick = () => {
      bloecke.push({ id: uid(), name: 'Neuer Block', werke: [] });
      malen();
    };
    $$('[data-raus]', inhalt).forEach(b => b.onclick = () => {
      const von = b.dataset.von;
      const topf = von ? (bloecke.find(x => x.id === von) || {}).werke : frei;
      if (!topf) return;
      const i = topf.findIndex(w => w.id === b.dataset.raus);
      if (i >= 0) {
        const w = topf.splice(i, 1)[0];
        const g = gemerkt.indexOf(w);
        if (g >= 0) gemerkt.splice(g, 1);
      }
      zaehlerAuffrischen(false);
      malen();
    });
    $$('[data-schieb]', inhalt).forEach(b => b.onclick = () => {
      const von = b.dataset.von;
      const topf = von ? (bloecke.find(x => x.id === von) || {}).werke : frei;
      if (!topf) return;
      const w = topf.find(x => x.id === b.dataset.schieb);
      if (!w) return;
      stoVerschieben(w, () => {
        const i = topf.indexOf(w);
        if (i >= 0) topf.splice(i, 1);
      });
    });
    $('[data-anlegen]', inhalt).onclick = () => fertigstellen();
  };

  /* Wohin mit diesem Werk? */
  const stoVerschieben = (w, entfernen) => {
    const s = blatt('„' + w.titel + '“ verschieben', `
      <div class="list-card" data-l></div>
      <button class="btn btn-block btn-sm" style="margin-top:12px" data-neu>${ICON.plus} In neuen Block</button>`,
      { fokus: false });
    const l = $('[data-l]', s);
    l.innerHTML = bloecke.map(bl => `
      <button class="rowline" data-zu="${bl.id}" style="width:100%;text-align:left">
        <span class="grow"><span class="rn">${esc(bl.name || 'Ohne Namen')}</span>
          <span class="rm">${pl(bl.werke.length, 'Werk', 'Werke')}</span></span>
        <span class="chev">${ICON.chev}</span>
      </button>`).join('')
      + `<button class="rowline" data-zu="" style="width:100%;text-align:left">
           <span class="grow"><span class="rn">Ohne Block</span>
             <span class="rm">später zuordnen</span></span>
           <span class="chev">${ICON.chev}</span></button>`;
    $$('[data-zu]', s).forEach(b => b.onclick = () => {
      entfernen();
      const ziel = b.dataset.zu ? bloecke.find(x => x.id === b.dataset.zu) : null;
      if (ziel) ziel.werke.push(w); else frei.push(w);
      layerSchliessen();
      malen();
    });
    $('[data-neu]', s).onclick = () => {
      const bl = { id: uid(), name: w.thema || 'Neuer Block', werke: [] };
      entfernen();
      bl.werke.push(w);
      bloecke.push(bl);
      layerSchliessen();
      malen();
    };
  };

  const fertigstellen = () => {
    const name = (listenName || '').trim() || 'Meine Auswahl';
    const fertig = bloecke.filter(b => b.werke.length).map(b => ({
      name: (b.name || '').trim() || 'Ohne Namen', werke: b.werke
    }));
    if (frei.length) fertig.push({ name: 'Weitere', werke: frei.slice() });
    if (!fertig.length) { toast('Kein Werk zugeordnet.'); return; }
    let planId = null;
    aendern(() => {
      const plan = { id: uid(), name, ord: DB.lesepleane.length };
      DB.lesepleane.push(plan);
      planId = plan.id;
      DB.einstellungen.aktiverPlanId = plan.id;
      fertig.forEach((bl, i) => {
        const block = { id: uid(), planId: plan.id, name: bl.name, notiz: '', ord: i };
        DB.bloecke.push(block);
        bl.werke.forEach((w, j) => DB.buecher.push(stoBuchAus(w, block.id, j)));
      });
    });
    const anzahl = fertig.reduce((s, b) => s + b.werke.length, 0);
    /* Das Gemerkte ist verbraucht; der Vorrat und der Stand im Stapel
       bleiben, damit man später weiterstöbern kann. */
    gemerkt = []; verlauf = []; bloecke = []; frei = []; listenName = '';
    schritt = zeiger < stapel.length ? 'wischen' : 'themen';
    merken();
    layerSchliessen();
    offeneBloecke.clear();
    if (aktiverTab !== 'plan') tabWechseln('plan'); else viewMalen();
    toast('„' + name + '“ angelegt: ' + pl(fertig.length, 'Block', 'Blöcke') + ', ' + pl(anzahl, 'Werk', 'Werke') + '.', 4000);
  };

  /* Ein Schritt zurück gehört in den Fuss – die Kopfzeile bleibt die der App. */
  const SCHRITT_ZURUECK = { themen: 'laden', wischen: 'themen', sammlung: 'wischen', bloecke: 'sammlung' };
  const SCHRITT_NAME = { laden: 'Laden', themen: 'Themen', wischen: 'Karten', sammlung: 'Sammlung' };
  const fussZurueck = () => {
    const zu = SCHRITT_ZURUECK[schritt];
    const fuss = $('.sto-fuss', inhalt);
    if (!zu || !fuss) return;
    const b = document.createElement('button');
    b.className = 'sto-zurueck';
    b.innerHTML = ICON.back + '<span>' + SCHRITT_NAME[zu] + '</span>';
    b.onclick = () => { schritt = zu; malen(); };
    fuss.appendChild(b);
  };

  const malen = () => {
    if (schritt === 'laden') schrittLaden();
    else if (schritt === 'themen') schrittThemen();
    else if (schritt === 'wischen') schrittWischen();
    else if (schritt === 'sammlung') schrittSammlung();
    else schrittBloecke();
    fussZurueck();
    zaehlerAuffrischen(false);
    merken();
  };

  /* Der Pfeil oben tut, was er in jeder anderen Ebene tut: er schliesst sie.
     Zwischen den Schritten geht es unten im Fuss zurück. */
  $('[data-back]', node).onclick = () => layerSchliessen();

  layerOeffnen(node, () => {
    window.__zieht = false;
    /* Beim Verlassen wird der Stand sofort weggeschrieben – die
       Selbstsicherung käme erst Sekunden später. */
    merken();
    Store.sichern(true);
  });
  /* Wiedereinstieg ohne Ansage: der Stapel liegt einfach wieder da, wo er lag. */
  wiederherstellen();
  malen();
}

    Store.letzteSicherung = 0; Store.fehler = null;
    themeAnwenden();
    splashZeigen();
    toast('Zurückgesetzt.');
  };
}

function artenVerwalten() {
  const s = blatt('Notiz-Arten', '<div data-l></div>', { fokus: false });
  const malen = () => {
    const l = $('[data-l]', s);
    const benutzt = id => alleNotizen().filter(x => x.notiz.artId === id).length;
    l.innerHTML = `<div class="list-card">${DB.arten.map(a => `
      <div class="rowline">
        <span class="swatch" style="width:12px;height:12px;border-radius:4px;background:var(--${a.farbe})"></span>
        <span class="grow"><span class="rn">${esc(a.name)}</span><span class="rm">${benutzt(a.id)} Notizen</span></span>
        <button class="icon-btn" data-farbe="${a.id}" aria-label="Farbe">◐</button>
        <button class="icon-btn" data-um="${a.id}" aria-label="Umbenennen">${ICON.edit}</button>
        <button class="icon-btn" data-del="${a.id}" aria-label="Löschen">${ICON.trash}</button>
      </div>`).join('')}</div>
      <button class="btn btn-block" style="margin-top:12px" data-neu>${ICON.plus} Art anlegen</button>`;

    $$('[data-farbe]', l).forEach(b => b.onclick = () => {
      const a = artById(b.dataset.farbe);
      aendern(() => { a.farbe = ART_FARBEN[(ART_FARBEN.indexOf(a.farbe) + 1) % ART_FARBEN.length]; });
      malen(); viewMalen();
    });
    $$('[data-um]', l).forEach(b => b.onclick = () => {
      const a = artById(b.dataset.um);
      const s2 = blatt('Umbenennen', `<div class="field"><input type="text" data-n value="${esc(a.name)}"></div>
        <button class="btn btn-primary btn-block" data-ok>Sichern</button>`);
      $('[data-ok]', s2).onclick = () => {
        const n = $('[data-n]', s2).value.trim();
        if (!n) return;
        aendern(() => { a.name = n; });
        layerSchliessen(); malen(); viewMalen();
      };
    });
    $$('[data-del]', l).forEach(b => b.onclick = async () => {
      const a = artById(b.dataset.del);
      const ok = await bestaetigen('Art löschen?', `„${esc(a.name)}“ verschwindet. Die ${benutzt(a.id)} Notizen bleiben und stehen dann unter „Ohne Art“.`, 'Löschen', true);
      if (!ok) return;
      aendern(() => {
        DB.buecher.forEach(x => x.notizen.forEach(n => { if (n.artId === a.id) n.artId = null; }));
        DB.arten = DB.arten.filter(x => x.id !== a.id);
      });
      malen(); viewMalen();
    });
    $('[data-neu]', l).onclick = () => {
      const s2 = blatt('Neue Art', `<div class="field"><input type="text" data-n placeholder="z.B. Sonstiges"></div>
        <button class="btn btn-primary btn-block" data-ok>Anlegen</button>`);
      $('[data-ok]', s2).onclick = () => {
        const n = $('[data-n]', s2).value.trim();
        if (!n) return;
        aendern(() => DB.arten.push({ id: uid(), name: n, farbe: ART_FARBEN[DB.arten.length % 8] }));
        layerSchliessen(); malen(); viewMalen();
      };
    };
  };
  malen();
}
