<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0e11">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Legt man die Seite auf den Startbildschirm, startet sie damit ohne Browserleisten. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mylife">
<meta name="application-name" content="mylife">
<!-- Erzeugt aus mylife.src.html - nicht von Hand bearbeiten, sondern: node build.js -->
<title>leseliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* ---------- Tokens: dunkel ist die Grundeinstellung, hell wird bewusst gewählt ---------- */
:root{
  --bg:#000000;
  --surface:#0a0a0c;
  --surface-2:#111114;
  --surface-3:#191a1f;
  --border:#232328;
  --border-strong:#3a3b42;
  --text:#ededf0;
  --text-2:#a5a7ae;
  --text-3:#71737b;
  --accent:#dba43f;
  --accent-2:color-mix(in srgb,var(--accent) 78%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent);
  --good:#3fbe8c;
  --good-soft:rgba(63,190,140,.15);
  --bad:#e66767;
  --bad-soft:rgba(230,103,103,.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#4fae4f; --s7:#9085e9; --s8:#e66767;
  --chart-surface:#0a0a0c;
  --grid:#212127;
  --shadow:0 18px 48px rgba(0,0,0,.55);
  --scrim:rgba(4,6,8,.72);
  color-scheme:dark;
}
:root[data-app-theme="light"]{
  --bg:#eef0f3;
  --surface:#ffffff;
  --surface-2:#f5f6f9;
  --surface-3:#e9ecf1;
  --border:#dce0e6;
  --border-strong:#b9c1cb;
  --text:#11161b;
  --text-2:#4d5762;
  --text-3:#78838e;
  --accent:#8a6114;
  --accent-2:color-mix(in srgb,var(--accent) 80%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);
  --good:#0e7a53;
  --good-soft:rgba(14,122,83,.10);
  --bad:#c2312f;
  --bad-soft:rgba(194,49,47,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --chart-surface:#ffffff;
  --grid:#e4e8ed;
  --shadow:0 18px 44px rgba(23,32,45,.16);
  --scrim:rgba(30,38,48,.42);
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
/* Kein Zurückblättern und kein Nachziehen durch Überziehen: waagerechte
   Bahnen (Tage im To-Do, Karten, Seiten) laufen sonst aus der Seite heraus. */
html{overscroll-behavior:none;}
body{overscroll-behavior:none;
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;}
p{margin:0;}
[hidden]{display:none !important;}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
.serif{font-family:"Literata",Georgia,"Times New Roman",serif;}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:600;}
.muted{color:var(--text-2);}
.shell{max-width:680px;margin:0 auto;}

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);touch-action:none;
}
.topbar-inner{padding:12px 16px 10px;display:flex;flex-direction:column;gap:9px;}
.topbar-row{display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1;text-align:left;
  background:none;border:0;padding:0;color:inherit;cursor:pointer;}
.brand:active h1{opacity:.55;}
.brand h1{font-family:"Literata",Georgia,serif;font-size:17.5px;letter-spacing:-.01em;}
.brand .sub{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);display:grid;place-items:center;flex:0 0 auto;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);}
.icon-btn svg{width:17px;height:17px;display:block;}
.savechip{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--text-2);
  white-space:nowrap;margin-left:auto;
}
.savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto;}
.savechip[data-state="dirty"] .dot{background:var(--accent);}
.savechip[data-state="dirty"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));}
.savechip[data-state="error"] .dot{background:var(--bad);}
.savechip[data-state="error"]{color:var(--bad);}

.zielrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;
  border-radius:10px;border:1px solid var(--border);background:var(--surface);}
.zielrow .zt{font-size:11.5px;color:var(--text-2);white-space:nowrap;}
.zielrow .zbar{flex:1;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.zielrow .zbar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease;}
.zielrow .zn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.zielrow.geschafft .zbar > i{background:var(--good);}
.zielrow.geschafft .zn{color:var(--good);}
.progress-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-3);}
.barwrap{height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden;display:flex;gap:2px;}
.bar-read{height:100%;background:var(--good);border-radius:99px;transition:width .35s ease;}
.bar-active{height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease;}

/* ---------- Tableiste ---------- */
/* Laufende Sitzung bzw. Startknopf, direkt über der Tableiste */
.nowbar{
  position:fixed;left:0;right:0;bottom:calc(var(--tabh, 58px) + 6px);z-index:39;
  display:flex;justify-content:center;padding:0 12px 8px;pointer-events:none;
}
.nowbar-inner{
  pointer-events:auto;width:100%;max-width:656px;display:flex;align-items:center;gap:10px;
  padding:8px 10px 8px 13px;border-radius:13px;
  /* Bereit zum Starten: Akzent. Läuft gerade eine Sitzung: rot. */
  border:1.5px solid color-mix(in srgb,var(--accent) 60%,var(--border));
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);
  box-shadow:var(--shadow);transition:border-color .25s ease;
}
.nowbar-inner.laeuft{border-color:color-mix(in srgb,var(--bad) 72%,var(--border));}
.nowbar-inner.fertig{border-color:color-mix(in srgb,var(--good) 60%,var(--border));}
.nowbar-inner.fertig .nt{color:var(--good);}
.nowbar-inner.laeuft .uhr{color:var(--bad);}
.nowbar .grow{flex:1;min-width:0;}
/* display:block ist nötig – an einem Inline-Element greift overflow nicht,
   der Titel lief sonst über die Uhr. */
.nowbar .nt{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nowbar .nm{font-size:10.5px;color:var(--text-3);margin-top:2px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nowbar .uhr,.nowbar .btn{flex:0 0 auto;}
.nowbar .uhr{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;}
main{padding-bottom:calc(var(--tabh, 58px) + 38px);}
body.hat-nowbar main{padding-bottom:calc(var(--tabh, 58px) + 96px);}
.toast{bottom:calc(var(--tabh, 58px) + 16px);}
body.hat-nowbar .toast{bottom:calc(var(--tabh, 58px) + 74px);}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-inner{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
.tabbar button{
  padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--text-3);font-weight:500;
}
.tabbar button svg{width:19px;height:19px;}
.tabbar button[aria-selected="true"]{color:var(--accent);}
main{padding:18px 0 0;}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;}
.section{padding:0 14px;margin-bottom:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px;}
.section-head h2{font-size:13px;font-weight:600;letter-spacing:.01em;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:500;
}
.btn:hover{border-color:var(--border-strong);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#12100a;font-weight:600;}
:root[data-app-theme="light"] .btn-primary{color:#fff;}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2);}
.btn-ghost{background:transparent;}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border));background:var(--bad-soft);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:12px;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,var(--border));color:var(--accent);font-weight:600;}
.chip .swatch{width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 2px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field > label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;}
/* Zeile mit Radio oder Haken: hier steht Fließtext, keine Feldüberschrift. */
.field > label.optzeile{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5;
  letter-spacing:0;text-transform:none;color:var(--text-2);font-weight:400;margin-bottom:8px;}
.field > label.optzeile:last-child{margin-bottom:0;}
.field > label.optzeile input{width:auto;margin-top:3px;flex:0 0 auto;}
.field > label.optzeile strong{color:var(--text);font-weight:600;}
.field .hint{font-size:11.5px;color:var(--text-3);}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);padding:10px 11px;font-size:15px;font-family:inherit;
}
textarea{resize:vertical;min-height:88px;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface-3);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* ---------- Plan ---------- */
.block{margin:0 12px 10px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;}
.block-head{display:flex;align-items:center;gap:11px;padding:13px 13px;width:100%;text-align:left;}
.block-head .idx{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-3);
  width:22px;flex:0 0 auto;padding-top:2px;
}
.block-head .name{font-size:14.5px;font-weight:600;}
.block-head .meta{font-size:11.5px;color:var(--text-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.block-head .grow{flex:1;min-width:0;}
.chev{color:var(--text-3);transition:transform .2s ease;flex:0 0 auto;}
.chev svg{width:16px;height:16px;display:block;}
.block.open > .block-head .chev{transform:rotate(90deg);}
.block-bar{height:3px;background:var(--surface-3);}
.block-bar > i{display:block;height:100%;background:var(--good);}
.books{display:none;padding:10px 8px 10px;flex-direction:column;gap:6px;}
.block.open .books{display:flex;}

/* Jede Buchzeile ist zwei Felder breit: Zeile und Kurzfassung, per Wisch. */
.book{
  display:flex;border-radius:11px;background:var(--surface-2);
  border:1px solid transparent;width:100%;overflow-x:auto;
  scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.book::-webkit-scrollbar{display:none;}
.book:hover{border-color:var(--border);}
.book.zieht,.block.zieht{box-shadow:0 14px 32px rgba(0,0,0,.55);border-color:var(--accent);
  transform:scale(1.02);position:relative;z-index:5;transition:transform .12s ease;touch-action:none;}
.book.zieht .chev,.block.zieht .chev{opacity:0;}
.block.zieht .books,.block.zieht .block-bar{display:none;}
:root[data-app-theme="light"] .book.zieht,
:root[data-app-theme="light"] .block.zieht{box-shadow:0 14px 32px rgba(23,32,45,.22);}
.bookpane{
  flex:0 0 100%;width:100%;scroll-snap-align:start;
  display:flex;align-items:center;gap:11px;padding:10px;text-align:left;min-width:0;
}
.kurzpane{flex-direction:column;align-items:stretch;justify-content:center;gap:5px;}
.kurzpane .kt{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;}
.kurzpane .kx{font-family:"Literata",Georgia,serif;font-size:13px;line-height:1.5;color:var(--text-2);}
.kurzpane .kx em{color:var(--text-3);font-style:normal;}
.book .grow{flex:1;min-width:0;}
.book .title{font-family:"Literata",Georgia,serif;font-size:13.5px;line-height:1.35;}
.book .title.done{color:var(--text-3);}
.book .byline{font-size:11.5px;color:var(--text-3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.book .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.minitag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--surface-3);color:var(--text-2);}
.minitag.acc{background:var(--accent-soft);color:var(--accent);}

.status-btn{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:1.5px solid var(--border-strong);background:transparent;color:var(--text-3);
}
.status-btn svg{width:15px;height:15px;}
.status-btn[data-status="lese"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.status-btn[data-status="gelesen"]{border-color:var(--good);background:var(--good);color:#07120d;}
:root[data-app-theme="light"] .status-btn[data-status="gelesen"]{color:#fff;}

.empty{
  text-align:center;padding:38px 22px;color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--border);border-radius:14px;margin:0 14px;
}
.empty strong{display:block;color:var(--text-2);font-size:15px;margin-bottom:6px;font-family:"Literata",Georgia,serif;font-weight:600;}

/* ---------- Overlay / Sheets ---------- */
/* --vvh/--vvtop folgen dem sichtbaren Bereich: Wenn die Tastatur aufgeht,
   schrumpft das Fenster mit, statt darunter zu verschwinden. */
.overlay{
  position:fixed;left:0;right:0;top:var(--vvtop,0px);height:var(--vvh,100dvh);z-index:60;
  background:var(--bg);display:flex;flex-direction:column;
  animation:slideIn .22s ease;overscroll-behavior:none;
}
@keyframes slideIn{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
/* Am Finger hängend: keine eigene Animation, die Lage bestimmt der Zug. */
.overlay.zieht{animation:none;will-change:transform,clip-path;}
.sheet-scrim{position:fixed;left:0;right:0;top:var(--vvtop,0px);height:var(--vvh,100dvh);z-index:70;
  background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:680px;max-height:calc(var(--vvh,100dvh) - 20px);overflow-y:auto;background:var(--surface);
  border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.22,.8,.3,1);
}
@keyframes up{from{transform:translateY(26px)}to{transform:none}}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--border-strong);margin:6px auto 12px;}
.sheet h3{font-size:16px;margin-bottom:12px;font-family:"Literata",Georgia,serif;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

.ovl-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);
  background:var(--bg);flex:0 0 auto;
  /* Kopfzeilen scrollen nichts: sonst schiebt ein Zug hier die Seite
     dahinter mit, während die Ebene selbst am Finger hängt. */
  touch-action:none;
}
.ovl-head .grow{flex:1;min-width:0;}
.ovl-title{font-family:"Literata",Georgia,serif;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ovl-sub{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ovl-body{flex:1;overflow-y:auto;overscroll-behavior:contain;}
/* Hell/Dunkel und Vollbild sind überall erreichbar – auch dort, wo die
   Kopfzeile der App verdeckt liegt. */
.gknoepfe{display:flex;gap:2px;flex:0 0 auto;}
.gknoepfe .icon-btn{width:32px;height:32px;background:none;border:0;color:var(--text-3);}
.gknoepfe .savechip{margin:0 4px 0 0;}
.gknoepfe .icon-btn svg{width:16px;height:16px;}
.sheet{position:relative;}
.sheet > .gknoepfe{position:absolute;top:8px;right:8px;z-index:2;}
.sheet h3{padding-right:74px;}

/* ---------- Pager ---------- */
.pagertabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--bg);flex:0 0 auto;overflow-x:auto;scrollbar-width:none;}
.pagertabs::-webkit-scrollbar{display:none;}
.pagertabs button{
  padding:10px 11px 9px;font-size:12.5px;color:var(--text-3);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;
}
.pagertabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);}
.pager{
  flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.pager::-webkit-scrollbar{display:none;}
.page{flex:0 0 100%;width:100%;scroll-snap-align:start;overflow-y:auto;padding:14px 14px 40px;}

.desc{font-family:"Literata",Georgia,serif;font-size:15px;line-height:1.7;color:var(--text);max-width:62ch;}
.factgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:14px;}
.fact{padding:10px 11px;box-shadow:1px 0 0 var(--border),0 1px 0 var(--border);}
.fact .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;}
.fact .v{font-family:"IBM Plex Mono",monospace;font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums;}
.fact .v small{font-size:11px;color:var(--text-3);font-family:"IBM Plex Sans",sans-serif;}

.grouprow{
  display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);width:100%;text-align:left;margin-bottom:8px;
}
.grouprow .grow{flex:1;min-width:0;}
.grouprow .gname{font-size:14px;font-weight:500;display:block;}
.grouprow .gmeta{font-size:11.5px;color:var(--text-3);margin-top:3px;display:block;}
.grouprow .count{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--text-2);}

.note{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;width:100%;text-align:left;display:block;}
.note-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
.note-page{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-3);}
.note-text{font-family:"Literata",Georgia,serif;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;}
.note-text.quote{border-left:2px solid var(--accent);padding-left:10px;font-style:italic;}
.note-thumbs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.note-thumbs img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--border);}
.arttag{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600;letter-spacing:.01em;}
.themetag{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--text-2);}

/* ---------- Bilder ---------- */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
.shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1;background:var(--surface-2);}
.shot img{width:100%;height:100%;object-fit:cover;display:block;}
.shot .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(8,10,12,.78);color:#fff;display:grid;place-items:center;font-size:12px;}
.addshot{display:grid;place-items:center;aspect-ratio:1;border:1px dashed var(--border-strong);border-radius:10px;color:var(--text-3);font-size:11px;gap:4px;}
.addshot svg{width:18px;height:18px;}

.cam{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;}
.cam video{flex:1;width:100%;object-fit:cover;background:#000;}
.cam-bar{padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px;background:#000;color:#fff;}
.cam-shutter{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:#fff;}
.cam-side{min-width:76px;color:#fff;font-size:13px;}
.cam-strip{display:flex;gap:6px;padding:8px 12px;background:#000;overflow-x:auto;}
.cam-strip img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid #333;}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.94);display:flex;flex-direction:column;}
.lightbox img{flex:1;width:100%;object-fit:contain;min-height:0;}
.lightbox .lb-bar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;align-items:center;color:#fff;font-size:13px;}

/* ---------- Übersicht / Diagramme ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.tile{padding:12px 12px 13px;box-shadow:1px 0 0 var(--border),0 1px 0 var(--border);}
.tile .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;}
.tile .v{font-family:"IBM Plex Mono",monospace;font-size:20px;line-height:1.2;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere;}
.tile .v small{font-size:12px;color:var(--text-3);letter-spacing:0;}
.tile .s{font-size:11px;color:var(--text-3);margin-top:3px;}

.chart{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 13px 10px;margin-bottom:12px;}
.chart-head{margin-bottom:11px;}
.chart-head h3{font-size:13.5px;}
.chart-head .cap{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.chart svg{display:block;width:100%;overflow:visible;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--text-2);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:block;}
.chart details{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.chart summary{font-size:11.5px;color:var(--text-3);cursor:pointer;}
.chart table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
.chart th,.chart td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);}
.chart td.n,.chart th.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
.chart-scroll{overflow-x:auto;}

/* Auf- und einklappbare Einträge (Zusammenfassungen, Autoren) */
.akk{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden;}
.akk > summary{list-style:none;padding:11px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.akk > summary::-webkit-details-marker{display:none;}
.akk .at{font-family:"Literata",Georgia,serif;font-size:14px;line-height:1.35;}
.akk .ak{font-size:12px;color:var(--text-2);margin-top:4px;font-family:"Literata",Georgia,serif;line-height:1.5;}
.akk .am{font-size:11px;color:var(--text-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.akk .ab{padding:11px 12px 13px;font-family:"Literata",Georgia,serif;font-size:13.5px;line-height:1.7;
  color:var(--text-2);border-top:1px solid var(--border);}
.akk[open] > summary .chev{transform:rotate(90deg);}
/* Autorenzeile: wie die Buchzeile zwei Felder breit, per Wisch */
.arow{display:flex;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;}
.arow::-webkit-scrollbar{display:none;}
.apane{flex:0 0 100%;width:100%;scroll-snap-align:start;min-width:0;
  display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:56px;text-align:left;}
.apane .ai{flex:1;min-width:0;}
.apane .an{font-family:"Literata",Georgia,serif;font-size:14px;line-height:1.3;display:block;}
.apane .am{font-size:11px;color:var(--text-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.apane .kt{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;display:block;}
.apane .kx{font-family:"Literata",Georgia,serif;font-size:12.5px;line-height:1.45;color:var(--text-2);
  margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* Einflusslinien */
.einfluss{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.einfluss .eg{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:5px;}
.einfluss .er{display:flex;gap:6px;flex-wrap:wrap;}
.einfluss .en{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text-2);}
.einfluss .en.link{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--accent);}
/* Die Gegenrichtung in eigener Farbe: wer herkommt, wohin es weitergeht. */
.einfluss .wirkt .eg{color:var(--wirkt);}
.einfluss .wirkt .en.link{border-color:color-mix(in srgb,var(--wirkt) 45%,var(--border));
  color:var(--wirkt);background:color-mix(in srgb,var(--wirkt) 9%,var(--surface-2));}
/* Gegenseitig: steht ein Name in beiden Reihen, bekommt er die dritte Farbe. */
.einfluss .en.link.beides,.einfluss .wirkt .en.link.beides{
  border-color:color-mix(in srgb,var(--beides) 50%,var(--border));
  color:var(--beides);background:color-mix(in srgb,var(--beides) 10%,var(--surface-2));}
.netzlegende{display:flex;flex-wrap:wrap;gap:12px;padding:0 0 12px;font-size:11px;color:var(--text-3);}
.netzlegende span{display:inline-flex;align-items:center;gap:5px;}
.netzlegende i{width:14px;height:2px;border-radius:2px;display:block;}

/* Vernetzung */
.netz{position:relative;padding:0 0 20px;}
.netzzeile{display:flex;align-items:center;height:28px;gap:8px;position:relative;z-index:2;}
.netzzeile .nn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  padding:2px 6px;border-radius:7px;}
.netzzeile .nj{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3);width:42px;text-align:right;}
.netzzeile.aktiv .nn{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.netzzeile.blass{opacity:.35;}
.netzsvg{position:absolute;top:0;right:0;height:100%;pointer-events:none;z-index:1;}

/* Zeitstrahl */
/* Eigener Scrollkasten: nur so bleibt die Jahreszahlzeile beim Blättern oben stehen. */
.zsRahmen{overflow:auto;max-height:min(58vh,520px);overscroll-behavior:contain;
  border:1px solid var(--border);border-radius:12px;background:var(--surface);}
.zsInner{position:relative;}
.zsAchse{position:sticky;top:0;height:24px;background:var(--surface);border-bottom:1px solid var(--border);z-index:4;}
.zsAchse span{position:absolute;top:5px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);transform:translateX(-50%);}
.zsAchse span.links{transform:none;}
.zsGitter{position:absolute;top:24px;bottom:0;width:1px;background:var(--grid);}
.zsZeile{position:relative;height:26px;transition:opacity .12s ease;}
.zsZeile.alt{background:color-mix(in srgb,var(--text-3) 6%,transparent);}
.zsBalken{position:absolute;top:6px;height:14px;border-radius:7px;background:color-mix(in srgb,var(--accent) 26%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);}
.zsName{position:absolute;top:6px;font-size:10.5px;line-height:14px;padding:0 7px;white-space:nowrap;
  color:var(--text);text-shadow:0 0 4px var(--surface),0 0 3px var(--surface);cursor:pointer;z-index:2;
  background:none;border:0;font-family:inherit;}
/* Ausgewählter Autor, seine Nachbarn im Einflussnetz, alle übrigen */
.zsZeile.aktiv{background:var(--accent-soft);}
.zsZeile.aktiv .zsBalken{background:color-mix(in srgb,var(--accent) 55%,transparent);
  border-color:var(--accent);}
.zsZeile.aktiv .zsName{color:var(--accent);font-weight:600;}
.zsZeile.verbunden .zsBalken{background:color-mix(in srgb,var(--accent) 40%,transparent);
  border-color:color-mix(in srgb,var(--accent) 70%,transparent);}
.zsZeile.blass{opacity:.28;}
.zsPunkt{position:absolute;top:8px;width:11px;height:11px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);transform:translateX(-50%);cursor:pointer;z-index:3;}
.zsPunkt.gelesen{background:var(--good);}
.zsBruch{position:absolute;top:24px;bottom:0;width:18px;z-index:1;
  background:repeating-linear-gradient(115deg,transparent 0 4px,var(--grid) 4px 6px);
  border-left:1px dashed var(--border-strong);border-right:1px dashed var(--border-strong);}

.blockkopf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 9px;}
.blockkopf h3{font-size:13px;font-weight:600;}
.stufe{display:inline-flex;gap:2px;align-items:center;}
.stufe i{width:5px;height:5px;border-radius:50%;background:var(--border-strong);display:block;}
.stufe i.an{background:var(--accent);}
.tip{
  position:fixed;z-index:99;pointer-events:none;background:var(--surface-3);border:1px solid var(--border-strong);
  border-radius:9px;padding:7px 9px;font-size:11.5px;box-shadow:var(--shadow);max-width:220px;
}
.tip .tt{font-weight:600;margin-bottom:2px;}
.tip .tv{font-family:"IBM Plex Mono",monospace;color:var(--text-2);}

/* ---------- Einrichtung ---------- */
.setup{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px 16px 34px;}
.setup-inner{width:100%;max-width:520px;}
.setup .mark{font-family:"Literata",Georgia,serif;font-size:27px;letter-spacing:-.02em;margin-bottom:5px;}
.setup .lead{color:var(--text-2);font-size:14px;line-height:1.6;margin-bottom:20px;max-width:52ch;}
.opt{
  display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);margin-bottom:10px;
}
.opt:hover{border-color:var(--border-strong);}
.opt .on{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;}
.opt .on svg{width:18px;height:18px;flex:0 0 auto;color:var(--text-2);}

/* Im Vollbild fehlen die Leisten des Browsers – der Rand muss von der App kommen. */
body.voll .topbar-inner{padding-top:46px;}
body.voll .ovl-head{padding-top:44px;}
body.voll .tabbar{padding-bottom:26px;}
body.voll .sheet{padding-bottom:30px;}
body.voll .cam-bar{padding-bottom:28px;}
body.voll .lightbox .lb-bar{padding-bottom:26px;}
body.voll .cam{padding-top:14px;}
.opt .od{font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.55;}
.opt .badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.03em;}
.opt[disabled]{opacity:.5;}

/* Startbildschirm wie ein karger Homescreen: ein paar Namen auf dem Grund
   der App, sonst nichts. Ein Tipp auf „leseliste“ öffnet sie – und derselbe
   Tipp löst das Vollbild aus, das ohne Geste nicht zu haben ist. */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
  background:var(--bg);padding:24px 30px;}
.splash .apps{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  animation:splashAuf .6s cubic-bezier(.2,.8,.3,1) both;}
.splash .app{background:none;border:0;padding:13px 2px;font-family:inherit;font-size:17px;
  letter-spacing:.01em;color:var(--text-2);cursor:pointer;text-align:left;line-height:1.2;}
.splash .app.ist{color:var(--text);}
.splash .app:active{color:var(--accent);}
.splash .app.aus{color:var(--text-3);opacity:.5;}
@keyframes splashAuf{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.infobox{padding:11px 13px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);text-align:left;cursor:pointer;width:100%;
  display:flex;flex-direction:column;gap:3px;}
.infobox .i-kopf{font-size:11.5px;color:var(--text-2);font-weight:600;}
.infobox .i-text{font-size:11px;color:var(--text-3);line-height:1.5;}
.infobox .i-text b{color:var(--text-2);font-weight:600;}
.infobox:active{border-color:var(--border-strong);}
.erklaer{display:flex;flex-direction:column;gap:12px;}
.e-schritt{display:flex;gap:11px;align-items:flex-start;}
.e-nr{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:11px;}
.e-text{font-size:13px;color:var(--text-2);line-height:1.55;}
.e-text b{color:var(--text);font-weight:600;}
.e-text i{font-style:normal;color:var(--accent);}
.splash .leiste{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 16px;}
.splash .leiste .icon-btn{background:none;border:0;color:var(--text-3);width:34px;height:34px;}
.splash .leiste .mehr{background:none;border:0;color:var(--text-3);font:inherit;font-size:11.5px;
  padding:9px 8px;cursor:pointer;opacity:.75;}
/* Der Grund, der beim Ziehen nach rechts hinter der App zum Vorschein kommt:
   derselbe Homescreen, nur ohne Bedienung – angefasst wird er erst, wenn der
   Zug durchgeht. */
.unschaerfe{position:fixed;inset:0;z-index:55;pointer-events:none;will-change:backdrop-filter;}
.heimgrund{z-index:1;pointer-events:none;}
.heimgrund .apps{animation:none;}
/* Ein Schattenstreifen genau vor der Kante der App, damit sie über dem
   Homescreen liegt statt daneben. */
.heimgrund::after{content:'';position:fixed;top:0;bottom:0;left:0;width:26px;
  transform:translateX(calc(var(--heimzug,0px) - 26px));
  background:linear-gradient(to right,rgba(0,0,0,0),rgba(0,0,0,.4));}
body.heimzug .topbar,body.heimzug #view,body.heimzug .nowbar,body.heimzug .tabbar{
  transform:translateX(var(--heimzug,0px));will-change:transform;}
body.heimzug.federt .topbar,body.heimzug.federt #view,body.heimzug.federt .nowbar,
body.heimzug.federt .tabbar{transition:transform .26s cubic-bezier(.2,.8,.3,1);}
body.heimzug #view{position:relative;z-index:2;background:var(--bg);}

/* ===== Kalender: die zweite App =====
   Gleiche Marken wie die leseliste – Karten, Chips, Serifen für Titel,
   Monoschrift für Zahlen. Nichts Eigenes, wo es schon etwas gibt. */
.kbanner{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:2px 0 1px;}
.kbanner .kb-tag{font-size:12.5px;color:var(--text-2);}
.kbanner .kb-zahlen{display:flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--text-3);
  min-width:0;overflow:hidden;}
.kbanner .kb-punkt{opacity:.5;}
.kbanner .kb-next{color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.kpunkt{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.kzeit{font-size:11.5px;color:var(--text-2);width:38px;flex:0 0 auto;}
.ktagchip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);
  font-size:9px;color:var(--text-3);flex:0 0 auto;line-height:1.1;}
.ktagchip b{font-size:13px;color:var(--text);font-weight:600;}
.kfort{width:44px;height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:0 0 auto;}
.kfort > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}

/* Monatsblatt */
.kmonatkopf{display:flex;align-items:center;gap:6px;padding:12px 0 10px;}
.kmonatkopf .km-name{font-size:17px;}
.kmonatkopf .km-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;}
.kgitterrahmen{overflow:hidden;touch-action:pan-y;}
.kgitter{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;will-change:transform;}
.kwtag{font-size:10px;color:var(--text-3);text-align:center;padding:2px 0 4px;letter-spacing:.04em;}
.ktag{aspect-ratio:1;border-radius:11px;background:var(--surface);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-2);padding:0;cursor:pointer;}
.ktag.leer{background:none;border-color:transparent;cursor:default;}
.ktag .kz{font-size:13px;}
.ktag.heute{border-color:var(--accent);background:var(--accent-soft);}
.ktag.heute .kz{color:var(--accent);font-weight:600;}
.ktag:active{border-color:var(--border-strong);}
.kpunkte{display:flex;gap:2px;height:5px;align-items:center;}
.kpunkte i{width:4px;height:4px;border-radius:50%;display:block;}
.kpunkte i.offen{width:4px;height:4px;border:1px solid var(--text-3);background:none;}

/* To-Do als Flussbild */
.kneu{display:flex;gap:8px;padding:14px 0 12px;}
.kneu input{flex:1;min-width:0;}
.kneu .btn{flex:0 0 auto;padding:0 16px;}
.kzahl{margin-left:auto;font-size:11px;color:var(--text-3);align-self:center;}
.kfluss{margin-bottom:22px;}
.kfluss.zieht .kv-kopf,.kspalte.zieht .kt-kasten,.kh.zieht{
  box-shadow:0 12px 28px rgba(0,0,0,.45);border-color:var(--accent);}
.kfluss.zieht .kbahn,.kfluss.zieht .kpfeil{display:none;}
.kspalte.zieht .kt-liste,.kspalte.zieht .kzeile{display:none;}
.kspalte.zieht,.kfluss.zieht,.kh.zieht{opacity:.96;}
/* Kein touch-action hier: das Anheben muss das Scrollen im ersten
   touchmove unterbinden dürfen, und das geht nur bei „auto“. */
.kt-kopf{cursor:grab;}
.kv-kopf{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--accent);}
.kv-kopf.fertig{border-color:var(--good);}
.kv-titel{display:block;font-size:15px;line-height:1.25;}
.kv-kopf.fertig .kv-titel{color:var(--text-3);text-decoration:line-through;}
.kv-meta{display:block;font-size:11px;color:var(--text-3);margin-top:2px;font-family:"IBM Plex Mono",monospace;}
.kctrl{display:flex;gap:1px;flex:0 0 auto;}
.kctrl .icon-btn{width:26px;height:26px;background:none;border:0;color:var(--text-3);}
.kctrl .icon-btn svg{width:13px;height:13px;}
.kpfeil{height:16px;position:relative;}
.kpfeil::before{content:'';position:absolute;left:26px;top:0;bottom:5px;width:1.5px;background:var(--border-strong);}
.kpfeil::after{content:'';position:absolute;left:22px;bottom:0;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid var(--border-strong);}
.kbahn{display:flex;align-items:flex-start;gap:0;overflow-x:auto;overscroll-behavior-x:contain;padding:0 2px 8px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.kbahn::-webkit-scrollbar{height:3px;}
.kbahn::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;}
.kverbinder{align-self:flex-start;flex:0 0 auto;width:16px;height:1.5px;background:var(--border-strong);
  margin-top:34px;position:relative;}
.kverbinder::after{content:'';position:absolute;right:0;top:-3.5px;border-top:4px solid transparent;
  border-bottom:4px solid transparent;border-left:5px solid var(--border-strong);}
.kspalte{flex:0 0 auto;width:212px;}
.kspalte.anfuegen{width:190px;padding-top:14px;}
.kt-kasten{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 10px 8px;}
.kt-kasten.fertig{border-color:color-mix(in srgb,var(--good) 45%,var(--border));}
.kt-kopf{display:flex;align-items:center;gap:6px;}
.kt-marke{flex:1;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.kt-kopf .icon-btn{width:20px;height:20px;background:none;border:0;color:var(--text-3);}
.kt-kopf .icon-btn svg{width:11px;height:11px;}
.kt-text{font-size:13px;color:var(--text);line-height:1.35;margin-top:3px;word-break:break-word;}
.kt-kasten.fertig .kt-text{color:var(--text-3);text-decoration:line-through;}
.kt-notiz{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.35;}
.kt-frist{font-size:10px;color:var(--text-3);margin-top:3px;}
.kspalte.anfuegen .kzeile input[type=date]{font-size:12px;}
.kt-liste{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
.kh{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:5px 6px;}
.kh.fertig{border-color:color-mix(in srgb,var(--good) 40%,var(--border));}
.kh-text{flex:1;min-width:0;font-size:11.5px;color:var(--text-2);line-height:1.3;word-break:break-word;}
.kh.fertig .kh-text{color:var(--text-3);text-decoration:line-through;}
.kh .icon-btn{width:18px;height:18px;background:none;border:0;color:var(--text-3);flex:0 0 auto;}
.kh .icon-btn svg{width:10px;height:10px;}
.kzeile{display:flex;gap:5px;margin-top:8px;}
.kzeile input{flex:1;min-width:0;padding:7px 9px;font-size:12.5px;border-radius:8px;}
.kzeile .btn{flex:0 0 auto;padding:0 10px;}
.kzeile .btn svg{width:12px;height:12px;}
.kt-fuss{display:flex;justify-content:flex-end;gap:1px;margin-top:6px;}
.kt-fuss .icon-btn{width:22px;height:22px;background:none;border:0;color:var(--text-3);}
.kt-fuss .icon-btn svg{width:11px;height:11px;}
.kt-fuss [data-tlinks] svg{transform:rotate(-90deg);}
.kt-fuss [data-trechts] svg{transform:rotate(-90deg);}
.status-btn.an{border-color:var(--good);background:var(--good);color:#07120d;}
:root[data-app-theme="light"] .status-btn.an{color:#fff;}
.status-btn.klein{width:17px;height:17px;}
.status-btn.klein svg{width:10px;height:10px;}
.status-btn.winzig{width:14px;height:14px;flex:0 0 auto;}
.status-btn.winzig svg{width:8px;height:8px;}
.kfarben{display:flex;gap:8px;}
.kfarbe{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.kfarbe.an{border-color:var(--text);}
#kview{padding:18px 14px calc(var(--tabh, 58px) + 24px);overscroll-behavior-x:contain;}
@media (min-width:520px){
  .kspalte{width:242px;}
  .kspalte.anfuegen{width:220px;}
}

/* ===== fastreader: Wort für Wort an einem festen Punkt =====
   Dieselben Marken wie überall; eigen ist nur die Anzeige selbst –
   zwei Striche, dazwischen das Wort, der Blickpunkt in Rot. */
.frquellen{display:grid;gap:8px;}
.frquelle{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;}
.frquelle:active{border-color:var(--border-strong);}
.frquelle .q-kopf{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);}
.frquelle .q-kopf svg{width:15px;height:15px;color:var(--accent);}
.frquelle .q-sub{font-size:11.5px;color:var(--text-3);}
.frzeile{align-items:center;}
.frzeile .grow{display:flex;flex-direction:column;gap:2px;min-width:0;}
.frbalken{display:block;height:3px;border-radius:99px;background:var(--surface-3);margin-top:6px;overflow:hidden;}
.frbalken > i{display:block;height:100%;background:var(--accent);border-radius:99px;}
.frpct{font-size:14px;color:var(--text-2);flex:0 0 auto;}
.frpct small{font-size:9px;color:var(--text-3);margin-left:1px;}

/* Die Anzeige */
/* Die Bühne füllt das Bild und hält das Wort in seiner Mitte – waagerecht
   wie senkrecht, unabhängig von Kopfzeile und Pult. */
.frbuehne{position:fixed;left:0;right:0;top:var(--vvtop,0px);height:var(--vvh,100dvh);z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 14px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.frmarke{position:absolute;top:0;left:50%;transform:translateX(-50%);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);
  opacity:0;transition:opacity .2s;pointer-events:none;}
.frmarke.an{opacity:1;}
.frzeiger{width:100%;max-width:680px;position:relative;}
.frbuehne .frkontext{position:absolute;left:14px;right:14px;top:calc(50% + 96px);margin:0 auto;}
.frstrich{display:block;height:1px;background:var(--border);position:relative;}
.frstrich::after{content:'';position:absolute;left:var(--fixx,50%);top:-6px;width:1px;height:6px;background:var(--bad);}
.frstrich.unten::after{top:0;}
/* Ein Schriftgrad für alle Wörter, immer mittig. Der Buchstabe am Blickpunkt
   bleibt rot – er markiert die Stelle, nicht die Ausrichtung. */
.frwort{display:block;text-align:center;padding:24px 0;line-height:1.1;
  white-space:normal;overflow-wrap:break-word;word-break:break-word;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.015em;}
.frwort .w-vor,.frwort .w-punkt,.frwort .w-nach{display:inline;}
.frwort .w-punkt{color:var(--bad);}
.frkontext{max-width:56ch;margin:20px auto 0;text-align:center;font-size:13.5px;line-height:1.65;
  color:var(--text-3);opacity:0;transition:opacity .22s;pointer-events:none;
  font-family:"Literata",Georgia,serif;}
.frkontext.an{opacity:1;}
/* Der Übergang ins Versinken dauert; das Auftauchen geht sofort. */
#fr .topbar,#fr .tabbar,#fr .frpult,#fr .frmarke,#fr .frkontext{
  transition:opacity .22s ease;}
#fr.vertieft .topbar,#fr.vertieft .tabbar,#fr.vertieft .frpult,#fr.vertieft .frmarke{
  opacity:0;transition:opacity 1.6s ease .45s;}
#fr.vertieft .frkontext{opacity:0;transition:opacity .5s ease;}

.frkontext b{color:var(--text);font-weight:600;}

/* Das Pult */
.frpult{position:fixed;left:0;right:0;bottom:var(--tabh,58px);z-index:5;
  background:var(--bg);border-top:1px solid var(--border);
  padding:12px 14px 10px;}
.frpult > *{max-width:680px;margin-left:auto;margin-right:auto;}
.frbahn{height:4px;background:var(--surface-3);border-radius:99px;position:relative;cursor:pointer;
  touch-action:none;margin-bottom:12px;}
.frbahn > i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;}
.frbahn::after{content:'';position:absolute;inset:-11px 0;}
.frreihe{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.frplay{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);}
.frplay svg{width:19px;height:19px;}
.frspul{width:34px;height:34px;flex:0 0 auto;background:none;border:0;color:var(--text-3);}
.frspul svg{width:17px;height:17px;}
.frspul.vor svg{transform:rotate(180deg);}
.frtempo{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px;}
.frtempo .t-kopf{display:flex;align-items:baseline;gap:6px;}
.frtempo .t-kopf b{font-size:17px;font-weight:500;}
.frtempo .t-kopf i{font-size:9.5px;letter-spacing:.1em;color:var(--text-3);font-style:normal;}
.frtempo .t-warm{margin-left:auto;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--bad);opacity:0;transition:opacity .2s;}
.frtempo .t-warm.an{opacity:1;}
.frtempo input[type=range]{width:100%;}
.frstand{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto;}
.frstand .num{font-size:12.5px;color:var(--text-2);}
.frstand .s-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:22px;width:100%;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:var(--surface-3);}
input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--surface-3);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:0;margin-top:-6.5px;}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:0;}
.frkurve{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;}
.frkurve svg{display:block;width:100%;height:56px;overflow:visible;}
#fview{padding:18px 14px calc(var(--tabh, 58px) + 18px);overscroll-behavior-x:contain;}
.toast{
  position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:120;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);
  padding:10px 15px;border-radius:11px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px);
}
.rowline{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);}
.rowline:last-child{border-bottom:0;}
.rowline .grow{flex:1;min-width:0;}
.rowline svg,.rowline span > svg,.grouprow > svg,.nowbar svg{width:17px;height:17px;flex:0 0 auto;}
.rowline .rn{font-size:14px;display:block;}
.rowline .rm{font-size:11.5px;color:var(--text-3);margin-top:3px;display:block;line-height:1.45;}
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.timer-big{font-family:"IBM Plex Mono",monospace;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:center;padding:6px 0 2px;}

/* ===== Stöbern: Werke sichten, merken, zu Blöcken ordnen ===== */
.sto{position:fixed;left:0;right:0;top:var(--vvtop,0px);height:var(--vvh,100dvh);z-index:60;
  background:var(--bg);display:flex;flex-direction:column;animation:slideIn .22s ease;}
/* Kopf und Fuss folgen der gewöhnlichen Ebene – auch im Vollbild, wo oben
   die Statusleiste und unten die Gestenleiste Platz brauchen. */
.sto-kopf .t{font-family:"Literata",Georgia,serif;font-size:15px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sto-kopf .u{font-size:11.5px;color:var(--text-3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sto-zaehler{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--good);
  background:var(--good-soft);border-radius:99px;padding:5px 9px;font-variant-numeric:tabular-nums;
  flex:0 0 auto;border:1px solid color-mix(in srgb,var(--good) 30%,transparent);}
.sto-zaehler svg{width:13px;height:13px;}
.sto-zaehler.puls{animation:stoPuls .5s cubic-bezier(.2,.8,.3,1);}
@keyframes stoPuls{0%{transform:scale(1)}32%{transform:scale(1.3)}100%{transform:scale(1)}}
.sto-fort{height:3px;background:var(--surface-3);flex:0 0 auto;}
.sto-fort i{display:block;height:100%;background:var(--accent);transition:width .3s ease;}
.sto-body{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 24px;}
.sto-zurueck{display:flex;align-items:center;gap:6px;margin:9px auto 0;background:none;border:0;
  color:var(--text-3);font:inherit;font-size:12px;padding:6px 10px;cursor:pointer;}
.sto-zurueck svg{width:14px;height:14px;}
.sto-zurueck:active{color:var(--text-2);}
.sto-fuss{flex:0 0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--surface);}
body.voll .sto-fuss{padding-bottom:calc(26px + env(safe-area-inset-bottom));}

/* Kartenstapel */
.stoBuehne{flex:1;min-height:0;display:flex;align-items:center;}
.stoDeck{width:100%;height:min(100%,600px);position:relative;touch-action:none;}
.stoKarte{position:absolute;left:16px;right:16px;top:10px;bottom:28px;
  background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
  padding:20px 18px;display:flex;flex-direction:column;overflow:hidden;
  will-change:transform;transition:transform .34s cubic-bezier(.2,.7,.3,1),opacity .34s ease;}
.stoKarte.hinten{pointer-events:none;}
.stoKarte .kKopf{display:flex;align-items:center;gap:8px;}
.stoKarte .kThema{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;}
.stoKarte .kJahr{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-3);}
.stoKarte .kTitel{font-family:"Literata",Georgia,serif;font-size:21px;line-height:1.26;margin-top:15px;}
.stoKarte .kAutor{font-size:13px;color:var(--text-2);margin-top:8px;}
.stoKarte .kKurz{font-size:13.5px;font-style:italic;color:var(--text-2);margin-top:15px;line-height:1.5;}
.stoKarte .kText{font-size:12.5px;color:var(--text-3);margin-top:12px;line-height:1.6;min-height:0;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;}
.stoKarte .kMehr{align-self:flex-start;margin-top:10px;background:none;border:0;padding:0;
  color:var(--accent);font-size:12px;font-family:inherit;cursor:pointer;}
.stoKarte .kFuss{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:14px;
  border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);}
.stoKarte .kStempel{position:absolute;top:24px;font-size:18px;font-weight:800;letter-spacing:.1em;
  padding:5px 13px;border-radius:9px;border:3px solid;opacity:0;pointer-events:none;}
.stoKarte .kJa{left:22px;transform:rotate(-15deg);color:var(--good);border-color:var(--good);}
.stoKarte .kNein{right:22px;transform:rotate(15deg);color:var(--bad);border-color:var(--bad);}
.stoHerz{position:absolute;left:50%;top:42%;opacity:0;pointer-events:none;z-index:40;color:var(--good);
  transform:translate(-50%,-50%) scale(.4);}
.stoHerz svg{width:76px;height:76px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));}
.stoHerz.los{animation:stoHerz .66s cubic-bezier(.2,.8,.3,1);}
@keyframes stoHerz{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  28%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  55%{opacity:.95;transform:translate(-50%,-54%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-78%) scale(.9)}
}
.stoKnoepfe{display:flex;align-items:center;justify-content:center;gap:18px;}
.stoKnoepfe button{width:58px;height:58px;border-radius:50%;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer;
  transition:transform .12s ease,background .15s ease;}
.stoKnoepfe button:active{transform:scale(.88);}
.stoKnoepfe button svg{width:25px;height:25px;}
.stoKnoepfe .nein{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--border));}
.stoKnoepfe .ja{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--border));}
.stoKnoepfe .rueck{width:44px;height:44px;}
.stoKnoepfe .rueck svg{width:19px;height:19px;}
.stoKnoepfe button:disabled{opacity:.32;cursor:default;}
.sto .btn:disabled{opacity:.4;cursor:default;}

/* Blöcke bauen */
.stoBlock{background:var(--surface);border:1px solid var(--border);border-radius:15px;
  margin-bottom:12px;overflow:hidden;}
.stoBlock.leer{border-style:dashed;}
.stoBlock .bk{display:flex;align-items:center;gap:6px;padding:9px 8px 9px 12px;
  background:var(--surface-2);border-bottom:1px solid var(--border);}
.stoBlock .bk input{flex:1;min-width:0;background:none;border:0;padding:5px 0;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--text);}
.stoBlock .bk input:focus{outline:none;border-bottom:1px solid var(--accent);}
.stoBlock .bz{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:0 0 auto;padding:0 4px;}
.stoWerk{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;border-bottom:1px solid var(--border);}
.stoWerk:last-child{border-bottom:0;}
.stoWerk .wn{font-family:"Literata",Georgia,serif;font-size:13.5px;display:block;line-height:1.35;}
.stoWerk .wm{font-size:11px;color:var(--text-3);margin-top:3px;display:block;}
.stoLeer{padding:15px 12px;font-size:12.5px;color:var(--text-3);text-align:center;}
/* Der Fortschritt im Kopf ist zugleich der Weg in die Übersicht:
   antippen oder nach unten ziehen. */
.fortschritt{display:block;width:100%;text-align:left;background:none;border:0;padding:0 0 7px;
  color:inherit;font:inherit;cursor:pointer;position:relative;}
.fortschritt .griff{display:block;width:34px;height:3px;border-radius:99px;margin:7px auto 0;
  background:var(--border-strong);opacity:.55;transition:opacity .2s ease,transform .2s ease;}
.fortschritt:active .griff{opacity:1;transform:scaleX(1.35);}

.searchbar{display:flex;gap:8px;padding:10px 14px 4px;}
.searchbar input{flex:1;}

/* Balken in HTML: saubere Beschriftung, kein Überlauf */
.bars{display:flex;flex-direction:column;gap:9px;}
.barrow{display:grid;grid-template-columns:minmax(88px,34%) 1fr auto;gap:10px;align-items:center;}
.blab{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btrack{height:12px;background:color-mix(in srgb,var(--text-3) 13%,transparent);border-radius:4px;display:flex;gap:2px;overflow:hidden;}
.bseg{height:100%;border-radius:0 4px 4px 0;min-width:2px;}
.bseg:first-child{border-radius:4px;}
.bval{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.axnote{font-size:11px;color:var(--text-3);margin-top:9px;}
.hinweis{font-size:12.5px;color:var(--text-3);line-height:1.55;padding:14px 2px;}

/* Leseplan-Umschalter über der Blockliste */
.planbar{display:flex;align-items:center;gap:8px;padding:0 14px 10px;}
.planbtn{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);flex:1;min-width:0;text-align:left;}
.planbtn:hover{border-color:var(--border-strong);}
.planbtn .grow{flex:1;min-width:0;}
.planbtn .pl-k{font-size:10px;letter-spacing:.06em;color:var(--text-3);font-weight:600;display:block;}
.planbtn .pl-n{font-family:"Literata",Georgia,serif;font-size:14.5px;margin-top:1px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sortrow{display:flex;align-items:center;gap:8px;padding:9px 14px 0;font-size:11.5px;color:var(--text-3);}
.sortrow select{width:auto;padding:5px 9px;font-size:12px;border-radius:9px;}

/* Galerie eines Buches */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:6px;}

<script>
'use strict';
/* ============================================================
   Leseplan – eine Datei, keine Daten darin.
   Alle Inhalte liegen im gewählten Speicher (Datei oder Gerät).
   ============================================================ */

/* ---------- kleine Helfer ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const heute = () => new Date().toISOString().slice(0, 10);
const MONATE = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

function fmtDauer(min) {
  if (!min) return '0 min';
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? (m ? h + ' h ' + m + ' min' : h + ' h') : m + ' min';
}
function fmtDauerKurz(min) {
  if (!min) return '–';
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? h + ':' + String(m).padStart(2, '0') + ' h' : m + ' min';
}
const pl = (n, ein, viele) => n + ' ' + (n === 1 ? ein : viele);
/* Antike Jahreszahlen stehen negativ in den Daten. */
function jahrText(j) {
  if (j == null || j === '') return '–';
  return j < 0 ? Math.abs(j) + ' v. Chr.' : String(j);
}
function lebensdaten(geb, gest) {
  if (geb == null && gest == null) return null;
  const g = geb == null ? '?' : (geb < 0 ? Math.abs(geb) : geb);
  const t = gest == null ? '' : (gest < 0 ? Math.abs(gest) : gest);
  const vChr = (geb != null && geb < 0) || (gest != null && gest < 0);
  return g + '–' + t + (vChr ? ' v. Chr.' : '');
}
function fmtGeld(v) {
  if (v == null || !isFinite(v)) return '–';
  return v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function fmtZahl(v, d) {
  if (v == null || !isFinite(v)) return '–';
  return v.toLocaleString('de-DE', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
}
function fmtDatum(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return +d + '. ' + MONATE[+m - 1] + ' ' + y;
}
function relZeit(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 45) return 'gerade eben';
  if (s < 3600) return 'vor ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'vor ' + Math.round(s / 3600) + ' h';
  return 'vor ' + Math.round(s / 86400) + ' Tagen';
}

const ICON = {

  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h11L20.5 8v12.5H5z"/><path d="M8.5 3.5v6h7v-6M8.5 20.5V14h7v6.5"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>',
  voll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  vollAus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
};

/* ---------- Toast ---------- */
let toastT;
function toast(msg, ms) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, ms || 2600);
}

/* ---------- Sichtbarer Bereich ----------
   Auf dem Handy schiebt die Tastatur den unteren Teil des Fensters weg.
   Diese beiden Werte folgen dem, was wirklich zu sehen ist. */
(function viewportVerfolgen() {
  /* Der Browser soll das Layout selbst verkleinern, wenn die Tastatur aufgeht.
     Ohne das bleibt die Seitenhöhe stehen und alles rutscht darunter. */
  try {
    let meta = document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
      (document.head || document.documentElement).appendChild(meta);
    }
    if (!/interactive-widget/.test(meta.content)) {
      meta.content = meta.content.trim().replace(/,$/, '') + ', interactive-widget=resizes-content';
    }
  } catch (e) { }

  const vv = window.visualViewport;
  const setzen = () => {
    const wurzel = document.documentElement.style;
    wurzel.setProperty('--vvh', (vv ? vv.height : window.innerHeight) + 'px');
    wurzel.setProperty('--vvtop', (vv ? vv.offsetTop : 0) + 'px');
  };
  if (vv) {
    vv.addEventListener('resize', setzen);
    vv.addEventListener('scroll', setzen);
  }
  window.addEventListener('resize', setzen);
  window.addEventListener('orientationchange', () => setTimeout(setzen, 250));
  setzen();
})();

/* Das gerade beschriebene Feld in den sichtbaren Bereich holen. */
document.addEventListener('focusin', e => {
  const feld = e.target;
  if (!feld.matches || !feld.matches('input,textarea,select')) return;
  if (!feld.closest('.sheet,.overlay')) return;
  setTimeout(() => {
    try { feld.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) { }
  }, 320);
});

/* ============================================================
   Datenmodell
   ============================================================ */
const ART_FARBEN = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8'];
const STD_ARTEN = ['Zitat', 'Gedanke', 'Frage', 'Widerspruch', 'Begriff', 'Querverweis', 'Aufgabe'];
const STATUS = { offen: 'Offen', lese: 'Lese ich', gelesen: 'Gelesen' };
/* Besitz: getrennt vom Lesestatus – man kann ein Buch haben, ohne es zu lesen. */
const BESITZ = {
  fehlt: { name: 'Fehlt', kurz: 'fehlt', farbe: 'var(--text-3)' },
  bestellt: { name: 'Bestellt', kurz: 'bestellt', farbe: 'var(--s4)' },
  habe: { name: 'Habe ich', kurz: '', farbe: 'var(--good)' },
  bibliothek: { name: 'Bibliothek', kurz: 'Bibliothek', farbe: 'var(--s1)' }
};

function leereDb() {
  return {
    format: 'leseplan',
    version: 2,
    erstellt: Date.now(),
    geaendert: Date.now(),
    einstellungen: { theme: 'dark', akzent: 'messing', vollbildStart: true, zielSeiten: null, einfuehrung: false, weckerMin: 45, timerFragen: true, autosaveSek: 60, aktiverPlanId: null },
    arten: STD_ARTEN.map((n, i) => ({ id: uid(), name: n, farbe: ART_FARBEN[i % 8] })),
    themen: [],
    lesepleane: [],
    bloecke: [],
    buecher: [],
    /* Der angefangene Stöber-Durchgang, damit man ihn später fortsetzen kann. */
    stoebern: null
  };
}

/* Ein Buch kann mehrere Autoren haben. Jeder trägt eigene Lebensdaten,
   Biographie und Einflüsse; b.autor bleibt die Anzeigezeile. */
function normAutoren(b) {
  const roh = Array.isArray(b.autoren) ? b.autoren : null;
  if (roh && roh.length) {
    const l = roh.map(a => ({
      name: String((a && a.name) || '').trim(),
      geb: a && a.geb != null ? a.geb : null,
      gest: a && a.gest != null ? a.gest : null,
      bio: (a && a.bio) || '',
      einfluss: Array.isArray(a && a.einfluss) ? a.einfluss.map(x => String(x).trim()).filter(Boolean) : []
    })).filter(a => a.name);
    if (l.length) return l;
  }
  const name = String(b.autor || '').trim();
  if (!name) return [];
  return [{
    name,
    geb: b.autorGeb == null ? null : b.autorGeb,
    gest: b.autorGest == null ? null : b.autorGest,
    bio: b.autorBio || '',
    einfluss: Array.isArray(b.autorEinfluss) ? b.autorEinfluss.map(x => String(x).trim()).filter(Boolean) : []
  }];
}
/* Freitext in Namen zerlegen – nur wenn keine Klammer im Spiel ist. */
function autorenAusText(text, alt) {
  const t = String(text || '').trim();
  if (!t) return [];
  const teile = /[()]/.test(t) ? [t] : t.split(/\s*,\s*|\s+und\s+/).map(x => x.trim()).filter(Boolean);
  return teile.map(n => (alt || []).find(a => a.name === n) || { name: n, geb: null, gest: null, bio: '', einfluss: [] });
}
const buchAutoren = b => (b.autoren && b.autoren.length) ? b.autoren : normAutoren(b);

/* Notiz-Seiten dürfen Text sein ("35-36"); zum Sortieren zählt die erste Zahl. */
function seiteZahl(s) {
  if (s == null || s === '') return Infinity;
  const m = String(s).match(/-?\d+/);
  return m ? parseInt(m[0], 10) : Infinity;
}
function seiteText(s) { return (s == null || s === '') ? '' : String(s); }

/* Fehlende Felder ergänzen, damit auch fremde oder ältere Dateien laufen. */
function normalisiere(raw) {
  const d = Object.assign(leereDb(), raw || {});
  d.einstellungen = Object.assign(
    { theme: 'dark', akzent: 'messing', vollbildStart: true, zielSeiten: null, einfuehrung: false, weckerMin: 45, timerFragen: true, autosaveSek: 60, aktiverPlanId: null },
    raw && raw.einstellungen);
  d.arten = (Array.isArray(d.arten) ? d.arten : []).map((a, i) => ({
    id: a.id || uid(), name: String(a.name || 'Art'), farbe: a.farbe || ART_FARBEN[i % 8]
  }));
  if (!d.arten.length) d.arten = leereDb().arten;
  d.themen = (Array.isArray(d.themen) ? d.themen : []).map(t =>
    typeof t === 'string' ? { id: uid(), name: t } : { id: t.id || uid(), name: String(t.name || '') }
  ).filter(t => t.name);
  d.lesepleane = (Array.isArray(d.lesepleane) ? d.lesepleane : []).map((p, i) => ({
    id: p.id || uid(), name: String(p.name || 'leseliste'), ord: p.ord != null ? p.ord : i
  }));
  d.bloecke = (Array.isArray(d.bloecke) ? d.bloecke : []).map((b, i) => ({
    id: b.id || uid(), planId: b.planId || null, name: String(b.name || 'Block'),
    ord: b.ord != null ? b.ord : i, notiz: b.notiz || ''
  }));
  /* Ältere Dateien kannten noch keine Lesepläne: alles wandert in einen. */
  if (!d.lesepleane.length && d.bloecke.length) {
    d.lesepleane = [{ id: uid(), name: 'Lesestart', ord: 0 }];
  }
  const ersterPlan = d.lesepleane[0];
  const planIds = new Set(d.lesepleane.map(p => p.id));
  d.bloecke.forEach(b => { if (!b.planId || !planIds.has(b.planId)) b.planId = ersterPlan ? ersterPlan.id : null; });
  if (!d.einstellungen.aktiverPlanId || !planIds.has(d.einstellungen.aktiverPlanId)) {
    d.einstellungen.aktiverPlanId = ersterPlan ? ersterPlan.id : null;
  }
  d.stoebern = (raw && raw.stoebern && Array.isArray(raw.stoebern.werke) && raw.stoebern.werke.length)
    ? raw.stoebern : null;
  d.buecher = (Array.isArray(d.buecher) ? d.buecher : []).map((b, i) => ({
    id: b.id || uid(),
    blockId: b.blockId || (d.bloecke[0] && d.bloecke[0].id) || null,
    ord: b.ord != null ? b.ord : i,
    titel: String(b.titel || 'Ohne Titel'),
    autor: String(b.autor || ''),
    autorGeb: b.autorGeb == null ? null : b.autorGeb,
    autorGest: b.autorGest == null ? null : b.autorGest,
    autorBio: b.autorBio || '',
    autorEinfluss: Array.isArray(b.autorEinfluss) ? b.autorEinfluss.map(x => String(x).trim()).filter(Boolean) : [],
    autoren: normAutoren(b),

    ausgabe: b.ausgabe || '',
    link: String(b.link || b.doi || b.url || '').trim(),
    beschreibung: b.beschreibung || '',
    kurz: b.kurz || '',
    preis: b.preis == null ? null : b.preis,
    status: STATUS[b.status] ? b.status : 'offen',
    besitz: BESITZ[b.besitz] ? b.besitz : 'fehlt',
    einkauf: !!b.einkauf,
    sessions: (b.sessions || []).map(s => ({
      id: s.id || uid(), datum: s.datum || heute(), minuten: +s.minuten || 0,
      von: s.von == null ? null : s.von, bis: s.bis == null ? null : s.bis, notiz: s.notiz || ''
    })),
    notizen: (b.notizen || []).map(n => ({
      id: n.id || uid(), seite: (n.seite == null || n.seite === '') ? null : String(n.seite).trim(),
      themaId: n.themaId || null, artId: n.artId || null,

      erstellt: n.erstellt || Date.now(), geaendert: n.geaendert || Date.now()
    }))
  }));
  return d;
}

/* --- Zugriffe --- */
const plaeneSortiert = () => DB.lesepleane.slice().sort((a, b) => a.ord - b.ord);
const aktiverPlan = () => DB.lesepleane.find(p => p.id === DB.einstellungen.aktiverPlanId) || plaeneSortiert()[0] || null;

const buecherImPlan = id => {
  const ids = new Set(DB.bloecke.filter(b => b.planId === id).map(b => b.id));
  return DB.buecher.filter(b => ids.has(b.blockId));
};

/* Alle Bücher in der Reihenfolge der Listen, Blöcke und Plätze. */
function buecherNachPlan() {
  const out = [];
  plaeneSortiert().forEach(p => bloeckeVonPlan(p.id).forEach(bl => buecherIn(bl.id).forEach(b => out.push(b))));
  DB.buecher.forEach(b => { if (!out.includes(b)) out.push(b); });
  return out;
}
const buecherIn = id => DB.buecher.filter(b => b.blockId === id).sort((a, b) => a.ord - b.ord);
const buchById = id => DB.buecher.find(b => b.id === id);
const blockById = id => DB.bloecke.find(b => b.id === id);
const artById = id => DB.arten.find(a => a.id === id);
const themaById = id => DB.themen.find(t => t.id === id);
const artFarbe = id => { const a = artById(id); return a ? 'var(--' + a.farbe + ')' : 'var(--text-3)'; };
const artName = id => { const a = artById(id); return a ? a.name : 'Ohne Art'; };
