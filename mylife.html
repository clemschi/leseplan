function themaFindenOderAnlegen(name) {
  const n = String(name || '').trim();
  if (!n) return null;
  const vorhanden = DB.themen.find(t => t.name.toLowerCase() === n.toLowerCase());
  if (vorhanden) return vorhanden.id;
  const t = { id: uid(), name: n };
  DB.themen.push(t);
  return t.id;
}
function buchMinuten(b) { return b.sessions.reduce((s, x) => s + (+x.minuten || 0), 0); }
function buchSeitenGelesen(b) {
  return b.sessions.reduce((s, x) => (x.von != null && x.bis != null && x.bis > x.von) ? s + (x.bis - x.von) : s, 0);
}
function buchTempo(b) { const m = buchMinuten(b), s = buchSeitenGelesen(b); return (m > 5 && s > 0) ? s / (m / 60) : null; }
/* Was an einem Tag gelesen wurde – aus den Sitzungen. */
function tagStatistik(datum) {
  let seiten = 0, minuten = 0;
  const buecher = new Set();
  DB.buecher.forEach(b => b.sessions.forEach(x => {
    if (x.datum !== datum) return;
    minuten += +x.minuten || 0;
    if (x.von != null && x.bis != null && x.bis > x.von) seiten += x.bis - x.von;
    buecher.add(b.id);
  }));
  return { datum, seiten, minuten, buecher: buecher.size };
}
/* Alle Tage mit Sitzungen, neueste zuerst. */
function tageMitSitzungen() {
  const tage = new Set();
  DB.buecher.forEach(b => b.sessions.forEach(x => tage.add(x.datum)));
  return Array.from(tage).sort().reverse().map(tagStatistik);
}
function zielHeute() {
  const ziel = +DB.einstellungen.zielSeiten || 0;
  const t = tagStatistik(heute());
  return { ziel, gelesen: t.seiten, minuten: t.minuten, geschafft: ziel > 0 && t.seiten >= ziel };
}

function alleNotizen() {
  const out = [];
  DB.buecher.forEach(b => b.notizen.forEach(n => out.push({ buch: b, notiz: n })));
  return out;
}

/* ============================================================
   Speicher: Datei (wo der Browser es erlaubt) oder Gerät
   ============================================================ */
const IDB = (() => {
  let p;
  function open() {
    if (p) return p;
    p = new Promise((res, rej) => {
      const r = indexedDB.open('leseplan', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return p;
  }
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), st = t.objectStore('kv');
    const q = fn(st);
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  }));
  return {
    get: k => tx('readonly', st => st.get(k)),
    set: (k, v) => tx('readwrite', st => st.put(v, k)),
    del: k => tx('readwrite', st => st.delete(k))
  };
})();

/* ===== Speicher =====
   Jede App in dieser Datei hält ihre Einträge für sich: eigener Ort, eigene
   JSON-Datei, eigener Stand. Die Schicht ist darum eine Fabrik – „Store“ ist
   die Ausfertigung der leseliste, „KStore“ die des Kalenders. */
function macheSpeicher(cfg) {
  return {
    id: cfg.id,
    metaKey: cfg.metaKey,
    datenKey: cfg.datenKey,
    modus: null,          // 'datei' | 'geraet'
    handle: null,         // FileSystemFileHandle bei 'datei'
    dateiname: cfg.dateiname,
    dirty: false,
    letzteSicherung: 0,
    fehler: null,
    timer: null,

    daten() { return cfg.daten(); },
    setzen(d) { cfg.setzen(d); },

    dateiGesperrt: false,
    dateiApiDa() { return typeof window.showSaveFilePicker === 'function' && !this.dateiGesperrt; },

    async metaLesen() { return (await IDB.get(this.metaKey)) || null; },
    async metaSchreiben() {
      await IDB.set(this.metaKey, { modus: this.modus, handle: this.handle, dateiname: this.dateiname });
    },

    async rechtePruefen(handle, fragen) {
      if (!handle || !handle.queryPermission) return true;
      const opt = { mode: 'readwrite' };
      if ((await handle.queryPermission(opt)) === 'granted') return true;
      if (!fragen) return false;
      return (await handle.requestPermission(opt)) === 'granted';
    },

    async ladeDaten() {
      if (this.modus === 'datei' && this.handle) {
        const f = await this.handle.getFile();
        const txt = await f.text();
        return txt.trim() ? JSON.parse(txt) : null;
      }
      return (await IDB.get(this.datenKey)) || null;
    },

    async schreiben() {
      const json = JSON.stringify(this.daten());
      if (this.modus === 'datei' && this.handle) {
        const w = await this.handle.createWritable();
        await w.write(json);
        await w.close();
      } else {
        await IDB.set(this.datenKey, this.daten());
      }
    },

    async sichern(still) {
      if (!this.modus) return false;
      if (this._laeuft) { this._nochmal = true; return false; }
      this._laeuft = true;
      try {
        this.daten().geaendert = Date.now();
        await this.schreiben();
        this.dirty = false;
        this.fehler = null;
        this.letzteSicherung = Date.now();
        saveChipMalen();
        return true;
      } catch (e) {
        console.error(e);
        this.fehler = e && e.message ? e.message : 'Unbekannter Fehler';
        saveChipMalen();
        if (!still) toast('Sichern fehlgeschlagen: ' + this.fehler, 4200);
        return false;
      } finally {
        this._laeuft = false;
        if (this._nochmal) { this._nochmal = false; setTimeout(() => this.sichern(true), 0); }
      }
    },

    /* Der feste Takt ist die Zusage; kurz nach der letzten Eingabe wird zusätzlich
       gesichert, damit ein Schließen zwischen zwei Takten nichts kostet. */
    aendern() {
      this.dirty = true;
      saveChipMalen();
      clearTimeout(this._kurz);
      this._kurz = setTimeout(() => { if (this.dirty) this.sichern(true); }, 4000);
    },

    autosaveStarten() {
      clearInterval(this.timer);
      const e = this.daten().einstellungen || {};
      const sek = clamp(+(e.autosaveSek || 60), 15, 600);
      this.timer = setInterval(() => { if (this.dirty) this.sichern(true); }, sek * 1000);
      if (this._haengt) return;
      this._haengt = true;
      document.addEventListener('visibilitychange', () => { if (document.hidden && this.dirty) this.sichern(true); });
      window.addEventListener('pagehide', () => { if (this.dirty) this.sichern(true); });
    },

    /* Bewusstes Sichern als Datei – im Gerätemodus über den Datei-Dialog der Umgebung. */
    async alsDateiSichern(ohneBilder) {
      if (this.modus === 'datei' && this.handle) {
        const ok = await this.sichern();
        if (ok) toast('In ' + this.dateiname + ' gesichert.');
        return;
      }
      let daten = this.daten();
      if (ohneBilder && cfg.ohneBilder) daten = cfg.ohneBilder(daten);
      const json = JSON.stringify(daten);
      const name = cfg.id + '-' + heute() + (ohneBilder ? '-ohne-fotos' : '') + '.json';
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) {
        try {
          await dl.save({ filename: name, data: json });
          toast('Datei gesichert: ' + name);
          this.letzteSicherung = Date.now(); saveChipMalen();
          return;
        } catch (e) {
          const code = e && e.code;
          if (code === 'declined') { toast('Sichern abgebrochen.'); return; }
          if (code === 'too_large' && !ohneBilder && cfg.ohneBilder) { return this.alsDateiSichern(true); }
          toast('Datei konnte nicht gesichert werden (' + (code || 'Fehler') + ').', 4200);
          return;
        }
      }
      /* Läuft die Seite außerhalb der Umgebung, geht der klassische Weg. */
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('Datei gesichert: ' + name);
      } catch (e) { toast('Kein Weg zum Dateispeichern verfügbar.', 4000); }
    }
  };
}

/* Die leseliste behält ihre bisherigen Schlüssel, damit vorhandene Stände
   unangetastet weiterlaufen. */
const Store = macheSpeicher({
  id: 'leseplan', metaKey: 'meta', datenKey: 'daten', dateiname: 'leseplan.json',
  daten: () => DB, setzen: d => { DB = d; },
  ohneBilder: d => {
    const k = JSON.parse(JSON.stringify(d));
    k.buecher.forEach(b => b.notizen.forEach(n => { n.bilder = []; }));
    k.ohneBilder = true;
    return k;
  }
});

/* Welcher Speicher gerade zählt – danach richtet sich der Chip in der Kopfzeile. */
let aktiverSpeicher = Store;


/* Denselben Chip gibt es in der Kopfzeile der App und in jeder Ebene
   darüber – ein Zustand, ein Aussehen, ein Griff. */
function saveChipMalen() {
  const S = aktiverSpeicher || Store;
  const zustand = S.fehler ? 'error' : S.dirty ? 'dirty' : 'clean';
  const text = S.fehler ? 'Fehler' : S.dirty ? 'offen'
    : (S.letzteSicherung ? relZeit(S.letzteSicherung).replace('vor ', '') : 'gesichert');
  $$('.savechip').forEach(chip => {
    chip.dataset.state = zustand;
    const t = $('.st', chip);
    if (t) t.textContent = text;
  });
}
setInterval(saveChipMalen, 30000);

        <div style="margin-top:10px">
          <button class="btn btn-block btn-ghost" data-act="import">Daten aus einer Datei laden</button>
        </div>

        <p class="hinweis" style="margin-top:16px">
          Dieser Browser lässt die Seite nicht direkt in eine Datei schreiben. Hol dir mit „Jetzt sichern“ regelmäßig eine Kopie.
        </p>
      `}

      <button class="infobox" data-act="info" style="position:static;margin:20px 0 0;max-width:none">
        <span class="i-kopf">Wo liegen meine Daten?</span>
        <span class="i-text">Im Browser dieses Geräts, an diese Seite gebunden – nicht in einer Datei.
          Jede App für sich. Zum Mitnehmen: <b>Mehr → Jetzt sichern</b>. Tippen für die lange Fassung.</span>
      </button>

      <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        ${dateiDa ? '<button class="btn btn-sm" data-act="import">Daten aus Datei laden</button>' : ''}
        ${nurWechsel ? '' : '<button class="btn btn-sm" data-act="stoebern">' + ICON.herz + ' Stöbern</button>'}
        ${nurWechsel ? '' : '<button class="btn btn-sm" data-act="ki">Liste von KI zusammenstellen</button>'}
        ${(nurWechsel || ausSplash) ? '<button class="btn btn-sm btn-ghost" data-act="abbrechen">Zurück</button>' : ''}
        <button class="btn btn-sm btn-ghost" data-act="theme">Hell/Dunkel</button>
        ${vollbildGeht() ? `<button class="btn btn-sm btn-ghost" data-act="voll">${ICON.voll} Vollbild</button>` : ''}
      </div>
    </div>`;
  s.hidden = false;
  $('#app').hidden = true;

  s.onclick = async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'theme') { themeUmschalten(); return; }
    if (act === 'voll') { vollbildUmschalten(); return; }
    if (act === 'info') { speicherErklaerung(); return; }
    if (act === 'abbrechen') {
      if (ausSplash) { splashZeigen(); return; }
      s.hidden = true; $('#app').hidden = false; return;
    }
    if (act === 'import') { importDialog(!nurWechsel); return; }
    if (act === 'ki') { kiErstellenOeffnen(); return; }
    /* Stöbern legt am Ende selbst eine leseliste an – dafür braucht es einen
       Speicherort, also gilt hier dieselbe Arbeitskopie wie bei „Loslegen“. */
    if (act === 'stoebern') {
      if (!Store.modus) {
        Store.modus = 'geraet'; Store.handle = null;
        await Store.metaSchreiben();
        if (!nurWechsel) DB = normalisiere(await IDB.get('daten'));
        await Store.sichern(true);
        appStarten(true);
      }
      stoebernOeffnen();
      return;
    }

    if (act === 'geraet') {
      Store.modus = 'geraet'; Store.handle = null;
      await Store.metaSchreiben();
      if (!nurWechsel) DB = normalisiere(await IDB.get('daten'));
      await Store.sichern(true);
      appStarten();
      return;
    }
    if (act === 'datei-neu' || act === 'datei-oeffnen') {
      try {
        let handle;
        if (act === 'datei-neu') {
          handle = await window.showSaveFilePicker({
            suggestedName: 'leseplan.json',
            types: [{ description: 'leseliste', accept: { 'application/json': ['.json'] } }]
          });
        } else {
          const [h] = await window.showOpenFilePicker({
            types: [{ description: 'leseliste', accept: { 'application/json': ['.json'] } }]
          });
          handle = h;
        }
        if (!(await Store.rechtePruefen(handle, true))) { toast('Ohne Schreibrecht geht es nicht.'); return; }
        Store.modus = 'datei'; Store.handle = handle; Store.dateiname = handle.name || 'leseplan.json';
        const geladen = await Store.ladeDaten();
        DB = normalisiere(geladen);
        await Store.metaSchreiben();
        await Store.sichern(true);
        appStarten();
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        console.error(err);
        /* In einer eingebetteten Ansicht verbieten Browser den Dateidialog. */
        Store.dateiGesperrt = true;
        setupZeigen(nurWechsel);
        $('.setup-inner').insertAdjacentHTML('afterbegin',
          `<p class="lead" style="color:var(--accent)">Dieser Browser lässt die Seite hier nicht in eine Datei schreiben – das passiert, wenn die App eingebettet läuft. Nimm die Arbeitskopie; sichern als Datei geht später jederzeit über „Jetzt sichern“.</p>`);
      }
    }
  };
}

   ============================================================ */
/* Akzentfarben: je ein Wert für dunkel und hell, im Menü umstellbar. */
const AKZENTE = [
  { id: 'messing', name: 'Messing', dark: '#dba43f', light: '#8a6114' },
  { id: 'kupfer', name: 'Kupfer', dark: '#e08a55', light: '#a04d1c' },
  { id: 'rot', name: 'Rot', dark: '#e5706c', light: '#b02e2a' },
  { id: 'magenta', name: 'Magenta', dark: '#d97ab0', light: '#a02f75' },
  { id: 'violett', name: 'Violett', dark: '#9b8bf0', light: '#5344b5' },
  { id: 'blau', name: 'Blau', dark: '#5b9df0', light: '#1a5eb0' },
  { id: 'tuerkis', name: 'Türkis', dark: '#3fbfb2', light: '#0c766c' },
  { id: 'gruen', name: 'Grün', dark: '#5fbf7a', light: '#177a3c' },
  { id: 'grau', name: 'Grau', dark: '#c3c7cf', light: '#454d57' }
];
/* ===== Die Hülle =====
   In dieser Datei wohnen mehrere Apps. Was allen gemeinsam ist – Farbe, Hell
   oder Dunkel, Vollbild –, gehört der Hülle und liegt in einem eigenen kleinen
   Satz neben den Daten der Apps. Jede App hält ihre Einträge dagegen in einer
   eigenen JSON-Datenbasis. */
let SHELL = { theme: 'dark', akzent: 'messing', vollbildStart: true };
async function shellLesen() {
  try {
    const s = await IDB.get('shell');
    if (s && typeof s === 'object') SHELL = Object.assign(SHELL, s);
  } catch (e) { console.warn(e); }
}
function shellSchreiben() {
  try { IDB.set('shell', { theme: SHELL.theme, akzent: SHELL.akzent, vollbildStart: SHELL.vollbildStart }); }
  catch (e) { console.warn(e); }
}

const akzentAktiv = () => AKZENTE.find(a => a.id === SHELL.akzent) || AKZENTE[0];
/* Nebenfarben für die Vernetzung, je [hell, dunkel]. */
const TEAL = ['#0c766c', '#3fbfb2'], VIOLETT = ['#5344b5', '#9b8bf0'],
  ROSE = ['#a02f75', '#d97ab0'], MESSING = ['#8a6114', '#dba43f'];

function themeAnwenden() {
  const hell = SHELL.theme === 'light';
  document.documentElement.setAttribute('data-app-theme', hell ? 'light' : 'dark');
  const a = akzentAktiv();
  document.documentElement.style.setProperty('--accent', hell ? a.light : a.dark);
  /* Drei Farben müssen sich in der Vernetzung auseinanderhalten lassen:
     der Akzent für „beeinflusst von“, --wirkt für „wirkt auf“ und --beides,
     wenn zwei Autoren aufeinander gewirkt haben. Zu jedem Akzent stehen die
     beiden anderen darum eigens fest. */
  const DREI = {
    messing: [TEAL, ROSE], kupfer: [TEAL, VIOLETT], rot: [TEAL, VIOLETT],
    magenta: [TEAL, MESSING], violett: [TEAL, ROSE], blau: [TEAL, ROSE],
    tuerkis: [VIOLETT, MESSING], gruen: [VIOLETT, MESSING], grau: [TEAL, ROSE]
  };
  const [wirkt, beides] = DREI[a.id] || DREI.messing;
  document.documentElement.style.setProperty('--wirkt', hell ? wirkt[0] : wirkt[1]);
  document.documentElement.style.setProperty('--beides', hell ? beides[0] : beides[1]);
  const b = $('#btnTheme');
  if (b) b.innerHTML = hell ? ICON.moon : ICON.sun;
}
function themeUmschalten() {
  SHELL.theme = SHELL.theme === 'light' ? 'dark' : 'light';
  themeAnwenden();
  shellSchreiben();
}

/* ---------- Vollbild: Browserleisten verschwinden lassen ---------- */
const vollbildGeht = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const vollbildAn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function vollbildUmschalten() {
  const el = document.documentElement;
  /* Beide Wege liefern ein Versprechen, das der Browser ablehnen darf – etwa
     wenn keine Geste dahintersteht. Das ist kein Fehler, nur kein Vollbild. */
  const still = p => { if (p && p.catch) p.catch(() => { }); };
  if (vollbildAn()) {
    still((document.exitFullscreen || document.webkitExitFullscreen).call(document));
  } else {
    const f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) still(f.call(el, { navigationUI: 'hide' }));
  }
}
function vollbildKnopfMalen() {
  document.body.classList.toggle('voll', vollbildAn());
  if (typeof globalKnoepfeMalen === 'function') globalKnoepfeMalen();
  const b = $('#btnVoll');
  if (!b) return;
  b.hidden = !vollbildGeht();
  b.innerHTML = vollbildAn() ? ICON.vollAus : ICON.voll;
}
document.addEventListener('fullscreenchange', vollbildKnopfMalen);
document.addEventListener('webkitfullscreenchange', vollbildKnopfMalen);

/* Vollbild verlangt eine Geste des Nutzers – also bei der allerersten Berührung,
   schon auf dem Startbildschirm. Die Einstellung wird erst beim Auslösen gelesen. */
function vollbildAutostart() {
  if (!vollbildGeht()) return;
  const versuch = () => {
    document.removeEventListener('pointerdown', versuch, true);
    document.removeEventListener('keydown', versuch, true);
    try {
      if (SHELL.vollbildStart && !vollbildAn()) vollbildUmschalten();
    } catch (e) { }
  };
  document.addEventListener('pointerdown', versuch, true);
  document.addEventListener('keydown', versuch, true);
}

/* ============================================================
   Rahmen: Tabs, Kopfzeile

/* „tat“ statt Ansicht: das Stöbern ist keine Registerkarte, sondern öffnet
   eine eigene Ebene – es steht nur der Erreichbarkeit halber in der Leiste. */
const TABS = [
  { id: 'plan', label: 'Liste', icon: ICON.books },
  { id: 'stoebern', label: 'Stöbern', icon: ICON.herz, tat: () => stoebernOeffnen() },
  { id: 'themen', label: 'Notizen', icon: ICON.tags },
  { id: 'mehr', label: 'Mehr', icon: ICON.more }
];
const ANSICHTEN = TABS.filter(t => !t.tat).map(t => t.id);
let aktiverTab = 'plan';

function tabbarMalen() {
  $('#tabbar').innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" aria-selected="${t.id === aktiverTab}">${t.icon}<span>${t.label}</span></button>`).join('');
  $('#tabbar').onclick = e => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    const t = TABS.find(x => x.id === b.dataset.tab);

  };
}
function tabWechseln(id) {
  aktiverTab = id;
  tabbarMalen();
  viewMalen();
  window.scrollTo(0, 0);
}
function viewMalen() {
  const v = $('#view');
  if (aktiverTab === 'plan') planMalen(v);
  else if (aktiverTab === 'themen') notizenTabMalen(v);
  else mehrMalen(v);
  kopfMalen();
  nowbarMalen();
  /* Liegt die Übersicht offen, wandert die Änderung gleich mit hinein. */
  if (ueOffen) ueOffen();
}
let ueOffen = null;
function kopfMalen() {
  const buecher = buecherAktiv();
  const ges = buecher.length;
  const gelesen = buecher.filter(b => b.status === 'gelesen').length;
  const lese = buecher.filter(b => b.status === 'lese').length;
  $('#progText').textContent = gelesen + ' / ' + ges + ' gelesen';
  const seiten = buecher.filter(b => b.status === 'gelesen').reduce((s, b) => s + (b.seiten || 0), 0);
  $('#progRight').textContent = seiten ? fmtZahl(seiten) + ' Seiten' : '';
  $('#barRead').style.width = (ges ? gelesen / ges * 100 : 0) + '%';
  $('#barActive').style.width = (ges ? lese / ges * 100 : 0) + '%';

  const zr = $('#zielRow');
  const z = zielHeute();
  if (!z.ziel) { zr.hidden = true; }
  else {
    zr.hidden = false;
    zr.classList.toggle('geschafft', z.geschafft);
    zr.innerHTML = `
      <span class="zt">Heute</span>
      <span class="zbar"><i style="width:${clamp(z.gelesen / z.ziel * 100, 0, 100)}%"></i></span>
      <span class="zn">${z.gelesen} / ${z.ziel} S.${z.geschafft ? ' ✓' : ''}</span>`;
    zr.onclick = () => zielBearbeiten();
  }
}

function zielBearbeiten(nachher) {
  const s = blatt('Tagesziel', `
    <div class="field">
      <label>Seiten pro Tag</label>
      <input type="number" data-z value="${DB.einstellungen.zielSeiten || ''}" placeholder="z.B. 20">

    </div>

    layerSchliessen();

  };
}

function einfuehrungZeigen() {

  const node = document.createElement('div');

  };

      aktion: null
    },
    {
      titel: 'Wie viel willst du am Tag lesen?',
      text: () => 'Das Ziel steht dann oben in der Kopfzeile und füllt sich mit jeder Lese-Sitzung. Du kannst es jederzeit ändern oder weglassen.',
      feld: `<div class="field"><label>Seiten pro Tag</label><input type="number" data-ziel placeholder="z.B. 20" value="${DB.einstellungen.zielSeiten || ''}"></div>`,
      vorWeiter: (body) => {
        const v = num($('[data-ziel]', body).value);
        aendern(() => { DB.einstellungen.zielSeiten = (v && v > 0) ? Math.round(v) : null; });

    {
      titel: 'Eine leseliste anlegen',
      text: () => `Ganz oben steht die <strong>leseliste</strong> – sie bündelt mehrere Blöcke. Du kannst mehrere führen und zwischen ihnen wechseln.

      feld: `<div class="field"><label>Name</label><input type="text" data-name placeholder="z.B. Lesestart"></div>
             <p class="hinweis" style="padding:0 0 4px">Oder lade die fertige Liste als Datei – dann sind Blöcke und Bücher gleich mit dabei.</p>
             <button class="btn btn-block" data-import>Fertige Liste aus Datei laden</button>
             <p class="hinweis" style="padding:10px 0 4px">Du hast noch keine Liste, aber eine Frage, eine These oder ein Thema?
               Dann lass sie dir zusammenstellen: Die App baut den Prompt, Claude liefert eine Datei zurück, die du hier lädst.</p>
             <button class="btn btn-block" data-ki>${ICON.tags} Von KI zusammenstellen lassen</button>`,
      vorWeiter: (body) => {
        const name = ($('[data-name]', body).value || '').trim();
        if (!name) return;
        aendern(() => {
          const n = { id: uid(), name, ord: DB.lesepleane.length };
          DB.lesepleane.push(n);
          DB.einstellungen.aktiverPlanId = n.id;
        });
      }
    },
    {
      titel: 'Blöcke gliedern die Liste',
      text: () => `Ein Block ist ein Thema mit mehreren Werken – „Existentialismus“, „Faschismus“, was du willst.

      </div>`;
    const imp = $('[data-import]', body);
    if (imp) imp.onclick = () => importDialog(false);
    const ki = $('[data-ki]', body);
    if (ki) ki.onclick = () => kiErstellenOeffnen();
    const zur = $('[data-zurueck]', body);
    if (zur) zur.onclick = () => { schritt--; malen(); };
    $('[data-weiter]', body).onclick = () => {
      if (sch.vorWeiter) sch.vorWeiter(body);
      if (schritt === schritte.length - 1) { fertig(); return; }
      schritt++;
      malen();
      viewMalen();
    };
  };

  $('[data-weg]', node).onclick = fertig;
  layerOeffnen(node, () => { if (!DB.einstellungen.einfuehrung) { aendern(() => { DB.einstellungen.einfuehrung = true; }); } viewMalen(); });
  malen();
}

/* „still“ heisst: ohne Einführung – etwa wenn vom Startbildschirm aus direkt

  tabbarMalen();

/* ============================================================
   Kalender – die zweite App in dieser Datei
   Eigene Datenbasis, eigener Speicherort, gleiches Gesicht:
   Heute · Kalender · To-Do · Mehr
   ============================================================ */

let KDB = leereKal();

function leereKal() {
  return {
    format: 'mylife-kalender',
    version: 1,
    erstellt: Date.now(),
    geaendert: Date.now(),
    einstellungen: { autosaveSek: 60 },
    /* Ein Termin: Tag, wahlweise Uhrzeit und Dauer, wahlweise Wiederholung. */
    termine: [],
    /* Eine Aufgabe in drei Ebenen: Vorhaben → Schritt → Handgriff. */
    aufgaben: []
  };
}

function kalNormalisiere(roh) {
  const d = (roh && typeof roh === 'object') ? roh : {};
  const k = leereKal();
  k.erstellt = +d.erstellt || Date.now();
  k.einstellungen = Object.assign(k.einstellungen, d.einstellungen || {});
  k.termine = (Array.isArray(d.termine) ? d.termine : []).map(t => ({
    id: t.id || uid(),
    titel: String(t.titel || '').trim() || 'Ohne Titel',
    datum: /^\d{4}-\d{2}-\d{2}$/.test(t.datum) ? t.datum : heute(),
    zeit: /^\d{2}:\d{2}$/.test(t.zeit) ? t.zeit : null,
    dauer: t.dauer == null ? null : clamp(+t.dauer || 0, 0, 1440),
    ort: String(t.ort || ''),
    notiz: String(t.notiz || ''),
    farbe: KFARBEN.includes(t.farbe) ? t.farbe : KFARBEN[0],
    wdh: KWDH[t.wdh] ? t.wdh : 'keine'
  }));
  /* Drei Ebenen: Thema → Tag → Tätigkeit. Ältere Stände hiessen Vorhaben,
     Schritt und Handgriff; ihre Felder werden hier übernommen. */
  const taetigkeit = x => ({ id: x.id || uid(), text: String(x.text || '').trim(), done: !!x.done });
  k.aufgaben = (Array.isArray(d.aufgaben) ? d.aufgaben : []).map(v => {
    const tage = (Array.isArray(v.tage) ? v.tage : (Array.isArray(v.teile) ? v.teile : [])).map(t => ({
      id: t.id || uid(),
      datum: /^\d{4}-\d{2}-\d{2}$/.test(t.datum) ? t.datum
        : (/^\d{4}-\d{2}-\d{2}$/.test(t.faellig) ? t.faellig : null),
      notiz: String(t.notiz != null ? t.notiz : (t.text || '')).trim(),
      done: !!t.done,
      taetigkeiten: (Array.isArray(t.taetigkeiten) ? t.taetigkeiten
        : (Array.isArray(t.schritte) ? t.schritte : [])).map(taetigkeit).filter(x => x.text)
    })).filter(t => t.datum || t.notiz || t.taetigkeiten.length);
    /* Hatte ein Thema früher selbst eine Frist und noch keinen Tag, wird daraus einer. */
    if (!tage.length && /^\d{4}-\d{2}-\d{2}$/.test(v.faellig)) {
      tage.push({ id: uid(), datum: v.faellig, notiz: '', done: !!v.done, taetigkeiten: [] });
    }
    return {
      id: v.id || uid(),
      text: String(v.text || '').trim() || 'Ohne Titel',
      done: !!v.done,
      tage
    };
  });
  return k;
}

const KFARBEN = ['accent', 'good', 'wirkt', 'beides', 'bad'];
/* Was der leseliste fehlt, bringt der Kalender selbst mit. */
const KICON = {
  heute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="2" fill="currentColor" stroke="none"/></svg>',
  monat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8.5 14h1M12 14h1M15.5 14h1M8.5 17.5h1M12 17.5h1"/></svg>',
  fluss: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="5" rx="2"/><path d="M12 8v4M6 16h12M6 12v4M18 12v4"/><rect x="3" y="16" width="6" height="5" rx="2"/><rect x="15" y="16" width="6" height="5" rx="2"/></svg>',
  frist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>'
};
const KWDH = {
  keine: 'einmalig', taeglich: 'täglich', woechentlich: 'wöchentlich',
  monatlich: 'monatlich', jaehrlich: 'jährlich'
};

const KStore = macheSpeicher({
  id: 'kalender', metaKey: 'meta-kalender', datenKey: 'daten-kalender', dateiname: 'kalender.json',
  daten: () => KDB, setzen: d => { KDB = d; }
});

/* Wie aendern() in der leseliste: anfassen, vormerken, den Rest macht der Takt. */
function kAendern(fn) {
  if (fn) fn();
  KStore.aendern();
}

/* ---------- Tage rechnen ---------- */
const KTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const KMONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
  'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const KTAGE_LANG = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

function kDatum(iso) { const [j, m, t] = iso.split('-').map(Number); return new Date(j, m - 1, t); }
function kIso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function kPlus(iso, tage) { const d = kDatum(iso); d.setDate(d.getDate() + tage); return kIso(d); }
/* Montag = 0, damit die Woche dort beginnt, wo sie hier beginnt. */
function kWochentag(iso) { return (kDatum(iso).getDay() + 6) % 7; }
function kTagText(iso, lang) {
  const d = kDatum(iso);
  return (lang ? KTAGE_LANG : KTAGE)[kWochentag(iso)] + ', ' + d.getDate() + '. ' + MONATE[d.getMonth()]
    + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function kNaheText(iso) {
  const h = heute();
  if (iso === h) return 'Heute';
  if (iso === kPlus(h, 1)) return 'Morgen';
  if (iso === kPlus(h, -1)) return 'Gestern';
  return null;
}

/* Fällt ein wiederkehrender Termin auf diesen Tag? */
function kFaelltAuf(t, iso) {
  if (t.datum === iso) return true;
  if (t.wdh === 'keine' || iso < t.datum) return false;
  const a = kDatum(t.datum), b = kDatum(iso);
  if (t.wdh === 'taeglich') return true;
  if (t.wdh === 'woechentlich') return a.getDay() === b.getDay();
  if (t.wdh === 'monatlich') return a.getDate() === b.getDate();
  if (t.wdh === 'jaehrlich') return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
  return false;
}
function kTermineAm(iso) {
  return KDB.termine.filter(t => kFaelltAuf(t, iso))
    .sort((x, y) => (x.zeit || '99:99').localeCompare(y.zeit || '99:99') || x.titel.localeCompare(y.titel));
}
/* Was an diesem Tag ansteht: jeder Tag eines Themas mit seinem Datum. */
function kFaelligAm(iso) {
  const raus = [];
  KDB.aufgaben.forEach(v => {
    v.tage.forEach(t => {
      if (t.datum !== iso || t.done) return;
      const offen = t.taetigkeiten.filter(x => !x.done);
      raus.push({ thema: v, tag: t, text: t.notiz || v.text, offen: offen.length, taetigkeiten: offen });
    });
  });
  return raus;
}
function kFortschritt(v) {
  const alle = [];
  v.tage.forEach(t => { alle.push(t.done); t.taetigkeiten.forEach(x => alle.push(x.done)); });
  if (!alle.length) return { fertig: v.done ? 1 : 0, ganz: 1 };
  return { fertig: alle.filter(Boolean).length, ganz: alle.length };
}
/* Ein Elternteil gilt als erledigt, wenn alles darunter erledigt ist. */
function kElternPruefen(v) {
  v.tage.forEach(t => { if (t.taetigkeiten.length) t.done = t.taetigkeiten.every(x => x.done); });
  if (v.tage.length) v.done = v.tage.every(t => t.done);
}
/* Tage stehen in der Reihenfolge, in der sie liegen – neue rutschen an ihren Platz. */
function kTagEinfuegen(thema, tag) {
  if (!tag.datum) { thema.tage.push(tag); return; }
  const i = thema.tage.findIndex(t => t.datum && t.datum > tag.datum);
  if (i < 0) thema.tage.push(tag); else thema.tage.splice(i, 0, tag);
}

/* ---------- Öffnen und Speicherort ---------- */
async function kalenderOeffnen() {
  aktiverSpeicher = KStore;
  let meta = null;
  try { meta = await KStore.metaLesen(); } catch (e) { console.warn(e); }

  if (meta && meta.modus === 'datei' && meta.handle) {
    KStore.modus = 'datei'; KStore.handle = meta.handle; KStore.dateiname = meta.dateiname || 'kalender.json';
    if (await KStore.rechtePruefen(meta.handle, false)) {
      try { KDB = kalNormalisiere(await KStore.ladeDaten()); kalStarten(); return; }
      catch (e) { console.error(e); }
    }
    kalSpeicherort(true);
    return;
  }
  if (meta && meta.modus === 'geraet') {
    KStore.modus = 'geraet';
    KDB = kalNormalisiere(await IDB.get('daten-kalender'));
    kalStarten();
    return;
  }
  kalSpeicherort(false);
}

/* Derselbe Weg wie in der leseliste, nur kürzer: einmal den Ort wählen. */
function kalSpeicherort(erneut) {
  const s = $('#setup');
  const dateiDa = KStore.dateiApiDa();
  s.innerHTML = `
    <div class="setup-inner">
      <div class="mark serif">kalender</div>
      ${erneut ? `<p class="lead">Der Browser hat den Zugriff auf <strong>${esc(KStore.dateiname)}</strong> zurückgesetzt. Einmal bestätigen, dann geht es weiter.</p>`
      : `<p class="lead">Wo sollen Termine und Aufgaben liegen? Der Kalender führt eine eigene Datei – die leseliste bleibt davon unberührt.</p>`}
      ${dateiDa ? `
        <button class="opt" data-kact="datei-neu">
          <span class="on">${ICON.save} Neue Datei anlegen <span class="badge">empfohlen</span></span>
          <span class="od">Einmal den Ort wählen – danach speichert die App still in kalender.json.</span>
        </button>
        <button class="opt" data-kact="datei-oeffnen">
          <span class="on">${ICON.books} Bestehende Datei öffnen</span>
          <span class="od">Eine kalender.json weiterführen.</span>
        </button>` : ''}
      <button class="opt" data-kact="geraet">
        <span class="on">${ICON.check} Auf diesem Gerät speichern</span>
        <span class="od">Ohne Datei-Dialog. Jederzeit als Datei sicherbar.</span>
      </button>
      <div style="margin-top:10px"><button class="btn btn-block btn-ghost" data-kact="zurueck">Zurück zur Startseite</button></div>
    </div>`;
  s.hidden = false;
  $$('.appflaeche').forEach(x => { x.hidden = true; });

  s.onclick = async (e) => {
    const b = e.target.closest('[data-kact]');
    if (!b || b.disabled) return;
    const act = b.dataset.kact;
    if (act === 'zurueck') { splashZeigen(); return; }
    b.disabled = true;
    try {
      if (act === 'datei-neu' || act === 'datei-oeffnen') {
        let handle = null;
        if (act === 'datei-neu') {
          handle = await window.showSaveFilePicker({
            suggestedName: 'kalender.json',
            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
          });
        } else {
          const [h] = await window.showOpenFilePicker({
            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
          });
          handle = h;
        }
        if (!handle) { b.disabled = false; return; }
        KStore.modus = 'datei'; KStore.handle = handle; KStore.dateiname = handle.name || 'kalender.json';
        if (act === 'datei-oeffnen') {
          try { KDB = kalNormalisiere(await KStore.ladeDaten()); } catch (err) { KDB = leereKal(); }
        } else { KDB = leereKal(); }
        await KStore.metaSchreiben();
        await KStore.sichern(true);
        kalStarten();
        return;
      }
      if (act === 'geraet') {
        KStore.modus = 'geraet'; KStore.handle = null;
        await KStore.metaSchreiben();
        KDB = kalNormalisiere(await IDB.get('daten-kalender'));
        await KStore.sichern(true);
        kalStarten();
        return;
      }
    } catch (err) {
      console.warn(err);
      if (err && err.name === 'AbortError') { b.disabled = false; return; }
      if (err && err.name === 'SecurityError') { KStore.dateiGesperrt = true; kalSpeicherort(false); return; }
      toast('Das hat nicht geklappt.', 3500);
      b.disabled = false;
    }
  };
}

/* ---------- Gerüst ---------- */
const KTABS = [
  { id: 'heute', label: 'Heute', icon: KICON.heute },
  { id: 'monat', label: 'Kalender', icon: KICON.monat },
  { id: 'todo', label: 'To-Do', icon: KICON.fluss },
  { id: 'kmehr', label: 'Mehr', icon: ICON.more }
];
let kTab = 'heute';
let kMonat = null;   // erster Tag des gezeigten Monats

function kalStarten() {
  appFlaeche('kal');
  aktiverSpeicher = KStore;
  kTab = 'heute';
  kMonat = kMonat || heute().slice(0, 8) + '01';
  themeAnwenden();
  kVollbildKnopfMalen();
  $('#kBtnTheme').onclick = () => { themeUmschalten(); kVollbildKnopfMalen(); kViewMalen(); };
  $('#kBtnVoll').onclick = vollbildUmschalten;
  $('#kBtnRaus').innerHTML = ICON.x;
  $('#kBtnRaus').onclick = zumStartbildschirm;
  $('#kBrand').onclick = () => { if (kTab !== 'heute') kTabWechseln('heute'); else window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('#kSaveChip').onclick = () => KStore.alsDateiSichern(false);
  kTabbarMalen();
  kViewMalen();
  KStore.autosaveStarten();
  saveChipMalen();
}

function kVollbildKnopfMalen() {
  const t = $('#kBtnTheme'), v = $('#kBtnVoll');
  if (t) t.innerHTML = SHELL.theme === 'light' ? ICON.moon : ICON.sun;
  if (!v) return;
  v.hidden = !vollbildGeht();
  v.innerHTML = vollbildAn() ? ICON.vollAus : ICON.voll;
}

function kTabbarMalen() {
  $('#ktabbar').innerHTML = KTABS.map(t =>
    `<button data-ktab="${t.id}" aria-selected="${t.id === kTab}">${t.icon}<span>${t.label}</span></button>`).join('');
  $('#ktabbar').onclick = e => {
    const b = e.target.closest('[data-ktab]');
    if (b) kTabWechseln(b.dataset.ktab);
  };
}
function kTabWechseln(id) {
  kTab = id;
  kTabbarMalen();
  kViewMalen();
  window.scrollTo(0, 0);
}
function kViewMalen() {
  leistenHoeheMessen();
  const v = $('#kview');
  kBannerMalen();
  if (kTab === 'heute') kHeuteMalen(v);
  else if (kTab === 'monat') kMonatMalen(v);
  else if (kTab === 'todo') kTodoMalen(v);
  else kMehrMalen(v);
  kVollbildKnopfMalen();
  saveChipMalen();
}

/* Die Zeile unter dem Namen: was heute ansteht, immer sichtbar. */
function kBannerMalen() {
  const b = $('#kBanner');
  const h = heute();
  const t = kTermineAm(h), f = kFaelligAm(h);
  const naechster = t.find(x => x.zeit && x.zeit >= new Date().toTimeString().slice(0, 5));
  b.innerHTML = `
    <span class="kb-tag num">${esc(kTagText(h, true))}</span>
    <span class="kb-zahlen">
      <span>${pl(t.length, 'Termin', 'Termine')}</span>
      <span class="kb-punkt">·</span>
      <span>${pl(f.length, 'Aufgabe', 'Aufgaben')}</span>
      ${naechster ? `<span class="kb-punkt">·</span><span class="kb-next num">${esc(naechster.zeit)} ${esc(naechster.titel)}</span>` : ''}
    </span>`;
}

/* ---------- Heute ---------- */
function kHeuteMalen(v) {
  const h = heute();
  const t = kTermineAm(h);
  const f = kFaelligAm(h);
  const kommend = [];
  for (let i = 1; i <= 7; i++) {
    const tag = kPlus(h, i);
    const tt = kTermineAm(tag), ff = kFaelligAm(tag);
    if (tt.length || ff.length) kommend.push({ tag, termine: tt, faellig: ff });
  }
  const offen = KDB.aufgaben.filter(x => !x.done);

  v.innerHTML = `
    <div class="section-head" style="padding-top:14px"><h2>Termine</h2>
      <button class="btn btn-sm" data-neuertermin>${ICON.plus} Termin</button></div>
    ${t.length ? `<div class="list-card">${t.map(x => kTerminZeile(x, h)).join('')}</div>`
      : `<div class="empty" style="margin:0"><strong>Heute nichts eingetragen</strong>Ein freier Tag – oder einer, der noch gefüllt wird.</div>`}

    <div class="section-head" style="margin-top:20px"><h2>Heute fällig</h2>
      ${f.length ? `<span class="eyebrow">${f.length}</span>` : ''}</div>
    ${f.length ? `<div class="list-card">${f.map(x => `
        <div class="rowline">
          <button class="status-btn" data-fertig="${x.tag.id}" aria-label="Erledigt">${ICON.check}</button>
          <span class="grow"><span class="rn">${esc(x.thema.text)}</span>
            <span class="rm">${x.taetigkeiten.length
        ? x.taetigkeiten.map(t => esc(t.text)).join(' · ')
        : (x.tag.notiz ? esc(x.tag.notiz) : 'ohne Tätigkeit')}</span></span>
        </div>`).join('')}</div>`
      : `<p class="hinweis" style="padding:0">Nichts fällig. Termine im Kalender, Themen unter To-Do.</p>`}

    ${offen.length ? `
      <div class="section-head" style="margin-top:20px"><h2>Themen</h2><span class="eyebrow">${offen.length} offen</span></div>
      <div class="list-card">${offen.slice(0, 5).map(x => {
        const fs = kFortschritt(x);
        return `<button class="rowline" data-vorhaben="${x.id}" style="width:100%;text-align:left">
          <span class="grow"><span class="rn">${esc(x.text)}</span>
            <span class="rm">${fs.fertig} von ${fs.ganz} erledigt${x.tage.length ? ' · ' + pl(x.tage.length, 'Tag', 'Tage') : ''}</span></span>
          <span class="kfort"><i style="width:${Math.round(fs.fertig / fs.ganz * 100)}%"></i></span>
          <span class="chev">${ICON.chev}</span></button>`;
      }).join('')}</div>` : ''}

    ${kommend.length ? `
      <div class="section-head" style="margin-top:20px"><h2>Die nächsten Tage</h2></div>
      <div class="list-card">${kommend.map(k => `
        <button class="rowline" data-tag="${k.tag}" style="width:100%;text-align:left">
          <span class="ktagchip num">${esc(KTAGE[kWochentag(k.tag)])}<b>${kDatum(k.tag).getDate()}</b></span>
          <span class="grow"><span class="rn">${esc(k.termine.length ? k.termine[0].titel : k.faellig[0].text)}</span>
            <span class="rm">${k.termine.length + k.faellig.length > 1
        ? 'und ' + (k.termine.length + k.faellig.length - 1) + ' weitere' : (k.termine.length ? (k.termine[0].zeit || 'ganztägig') : 'fällig')}</span></span>
          <span class="chev">${ICON.chev}</span></button>`).join('')}</div>` : ''}
    <div style="height:26px"></div>`;

  $('[data-neuertermin]', v).onclick = () => kTerminBearbeiten(null, h);
  $$('[data-termin]', v).forEach(b => b.onclick = () => kTerminBearbeiten(KDB.termine.find(x => x.id === b.dataset.termin), h));
  $$('[data-tag]', v).forEach(b => b.onclick = () => kTagBlatt(b.dataset.tag));
  $$('[data-vorhaben]', v).forEach(b => b.onclick = () => { kTabWechseln('todo'); setTimeout(() => kZuThema(b.dataset.vorhaben), 60); });
  $$('[data-fertig]', v).forEach(b => b.onclick = () => { kAbhaken(b.dataset.fertig); kViewMalen(); });
}

function kTerminZeile(x, iso) {
  return `<button class="rowline" data-termin="${x.id}" style="width:100%;text-align:left">
    <span class="kpunkt" style="background:var(--${x.farbe})"></span>
    <span class="kzeit num">${x.zeit ? esc(x.zeit) : '–'}</span>
    <span class="grow"><span class="rn">${esc(x.titel)}</span>
      <span class="rm">${[x.ort, x.dauer ? fmtDauer(x.dauer) : '', x.wdh !== 'keine' ? KWDH[x.wdh] : '']
      .filter(Boolean).map(esc).join(' · ') || 'ohne weitere Angabe'}</span></span>
    <span class="chev">${ICON.chev}</span></button>`;
}

/* Ein Häkchen von irgendwo: die Kennung kann ein Vorhaben oder ein Schritt sein. */
function kAbhaken(id) {
  kAendern(() => {
    KDB.aufgaben.forEach(v => {
      if (v.id === id) {
        v.done = !v.done;
        v.tage.forEach(t => { t.done = v.done; t.taetigkeiten.forEach(x => { x.done = v.done; }); });
        return;
      }
      v.tage.forEach(t => {
        if (t.id === id) { t.done = !t.done; t.taetigkeiten.forEach(x => { x.done = t.done; }); }
        t.taetigkeiten.forEach(x => { if (x.id === id) x.done = !x.done; });
      });
      kElternPruefen(v);
    });
  });
}

/* ---------- Kalender: das Monatsblatt ---------- */
function kMonatMalen(v) {
  const erster = kMonat;
  const d = kDatum(erster);
  const jahr = d.getFullYear(), monat = d.getMonth();
  const tageImMonat = new Date(jahr, monat + 1, 0).getDate();
  const vorlauf = kWochentag(erster);
  const zellen = [];
  for (let i = 0; i < vorlauf; i++) zellen.push(null);
  for (let i = 1; i <= tageImMonat; i++) zellen.push(kIso(new Date(jahr, monat, i)));
  while (zellen.length % 7) zellen.push(null);

  const h = heute();
  v.innerHTML = `
    <div class="kmonatkopf">
      <button class="icon-btn" data-vor aria-label="Vorheriger Monat">${ICON.back}</button>
      <div class="grow" style="text-align:center">
        <div class="km-name serif">${KMONATE[monat]} ${jahr}</div>
        <div class="km-sub">${pl(KDB.termine.filter(t => zellen.some(z => z && kFaelltAuf(t, z))).length, 'Termin', 'Termine')} in diesem Monat</div>
      </div>
      <button class="icon-btn" data-zurueck2 aria-label="Nächster Monat" style="transform:rotate(180deg)">${ICON.back}</button>
    </div>
    <div class="kgitterrahmen" data-rahmen>
      <div class="kgitter" data-gitter>
        ${KTAGE.map(t => `<span class="kwtag">${t}</span>`).join('')}
        ${zellen.map(z => {
          if (!z) return '<span class="ktag leer"></span>';
          const t = kTermineAm(z), f = kFaelligAm(z);
          const punkte = t.slice(0, 3).map(x => `<i style="background:var(--${x.farbe})"></i>`).join('')
            + (f.length ? '<i class="offen"></i>' : '');
          return `<button class="ktag${z === h ? ' heute' : ''}${z.slice(0, 7) !== erster.slice(0, 7) ? ' fremd' : ''}" data-tag="${z}">
            <span class="kz num">${kDatum(z).getDate()}</span>
            <span class="kpunkte">${punkte}</span></button>`;
        }).join('')}
      </div>
    </div>
    <div class="section-head" style="margin-top:18px"><h2>${esc(KMONATE[monat])} im Überblick</h2>
      <button class="btn btn-sm" data-neuertermin>${ICON.plus} Termin</button></div>
    ${(() => {
      const liste = [];
      zellen.filter(Boolean).forEach(z => { kTermineAm(z).forEach(t => liste.push({ z, t })); });
      if (!liste.length) return `<div class="empty" style="margin:0"><strong>Noch nichts in diesem Monat</strong>Tippe einen Tag an oder leg oben einen Termin an.</div>`;
      return `<div class="list-card">${liste.slice(0, 40).map(x => `
        <button class="rowline" data-tag="${x.z}" style="width:100%;text-align:left">
          <span class="ktagchip num">${esc(KTAGE[kWochentag(x.z)])}<b>${kDatum(x.z).getDate()}</b></span>
          <span class="kpunkt" style="background:var(--${x.t.farbe})"></span>
          <span class="grow"><span class="rn">${esc(x.t.titel)}</span>
            <span class="rm">${x.t.zeit ? esc(x.t.zeit) + ' Uhr' : 'ganztägig'}${x.t.ort ? ' · ' + esc(x.t.ort) : ''}</span></span>
        </button>`).join('')}</div>`;
    })()}
    <div style="height:26px"></div>`;

  const springen = (n) => {
    const dd = kDatum(kMonat); dd.setMonth(dd.getMonth() + n);
    kMonat = kIso(new Date(dd.getFullYear(), dd.getMonth(), 1));
    kViewMalen();
  };
  $('[data-vor]', v).onclick = () => springen(-1);
  $('[data-zurueck2]', v).onclick = () => springen(1);
  $('[data-neuertermin]', v).onclick = () => kTerminBearbeiten(null, erster);
  $$('[data-tag]', v).forEach(b => b.onclick = () => kTagBlatt(b.dataset.tag));
  kMonatZiehen($('[data-rahmen]', v), $('[data-gitter]', v), springen);
}

/* Das Blatt folgt dem Finger, genau wie die Karten beim Stöbern: 1:1, kurze
   Schwelle, Schwung zählt auch. */
function kMonatZiehen(rahmen, gitter, springen) {
  if (!rahmen || !gitter) return;
  let x0 = null, y0 = 0, zieht = false, ab = 0, weiter = 0;
  let letztX = 0, letztT = 0, tempo = 0;
  const schwelle = () => Math.max(80, (rahmen.clientWidth || 320) * 0.26);

  const setzen = (dx) => {
    gitter.style.transition = 'none';
    gitter.style.transform = 'translateX(' + dx.toFixed(1) + 'px)';
    gitter.style.opacity = String(clamp(1 - Math.abs(dx) / (rahmen.clientWidth || 320) * 0.7, 0.25, 1));
  };
  const loesen = (fertig) => {
    gitter.style.transition = 'transform .24s cubic-bezier(.2,.8,.3,1),opacity .2s ease';
    if (fertig) {
      const b = rahmen.clientWidth || 320;
      gitter.style.transform = 'translateX(' + (weiter < 0 ? b : -b) + 'px)';
      gitter.style.opacity = '0';
      setTimeout(() => springen(weiter), 200);
    } else {
      gitter.style.transform = 'translateX(0)';
      gitter.style.opacity = '1';
    }
    setTimeout(() => { window.__zieht = false; }, 240);
  };

  rahmen.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || window.__zieht) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    zieht = false; weiter = 0;
    letztX = x0; letztT = Date.now(); tempo = 0;
  }, { passive: true });

  rahmen.addEventListener('touchmove', e => {
    if (x0 == null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (!zieht) {
      if (dy > 16 && dy > Math.abs(dx)) { x0 = null; return; }
      if (Math.abs(dx) < 12) return;
      zieht = true; ab = dx; window.__zieht = true;
    }
    e.preventDefault();
    const jetzt = Date.now();
    if (jetzt > letztT) { tempo = (t.clientX - letztX) / (jetzt - letztT); letztX = t.clientX; letztT = jetzt; }
    const x = dx - ab;
    weiter = (x < 0 || tempo < -0.45) ? 1 : -1;
    setzen(x);
  }, { passive: false });

  const los = () => {
    if (x0 == null) return;
    const zog = zieht;
    const dx = letztX - x0 - ab;
    x0 = null; zieht = false;
    if (!zog) return;
    loesen(Math.abs(dx) > schwelle() || Math.abs(tempo) > 0.45);
  };
  rahmen.addEventListener('touchend', los, { passive: true });
  rahmen.addEventListener('touchcancel', los, { passive: true });
}

/* Ein Tag in ganzer Länge, als Blatt von unten. */
function kTagBlatt(iso) {
  const malen = () => {
    const t = kTermineAm(iso), f = kFaelligAm(iso);
    const nahe = kNaheText(iso);
    const s = blatt(nahe ? nahe : kTagText(iso, true), `
      ${nahe ? `<p class="muted" style="font-size:12.5px;margin:-6px 0 12px">${esc(kTagText(iso, true))}</p>` : ''}
      ${t.length ? `<div class="list-card" style="margin-bottom:12px">${t.map(x => kTerminZeile(x, iso)).join('')}</div>`
        : `<p class="hinweis" style="padding:0 0 12px">Keine Termine an diesem Tag.</p>`}
      ${f.length ? `<div class="section-head" style="padding:0;margin:0 0 8px"><h2>Zu tun</h2></div>
        <div class="list-card" style="margin-bottom:12px">${f.map(x => `
          <div class="rowline">
            <button class="status-btn" data-fertig="${x.tag.id}" aria-label="Erledigt">${ICON.check}</button>
            <span class="grow"><span class="rn">${esc(x.thema.text)}</span>
              <span class="rm">${x.taetigkeiten.length
        ? x.taetigkeiten.map(t => esc(t.text)).join(' · ')
        : (x.tag.notiz ? esc(x.tag.notiz) : 'ohne Tätigkeit')}</span></span>
          </div>`).join('')}</div>` : ''}
      <button class="btn btn-primary btn-block" data-neu>${ICON.plus} Termin an diesem Tag</button>`, { fokus: false });

    $('[data-neu]', s).onclick = () => kTerminBearbeiten(null, iso, true);
    $$('[data-termin]', s).forEach(b => b.onclick = () =>
      kTerminBearbeiten(KDB.termine.find(x => x.id === b.dataset.termin), iso, true));
    $$('[data-fertig]', s).forEach(b => b.onclick = () => { kAbhaken(b.dataset.fertig); layerSchliessen(); kViewMalen(); malen(); });
  };
  malen();
}

/* Termin anlegen oder ändern. */
function kTerminBearbeiten(t, vorgabe, ersetzen) {
  const neu = !t;
  const w = t || { id: uid(), titel: '', datum: vorgabe || heute(), zeit: null, dauer: null, ort: '', notiz: '', farbe: KFARBEN[0], wdh: 'keine' };
  const s = blatt(neu ? 'Neuer Termin' : 'Termin', `
    <div class="field"><label>Was</label>
      <input type="text" data-titel value="${esc(w.titel)}" placeholder="z.B. Zahnarzt"></div>
    <div class="row2">
      <div class="field"><label>Tag</label><input type="date" data-datum value="${esc(w.datum)}"></div>
      <div class="field"><label>Uhrzeit</label><input type="time" data-zeit value="${w.zeit ? esc(w.zeit) : ''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Dauer in Minuten</label><input type="number" data-dauer value="${w.dauer || ''}" placeholder="60"></div>
      <div class="field"><label>Ort</label><input type="text" data-ort value="${esc(w.ort)}" placeholder="optional"></div>
    </div>
    <div class="field"><label>Wiederholung</label>
      <select data-wdh>${Object.keys(KWDH).map(k => `<option value="${k}"${k === w.wdh ? ' selected' : ''}>${KWDH[k]}</option>`).join('')}</select></div>
    <div class="field"><label>Farbe</label>
      <div class="kfarben">${KFARBEN.map(f => `<button class="kfarbe${f === w.farbe ? ' an' : ''}" data-farbe="${f}" style="background:var(--${f})" aria-label="${f}"></button>`).join('')}</div></div>
    <div class="field"><label>Notiz</label><textarea data-notiz rows="2" placeholder="optional">${esc(w.notiz)}</textarea></div>
    <div class="btn-row">
      <button class="btn btn-primary" data-ok style="flex:1">Sichern</button>
      ${neu ? '' : '<button class="btn btn-danger" data-del>Löschen</button>'}
    </div>`, { ersetzen: !!ersetzen });

  let farbe = w.farbe;
  $$('[data-farbe]', s).forEach(b => b.onclick = () => {
    farbe = b.dataset.farbe;
    $$('[data-farbe]', s).forEach(x => x.classList.toggle('an', x.dataset.farbe === farbe));
  });
  $('[data-ok]', s).onclick = () => {
    const titel = $('[data-titel]', s).value.trim();
    if (!titel) { toast('Ohne Titel geht es nicht.'); return; }
    const zeit = $('[data-zeit]', s).value;
    kAendern(() => {
      w.titel = titel;
      w.datum = $('[data-datum]', s).value || heute();
      w.zeit = /^\d{2}:\d{2}$/.test(zeit) ? zeit : null;
      w.dauer = num($('[data-dauer]', s).value);
      w.ort = $('[data-ort]', s).value.trim();
      w.notiz = $('[data-notiz]', s).value.trim();
      w.wdh = $('[data-wdh]', s).value;
      w.farbe = farbe;
      if (neu) KDB.termine.push(w);
    });
    KStore.sichern(true);
    layerSchliessen();
    kViewMalen();
    toast(neu ? 'Termin angelegt.' : 'Gesichert.');
  };
  const del = $('[data-del]', s);
  if (del) del.onclick = async () => {
    if (!await bestaetigen('Termin löschen?', esc(w.titel) + ' wird entfernt.', 'Löschen', true)) return;
    kAendern(() => { KDB.termine = KDB.termine.filter(x => x.id !== w.id); });
    KStore.sichern(true);
    layerSchliessen();
    kViewMalen();
  };
}

/* ---------- To-Do: Vorhaben → Schritt → Handgriff ----------
   Der Aufbau stammt aus der mitgebrachten Vorlage: eine Hauptaufgabe, darunter
   quer die Teilaufgaben, in jeder davon die einzelnen Handgriffe. Abgehakt
   wird von unten nach oben – ist alles darunter erledigt, gilt auch das
   Darüberliegende als erledigt. */
let kNurOffen = false;
let kZuletztVorhaben = null;

function kTodoMalen(v) {
  const alle = KDB.aufgaben;
  const liste = kNurOffen ? alle.filter(x => !x.done) : alle;
  v.innerHTML = `
    <div class="kneu">
      <input type="text" data-neu placeholder="Neues Thema …">
      <button class="btn btn-primary" data-add>${ICON.plus}</button>
    </div>
    <div class="chiprow" style="margin-bottom:4px">
      <button class="chip" data-filter="alle" aria-pressed="${!kNurOffen}">Alle</button>
      <button class="chip" data-filter="offen" aria-pressed="${kNurOffen}">Offen</button>
      ${alle.length ? `<span class="kzahl num">${alle.filter(x => x.done).length} / ${alle.length} erledigt</span>` : ''}
    </div>
    ${liste.length ? liste.map(vh => kThemaHtml(vh)).join('')
      : `<div class="empty" style="margin-top:26px"><strong>${alle.length ? 'Nichts Offenes mehr' : 'Noch keine Themen'}</strong>
          ${alle.length ? 'Alles abgehakt. Schalte oben auf „Alle“, um das Erledigte zu sehen.'
        : 'Ein Thema oben anlegen, darunter die Tage, an jedem Tag die einzelnen Tätigkeiten.'}</div>`}
    <div style="height:26px"></div>`;

  const eingabe = $('[data-neu]', v);
  const anlegen = () => {
    const text = eingabe.value.trim();
    if (!text) return;
    kAendern(() => KDB.aufgaben.push({ id: uid(), text, done: false, tage: [] }));
    eingabe.value = '';
    kViewMalen();
  };
  $('[data-add]', v).onclick = anlegen;
  eingabe.addEventListener('keydown', e => { if (e.key === 'Enter') anlegen(); });
  $$('[data-filter]', v).forEach(b => b.onclick = () => { kNurOffen = b.dataset.filter === 'offen'; kViewMalen(); });
  kTodoBinden(v);
  if (kZuletztVorhaben) {
    const el = $('[data-vh="' + kZuletztVorhaben + '"]', v);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    kZuletztVorhaben = null;
  }
}

function kZuThema(id) { kZuletztVorhaben = id; kViewMalen(); }

function kThemaHtml(vh) {
  const fs = kFortschritt(vh);
  const prozent = Math.round(fs.fertig / fs.ganz * 100);
  return `
  <div class="kfluss" data-vh="${vh.id}" data-sortthema="${vh.id}">
    <div class="kv-kopf${vh.done ? ' fertig' : ''}" data-griff-thema="${vh.id}">
      <button class="status-btn${vh.done ? ' an' : ''}" data-vhcheck="${vh.id}" aria-label="Erledigt">${vh.done ? ICON.check : ''}</button>
      <span class="grow">
        <span class="kv-titel serif">${esc(vh.text)}</span>
        <span class="kv-meta">${pl(vh.tage.length, 'Tag', 'Tage')} · ${fs.fertig} / ${fs.ganz}</span>
      </span>
      <span class="kfort"><i style="width:${prozent}%"></i></span>
      <span class="kctrl">
        <button class="icon-btn" data-vhedit="${vh.id}" aria-label="Ändern">${ICON.edit}</button>
        <button class="icon-btn" data-vhdel="${vh.id}" aria-label="Löschen">${ICON.trash}</button>
      </span>
    </div>
    <div class="kpfeil" aria-hidden="true"></div>
    <div class="kbahn" data-bahn="${vh.id}">
      ${vh.tage.map((t, i) => `
        ${i ? '<div class="kverbinder" aria-hidden="true"></div>' : ''}
        <div class="kspalte" data-sorttag="${t.id}">
          <div class="kt-kasten${t.done ? ' fertig' : ''}">
            <div class="kt-kopf" data-griff-tag="${t.id}">
              <button class="status-btn klein${t.done ? ' an' : ''}" data-tcheck="${t.id}" aria-label="Erledigt">${t.done ? ICON.check : ''}</button>
              <span class="kt-marke">${t.datum ? esc(kTagKurz(t.datum)) : 'Ohne Datum'}</span>
              <button class="icon-btn" data-tedit="${t.id}" aria-label="Tag ändern">${ICON.edit}</button>
              <button class="icon-btn" data-tdel="${t.id}" aria-label="Löschen">${ICON.trash}</button>
            </div>
            ${t.datum ? `<div class="kt-text">${esc(kTagText(t.datum))}</div>` : ''}
            ${t.notiz ? `<div class="kt-notiz">${esc(t.notiz)}</div>` : ''}
            ${t.taetigkeiten.length ? `<div class="kt-liste" data-liste="${t.id}">${t.taetigkeiten.map(x => `
              <div class="kh${x.done ? ' fertig' : ''}" data-sorttat="${x.id}" data-griff-tat="${x.id}">
                <button class="status-btn winzig${x.done ? ' an' : ''}" data-scheck="${x.id}" aria-label="Erledigt">${x.done ? ICON.check : ''}</button>
                <span class="kh-text">${esc(x.text)}</span>
                <button class="icon-btn" data-sdel="${x.id}" aria-label="Löschen">${ICON.x}</button>
              </div>`).join('')}</div>` : ''}
            <div class="kzeile">
              <input type="text" data-sneu="${t.id}" placeholder="Tätigkeit …">
              <button class="btn btn-sm" data-sadd="${t.id}">${ICON.plus}</button>
            </div>
          </div>
        </div>`).join('')}
      ${vh.tage.length ? '<div class="kverbinder" aria-hidden="true"></div>' : ''}
      <div class="kspalte anfuegen">
        <div class="kzeile">
          <input type="date" data-tneu="${vh.id}" value="${esc(heute())}" aria-label="Tag">
          <button class="btn btn-sm" data-tadd="${vh.id}">${ICON.plus}</button>
        </div>
        <p class="hinweis" style="padding:6px 0 0;font-size:10px">Tag anlegen</p>
      </div>
    </div>
  </div>`;
}

/* Kurzform für die Marke über dem Tag: „Fr · 4.9.“ */
function kTagKurz(iso) {
  const d = kDatum(iso);
  const h = heute();
  const nahe = kNaheText(iso);
  if (nahe) return nahe;
  return KTAGE[kWochentag(iso)] + ' · ' + d.getDate() + '.' + (d.getMonth() + 1) + '.'
    + (d.getFullYear() !== kDatum(h).getFullYear() ? d.getFullYear() : '');
}

function kTodoBinden(v) {
  const finde = id => {
    for (const vh of KDB.aufgaben) {
      if (vh.id === id) return { vh };
      for (const t of vh.tage) {
        if (t.id === id) return { vh, t };
        for (const x of t.taetigkeiten) if (x.id === id) return { vh, t, x };
      }
    }
    return null;
  };
  const neuMalen = () => kViewMalen();

  $$('[data-vhcheck]', v).forEach(b => b.onclick = () => { if (!b._langGedrueckt) { kAbhaken(b.dataset.vhcheck); neuMalen(); } });
  $$('[data-tcheck]', v).forEach(b => b.onclick = () => { if (!b._langGedrueckt) { kAbhaken(b.dataset.tcheck); neuMalen(); } });
  $$('[data-scheck]', v).forEach(b => b.onclick = () => { if (!b._langGedrueckt) { kAbhaken(b.dataset.scheck); neuMalen(); } });

  $$('[data-vhdel]', v).forEach(b => b.onclick = async () => {
    const f = finde(b.dataset.vhdel);
    if (!f) return;
    if (!await bestaetigen('Thema löschen?', esc(f.vh.text) + ' samt allen Tagen darunter.', 'Löschen', true)) return;
    kAendern(() => { KDB.aufgaben = KDB.aufgaben.filter(x => x.id !== f.vh.id); });
    neuMalen();
  });
  $$('[data-tdel]', v).forEach(b => b.onclick = () => {
    const f = finde(b.dataset.tdel);
    if (!f) return;
    kAendern(() => { f.vh.tage = f.vh.tage.filter(x => x.id !== f.t.id); kElternPruefen(f.vh); });
    neuMalen();
  });
  $$('[data-sdel]', v).forEach(b => b.onclick = () => {
    const f = finde(b.dataset.sdel);
    if (!f) return;
    kAendern(() => { f.t.taetigkeiten = f.t.taetigkeiten.filter(x => x.id !== f.x.id); kElternPruefen(f.vh); });
    neuMalen();
  });

  $$('[data-vhedit]', v).forEach(b => b.onclick = () => {
    const f = finde(b.dataset.vhedit);
    if (f) kThemaBearbeiten(f.vh);
  });
  $$('[data-tedit]', v).forEach(b => b.onclick = () => {
    const f = finde(b.dataset.tedit);
    if (f) kTagBearbeiten(f.vh, f.t);
  });

  const tagAnlegen = (vhId, feld) => {
    if (!feld) return;
    const datum = feld.value;
    const vh = KDB.aufgaben.find(x => x.id === vhId);
    if (!vh) return;
    if (vh.tage.some(t => t.datum === datum)) { toast('Diesen Tag gibt es hier schon.'); return; }
    kAendern(() => {
      kTagEinfuegen(vh, { id: uid(), datum: /^\d{4}-\d{2}-\d{2}$/.test(datum) ? datum : null, notiz: '', done: false, taetigkeiten: [] });
      kElternPruefen(vh);
    });
    neuMalen();
  };
  const tatAnlegen = (tId, feld) => {
    if (!feld) return;
    const text = feld.value.trim();
    if (!text) return;
    const f = finde(tId);
    if (!f) return;
    kAendern(() => { f.t.taetigkeiten.push({ id: uid(), text, done: false }); kElternPruefen(f.vh); });
    neuMalen();
  };
  $$('[data-tadd]', v).forEach(b => b.onclick = () => tagAnlegen(b.dataset.tadd, $('[data-tneu="' + b.dataset.tadd + '"]', v)));
  $$('[data-sadd]', v).forEach(b => b.onclick = () => tatAnlegen(b.dataset.sadd, $('[data-sneu="' + b.dataset.sadd + '"]', v)));
  $$('[data-sneu]', v).forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') tatAnlegen(el.dataset.sneu, el);
  }));

  /* Langes Drücken hebt an – Themen untereinander, Tage nebeneinander,
     Tätigkeiten innerhalb ihres Tages. */
  $$('[data-sortthema]', v).forEach(node => {
    node._sortId = node.dataset.sortthema;
    const griff = $('[data-griff-thema]', node);
    if (griff) ziehenZumSortieren(node, griff, {
      auswahl: '[data-sortthema]',
      neuMalen: kViewMalen,
      fertig: reihe => kAendern(() => { KDB.aufgaben = reihe.map(id => KDB.aufgaben.find(x => x.id === id)).filter(Boolean); })
    });
  });
  $$('[data-sorttag]', v).forEach(node => {
    node._sortId = node.dataset.sorttag;
    const griff = $('[data-griff-tag]', node);
    const f = finde(node.dataset.sorttag);
    if (griff && f) ziehenZumSortieren(node, griff, {
      auswahl: '[data-sorttag]', waagerecht: true,
      neuMalen: kViewMalen,
      fertig: reihe => kAendern(() => { f.vh.tage = reihe.map(id => f.vh.tage.find(x => x.id === id)).filter(Boolean); })
    });
  });
  $$('[data-sorttat]', v).forEach(node => {
    node._sortId = node.dataset.sorttat;
    const f = finde(node.dataset.sorttat);
    if (f) ziehenZumSortieren(node, node, {
      auswahl: '[data-sorttat]',
      neuMalen: kViewMalen,
      fertig: reihe => kAendern(() => { f.t.taetigkeiten = reihe.map(id => f.t.taetigkeiten.find(x => x.id === id)).filter(Boolean); })
    });
  });
}

function kThemaBearbeiten(vh) {
  const s = blatt('Thema', `
    <div class="field"><label>Name</label><input type="text" data-t value="${esc(vh.text)}"></div>
    <button class="btn btn-primary btn-block" data-ok>Sichern</button>`);
  $('[data-ok]', s).onclick = () => {
    const text = $('[data-t]', s).value.trim();

/* ============================================================
   fastreader – die dritte App
   Wort für Wort an einem festen Punkt: das Auge bleibt stehen,
   der Text läuft. Bibliothek · Lesen · Bilanz · Mehr
   ============================================================ */

let FDB = leereFr();

function leereFr() {
  return {
    format: 'mylife-fastreader',
    version: 1,
    erstellt: Date.now(),
    geaendert: Date.now(),
    einstellungen: {
      autosaveSek: 60,
      tempo: 350,        // Wörter je Minute
      groesse: 30,       // Schriftgrad der Wortanzeige
      aufwaermen: true,  // die ersten Wörter langsamer
      pausen: true,      // an Satzzeichen länger stehen bleiben
      kontext: true      // beim Anhalten den Satz zeigen
    },
    /* Jeder Text mit seiner Stelle – der Text liegt mit in dieser Datenbasis,
       damit die Sicherung vollständig ist. */
    dokumente: [],
    bilanz: { worte: 0, ms: 0, proben: [] }
  };
}

function frNormalisiere(roh) {
  const d = (roh && typeof roh === 'object') ? roh : {};
  const f = leereFr();
  f.erstellt = +d.erstellt || Date.now();
  f.einstellungen = Object.assign(f.einstellungen, d.einstellungen || {});
  f.einstellungen.tempo = clamp(+f.einstellungen.tempo || 350, 100, 1000);
  f.einstellungen.groesse = clamp(+f.einstellungen.groesse || 30, 14, 72);
  f.dokumente = (Array.isArray(d.dokumente) ? d.dokumente : []).map(x => ({
    id: x.id || uid(),
    name: String(x.name || 'Ohne Titel').trim().slice(0, 160),
    text: String(x.text || ''),
    wort: Math.max(0, +x.wort || 0),
    worte: Math.max(0, +x.worte || 0),
    quelle: String(x.quelle || ''),
    zuletzt: +x.zuletzt || Date.now()
  })).filter(x => x.text);
  const b = d.bilanz || {};
  f.bilanz = {
    worte: Math.max(0, +b.worte || 0),
    ms: Math.max(0, +b.ms || 0),
    proben: (Array.isArray(b.proben) ? b.proben : []).map(n => +n || 0).filter(n => n > 0).slice(-200)
  };
  return f;
}

const FStore = macheSpeicher({
  id: 'fastreader', metaKey: 'meta-fastreader', datenKey: 'daten-fastreader', dateiname: 'fastreader.json',
  daten: () => FDB, setzen: d => { FDB = d; }
});

function fAendern(fn) { if (fn) fn(); FStore.aendern(); }

const FICON = {

  kurve: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 8.5 11l3.5 3.5L21 6"/><path d="M3 21h18"/></svg>',

/* ---------- Text aufbereiten ---------- */
/* Zeilenumbrüche aus Dateien sind Layout, keine Absätze: getrennte Wörter
   werden zusammengefügt, Kopf- und Fusszeilen fliegen raus. */
function frSaeubern(roh) {
  let zeilen = String(roh).split('\n').map(z => z.replace(/­/g, '').replace(/\s+/g, ' ').trim());
  zeilen = zeilen.filter(z => !/^([ivxlcdm]{1,7}|\d{1,4}|[-–—•·|]+)$/i.test(z));
  const gesehen = {};
  zeilen.forEach(z => { if (z.length > 3 && z.length < 70) gesehen[z] = (gesehen[z] || 0) + 1; });
  const laeufer = new Set(Object.keys(gesehen).filter(k => gesehen[k] >= 4));
  zeilen = zeilen.filter(z => !laeufer.has(z));
  const laengen = zeilen.filter(Boolean).map(z => z.length).sort((a, b) => a - b);
  const mitte = laengen.length ? laengen[Math.floor(laengen.length / 2)] : 64;
  let aus = '';
  for (let i = 0; i < zeilen.length; i++) {
    const z = zeilen[i];
    if (!z) { if (!/\n\n$/.test(aus)) aus += '\n\n'; continue; }
    const naechste = zeilen[i + 1] || '';
    if (/[-‐‑]$/.test(z) && /^[a-zäöüßàéèç]/.test(naechste)) { aus += z.slice(0, -1); continue; }
    aus += z;
    const schluss = /[.!?…»"'”)]$/.test(z);
    if ((schluss && z.length < mitte * 0.82) || !naechste.trim()) aus += '\n\n'; else aus += ' ';
  }
  return aus.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

/* Abkürzungen, die kein Satzende sind. */
const F_ABK = new Set(['dr.', 'prof.', 'nr.', 'bzw.', 'usw.', 'etc.', 'vgl.', 'ca.', 'z.b.', 'u.a.',
  'd.h.', 'ggf.', 'abb.', 's.', 'vs.', 'mr.', 'mrs.', 'st.', 'ff.', 'inkl.', 'evtl.', 'jh.', 'bd.']);
function frSatzende(w) {
  if (!/[.!?…][»"'”)\]]?$/.test(w)) return false;
  return !F_ABK.has(w.toLowerCase());
}
function frZerlegen(text) {
  const marken = [];
  const absaetze = String(text).split(/\n{2,}/);
  absaetze.forEach((p, pi) => {
    const ws = p.split(/\s+/).filter(Boolean);
    ws.forEach((w, i) => {
      marken.push({
        w,
        absatz: i === ws.length - 1 && pi < absaetze.length - 1,
        satz: frSatzende(w),
        weich: /[,;:—–)]$/.test(w)
      });
    });
  });
  return marken;
}

/* Der Blickpunkt im Wort: nicht die Mitte, sondern etwas davor. */
function frFixpunkt(w) {
  const stellen = [];
  for (let j = 0; j < w.length; j++) if (/[\p{L}\p{N}]/u.test(w[j])) stellen.push(j);
  if (!stellen.length) return 0;
  const n = stellen.length;
  const i = n <= 1 ? 0 : n <= 5 ? 1 : n <= 9 ? 2 : n <= 13 ? 3 : 4;
  return stellen[Math.min(i, n - 1)];
}

/* Wie lange ein Wort stehen bleibt – lange Wörter länger, Satzzeichen halten auf. */
function frFaktor(t, pausen) {
  const len = t.w.replace(/[^\p{L}\p{N}]/gu, '').length;
  let m = 1;
  if (len > 7) m += (len - 7) * 0.055;
  if (len <= 2) m *= 0.9;
  if (pausen) {
    if (t.weich) m *= 1.5;
    if (t.satz) m *= 2.1;
    if (t.absatz) m *= 2.7;
  }
  return m;
}

/* ---------- Öffnen ---------- */
async function fastreaderOeffnen() {
  aktiverSpeicher = FStore;
  let meta = null;
  try { meta = await FStore.metaLesen(); } catch (e) { console.warn(e); }

  if (meta && meta.modus === 'datei' && meta.handle) {
    FStore.modus = 'datei'; FStore.handle = meta.handle; FStore.dateiname = meta.dateiname || 'fastreader.json';
    if (await FStore.rechtePruefen(meta.handle, false)) {
      try { FDB = frNormalisiere(await FStore.ladeDaten()); frStarten(); return; }
      catch (e) { console.error(e); }
    }
    frSpeicherort(true);
    return;
  }
  if (meta && meta.modus === 'geraet') {
    FStore.modus = 'geraet';
    FDB = frNormalisiere(await IDB.get('daten-fastreader'));
    frStarten();
    return;
  }
  frSpeicherort(false);
}

function frSpeicherort(erneut) {
  const s = $('#setup');
  const dateiDa = FStore.dateiApiDa();
  s.innerHTML = `

      : `<p class="lead">Wo sollen deine Texte und Lesezeichen liegen? Der fastreader führt eine eigene Datei – die anderen Apps bleiben davon unberührt.</p>`}
      ${dateiDa ? `
        <button class="opt" data-fact="datei-neu">
          <span class="on">${ICON.save} Neue Datei anlegen <span class="badge">empfohlen</span></span>

      </button>
      <div style="margin-top:10px"><button class="btn btn-block btn-ghost" data-fact="zurueck">Zurück zur Startseite</button></div>
    </div>`;
  s.hidden = false;
  $$('.appflaeche').forEach(x => { x.hidden = true; });

  s.onclick = async (e) => {
    const b = e.target.closest('[data-fact]');
    if (!b || b.disabled) return;
    const act = b.dataset.fact;
    if (act === 'zurueck') { splashZeigen(); return; }
    b.disabled = true;
    try {
      if (act === 'datei-neu' || act === 'datei-oeffnen') {
        let handle = null;
        if (act === 'datei-neu') {
          handle = await window.showSaveFilePicker({
            suggestedName: 'fastreader.json',
            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
          });
        } else {
          const [h] = await window.showOpenFilePicker({
            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
          });
          handle = h;
        }
        if (!handle) { b.disabled = false; return; }
        FStore.modus = 'datei'; FStore.handle = handle; FStore.dateiname = handle.name || 'fastreader.json';
        if (act === 'datei-oeffnen') {
          try { FDB = frNormalisiere(await FStore.ladeDaten()); } catch (err) { FDB = leereFr(); }
        } else { FDB = leereFr(); }
        await FStore.metaSchreiben();
        await FStore.sichern(true);
        frStarten();
        return;
      }
      if (act === 'geraet') {
        FStore.modus = 'geraet'; FStore.handle = null;
        await FStore.metaSchreiben();
        FDB = frNormalisiere(await IDB.get('daten-fastreader'));
        await FStore.sichern(true);
        frStarten();
        return;
      }
    } catch (err) {
      console.warn(err);
      if (err && err.name === 'AbortError') { b.disabled = false; return; }
      if (err && err.name === 'SecurityError') { FStore.dateiGesperrt = true; frSpeicherort(false); return; }
      toast('Das hat nicht geklappt.', 3500);
      b.disabled = false;
    }
  };
}
