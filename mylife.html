    ${liste.length ? `<div class="list-card">${liste.map(d => {
      const pct = d.worte ? Math.round(d.wort / d.worte * 100) : 0;
      return `<div class="rowline frzeile">
        <button class="grow" data-oeffne="${d.id}" style="text-align:left">
          <span class="rn">${esc(d.name)}</span>
          <span class="rm">${fmtZahl(d.worte)} Wörter · Wort ${fmtZahl(d.wort)}${d.quelle ? ' · ' + esc(d.quelle) : ''}</span>
          <span class="frbalken"><i style="width:${pct}%"></i></span>
        </button>
        <span class="frpct num">${pct}<small>%</small></span>
        <button class="icon-btn" data-loesch="${d.id}" aria-label="Entfernen">${ICON.trash}</button>
      </div>`;
    }).join('')}</div>`
      : `<div class="empty" style="margin:0"><strong>Noch nichts hier</strong>
          Lade oben einen Text. Er bleibt danach liegen – samt der Stelle, an der du aufgehört hast.</div>`}
    <div style="height:26px"></div>`;

  const datei = $('[data-file]', v);
  $('[data-datei]', v).onclick = () => datei.click();
  datei.onchange = async () => { const f = datei.files[0]; datei.value = ''; if (f) await frDateiLesen(f); };
  $('[data-einfuegen]', v).onclick = () => frEinfuegenBlatt();
  $('[data-adresse]', v).onclick = () => frAdresseBlatt();
  $$('[data-oeffne]', v).forEach(b => b.onclick = () => {
    frDokLaden(FDB.dokumente.find(x => x.id === b.dataset.oeffne));
    fTabWechseln('lesen');
  });
  $$('[data-loesch]', v).forEach(b => b.onclick = async () => {
    const d = FDB.dokumente.find(x => x.id === b.dataset.loesch);
    if (!d) return;
    if (!await bestaetigen('Text entfernen?', esc(d.name) + ' verschwindet samt Lesezeichen.', 'Entfernen', true)) return;
    fAendern(() => { FDB.dokumente = FDB.dokumente.filter(x => x.id !== d.id); });
    if (FS.doc && FS.doc.id === d.id) { frAnhalten(); FS.doc = null; FS.marken = []; FS.i = 0; }
    FStore.sichern(true);
    fViewMalen();
  });
}

/* ---------- Text hereinholen ---------- */
async function frDateiLesen(f) {
  const name = f.name.replace(/\.[^.]+$/, '');
  const endung = (f.name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
  const warten = frWarten('Text wird gelesen');
  try {
    let text;
    if (endung === 'docx') text = await frDocx(f);
    else if (endung === 'pdf') text = await frPdf(f, p => warten.stand(p));
    else text = frSaeubern(await f.text());
    warten.weg();
    if (!text || text.split(/\s+/).length < 10) {
      toast('In dieser Datei steckt kein lesbarer Text.', 4200);
      return;
    }
    frAnlegen(name, text, endung.toUpperCase());
  } catch (e) {
    warten.weg();
    console.warn(e);
    toast(e && e.message ? e.message : 'Die Datei liess sich nicht lesen.', 5000);
  }
}

/* DOCX ist ein ZIP – auspacken kann der Browser selbst. */
async function frDocx(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  const sicht = new DataView(buf.buffer);
  /* Das zentrale Verzeichnis steht am Ende; von dort führt der Weg zu den Teilen. */
  let ende = -1;
  for (let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--) {
    if (sicht.getUint32(i, true) === 0x06054b50) { ende = i; break; }
  }
  if (ende < 0) throw new Error('Das ist keine gültige DOCX-Datei.');
  let zeiger = sicht.getUint32(ende + 16, true);
  const anzahl = sicht.getUint16(ende + 10, true);
  let roh = null;
  for (let n = 0; n < anzahl; n++) {
    if (sicht.getUint32(zeiger, true) !== 0x02014b50) break;
    const art = sicht.getUint16(zeiger + 10, true);
    const gepackt = sicht.getUint32(zeiger + 20, true);
    const nLen = sicht.getUint16(zeiger + 28, true);
    const eLen = sicht.getUint16(zeiger + 30, true);
    const kLen = sicht.getUint16(zeiger + 32, true);
    const start = sicht.getUint32(zeiger + 42, true);
    const name = new TextDecoder().decode(buf.subarray(zeiger + 46, zeiger + 46 + nLen));
    if (name === 'word/document.xml') {
      const lokalN = sicht.getUint16(start + 26, true);
      const lokalE = sicht.getUint16(start + 28, true);
      const von = start + 30 + lokalN + lokalE;
      const teil = buf.subarray(von, von + gepackt);
      roh = art === 0 ? teil : await frAuspacken(teil);
      break;
    }
    zeiger += 46 + nLen + eLen + kLen;
  }
  if (!roh) throw new Error('In der DOCX-Datei fehlt der Textteil.');
  const xml = new TextDecoder().decode(roh);
  const absaetze = xml.split(/<\/w:p>/).map(p => {
    const stuecke = [...p.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(m => m[1]);
    return stuecke.join('')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/\s+/g, ' ').trim();
  }).filter(Boolean);
  if (!absaetze.length) throw new Error('In der DOCX-Datei steht kein Text.');
  return absaetze.join('\n\n');
}
async function frAuspacken(teil) {
  if (typeof DecompressionStream !== 'function') throw new Error('Dieser Browser kann DOCX nicht auspacken – bitte den Text einfügen.');
  const strom = new Blob([teil]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(strom).arrayBuffer());
}

/* PDF braucht eine fremde Bibliothek – die wird erst geholt, wenn wirklich
   ein PDF kommt, und nur, wenn diese Umgebung nach draussen darf. */
let frPdfLib = null;
async function frPdfBibliothek() {
  if (frPdfLib) return frPdfLib;
  if (typeof window.pdfjsLib !== 'undefined') { frPdfLib = window.pdfjsLib; return frPdfLib; }
  await new Promise((res, rej) => {
    const sk = document.createElement('script');
    sk.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sk.onload = res;
    sk.onerror = () => rej(new Error('Die PDF-Bibliothek liess sich nicht laden. Ohne Verbindung geht PDF nicht – kopiere den Text und füge ihn ein.'));
    document.head.appendChild(sk);
    setTimeout(() => rej(new Error('Die PDF-Bibliothek antwortet nicht. Kopiere den Text und füge ihn ein.')), 15000);
  });
  if (typeof window.pdfjsLib === 'undefined') throw new Error('Die PDF-Bibliothek liess sich nicht laden.');
  frPdfLib = window.pdfjsLib;
  frPdfLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return frPdfLib;
}
async function frPdf(f, melden) {
  const lib = await frPdfBibliothek();
  const pdf = await lib.getDocument({ data: await f.arrayBuffer() }).promise;
  const seiten = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const zeilen = new Map();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const key = Math.round(it.transform[5] / 3);
      if (!zeilen.has(key)) zeilen.set(key, []);
      zeilen.get(key).push({ x: it.transform[4], s: it.str, w: it.width || 0 });
    }
    seiten.push([...zeilen.entries()].sort((a, b) => b[0] - a[0]).map(([, items]) => {
      items.sort((a, b) => a.x - b.x);
      let s = '', ende = null;
      for (const it of items) {
        if (ende !== null && it.x - ende > 1.4) s += ' ';
        s += it.s; ende = it.x + it.w;
      }
      return s;
    }).join('\n'));
    melden(Math.round(p / pdf.numPages * 100));
    if (p % 12 === 0) await new Promise(r => setTimeout(r));
  }
  return frSaeubern(seiten.join('\n\n'));
}

function frWarten(titel) {
  const s = blatt(titel, `<p class="muted" style="font-size:13px;margin-bottom:8px" data-stand>einen Augenblick …</p>
    <div class="barwrap"><i class="bar-read" data-bar style="width:0%"></i></div>`, { fokus: false });
  return {
    stand: p => { const t = $('[data-stand]', s); if (t) t.textContent = p + ' %'; const b = $('[data-bar]', s); if (b) b.style.width = p + '%'; },
    weg: () => { if (s.isConnected) layerSchliessen(); }
  };
}

function frEinfuegenBlatt() {
  const s = blatt('Text einfügen', `
    <div class="field"><label>Titel</label><input type="text" data-name placeholder="z.B. Aufsatz über die Zeit"></div>
    <div class="field"><label>Text</label><textarea data-text style="min-height:160px" placeholder="Hier einfügen …"></textarea>
      <span class="hint" data-zahl></span></div>
    <button class="btn btn-primary btn-block" data-ok>Lesen</button>`, { fokus: false });

  });
  $('[data-ok]', s).onclick = () => {

}

function frAdresseBlatt() {
  const s = blatt('Von einer Adresse', `
    <div class="field"><label>Adresse</label>
      <input type="url" data-url placeholder="https://de.wikipedia.org/wiki/Lesen">
      <span class="hint">Wikipedia lädt direkt. Andere Seiten nur, wenn sie fremde Zugriffe erlauben –
      sonst hilft Kopieren und Einfügen.</span></div>
    <button class="btn btn-primary btn-block" data-ok>Holen</button>`);
  $('[data-ok]', s).onclick = async () => {
    const roh = $('[data-url]', s).value.trim();
    if (!roh) return;
    layerSchliessen();
    await frVonAdresse(roh);
  };
}

function frUrl(roh) {
  let u = roh.trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return new URL(u); } catch (e) { return null; }
}
const FR_WIKI_STOP = /^(Einzelnachweise|Literatur|Weblinks|Siehe auch|Anmerkungen|Quellen|Fußnoten|References|External links|See also|Further reading|Notes|Bibliography)$/i;

async function frVonAdresse(roh) {
  const u = frUrl(roh);
  if (!u) { toast('Das ist keine gültige Adresse.', 3500); return; }
  const warten = frWarten('Seite wird geholt');
  try {
    const m = u.hostname.match(/^([a-z-]{2,12})\.(m\.)?(wikipedia|wikisource|wikibooks)\.org$/i);
    const pfad = decodeURIComponent(u.pathname).match(/^\/wiki\/(.+)$/);
    let res;
    if (m && pfad) res = await frWiki(m[1], m[3], pfad[1].replace(/_/g, ' ').split('#')[0]);
    else res = await frSeite(u);
    warten.weg();
    if (!res.text || res.text.split(/\s+/).length < 25) {
      toast('Auf dieser Seite steckt kaum Fließtext – kopiere ihn lieber und füge ihn ein.', 5000);
      return;
    }
    frAnlegen(res.name || u.hostname, res.text, u.hostname);
  } catch (e) {
    warten.weg();
    console.warn(e);
    toast((e && e.message ? e.message : 'Die Seite war nicht erreichbar.') + ' Kopieren und Einfügen geht immer.', 5200);
  }
}
async function frHolen(url) {
  const anfrage = fetch(url).then(r => {
    if (!r.ok) throw new Error('Die Seite antwortet mit Fehler ' + r.status + '.');
    return r.text();
  });
  const uhr = new Promise((_, rej) => setTimeout(() => rej(new Error('Die Seite hat nicht geantwortet.')), 20000));
  return Promise.race([anfrage, uhr]);
}
async function frWiki(sprache, projekt, titel) {
  const q = new URLSearchParams({
    action: 'query', prop: 'extracts', explaintext: '1', exlimit: '1',
    redirects: '1', format: 'json', origin: '*', titles: titel
  });
  const r = await frHolen('https://' + sprache + '.' + projekt + '.org/w/api.php?' + q);
  const seiten = (JSON.parse(r).query || {}).pages || {};
  const seite = Object.values(seiten)[0];
  if (!seite || seite.missing !== undefined) throw new Error('Diesen Artikel gibt es dort nicht.');
  if (!seite.extract) throw new Error('Die Seite enthält keinen Fließtext.');
  const aus = [];
  for (const zeile of seite.extract.split('\n')) {
    const z = zeile.trim();
    if (!z) continue;
    const h = z.match(/^=+\s*(.+?)\s*=+$/);
    if (h) { if (FR_WIKI_STOP.test(h[1])) break; aus.push(h[1]); continue; }
    aus.push(z);
  }
  return { name: seite.title, text: aus.join('\n\n') };
}
async function frSeite(u) {
  const html = await frHolen(u.href);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript,nav,header,footer,aside,form,iframe,svg,button,figcaption,sup,[aria-hidden=true],[hidden]')
    .forEach(n => n.remove());
  const wurzel = doc.querySelector('article') || doc.querySelector('main') || doc.querySelector('[role=main]') || doc.body;
  const kandidaten = [...wurzel.querySelectorAll('h1,h2,h3,h4,p,li,blockquote,dd')];
  const menge = new Set(kandidaten);
  const teile = [];
  for (const el of kandidaten) {
    let p = el.parentElement, drin = false;
    while (p && p !== wurzel) { if (menge.has(p)) { drin = true; break; } p = p.parentElement; }
    if (drin) continue;
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (t.length > 2) teile.push(t);
  }
  const name = ((doc.querySelector('h1') || {}).textContent || doc.title || u.hostname).replace(/\s+/g, ' ').trim();
  return { name: name.slice(0, 120), text: teile.join('\n\n') };
}

function frAnlegen(name, text, quelle) {
  const marken = frZerlegen(text);
  const bekannt = FDB.dokumente.find(d => d.name === name && d.worte === marken.length);
  if (bekannt) {
    fAendern(() => { bekannt.text = text; bekannt.zuletzt = Date.now(); });
    frDokLaden(bekannt);
  } else {
    const d = { id: uid(), name: String(name).slice(0, 160), text, wort: 0, worte: marken.length, quelle: quelle || '', zuletzt: Date.now() };
    fAendern(() => FDB.dokumente.push(d));
    frDokLaden(d);
  }
  FStore.sichern(true);
  fTabWechseln('lesen');
}

/* ---------- Lesen ---------- */
function frDokLaden(d) {
  if (!d) return;
  frAnhalten();
  FS.doc = d;
  FS.marken = frZerlegen(d.text);
  FS.i = clamp(d.wort || 0, 0, Math.max(FS.marken.length - 1, 0));
  const summe = FS.marken.reduce((a, t) => a + frFaktor(t, FDB.einstellungen.pausen), 0);
  FS.norm = summe / Math.max(FS.marken.length, 1);
  FS.warmZaehler = 0;
}

function frLesenMalen(v) {
  if (!FS.doc) {
    const letzt = frLetztes();
    v.innerHTML = `<div class="empty" style="margin-top:40px"><strong>Kein Text offen</strong>
      ${letzt ? 'Weiter bei „' + esc(letzt.name) + '“ – oder wähle in der Bibliothek einen anderen.'
        : 'Lade zuerst in der Bibliothek einen Text.'}</div>
      <div style="max-width:320px;margin:16px auto 0">
        ${letzt ? '<button class="btn btn-primary btn-block" data-weiter>Weiterlesen</button>' : ''}
        <button class="btn btn-block" style="margin-top:8px" data-zurbib>Zur Bibliothek</button>
      </div>`;
    const w = $('[data-weiter]', v);
    if (w) w.onclick = () => { frDokLaden(letzt); fViewMalen(); };
    $('[data-zurbib]', v).onclick = () => fTabWechseln('bib');
    return;
  }
  const e = FDB.einstellungen;
  v.innerHTML = `
    <div class="frbuehne" data-buehne>
      <div class="frmarke" data-marke></div>
      <div class="frzeiger">
        <span class="frstrich"></span>
        <div class="frwort" data-wort style="font-size:${e.groesse}px">
          <span class="w-vor" data-vor></span><span class="w-punkt" data-punkt></span><span class="w-nach" data-nach></span>
        </div>
        <span class="frstrich unten"></span>
      </div>
      <div class="frkontext" data-kontext></div>
    </div>

    <div class="frpult">
      <div class="frbahn" data-bahn><i data-fuell></i></div>
      <div class="frreihe">
        <button class="icon-btn frspul" data-zurueck aria-label="Zehn Wörter zurück">${FICON.spulen}</button>
        <button class="frplay" data-play aria-label="Start und Pause">${FS.laeuft ? FICON.halt : FICON.start}</button>
        <button class="icon-btn frspul vor" data-vorwaerts aria-label="Zehn Wörter vor">${FICON.spulen}</button>
        <span class="frtempo">
          <span class="t-kopf"><b class="num" data-tempozahl>${e.tempo}</b><i>Wörter / Min</i>
            <span class="t-warm" data-warm>Aufwärmen</span></span>
          <input type="range" data-tempo min="100" max="1000" step="10" value="${e.tempo}" aria-label="Lesetempo">
        </span>
        <span class="frstand">
          <span class="num" data-stelle></span>
          <span class="s-k">Position</span>
        </span>
      </div>
    </div>`;

  const buehne = $('[data-buehne]', v);
  buehne.onclick = () => (FS.laeuft ? frAnhalten() : frLos());
  $('[data-play]', v).onclick = (ev) => { ev.stopPropagation(); FS.laeuft ? frAnhalten() : frLos(); };
  $('[data-zurueck]', v).onclick = () => frSpringen(-10);
  $('[data-vorwaerts]', v).onclick = () => frSpringen(10);
  const schieber = $('[data-tempo]', v);
  schieber.oninput = () => {
    FDB.einstellungen.tempo = clamp(+schieber.value, 100, 1000);
    $('[data-tempozahl]', v).textContent = FDB.einstellungen.tempo;
    frPultMalen();
  };
  schieber.onchange = () => fAendern();
  frBahnZiehen($('[data-bahn]', v));
  frWortMalen();
  frPultMalen();
  frKontext(!FS.laeuft);
  if (!FS.laeuft) frMarke('Antippen startet');
}

function frWortMalen() {
  const t = FS.marken[FS.i];
  if (!t) return;
  const wort = $('[data-wort]');
  const vor = $('[data-vor]'), punkt = $('[data-punkt]'), nach = $('[data-nach]');
  if (!wort || !vor) return;
  const k = frFixpunkt(t.w);
  vor.textContent = t.w.slice(0, k);
  punkt.textContent = t.w[k] || '';
  nach.textContent = t.w.slice(k + 1);
  wort.style.fontSize = FDB.einstellungen.groesse + 'px';
  /* Die beiden Striche stehen über und unter dem roten Buchstaben – sie
     wandern also mit ihm, während das Wort mittig bleibt. */
  const zeiger = wort.parentElement;
  if (zeiger) {
    const rz = zeiger.getBoundingClientRect();
    const rp = punkt.getBoundingClientRect();
    const x = rp.width ? (rp.left + rp.width / 2 - rz.left) : rz.width / 2;
    zeiger.style.setProperty('--fixx', clamp(x, 0, rz.width).toFixed(1) + 'px');
  }
}

function frPultMalen() {
  const n = FS.marken.length;
  const f = $('[data-fuell]');
  if (f) f.style.width = (FS.i / Math.max(n - 1, 1) * 100) + '%';
  const st = $('[data-stelle]');
  if (st) st.textContent = fmtZahl(FS.i) + ' / ' + fmtZahl(n);
  frBannerMalen();
}
function frKontext(zeigen) {
  const box = $('[data-kontext]');
  if (!box) return;
  if (!zeigen || !FDB.einstellungen.kontext || !FS.marken.length) { box.classList.remove('an'); return; }
  let a = FS.i, b = FS.i;
  while (a > 0 && !FS.marken[a - 1].satz && !FS.marken[a - 1].absatz && FS.i - a < 26) a--;
  while (b < FS.marken.length - 1 && !FS.marken[b].satz && !FS.marken[b].absatz && b - FS.i < 26) b++;
  box.innerHTML = '';
  for (let j = a; j <= b; j++) {
    const el = document.createElement(j === FS.i ? 'b' : 'span');
    el.textContent = FS.marken[j].w + ' ';
    box.appendChild(el);
  }
  box.classList.add('an');
}
function frMarke(text) {
  const m = $('[data-marke]');
  if (!m) return;
  m.textContent = text;
  m.classList.add('an');
  clearTimeout(m._t);
  m._t = setTimeout(() => m.classList.remove('an'), 1700);
}

/* Tempo: die ersten Wörter langsamer, damit das Auge hineinfindet. */
function frTempoJetzt() {
  const e = FDB.einstellungen;
  if (!e.aufwaermen || !FS.laeuft) return e.tempo;
  const p = Math.min(FS.warmZaehler / F_RAMPE, 1);
  return Math.round(e.tempo * (0.6 + 0.4 * p));
}
function frDauer() {
  const t = FS.marken[FS.i];
  return 60000 / frTempoJetzt() * frFaktor(t, FDB.einstellungen.pausen) / FS.norm;
}
function frTakt() {
  if (!FS.laeuft) return;
  frWortMalen(); frPultMalen();
  const w = $('[data-warm]');
  if (w) w.classList.toggle('an', FDB.einstellungen.aufwaermen && FS.warmZaehler < F_RAMPE);
  if (FS.i >= FS.marken.length - 1) { frFertig(); return; }
  /* Erst steht das Wort seine Zeit, dann kommt das nächste – so meint FS.i
     immer genau das, was zu sehen ist. */
  FS.uhr = setTimeout(() => {
    if (!FS.laeuft) return;
    FS.i++; FS.warmZaehler++; FS.sitzungWorte++;
    frTakt();
  }, frDauer());
}
/* Beim Lesen tritt alles zurück: Kopfzeile, Leisten, Striche und Kontext
   gehen langsam in den Grund über, bis nur noch das Wort dasteht. Beim
   Anhalten sind sie sofort wieder da. */
function frVertiefen(an) {
  const f = $('#fr');
  if (f) f.classList.toggle('vertieft', !!an);
}

function frLos() {
  if (FS.laeuft || !FS.marken.length) return;
  if (FS.i >= FS.marken.length - 1) FS.i = 0;
  const kalt = !FS.angehalten || Date.now() - FS.angehalten > 10000;
  FS.laeuft = true; FS.seit = Date.now();
  FS.warmZaehler = kalt ? 0 : F_RAMPE;
  const p = $('[data-play]');
  if (p) p.innerHTML = FICON.halt;
  frKontext(false);
  frVertiefen(true);
  frTakt();
}
function frAnhalten() {
  if (!FS.laeuft) return;
  clearTimeout(FS.uhr);
  FS.laeuft = false;
  FS.angehalten = Date.now();
  FS.sitzungMs += Date.now() - FS.seit;
  const p = $('[data-play]');
  if (p) p.innerHTML = FICON.start;
  const w = $('[data-warm]');
  if (w) w.classList.remove('an');
  frVertiefen(false);
  frKontext(true);
  frPultMalen();
  frMerken();
}
function frFertig() { frAnhalten(); frMarke('Ende erreicht'); frMerken(); }
function frSpringen(n) {
  if (!FS.marken.length) return;
  const lief = FS.laeuft;
  if (lief) clearTimeout(FS.uhr);
  FS.i = clamp(FS.i + n, 0, FS.marken.length - 1);
  frWortMalen(); frPultMalen();
  if (lief) { FS.warmZaehler = Math.max(FS.warmZaehler, F_RAMPE); FS.uhr = setTimeout(frTakt, frDauer()); }
  else frKontext(true);
}
function frSatzSprung(richtung) {
  let i = FS.i;
  if (richtung > 0) { while (i < FS.marken.length - 1 && !(FS.marken[i].satz || FS.marken[i].absatz)) i++; i++; }
  else { i--; while (i > 0 && !(FS.marken[i - 1].satz || FS.marken[i - 1].absatz)) i--; if (i === FS.i) i--; }
  frSpringen(clamp(i, 0, FS.marken.length - 1) - FS.i);
}
function frStelleSetzen(anteil) {
  if (!FS.marken.length) return;
  FS.i = clamp(Math.round(anteil * (FS.marken.length - 1)), 0, FS.marken.length - 1);
  frWortMalen(); frPultMalen();
}

/* Die Bahn folgt dem Finger, wie alles hier. */
function frBahnZiehen(bahn) {
  if (!bahn) return;
  let zieht = false;
  const anteil = ev => {
    const r = bahn.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    return clamp(x / Math.max(r.width, 1), 0, 1);
  };
  const start = ev => {
    zieht = true; window.__zieht = true;
    if (FS.laeuft) frAnhalten();
    frStelleSetzen(anteil(ev));
    if (ev.pointerId != null && bahn.setPointerCapture) { try { bahn.setPointerCapture(ev.pointerId); } catch (e) { } }
  };
  const zug = ev => { if (!zieht) return; ev.preventDefault(); frStelleSetzen(anteil(ev)); };
  const los = () => {
    if (!zieht) return;
    zieht = false; window.__zieht = false;
    frKontext(true); frMerken();
  };
  bahn.addEventListener('pointerdown', start);
  bahn.addEventListener('pointermove', zug);
  bahn.addEventListener('pointerup', los);
  bahn.addEventListener('pointercancel', los);
  bahn.addEventListener('touchmove', ev => { if (zieht) ev.preventDefault(); }, { passive: false });
}

/* Stelle und Bilanz wegschreiben – gebündelt, nicht bei jedem Wort. */
let frMerkUhr = null;
function frMerken() {
  if (!FS.doc) return;
  FS.doc.wort = FS.i;
  FS.doc.zuletzt = Date.now();
  clearTimeout(frMerkUhr);
  frMerkUhr = setTimeout(() => {
    if (FS.sitzungWorte > 0) {
      FDB.bilanz.worte += FS.sitzungWorte;
      FDB.bilanz.ms += FS.sitzungMs;
      if (FS.sitzungMs > 4000) FDB.bilanz.proben.push(Math.round(FS.sitzungWorte / (FS.sitzungMs / 60000)));
      if (FDB.bilanz.proben.length > 200) FDB.bilanz.proben = FDB.bilanz.proben.slice(-200);
      FS.sitzungWorte = 0; FS.sitzungMs = 0;
    }
    fAendern();
  }, 400);
}

/* ---------- Bilanz ---------- */
function frBilanzMalen(v) {
  const b = FDB.bilanz;
  const min = Math.round(b.ms / 60000);
  const schnitt = b.ms > 1000 ? Math.round(b.worte / (b.ms / 60000)) : 0;
  const p = b.proben.slice(-40);
  const gelesen = FDB.dokumente.filter(d => d.worte && d.wort / d.worte > 0.98).length;
  v.innerHTML = `
    <div class="section-head" style="padding-top:14px"><h2>Bilanz</h2></div>
    <div class="tiles">
      <div class="tile"><div class="k">Wörter</div><div class="v">${fmtZahl(b.worte)}</div></div>
      <div class="tile"><div class="k">Lesezeit</div><div class="v">${min < 60 ? min + '<small> min</small>' : Math.floor(min / 60) + '<small> h </small>' + (min % 60)}</div></div>
      <div class="tile"><div class="k">ø Tempo</div><div class="v">${schnitt ? fmtZahl(schnitt) + '<small> WpM</small>' : '–'}</div></div>
    </div>
    <div class="section-head" style="margin-top:20px"><h2>Tempoverlauf</h2>
      ${p.length > 1 ? `<span class="eyebrow num">${Math.min.apply(null, p)}–${Math.max.apply(null, p)} WpM</span>` : ''}</div>
    ${p.length > 1 ? frKurve(p) : `<p class="hinweis" style="padding:0">Der Verlauf erscheint nach der ersten Sitzung von mehr als vier Sekunden.</p>`}

    <div class="section-head" style="margin-top:22px"><h2>Texte</h2>
      <span class="eyebrow">${gelesen} von ${FDB.dokumente.length} durch</span></div>
    ${FDB.dokumente.length ? `<div class="list-card">${FDB.dokumente.slice().sort((a, b2) => b2.zuletzt - a.zuletzt).map(d => {
      const pct = d.worte ? Math.round(d.wort / d.worte * 100) : 0;
      return `<div class="rowline">
        <span class="grow"><span class="rn">${esc(d.name)}</span>
          <span class="rm">${fmtZahl(d.worte)} Wörter · zuletzt ${esc(relZeit(d.zuletzt))}</span>
          <span class="frbalken"><i style="width:${pct}%"></i></span></span>
        <span class="frpct num">${pct}<small>%</small></span></div>`;
    }).join('')}</div>` : `<p class="hinweis" style="padding:0">Noch keine Texte in der Bibliothek.</p>`}
    <div style="height:26px"></div>`;
}
function frKurve(p) {
  const mx = Math.max.apply(null, p), mn = Math.min.apply(null, p);
  const spanne = Math.max(mx - mn, 40);
  const pts = p.map((v, i) => (i / (p.length - 1) * 100).toFixed(2) + ',' + (46 - (v - mn) / spanne * 42).toFixed(2)).join(' ');
  return `<div class="frkurve"><svg viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="48" x2="100" y2="48" stroke="var(--border)" stroke-width=".5"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
  </svg></div>`;
}

        <span class="rm">Gilt für jedes Wort gleich.</span></span></div>
      <div class="rowline" style="padding-top:0"><input type="range" data-groesse min="14" max="72" step="1" value="${e.groesse}" style="width:100%" aria-label="Schriftgröße"></div>
      <div class="rowline"><span class="grow"><span class="rn">Aufwärmen</span><span class="rm">Die ersten 45 Wörter langsamer</span></span>

      <div class="rowline"><span class="grow"><span class="rn">Pausen bei Satzzeichen</span><span class="rm">Komma, Punkt und Absatz halten auf</span></span>
        <button class="btn btn-sm" data-pausen>${e.pausen ? 'An' : 'Aus'}</button></div>
      <div class="rowline"><span class="grow"><span class="rn">Kontext beim Anhalten</span><span class="rm">Zeigt den Satz um das Wort</span></span>
        <button class="btn btn-sm" data-kontext>${e.kontext ? 'An' : 'Aus'}</button></div>
    </div>

    <div class="section-head" style="margin-top:20px"><h2>Datenbasis</h2></div>
    <div class="list-card">
      <div class="rowline"><span class="grow"><span class="rn">Speicherort</span><span class="rm">${esc(ort)}</span></span>
        <button class="btn btn-sm" data-fwechseln>Ändern</button></div>
      <div class="rowline"><span class="grow"><span class="rn">Jetzt sichern</span><span class="rm">Als Datei ablegen</span></span>
        <button class="btn btn-sm" data-fsave>Sichern</button></div>
      <div class="rowline"><span class="grow"><span class="rn">Daten laden</span><span class="rm">Eine fastreader.json einlesen</span></span>
        <button class="btn btn-sm" data-fimport>Laden</button></div>
      <div class="rowline"><span class="grow"><span class="rn">Umfang</span><span class="rm">${pl(FDB.dokumente.length, 'Text', 'Texte')} · ${fmtZahl(Math.round(zeichen / 1000))} Tausend Zeichen</span></span></div>
      <div class="rowline"><span class="grow"><span class="rn">Alles löschen</span><span class="rm">Texte, Lesezeichen und Bilanz</span></span>
        <button class="btn btn-sm btn-danger" data-freset>Zurücksetzen</button></div>
    </div>

    ${huelleEinstellungenHtml()}
    <p class="hinweis" style="padding:16px 0 30px">Mit Tastatur: <b>Leertaste</b> startet und hält an,
      <b>↑ ↓</b> ändern das Tempo, <b>← →</b> springen zehn Wörter, mit <b>Umschalt</b> einen Satz.</p>`;

  const gr = $('[data-groesse]', v);
  gr.oninput = () => {
    FDB.einstellungen.groesse = clamp(+gr.value, 14, 72);
    $('[data-groessewert]', v).textContent = FDB.einstellungen.groesse + ' px';
  };
  gr.onchange = () => { fAendern(); };
  const um = (feld, knopf) => {
    $(knopf, v).onclick = () => { fAendern(() => { FDB.einstellungen[feld] = !FDB.einstellungen[feld]; }); fViewMalen(); };
  };
  um('aufwaermen', '[data-warm]');
  um('kontext', '[data-kontext]');
  $('[data-pausen]', v).onclick = () => {
    fAendern(() => { FDB.einstellungen.pausen = !FDB.einstellungen.pausen; });
    if (FS.marken.length) FS.norm = FS.marken.reduce((a, t) => a + frFaktor(t, FDB.einstellungen.pausen), 0) / FS.marken.length;
    fViewMalen();
  };
  $('[data-fwechseln]', v).onclick = () => frSpeicherort(false);
  $('[data-fsave]', v).onclick = () => FStore.alsDateiSichern(false);
  $('[data-fimport]', v).onclick = () => frImportBlatt();
  huelleEinstellungenBinden(v, fViewMalen);
  $('[data-freset]', v).onclick = async () => {

      FDB.dokumente.length + ' Texte samt Lesezeichen und Bilanz werden entfernt.', 'Alles löschen', true)) return;
    frAnhalten();
    FDB = leereFr();
    FS.doc = null; FS.marken = []; FS.i = 0;
    await FStore.sichern(true);
    fTabWechseln('bib');
    toast('Zurückgesetzt.');
  };
}

function frImportBlatt() {
  const s = blatt('Daten laden', `
    <p class="muted" style="font-size:13px;line-height:1.6;margin-bottom:14px">Eine <strong>fastreader.json</strong> einlesen. Der bisherige Stand wird ersetzt.</p>
    <input type="file" accept="application/json,.json" data-file style="width:100%">

      <button class="btn btn-ghost" data-no>Abbrechen</button>
    </div>`, { fokus: false });
  $('[data-no]', s).onclick = () => layerSchliessen();

/* Tastatur – nur, solange der Leser offen ist. */
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if ($('#fr').hidden || fTab !== 'lesen' || !FS.marken.length || Layers.length) return;
  const e2 = FDB.einstellungen;
  switch (e.key) {
    case ' ': e.preventDefault(); FS.laeuft ? frAnhalten() : frLos(); break;
    case 'ArrowUp': e.preventDefault(); fAendern(() => { e2.tempo = Math.min(1000, e2.tempo + 25); }); fViewMalen(); break;
    case 'ArrowDown': e.preventDefault(); fAendern(() => { e2.tempo = Math.max(100, e2.tempo - 25); }); fViewMalen(); break;
    case 'ArrowLeft': e.preventDefault(); e.shiftKey ? frSatzSprung(-1) : frSpringen(-10); break;
    case 'ArrowRight': e.preventDefault(); e.shiftKey ? frSatzSprung(1) : frSpringen(10); break;
  }
});
/* Wandert die Seite in den Hintergrund, läuft nichts weiter. */
document.addEventListener('visibilitychange', () => { if (document.hidden) frAnhalten(); });

async function boot() {
  vollbildKnopfMalen();
  $('#btnVoll').onclick = vollbildUmschalten;
  $('#btnTheme').onclick = () => { themeUmschalten(); viewMalen(); };
  /* Der Name oben links führt zurück auf die Liste; steht man schon dort,
     geht es nach oben. */
  $('#btnHeim').onclick = () => {
    if (aktiverTab !== 'plan') tabWechseln('plan');
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  $('#saveChip').onclick = () => Store.alsDateiSichern(false);
  $('#btnUebersicht').onclick = () => uebersichtOeffnen();
  $('#btnRaus').innerHTML = ICON.x;
  $('#btnRaus').onclick = zumStartbildschirm;
  /* Die Übersicht wird von der Kopfzeile heruntergezogen wie ein Vorhang:
     die Kante, an der sie aufhört, liegt genau unter der Fingerkuppe. Erst
     beim Loslassen entscheidet sich, ob sie liegen bleibt – die Schwelle ist
     kurz, ein Schwung nach unten genügt auch. */
  (() => {
    const kopf = $('.topbar');
    let y0 = null, x0 = 0, node = null, ab = 0, hoehe = 1, offen = false;
    let letztY = 0, letztT = 0, tempo = 0;

    const fertig = () => {
      window.__zieht = false;
      y0 = null; node = null;
    };

    kopf.addEventListener('touchstart', e => {
      if (e.touches.length !== 1 || Layers.length || window.__zieht) { y0 = null; return; }
      y0 = e.touches[0].clientY; x0 = e.touches[0].clientX;
      node = null; offen = false; ab = 0;
      hoehe = window.innerHeight || 640;
      letztY = y0; letztT = Date.now(); tempo = 0;
    }, { passive: true });

    kopf.addEventListener('touchmove', e => {
      if (y0 == null) return;
      const t = e.touches[0], dy = t.clientY - y0, dx = Math.abs(t.clientX - x0);
      if (!node) {
        /* Erst ab einer klaren Abwärtsbewegung übernehmen. */
        if (dx > 14 && dx > Math.abs(dy)) { y0 = null; return; }
        if (dy < 10) return;
        node = uebersichtOeffnen(true);
        if (!node) { y0 = null; return; }
        window.__zieht = true;
        ab = dy;
        hoehe = vorhangSetzen(node, 0);
      }
      e.preventDefault();
      const jetzt = Date.now();
      if (jetzt > letztT) {
        tempo = (t.clientY - letztY) / (jetzt - letztT);
        letztY = t.clientY; letztT = jetzt;
      }
      const y = dy - ab;
      offen = y > vorhangSchwelle(hoehe) || tempo > 0.45;
      vorhangSetzen(node, y);
    }, { passive: false });

    const los = () => {
      if (y0 == null) return;
      const el = node;
      if (!el) { fertig(); return; }
      vorhangLoesen(el, offen, () => { if (!offen) layerSchliessen(); });
      fertig();
    };
    kopf.addEventListener('touchend', los, { passive: true });
    kopf.addEventListener('touchcancel', los, { passive: true });
  })();

  await shellLesen();
  themeAnwenden();
  splashZeigen();
}

/* Die leseliste holt sich beim Öffnen ihren eigenen Speicherort. Steht keiner
   fest, fragt sie danach – die anderen Apps bleiben davon unberührt. */
async function leselisteOeffnen() {
  aktiverSpeicher = Store;
  let meta = null;
  try { meta = await Store.metaLesen(); } catch (e) { console.warn(e); }

  if (meta && meta.modus === 'datei' && meta.handle) {
    Store.modus = 'datei'; Store.handle = meta.handle; Store.dateiname = meta.dateiname || 'leseplan.json';
    if (await Store.rechtePruefen(meta.handle, false)) {
      try {
        DB = normalisiere(await Store.ladeDaten());
        shellUebernehmen();
        appStarten();
        return;
      } catch (e) { console.error(e); }
    }
    zugriffFreigebenZeigen();
    return;
  }
  if (meta && meta.modus === 'geraet') {
    Store.modus = 'geraet';
    DB = normalisiere(await IDB.get('daten'));
    shellUebernehmen();
    appStarten();
    return;
  }
  setupZeigen();
}

/* Wer die App schon vor der Trennung benutzt hat, hat Farbe und Vollbild in
   den Daten der leseliste stehen. Einmal übernehmen, dann gilt die Hülle. */
let shellSchonDa = false;
function shellUebernehmen() {
  if (shellSchonDa) return;
  shellSchonDa = true;
  const e = DB.einstellungen || {};
  IDB.get('shell').then(vorhanden => {
    if (vorhanden) return;
    if (e.theme) SHELL.theme = e.theme;
    if (e.akzent) SHELL.akzent = e.akzent;
    if (typeof e.vollbildStart === 'boolean') SHELL.vollbildStart = e.vollbildStart;
    themeAnwenden();
    shellSchreiben();
  }).catch(() => { });
}

function zugriffFreigebenZeigen() {
  const s = $('#setup');
  s.innerHTML = `
    <div class="setup-inner">
      <div class="mark serif">Zugriff bestätigen</div>
      <p class="lead">Der Browser hat den Zugriff auf <strong>${esc(Store.dateiname)}</strong> nach dem Schließen zurückgesetzt. Ein Klick, und es geht weiter wie zuvor.</p>
      <button class="btn btn-primary btn-block" data-act="frei">Datei freigeben</button>
      <div style="margin-top:10px"><button class="btn btn-block btn-ghost" data-act="anders">Anderen Speicherort wählen</button></div>
    </div>`;
  s.hidden = false; $('#app').hidden = true;
  s.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'anders') { setupZeigen(false); return; }
    if (await Store.rechtePruefen(Store.handle, true)) {
      DB = normalisiere(await Store.ladeDaten());

    } else toast('Freigabe verweigert.');
  };
}
/* ============================================================
   Lese-Sitzungen: starten, beenden, laufende anzeigen
   ============================================================ */
/* „ersetzen“ heisst: der Start kommt aus einer offenen Ebene – der Buchauswahl.
   Die Kette Buchauswahl → Timer-Frage bleibt dann eine einzige Ebene mit
   einem einzigen Verlaufseintrag. Schliessen und im selben Zug wieder
   Öffnen brächte den Verlauf durcheinander. */
function sitzungStarten(buchId, ersetzen) {
  const b = buchById(buchId);
  if (!b) return;
  aendern(() => {
    DB.einstellungen.timer = { buchId, startTs: Date.now(), geweckt: false };
    if (b.status === 'offen') b.status = 'lese';
  });
  viewMalen();
  if (DB.einstellungen.timerFragen) timerFrageZeigen(b, ersetzen);
  else {
    if (ersetzen) layerSchliessen();
    toast('Sitzung läuft: ' + b.titel);
  }
}

/* Nach dem Start: Timer stellen – und wenn ja, wie lange? */
function timerFrageZeigen(buch, ersetzen) {
  const werte = [15, 25, 45, 60, 90];
  let wahl = DB.einstellungen.weckerMin || 45;

  const s = blatt('Timer stellen?', `
    <p class="muted" style="font-size:13px;line-height:1.6;margin-bottom:14px">
      Die Sitzung läuft${buch ? ': „' + esc(buch.titel) + '“' : ''}. Soll dich etwas erinnern?
    </p>
    <div style="display:flex;gap:7px;flex-wrap:wrap" data-w></div>
    <div class="field" style="margin-top:14px"><label>Eigener Wert in Minuten</label>
      <input type="number" data-eigen value="${wahl}" placeholder="45"></div>
    <p class="hinweis" style="padding:4px 0 12px">
      Der Wecker meldet sich, solange die leseliste geöffnet ist. Bei gesperrtem Bildschirm
      friert der Browser die Seite ein – dafür brauchst du den Timer deiner Uhr-App.
    </p>
    <div class="btn-row">
      <button class="btn btn-primary" data-ok style="flex:1">Timer stellen</button>
      <button class="btn" data-ohne style="flex:1">Ohne Timer</button>
    </div>
    <button class="btn btn-block btn-ghost btn-sm" style="margin-top:10px" data-nie>Nicht mehr fragen</button>`,
    { fokus: false, ersetzen: ersetzen });

  const malen = () => {
    $('[data-w]', s).innerHTML = werte.map(v =>
      `<button class="chip" data-v="${v}" aria-pressed="${wahl === v}">${v} min</button>`).join('');
    $$('[data-v]', s).forEach(x => x.onclick = () => { wahl = +x.dataset.v; $('[data-eigen]', s).value = wahl; malen(); });
  };
  malen();

  const stellen = () => {
    const eigen = num($('[data-eigen]', s).value);
    const min = eigen && eigen > 0 ? Math.round(eigen) : wahl;
    aendern(() => {
      DB.einstellungen.weckerMin = min;
      if (DB.einstellungen.timer) {
        DB.einstellungen.timer.geweckt = false;
        DB.einstellungen.timer.weckMin = min;
      }
    });
    layerSchliessen();
    viewMalen();
    toast('Wecker nach ' + pl(min, 'Minute', 'Minuten') + '.');
  };

  $('[data-ok]', s).onclick = stellen;
  $('[data-ohne]', s).onclick = () => {
    aendern(() => { DB.einstellungen.weckerMin = null; });
    layerSchliessen(); viewMalen();
    toast('Sitzung läuft ohne Timer.');
  };
  $('[data-nie]', s).onclick = () => {
    aendern(() => { DB.einstellungen.timerFragen = false; });
    layerSchliessen();
    toast('Wird nicht mehr gefragt. Unter „Mehr“ wieder einschaltbar.');
  };
}

function sitzungBeenden() {
  const t = laufenderTimer();
  if (!t) return;
  const b = buchById(t.buchId);
  const minuten = Math.max(1, Math.round(timerMinuten(t)));
  aendern(() => { DB.einstellungen.timer = null; });
  clearInterval(uhrTick);
  viewMalen();
  if (!b) return;
  const stand = b.sessions.reduce((m, s) => Math.max(m, s.bis || 0), 0);
  sessionBearbeiten(b, null, { minuten, von: stand || null }, () => viewMalen(), true);
}

function buchWaehlenFuerSitzung() {
  const angefangen = DB.buecher.filter(b => b.status === 'lese');
  const offen = DB.buecher.filter(b => b.status !== 'gelesen');
  if (!offen.length) { toast('Kein offenes Buch in der Liste.'); return; }
  let nurAngefangene = angefangen.length > 0;

  const s = blatt(nurAngefangene ? 'Woran liest du gerade?' : 'Welches Buch?', `
    <input type="text" data-q placeholder="Titel oder Autor suchen" autocomplete="off">

    ${angefangen.length ? '<button class="btn btn-block btn-ghost btn-sm" style="margin-top:10px" data-alle></button>' : ''}`,
    { fokus: false });

  const malen = () => {
    const q = $('[data-q]', s).value.trim().toLowerCase();
    const kandidaten = nurAngefangene ? angefangen : offen;
    const treffer = kandidaten
      .filter(b => !q || (b.titel + ' ' + b.autor).toLowerCase().includes(q))
      .sort((a, b) => (a.status === 'lese' ? 0 : 1) - (b.status === 'lese' ? 0 : 1));
    const knopf = $('[data-alle]', s);
    if (knopf) {
      knopf.textContent = nurAngefangene ? 'Alle offenen Bücher zeigen (' + offen.length + ')' : 'Nur angefangene zeigen (' + angefangen.length + ')';
      knopf.onclick = () => { nurAngefangene = !nurAngefangene; malen(); };
    }
    const l = $('[data-l]', s);
    l.innerHTML = treffer.length ? '' : '<div class="hinweis" style="padding:14px">Kein Treffer.</div>';
    treffer.slice(0, 60).forEach(b => {
      const r = document.createElement('button');
      r.className = 'rowline';
      r.style.cssText = 'width:100%;text-align:left';
      r.innerHTML = `<span class="grow">
          <span class="rn serif">${esc(b.titel)}</span>
          <span class="rm">${esc(b.autor)}${b.status === 'lese' ? ' · lese ich' : ''}</span>
        </span><span class="chev">${ICON.chev}</span>`;
      r.onclick = () => sitzungStarten(b.id, true);
      l.appendChild(r);
    });
  };
  let t;
  $('[data-q]', s).oninput = () => { clearTimeout(t); t = setTimeout(malen, 150); };
  malen();
}

/* Lese-Wecker: meldet sich, wenn die eingestellte Zeit erreicht ist. */
function piepsen() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    [0, 0.35].forEach(v => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + v);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + v + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + v + 0.28);
      o.start(ctx.currentTime + v);
      o.stop(ctx.currentTime + v + 0.3);
    });
    setTimeout(() => { try { ctx.close(); } catch (e) { } }, 1200);
  } catch (e) { }
}

function wecken(buch, minuten) {
  if (navigator.vibrate) { try { navigator.vibrate([220, 120, 220, 120, 420]); } catch (e) { } }
  piepsen();
  try {
    if (window.Notification && Notification.permission === 'granted') {
      new Notification(minuten + ' Minuten gelesen', { body: buch ? buch.titel : '', tag: 'leseliste-wecker' });
    }
  } catch (e) { }
  const s = blatt(minuten + ' Minuten gelesen', `
    <p class="muted" style="font-size:13.5px;line-height:1.6;margin-bottom:16px">
      ${buch ? '„' + esc(buch.titel) + '“ – ' : ''}die eingestellte Zeit ist um. Die Stoppuhr läuft weiter, bis du sie beendest.
    </p>
    <div class="btn-row">
      <button class="btn btn-primary" data-weiter style="flex:1">Weiterlesen</button>
      <button class="btn" data-stop style="flex:1">Sitzung beenden</button>
    </div>
    <button class="btn btn-block btn-ghost btn-sm" style="margin-top:10px" data-nochmal>Noch einmal ${minuten} Minuten</button>`,
    { fokus: false });
  $('[data-nochmal]', s).onclick = () => {
    const t = laufenderTimer();
    /* Die Startzeit bleibt stehen – sonst wäre die bisherige Lesezeit weg.
       Verschoben wird nur die Marke, ab der wieder geweckt wird. */
    if (t) aendern(() => { t.geweckt = false; t.weckMin = Math.round(timerMinuten(t)) + minuten; });
    layerSchliessen();
    viewMalen();
    toast('Weiter für ' + minuten + ' Minuten.');
  };
  $('[data-weiter]', s).onclick = () => layerSchliessen();
  $('[data-stop]', s).onclick = () => { layerSchliessen(); setTimeout(sitzungBeenden, 80); };
}

function weckerBearbeiten(nachher) {
  const werte = [15, 25, 45, 60, 90];
  const s = blatt('Lese-Wecker', `
    <p class="muted" style="font-size:13px;line-height:1.6;margin-bottom:12px">
      Meldet sich während einer laufenden Sitzung mit Ton und Vibration. Dafür muss die leseliste geöffnet bleiben.
    </p>
    <div style="display:flex;gap:7px;flex-wrap:wrap" data-w></div>
    <div class="field" style="margin-top:14px"><label>Eigener Wert in Minuten</label>
      <input type="number" data-eigen value="${DB.einstellungen.weckerMin || ''}" placeholder="45"></div>
    <button class="btn btn-primary btn-block" data-ok>Sichern</button>`, { fokus: false });

  let wahl = DB.einstellungen.weckerMin || null;
  const malen = () => {
    $('[data-w]', s).innerHTML = werte.map(v =>
      `<button class="chip" data-v="${v}" aria-pressed="${wahl === v}">${v} min</button>`).join('') +
      `<button class="chip" data-v="0" aria-pressed="${!wahl}">aus</button>`;
    $$('[data-v]', s).forEach(x => x.onclick = () => {
      wahl = +x.dataset.v || null;
      $('[data-eigen]', s).value = wahl || '';
      malen();
    });
  };
  malen();
  $('[data-ok]', s).onclick = () => {
    const eigen = num($('[data-eigen]', s).value);
    const v = eigen && eigen > 0 ? Math.round(eigen) : wahl;
    aendern(() => { DB.einstellungen.weckerMin = v || null; });
    if (v && window.Notification && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch (e) { }
    }
    layerSchliessen();
    viewMalen();
    if (nachher) nachher();
    toast(v ? 'Wecker nach ' + v + ' Minuten.' : 'Wecker aus.');
  };
}

let nowTick = null;
/* Die Tableiste ist im Vollbild höher – ihre Höhe wird gemessen, nicht geraten. */
function leistenHoeheMessen() {
  /* Es gibt zwei Leisten in dieser Datei – gemessen wird die der offenen App. */
  const tb = Array.from(document.querySelectorAll('.tabbar'))
    .find(x => x.getBoundingClientRect().height > 0);
  if (!tb) return;
  const h = Math.round(tb.getBoundingClientRect().height);
  if (h > 0) document.documentElement.style.setProperty('--tabh', h + 'px');
}
window.addEventListener('resize', leistenHoeheMessen);
document.addEventListener('fullscreenchange', () => setTimeout(leistenHoeheMessen, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(leistenHoeheMessen, 60));

function nowbarMalen() {
  leistenHoeheMessen();
  const bar = $('#nowbar'), inner = $('#nowbarInner');
  if (!bar) return;
  clearInterval(nowTick);
  if (!DB.buecher.length) {
    bar.hidden = true;
    document.body.classList.remove('hat-nowbar');
    return;
  }
  bar.hidden = false;
  document.body.classList.add('hat-nowbar');
  const t = laufenderTimer();
  /* Was heute noch fehlt – rechnet sich aus den Sitzungen des Tages. */
  const z = zielHeute();
  const rest = z.ziel ? Math.max(0, z.ziel - z.gelesen) : 0;

  if (t) {
    const b = buchById(t.buchId);
    inner.className = 'nowbar-inner laeuft';
    inner.innerHTML = `
      <span class="grow">
        <span class="nt serif">${esc(b ? b.titel : 'Sitzung')}</span>
        <span class="nm">Sitzung läuft${z.ziel ? ' · ' + (rest ? 'heute noch ' + rest + ' S.' : 'Ziel geschafft') : ''}</span>
      </span>
      <span class="uhr" data-uhr>00:00</span>
      <button class="btn btn-sm" data-wecker title="Lese-Wecker">${DB.einstellungen.weckerMin ? DB.einstellungen.weckerMin + '′' : '⏰'}</button>
      <button class="btn btn-sm" data-stop>Beenden</button>`;
    const malen = () => {
      const el = $('[data-uhr]', inner);
      if (!el) return;
      const sek = Math.floor((Date.now() - t.startTs) / 1000);
      const teile = sek >= 3600
        ? [Math.floor(sek / 3600), Math.floor(sek / 60) % 60, sek % 60]
        : [Math.floor(sek / 60), sek % 60];
      el.textContent = teile.map(x => String(x).padStart(2, '0')).join(':');
      const w = +t.weckMin || +DB.einstellungen.weckerMin || 0;
      if (w && !t.geweckt && sek >= w * 60) {
        aendern(() => { t.geweckt = true; });
        wecken(buchById(t.buchId), +DB.einstellungen.weckerMin || w);
      }
    };
    malen();
    nowTick = setInterval(malen, 1000);
    $('[data-stop]', inner).onclick = sitzungBeenden;
    $('[data-wecker]', inner).onclick = () => timerFrageZeigen(b);
    if (b) $('.grow', inner).onclick = () => buchOeffnen(b.id);
  } else {
    const lese = DB.buecher.filter(b => b.status === 'lese');
    const eines = lese.length === 1 ? lese[0] : null;
    const kopf = !z.ziel ? 'Heute noch kein Ziel'
      : rest ? 'Heute noch ' + rest + ' Seiten zu lesen'
        : 'Tagesziel geschafft';
    const unten = !z.ziel ? 'Tagesziel setzen'
      : eines ? esc(eines.titel)
        : (lese.length > 1 ? lese.length + ' Bücher angefangen' : 'Buch wählen');
    inner.className = 'nowbar-inner' + (z.ziel && !rest ? ' fertig' : '');
    inner.innerHTML = `
      <span class="grow">
        <span class="nt serif">${esc(kopf)}</span>
        <span class="nm">${unten}</span>
      </span>
      <button class="btn btn-sm btn-primary" data-start>${ICON.play} Starten</button>`;
    $('[data-start]', inner).onclick = () => eines ? sitzungStarten(eines.id) : buchWaehlenFuerSitzung();
    /* Ohne Tagesziel führt die Zeile dorthin, wo eines gesetzt wird. */
    $('.grow', inner).onclick = () => !z.ziel ? zielBearbeiten(() => nowbarMalen())
      : eines ? buchOeffnen(eines.id) : buchWaehlenFuerSitzung();
  }
}

/* ============================================================
   Ebenen: Vollbild-Ansichten und Blätter von unten
   ============================================================ */
const Layers = [];
function layerOeffnen(node, onClose) {
  Layers.push({ node, onClose });
  $('#layers').appendChild(node);
  globalKnoepfeEinsetzen(node);
  /* Vollflächige Ebenen lassen sich vom linken Rand aus wegziehen. */
  if (node.classList && (node.classList.contains('overlay') || node.classList.contains('sto'))) ebeneZiehen(node);
  try { history.pushState({ layer: Layers.length }, ''); } catch (e) { }
  return node;
}
/* Wie viele Verlaufssprünge angestoßen, aber noch nicht angekommen sind.
   Jeder Aufruf von back() oder go() meldet genau ein popstate; solange eines
   aussteht, stammt es von uns und nicht von der Zurück-Taste. */
let zurueckOffen = 0;
function layerSchliessen() {
  if (!Layers.length) return;
  /* Sofort aus dem DOM: sonst schließt das später eintreffende popstate eine
     Ebene, die inzwischen darüber geöffnet wurde – etwa wenn aus der
     Buchauswahl heraus gleich die Timer-Frage aufgeht. */
  layerPop();
  zurueckOffen++;
  try { history.back(); } catch (e) { zurueckOffen--; }
}
/* Alle offenen Ebenen auf einmal zu; der Verlauf wird danach zurückgespult. */
function alleLayerSchliessen() {
  const n = Layers.length;
  if (!n) return;
  Layers.slice().reverse().forEach(l => { l.node.remove(); if (l.onClose) l.onClose(); });
  Layers.length = 0;
  zurueckOffen++;
  try { history.go(-n); } catch (e) { zurueckOffen--; }
}
/* Die oberste Ebene gegen eine andere tauschen, ohne den Verlauf anzufassen.
   Schliessen und gleich wieder Öffnen ginge schief: das nachlaufende popstate
   des back() räumt sonst die eben erst geöffnete Ebene wieder weg. */
/* ---------- Hell/Dunkel und Vollbild, überall erreichbar ----------
   Jede Ebene und jedes Blatt bekommt das Paar automatisch eingesetzt; die
   Kopfzeile der App liegt darunter verdeckt. */
function globalKnoepfeHtml(mitSpeicher) {
  return '<span class="gknoepfe">'
    + (mitSpeicher ? '<button class="savechip" data-gsave data-state="clean" title="Jetzt sichern">'
      + '<span class="dot"></span><span class="st">gesichert</span></button>' : '')
    + '<button class="icon-btn" data-gtheme title="Hell oder dunkel" aria-label="Hell oder dunkel"></button>'
    + (vollbildGeht() ? '<button class="icon-btn" data-gvoll title="Vollbild" aria-label="Vollbild"></button>' : '')
    + '</span>';
}
function globalKnoepfeMalen(wurzel) {
  $$('[data-gtheme]', wurzel || document).forEach(b => {
    b.innerHTML = SHELL.theme === 'light' ? ICON.moon : ICON.sun;
  });
  $$('[data-gvoll]', wurzel || document).forEach(b => {
    b.innerHTML = vollbildAn() ? ICON.vollAus : ICON.voll;
  });
}
function globalKnoepfeEinsetzen(node) {
  const kopf = $('.ovl-head', node);
  if (kopf && !$('[data-gtheme]', kopf)) kopf.insertAdjacentHTML('beforeend', globalKnoepfeHtml(true));
  const blatt = $('.sheet', node);
  if (blatt && !$('[data-gtheme]', blatt)) blatt.insertAdjacentHTML('afterbegin', globalKnoepfeHtml(false));
  globalKnoepfeMalen(node);
  saveChipMalen();
}
$('#layers').addEventListener('click', e => {
  if (e.target.closest('[data-gtheme]')) {
    themeUmschalten();
    globalKnoepfeMalen();
    viewMalen();
  } else if (e.target.closest('[data-gvoll]')) {
    vollbildUmschalten();
  } else if (e.target.closest('[data-gsave]')) {
    (aktiverSpeicher || Store).alsDateiSichern(false);
  }
});

function layerErsetzen(node, onClose) {
  const alt = Layers.pop();
  if (alt) { alt.node.remove(); if (alt.onClose) alt.onClose(); }
  Layers.push({ node, onClose });
  $('#layers').appendChild(node);
  globalKnoepfeEinsetzen(node);
  return node;
}
function layerPop() {
  const l = Layers.pop();
  if (!l) return;
  l.node.remove();
  if (l.onClose) l.onClose();
}
window.addEventListener('popstate', () => {
  if (zurueckOffen > 0) { zurueckOffen--; return; }
  layerPop();
});

function blatt(titel, inhalt, opts) {
  opts = opts || {};
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      ${titel ? `<h3>${esc(titel)}</h3>` : ''}
      <div data-body></div>
    </div>`;
  const body = $('[data-body]', scrim);
  if (typeof inhalt === 'string') body.innerHTML = inhalt; else body.appendChild(inhalt);
  scrim.addEventListener('click', e => { if (e.target === scrim) layerSchliessen(); });
  (opts.ersetzen ? layerErsetzen : layerOeffnen)(scrim, opts.onClose);
  const erstes = $('input,textarea,select', body);
  if (erstes && opts.fokus !== false) setTimeout(() => erstes.focus(), 80);
  ziehenZumSchliessen($('.sheet', scrim));
  return scrim;
}

/* Blatt mit dem Finger nach unten wegschieben.
   Touch-Ereignisse statt Pointer, weil nur dort das Scrollen der Seite
   rechtzeitig unterbunden werden kann. */
function ziehenZumSchliessen(sheet) {
  /* Nach derselben Regel wie der Kartenstapel: 1:1 am Finger, der bis zur
     Übernahme gelaufene Weg wird abgezogen, damit nichts hüpft; beim
     Loslassen entscheidet eine kurze Schwelle oder der Schwung. */
  let y0 = null, x0 = 0, ab = 0, zieht = false, hoehe = 1;
  let letztY = 0, letztT = 0, tempo = 0, weg = 0;

  const inScroller = el => {
    while (el && el !== sheet) {
      if (el.scrollHeight - el.clientHeight > 4) {
        const st = getComputedStyle(el).overflowY;
        if (st === 'auto' || st === 'scroll') return true;
      }
      el = el.parentElement;
    }
    return false;
  };

  const start = ev => {
    if (window.__zieht || sheet.scrollTop > 3) { y0 = null; return; }
    const ziel = ev.target;
    if (ziel.closest && ziel.closest('input,textarea,select,button,pre,[data-akzent]')) { y0 = null; return; }
    if (inScroller(ziel)) { y0 = null; return; }
    const t = ev.touches ? ev.touches[0] : ev;
    y0 = t.clientY; x0 = t.clientX;
    zieht = false; weg = 0;
    hoehe = sheet.getBoundingClientRect().height || 400;
    letztY = y0; letztT = Date.now(); tempo = 0;
  };

  const bewegen = ev => {
    if (y0 == null) return;
    const t = ev.touches ? ev.touches[0] : ev;
    const dy = t.clientY - y0, dx = Math.abs(t.clientX - x0);
    if (!zieht) {
      /* Erst nach dem Richtungsentscheid übernehmen. */
      if (dy < -8 || (dx > 14 && dx > Math.abs(dy))) { y0 = null; sheet.style.transform = ''; return; }
      if (dy < 10) return;
      zieht = true; ab = dy; window.__zieht = true;
      sheet.style.transition = 'none';
      sheet.style.willChange = 'transform';
    }
    if (ev.cancelable) ev.preventDefault();
    const jetzt = Date.now();
    if (jetzt > letztT) { tempo = (t.clientY - letztY) / (jetzt - letztT); letztY = t.clientY; letztT = jetzt; }
    weg = Math.max(0, dy - ab);
    sheet.style.transform = 'translateY(' + weg.toFixed(1) + 'px)';
  };

  const ende = () => {
    if (y0 == null) return;
    y0 = null;
    if (!zieht) return;
    zieht = false;
    /* Ein hohes Blatt darf nicht mehr Weg verlangen als ein niedriges –
       darum ist die Schwelle nach oben gedeckelt. */
    const zu = weg > Math.max(90, Math.min(hoehe * 0.16, 160)) || tempo > 0.45;
    sheet.style.transition = 'transform .26s cubic-bezier(.2,.8,.3,1)';
    if (zu) {
      sheet.style.transform = 'translateY(' + Math.ceil(hoehe + 40) + 'px)';
      setTimeout(() => { window.__zieht = false; layerSchliessen(); }, 190);
    } else {
      sheet.style.transform = 'translateY(0)';
      setTimeout(() => {
        window.__zieht = false;
        sheet.style.transition = ''; sheet.style.transform = ''; sheet.style.willChange = '';
      }, 270);
    }
  };

  sheet.addEventListener('touchstart', start, { passive: true });
  sheet.addEventListener('touchmove', bewegen, { passive: false });
  sheet.addEventListener('touchend', ende);
  sheet.addEventListener('touchcancel', ende);
  /* Maus: dasselbe über Pointer */
  sheet.addEventListener('pointerdown', ev => {
    if (ev.pointerType !== 'mouse') return;
    start(ev);
    const m = e => bewegen(e), u = () => { ende(); window.removeEventListener('pointermove', m); window.removeEventListener('pointerup', u); };
    window.addEventListener('pointermove', m);
    window.addEventListener('pointerup', u);
  });
}

function tabVerschieben(d) {
  const i = ANSICHTEN.indexOf(aktiverTab);
  if (i < 0) return;
  const j = clamp(i + d, 0, ANSICHTEN.length - 1);
  if (j !== i) tabWechseln(ANSICHTEN[j]);
}
/* ===== Zum Startbildschirm ziehen =====
   Von links nach rechts: die Flächen der App wandern am Finger mit und geben
   den Homescreen dahinter frei – 1:1 wie die Karten beim Stöbern, mit kurzer
   Schwelle und Schwung. Erst wenn der Zug durchgeht, wird wirklich
   umgeschaltet. */
(function heimZiehen() {
  const tabu = '.book,.arow,.pager,.chiprow,.gal,.chart-scroll,.pagertabs,.cam,.lightbox,'
    + '.nowbar,.zsRahmen,.netz,.sto,input,textarea,select,.sheet,.akk';
  let x0 = null, y0 = 0, zieht = false, ab = 0, raus = false, grund = null;
  let letztX = 0, letztT = 0, tempo = 0;

  const breite = () => window.innerWidth || 360;
  const schwelle = () => Math.max(80, breite() * 0.26);

  const grundBauen = () => {
    grund = document.createElement('div');
    grund.className = 'splash heimgrund';
    grund.setAttribute('aria-hidden', 'true');
    grund.innerHTML = '<div class="apps">'
      + '<span class="app ist">leseliste</span>'
      + '<span class="app aus">kalender</span></div>';
    grund.style.opacity = '0';
    document.body.appendChild(grund);
    document.body.classList.add('heimzug');
  };

  const setzen = (dx) => {
    const f = clamp(dx / breite(), 0, 1);
    document.body.style.setProperty('--heimzug', dx.toFixed(1) + 'px');
    if (grund) grund.style.opacity = clamp(0.2 + f * 2, 0, 1).toFixed(3);
  };

  const aufraeumen = () => {
    document.body.classList.remove('heimzug', 'federt');
    document.body.style.removeProperty('--heimzug');
    if (grund && grund.isConnected) grund.remove();
    grund = null;
    window.__zieht = false;
    x0 = null; zieht = false;
  };

  const los = () => {
    if (x0 == null) return;
    if (!zieht) { x0 = null; window.__zieht = false; return; }
    x0 = null;
    document.body.classList.add('federt');
    if (raus) {
      setzen(breite());
      setTimeout(() => { aufraeumen(); zumStartbildschirm(); }, 250);
    } else {
      setzen(0);
      if (grund) grund.style.opacity = '0';
      setTimeout(aufraeumen, 270);
    }
  };

  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || window.__zieht || zieht) { x0 = null; return; }
    if (Layers.length || $('#app').hidden || aktiverTab !== ANSICHTEN[0]) { x0 = null; return; }
    if (e.target.closest && e.target.closest(tabu)) { x0 = null; return; }
    const t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; raus = false;
    letztX = x0; letztT = Date.now(); tempo = 0;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (x0 == null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (!zieht) {
      if (window.__zieht) { x0 = null; return; }
      if (dx < -8 || dy > 18) { x0 = null; return; }
      if (dx < 14) return;
      zieht = true; ab = dx; window.__zieht = true;
      grundBauen();
      setzen(0);
    }
    e.preventDefault();
    const jetzt = Date.now();
    if (jetzt > letztT) {
      tempo = (t.clientX - letztX) / (jetzt - letztT);
      letztX = t.clientX; letztT = jetzt;
    }
    const x = Math.max(0, dx - ab);
    raus = x > schwelle() || tempo > 0.45;
    setzen(x);
  }, { passive: false });

  document.addEventListener('touchend', los, { passive: true });
  document.addEventListener('touchcancel', los, { passive: true });
})();

(function wischNavigation() {
  let x0 = null, y0 = null, zeit = 0, gesperrt = false;
  /* .block steht bewusst nicht hier: dort gibt es nur langes Drücken zum
     Sortieren, kein waagerechtes Ziehen – der Wisch soll durchkommen. */
  const tabu = '.book,.arow,.pager,.chiprow,.gal,.chart-scroll,.pagertabs,.cam,.lightbox,'
    + '.nowbar,.zsRahmen,.netz,.sto,input,textarea,select,.sheet,.akk';
  document.addEventListener('touchstart', e => {
    /* Nur in der leseliste – der Kalender und der fastreader haben eigene
       Flächen, auf denen quer gewischt wird. */
    if (e.touches.length !== 1 || window.__zieht || $('#app').hidden) { x0 = null; return; }
    const t = e.touches[0];
    gesperrt = !!(e.target.closest && e.target.closest(tabu));
    x0 = t.clientX; y0 = t.clientY; zeit = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 == null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - zeit;
    x0 = null;
    if (gesperrt || window.__zieht || dt > 700) return;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
    /* Offene Ebenen gehen am Finger (ebeneZiehen), nicht auf Zuruf. */
    if (Layers.length) return;
    if (dx > 0) {
      /* Ganz links angekommen führt der nächste Wisch aus der App heraus. */
      if (aktiverTab === ANSICHTEN[0]) zumStartbildschirm();
      else tabVerschieben(-1);
    }
    else tabVerschieben(1);
  }, { passive: true });
})();

function bestaetigen(titel, text, okLabel, gefaehrlich) {

      <p class="muted" style="font-size:13.5px;line-height:1.6;margin-bottom:16px">${text}</p>

    $('[data-no]', s).onclick = () => { done = true; res(false); layerSchliessen(); };

}

const offeneBloecke = new Set();
let planFilter = 'alle';
let planSort = 'plan';

function buecherGefiltert(blockId) {
  let l = buecherIn(blockId);
  if (planFilter === 'fehlt') l = l.filter(b => b.besitz === 'fehlt' || b.besitz === 'bestellt');
  else if (planFilter !== 'alle') l = l.filter(b => b.status === planFilter);
  if (planSort === 'titel') l = l.slice().sort((a, b) => a.titel.localeCompare(b.titel, 'de'));
  else if (planSort === 'autor') l = l.slice().sort((a, b) => (a.autor || '').localeCompare(b.autor || '', 'de'));
  else if (planSort === 'seiten') l = l.slice().sort((a, b) => (b.seiten || 0) - (a.seiten || 0));
  else if (planSort === 'jahr') l = l.slice().sort((a, b) => (a.jahr || 9999) - (b.jahr || 9999));
  return l;
}

    $('[data-neu-buch]', leiste).onclick = () => buchBearbeiten(null, blk.id);

  node.innerHTML = `

          <span>${esc(b.autor || 'ohne Autor')}</span>
          ${b.jahr != null ? `<span class="num">${esc(jahrText(b.jahr))}</span>` : ''}
          ${b.seiten ? `<span class="num">${b.seitenUnsicher ? '~' : ''}${b.seiten} S.</span>` : ''}
          ${bes.kurz ? `<span style="color:${bes.farbe}">${esc(bes.kurz)}</span>` : ''}

        </span>
        ${marken.length ? `<span class="tags">${marken.join('')}</span>` : ''}
      </button>
      <span class="chev">${ICON.chev}</span>

    <div class="bookpane kurzpane">
      <span class="kt">In Kürze</span>
      <span class="kx">${b.kurz ? esc(b.kurz) : '<em>Noch keine Kurzfassung – lang tippen, dann „Bearbeiten“.</em>'}</span>

  $('.status-btn', node).onclick = e => {

  });
  return node;

/* Langes Drücken hebt den Eintrag an; danach folgt er dem Finger und wird
   dort abgelegt, wo man loslässt. Auf dem Handy laufen dafür Touch-Ereignisse:
   nur damit lässt sich das Scrollen der Seite rechtzeitig unterbinden. */
function ziehenZumSortieren(node, griff, opts) {
  const auswahl = opts.auswahl;
  let halten = null, zieht = false, sx = 0, sy = 0, wrap = null;

  const punkt = ev => (ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]) || ev;

  const beginnen = () => {
    wrap = node.parentElement;
    if (!wrap || wrap.querySelectorAll(auswahl).length < 2) return;
    zieht = true;
    window.__zieht = true;
    node._langGedrueckt = true;
    $$('button', node).forEach(b => { b._langGedrueckt = true; });
    node.classList.add('zieht');
    document.body.style.userSelect = 'none';
    if (navigator.vibrate) { try { navigator.vibrate(14); } catch (e) { } }
  };

  /* Waagerecht liegende Reihen (die Tage im To-Do) messen an der Breite. */
  const quer = !!opts.waagerecht;
  const einsortieren = (x, y) => {
    const wert = quer ? x : y;
    for (const g of Array.from(wrap.querySelectorAll(auswahl))) {
      if (g === node) continue;
      const r = g.getBoundingClientRect();
      const mitte = quer ? r.left + r.width / 2 : r.top + r.height / 2;
      const nodeFolgt = !!(g.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING);
      if (wert < mitte && nodeFolgt) { wrap.insertBefore(node, g); return; }
      if (wert > mitte && !nodeFolgt) { wrap.insertBefore(node, g.nextSibling); return; }
    }
  };

  const bewegen = ev => {
    const p = punkt(ev);
    if (!zieht) {
      if (Math.abs(p.clientY - sy) > 12 || Math.abs(p.clientX - sx) > 12) clearTimeout(halten);
      return;
    }
    if (ev.cancelable) ev.preventDefault();
    einsortieren(p.clientX, p.clientY);
    const rand = 100;
    if (quer) {
      const r = wrap.getBoundingClientRect();
      if (p.clientX < r.left + 60) wrap.scrollBy(-14, 0);
      else if (p.clientX > r.right - 60) wrap.scrollBy(14, 0);
    } else if (p.clientY < rand) window.scrollBy(0, -14);
    else if (p.clientY > window.innerHeight - rand) window.scrollBy(0, 14);
  };

  const ende = () => {
    clearTimeout(halten);
    if (!zieht) return;
    zieht = false;
    window.__zieht = false;
    node.classList.remove('zieht');
    document.body.style.userSelect = '';
    setTimeout(() => { $$('button', node).forEach(b => { b._langGedrueckt = false; }); }, 60);
    opts.fertig(Array.from(wrap.querySelectorAll(auswahl)).map(x => x._sortId));
    (opts.neuMalen || viewMalen)();
    /* Der Klick, der auf das Loslassen folgt, gehört noch zum Zug. */
    setTimeout(() => { node._langGedrueckt = false; }, 60);
  };

  const start = ev => {
    const p = punkt(ev);
    sx = p.clientX; sy = p.clientY;
    clearTimeout(halten);
    halten = setTimeout(beginnen, 420);
  };

  /* Touch: der Zuhörer hängt von Anfang an am Griff und ist nicht passiv,
     damit preventDefault im Ziehen wirklich greift. */
  griff.addEventListener('touchstart', start, { passive: true });
  griff.addEventListener('touchmove', bewegen, { passive: false });
  griff.addEventListener('touchend', ende);
  griff.addEventListener('touchcancel', ende);

  /* Maus */
  griff.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    start(ev);
    const m = e => bewegen(e);
    const u = () => { ende(); window.removeEventListener('mousemove', m); window.removeEventListener('mouseup', u); };
    window.addEventListener('mousemove', m);
    window.addEventListener('mouseup', u);
  });
  griff.addEventListener('contextmenu', ev => { if (zieht) ev.preventDefault(); });
}

function planWechsler() {
  const s = blatt('leselisten', '<div data-l></div>', { fokus: false });

    const aktiv = aktiverPlan();
    l.innerHTML = `
      <p class="hinweis" style="padding:0 0 10px">Eine leseliste bündelt mehrere Blöcke. Beim Start öffnet sich immer die zuletzt benutzte.</p>
      <div class="list-card">${plaeneSortiert().map(p => {
      const bs = buecherImPlan(p.id);
      const g = bs.filter(b => b.status === 'gelesen').length;
      const ist = aktiv && p.id === aktiv.id;
      return `<div class="rowline">
          <button class="grow" data-w="${p.id}" style="text-align:left">
            <span class="rn" style="${ist ? 'color:var(--accent);font-weight:600' : ''}">${ist ? '● ' : ''}${esc(p.name)}</span>
            <span class="rm">${pl(bloeckeVonPlan(p.id).length, 'Block', 'Blöcke')} · ${pl(bs.length, 'Buch', 'Bücher')} · ${g} gelesen</span>
          </button>
          <button class="icon-btn" data-um="${p.id}" aria-label="Bearbeiten">${ICON.edit}</button>
        </div>`;
    }).join('')}</div>
      <button class="btn btn-block" style="margin-top:12px" data-neu>${ICON.plus} leseliste anlegen</button>
      <button class="btn btn-block" style="margin-top:8px" data-stoebern>${ICON.herz} Stöbern – aus einer Sammlung wählen</button>`;

    $$('[data-w]', l).forEach(b => b.onclick = () => {
      aendern(() => { DB.einstellungen.aktiverPlanId = b.dataset.w; });
      layerSchliessen();
      offeneBloecke.clear();
      viewMalen();
    });
    $$('[data-um]', l).forEach(b => b.onclick = () => planBearbeiten(DB.lesepleane.find(p => p.id === b.dataset.um), malen));
    /* Nach dem Anlegen soll der neue Leseplan offen liegen, nicht die Liste. */
    $('[data-neu]', l).onclick = () => { layerSchliessen(); setTimeout(() => planBearbeiten(null, null), 70); };
    $('[data-stoebern]', l).onclick = () => { layerSchliessen(); setTimeout(stoebernOeffnen, 70); };

function planBearbeiten(plan, neuMalen) {
  const neu = !plan;
  const p = plan || { id: null, name: '' };
  const s = blatt(neu ? 'Neue leseliste' : 'leseliste bearbeiten', `
    <div class="field">
      <label>Name</label>
      <input type="text" data-name value="${esc(p.name)}" placeholder="z.B. Lesestart">
    </div>
    ${neu ? '' : `<div class="field">
      <label>Reihenfolge</label>
      <div class="btn-row">
        <button class="btn btn-sm" data-up>${ICON.up} nach oben</button>
        <button class="btn btn-sm" data-down>${ICON.down} nach unten</button>
      </div>
    </div>`}
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-primary" data-ok style="flex:1">${neu ? 'Anlegen' : 'Sichern'}</button>
      ${neu ? '' : `<button class="btn btn-danger" data-del>${ICON.trash}</button>`}
    </div>`);

  $('[data-ok]', s).onclick = () => {
    const name = $('[data-name]', s).value.trim();
    if (!name) { toast('Die leseliste braucht einen Namen.'); return; }
    aendern(() => {
      if (neu) {
        const n = { id: uid(), name, ord: DB.lesepleane.length };
        DB.lesepleane.push(n);
        DB.einstellungen.aktiverPlanId = n.id;
      } else p.name = name;
    });
    layerSchliessen();
    if (neuMalen) neuMalen();
    viewMalen();
  };
  if (!neu) {
    const verschieben = d => {
      const l = plaeneSortiert();
      const i = l.findIndex(x => x.id === p.id), j = i + d;
      if (j < 0 || j >= l.length) return;
      aendern(() => { const t = l[i].ord; l[i].ord = l[j].ord; l[j].ord = t; plaeneSortiert().forEach((x, k) => x.ord = k); });
      if (neuMalen) neuMalen();
      viewMalen();
      toast('Verschoben.');
    };
    $('[data-up]', s).onclick = () => verschieben(-1);
