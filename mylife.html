/* ============================================================
   Daten laden: ganze Liste ersetzen oder ergänzen
   ============================================================ */
function importDialog(erstStart) {
  const s = blatt('Daten aus Datei laden', `
    <p class="muted" style="font-size:13px;line-height:1.6;margin-bottom:14px">
      Erwartet wird eine <span class="num">.json</span> im leseliste-Format – eine frühere Sicherung oder eine fertige Liste.
    </p>
    <input type="file" accept=".json,application/json" data-file style="padding:9px">
    <div class="field" style="margin-top:14px">
      <label>Wie einspielen?</label>
      <label style="display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--text-2)">
        <input type="radio" name="impmode" value="ersetzen" checked style="width:auto;margin-top:3px">
        <span><strong style="color:var(--text)">Alles ersetzen</strong><br>Der bisherige Inhalt wird verworfen.</span>
      </label>
      <label style="display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--text-2)">
        <input type="radio" name="impmode" value="ergaenzen" style="width:auto;margin-top:3px">
        <span><strong style="color:var(--text)">Ergänzen</strong><br>Neue Blöcke und Bücher kommen dazu, vorhandene bleiben unangetastet.</span>
      </label>
      <label style="display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text-2)">
        <input type="radio" name="impmode" value="abgleichen" style="width:auto;margin-top:3px">
        <span><strong style="color:var(--text)">Abgleichen</strong><br>Wie „Ergänzen“, aber vorhandene Bücher übernehmen zusätzlich die
        Angaben aus der Datei: Seitenzahl, Jahr, Ausgabe, Beschreibung, Kurzfassung, Schwierigkeit, Autoren.
        <span style="color:var(--text-3)">Dein Fortschritt bleibt: Status, Sitzungen, Notizen, Fotos, Preis, Besitz.</span></span>
      </label>
    </div>
    <button class="btn btn-primary btn-block" data-ok>Laden</button>`, { fokus: false });

  $('[data-ok]', s).onclick = async () => {
    const f = $('[data-file]', s).files[0];
    if (!f) { toast('Bitte erst eine Datei wählen.'); return; }
    let roh;
    try { roh = JSON.parse(await f.text()); }
    catch (e) { toast('Die Datei ist kein gültiges JSON.', 4000); return; }
    if (!roh || (!Array.isArray(roh.buecher) && !Array.isArray(roh.bloecke))) {
      toast('Darin steckt keine leseliste.', 4000); return;
    }
    const modus = $('input[name=impmode]:checked', s).value;
    const neu = normalisiere(roh);
    let neuBuch = 0, aktualisiert = 0;
    /* Wer gleich beim Start eine Datei lädt, bekommt die Arbeitskopie als Speicherort. */
    if (!Store.modus) { Store.modus = 'geraet'; Store.handle = null; await Store.metaSchreiben(); }

    if (modus === 'ersetzen') {
      const ok = erstStart || (!DB.buecher.length && !DB.bloecke.length) || await bestaetigen('Alles ersetzen?',
        `Dein jetziger Stand mit ${DB.buecher.length} Büchern wird verworfen und durch ${neu.buecher.length} Bücher aus der Datei ersetzt.`,
        'Ersetzen', true);
      if (!ok) return;
      /* Eine reine Listendatei bringt keine Einstellungen mit – dann bleiben
         Darstellung, Ziel und Einführung so, wie du sie hattest. */
      const eigene = Object.assign({}, DB.einstellungen);
      const planId = neu.einstellungen.aktiverPlanId;
      DB = neu;
      if (!roh.einstellungen) {
        DB.einstellungen = Object.assign(eigene, { aktiverPlanId: planId });
      }
    } else {
      aendern(() => {
        const artNach = {}, themaNach = {}, blockNach = {};
        neu.arten.forEach(a => {
          const da = DB.arten.find(x => x.name.toLowerCase() === a.name.toLowerCase());
          artNach[a.id] = da ? da.id : (DB.arten.push({ id: uid(), name: a.name, farbe: ART_FARBEN[DB.arten.length % 8] }), DB.arten[DB.arten.length - 1].id);
        });
        neu.themen.forEach(t => { themaNach[t.id] = themaFindenOderAnlegen(t.name); });
        const planNach = {};
        neu.lesepleane.slice().sort((a, b) => a.ord - b.ord).forEach(p => {
          const da = DB.lesepleane.find(x => x.name.toLowerCase() === p.name.toLowerCase());
          if (da) { planNach[p.id] = da.id; return; }
          const n = { id: uid(), name: p.name, ord: DB.lesepleane.length };
          DB.lesepleane.push(n); planNach[p.id] = n.id;
        });
        if (!DB.einstellungen.aktiverPlanId && DB.lesepleane[0]) DB.einstellungen.aktiverPlanId = DB.lesepleane[0].id;
        neu.bloecke.slice().sort((a, b) => a.ord - b.ord).forEach(bl => {
          const zielPlan = planNach[bl.planId] || DB.einstellungen.aktiverPlanId;
          const da = DB.bloecke.find(x => x.planId === zielPlan && x.name.toLowerCase() === bl.name.toLowerCase());
          if (da) { blockNach[bl.id] = da.id; return; }
          const n = { id: uid(), planId: zielPlan, name: bl.name, notiz: bl.notiz, ord: bloeckeVonPlan(zielPlan).length };
          DB.bloecke.push(n); blockNach[bl.id] = n.id;
        });
        /* Felder, die aus der Datei kommen dürfen – alles andere ist dein Fortschritt. */
        const katalogFelder = ['titel', 'autor', 'autoren', 'autorGeb', 'autorGest', 'autorBio', 'autorEinfluss',
          'jahr', 'seiten', 'seitenUnsicher', 'ausgabe', 'link', 'beschreibung', 'kurz', 'schwierigkeit'];
        neu.buecher.forEach(bu => {
          const zielBlock = blockNach[bu.blockId] || (DB.bloecke[0] && DB.bloecke[0].id);
          const da = DB.buecher.find(x => x.blockId === zielBlock && x.titel.toLowerCase() === bu.titel.toLowerCase());
          if (da) {
            if (modus === 'abgleichen') {
              katalogFelder.forEach(f => { if (bu[f] !== undefined && bu[f] !== null && bu[f] !== '') da[f] = bu[f]; });
              aktualisiert++;
            }
            return;
          }
          bu.id = uid(); bu.blockId = zielBlock; bu.ord = buecherIn(zielBlock).length;
          bu.notizen.forEach(n => { n.artId = artNach[n.artId] || null; n.themaId = themaNach[n.themaId] || null; });
          DB.buecher.push(bu);
          neuBuch++;
        });
      });
    }
    Store.aendern();
    await Store.sichern(true);
    if (erstStart) { appStarten(); }
    layerSchliessen();
    themeAnwenden();
    viewMalen();
    if (modus === 'ersetzen') toast('Liste geladen.');
    else toast([neuBuch ? pl(neuBuch, 'Buch neu', 'Bücher neu') : '',
      aktualisiert ? aktualisiert + ' aktualisiert' : '',
      (!neuBuch && !aktualisiert) ? 'Nichts zu tun – alles war schon da' : ''].filter(Boolean).join(', ') + '.', 3600);
  };
}
/* ============================================================
   Bilder: aufnehmen, wählen, verkleinern
   ============================================================ */
const BILD_KANTE = 1600, BILD_QUALITAET = 0.75;

function bildVerkleinern(quelle) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const f = Math.min(1, BILD_KANTE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', BILD_QUALITAET));
    };
    img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden'));
    img.src = quelle;
  });
}
function dateiZuBild(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => bildVerkleinern(r.result).then(res, rej);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
function bilderWaehlen(onFertig) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const out = [];
    for (const f of Array.from(inp.files || [])) {
      try { out.push(await dateiZuBild(f)); } catch (e) { console.error(e); }
    }
    inp.remove();
    if (out.length) onFertig(out);
  };
  inp.click();
}
function kameraUeberDateidialog(onFertig) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    try { onFertig([await dateiZuBild(f)]); } catch (e) { toast('Foto konnte nicht verarbeitet werden.'); }
  };
  inp.click();
}

/* Live-Kamera in der Seite; wo die Umgebung sie verbietet, springt die Kamera-App ein. */
async function kameraOeffnen(onFertig) {
  let stream = null, hinten = true;
  const holen = async () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: hinten ? { ideal: 'environment' } : 'user', width: { ideal: 2400 } }, audio: false
    });
    return stream;
  };
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('keine Kamera-Schnittstelle');
    await holen();
  } catch (e) {
    console.warn('Live-Kamera nicht möglich:', e);
    kameraUeberDateidialog(onFertig);
    return;
  }

  const aufnahmen = [];
  const node = document.createElement('div');
  node.className = 'cam';
  node.innerHTML = `
    <video playsinline autoplay muted></video>
    <div class="cam-strip" data-strip hidden></div>
    <div class="cam-bar">
      <button class="cam-side" data-abbruch style="text-align:left">Abbrechen</button>
      <button class="cam-shutter" data-shot aria-label="Auslösen"></button>
      <button class="cam-side" data-fertig style="text-align:right;font-weight:600">Fertig</button>
    </div>`;
  const video = $('video', node);
  video.srcObject = stream;

  const schliessen = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
  layerOeffnen(node, schliessen);

  $('[data-shot]', node).onclick = async () => {
    const c = document.createElement('canvas');
    const f = Math.min(1, BILD_KANTE / Math.max(video.videoWidth, video.videoHeight));
    c.width = Math.round(video.videoWidth * f); c.height = Math.round(video.videoHeight * f);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    const d = c.toDataURL('image/jpeg', BILD_QUALITAET);
    aufnahmen.push(d);
    const strip = $('[data-strip]', node);
    strip.hidden = false;
    const im = document.createElement('img'); im.src = d; strip.appendChild(im);
    strip.scrollLeft = strip.scrollWidth;
  };
  $('[data-abbruch]', node).onclick = () => layerSchliessen();
  $('[data-fertig]', node).onclick = () => { layerSchliessen(); if (aufnahmen.length) onFertig(aufnahmen); };
}

function bildGross(bilder, start, onLoeschen) {
  let i = start || 0;
  const node = document.createElement('div');
  node.className = 'lightbox';
  node.innerHTML = `<img alt="Foto zur Notiz">
    <div class="lb-bar">
      <button class="btn btn-sm btn-ghost" data-prev>Zurück</button>
      <span class="num" data-zaehler></span>

        ${onLoeschen ? `<button class="btn btn-sm btn-danger" data-del>${ICON.trash}</button>` : ''}

        <button class="btn btn-sm btn-ghost" data-zu>Schließen</button>
      </span>

  const malen = () => {

/* ============================================================
   Buchansicht: wischen zwischen Beschreibung, Themen, Arten, Lesen
   ============================================================ */
const SEITEN = [
  { id: 'beschreibung', label: 'Beschreibung' },
  { id: 'autor', label: 'Autor' },
  { id: 'themen', label: 'Themenfelder' },
  { id: 'arten', label: 'Arten' },
  { id: 'notizen', label: 'Alle Notizen' },
  { id: 'galerie', label: 'Galerie' }
];

function buchOeffnen(buchId, startSeite) {
  const b = buchById(buchId);
  if (!b) return;
  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back aria-label="Zurück">${ICON.back}</button>
      <div class="grow">
        <div class="ovl-title serif" data-t></div>
        <div class="ovl-sub" data-s></div>
      </div>
      <button class="status-btn" data-status aria-label="Status ändern"></button>
      <button class="icon-btn" data-edit aria-label="Buch bearbeiten">${ICON.edit}</button>
    </div>
    <div class="pagertabs">${SEITEN.map((s, i) => `<button data-go="${i}" aria-selected="${i === 0}">${s.label}</button>`).join('')}</div>
    <div class="pager">${SEITEN.map(s => `<section class="page" data-page="${s.id}"></section>`).join('')}</div>`;

  const pager = $('.pager', node);
  const tabs = $$('[data-go]', node);

  const kopf = () => {
    const blk = blockById(b.blockId);
    $('[data-t]', node).textContent = b.titel;
    $('[data-s]', node).textContent = [b.autor, blk && blk.name].filter(Boolean).join(' · ');
    const st = $('[data-status]', node);
    st.dataset.status = b.status;
    st.title = STATUS[b.status];
    st.innerHTML = b.status === 'gelesen' ? ICON.check : b.status === 'lese' ? ICON.read : '';
  };
  const allesMalen = () => {
    kopf();
    seiteBeschreibung(b, $('[data-page="beschreibung"]', node), allesMalen);
    seiteAutor(b, $('[data-page="autor"]', node), allesMalen);
    seiteGruppen(b, $('[data-page="themen"]', node), 'thema', allesMalen);
    seiteGruppen(b, $('[data-page="arten"]', node), 'art', allesMalen);
    seiteAlleNotizen(b, $('[data-page="notizen"]', node), allesMalen);
    seiteGalerie(b, $('[data-page="galerie"]', node), allesMalen);
    viewMalen();
  };

  $('[data-back]', node).onclick = () => layerSchliessen();
  $('[data-edit]', node).onclick = () => buchBearbeiten(b, b.blockId, allesMalen);
  $('[data-status]', node).onclick = () => {
    const folge = { offen: 'lese', lese: 'gelesen', gelesen: 'offen' };
    aendern(() => { b.status = folge[b.status] || 'offen'; });
    allesMalen();
    toast(STATUS[b.status]);
  };
  /* Der Reiter folgt dem Wischen sofort – kein Nachlaufen. */
  let aktiveSeite = 0;
  const reiterSetzen = i => {
    if (i === aktiveSeite) return;
    aktiveSeite = i;
    tabs.forEach((t, k) => t.setAttribute('aria-selected', String(k === i)));
    const akt = tabs[i];
    if (akt) akt.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  };
  tabs.forEach((t, i) => t.onclick = () => {
    reiterSetzen(i);
    pager.scrollTo({ left: pager.clientWidth * i, behavior: 'smooth' });
  });
  pager.addEventListener('scroll', () => {
    reiterSetzen(Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth)));
  }, { passive: true });

  layerOeffnen(node);
  allesMalen();
  if (startSeite) {
    const i = SEITEN.findIndex(s => s.id === startSeite);
    if (i > 0) requestAnimationFrame(() => { pager.scrollLeft = pager.clientWidth * i; tabs.forEach((t, k) => t.setAttribute('aria-selected', String(k === i))); });
  }
}

/* ---------- Seite 1: Beschreibung und Daten ---------- */

    </div>
    ${b.ausgabe ? `<p class="muted" style="font-size:12px;margin-top:10px">Ausgabe: ${esc(b.ausgabe)}</p>` : ''}
    ${b.link ? `<p style="font-size:12px;margin-top:8px"><a href="${esc(b.link)}" target="_blank" rel="noopener noreferrer"
      style="color:var(--accent);word-break:break-all">${esc(b.link)}</a></p>` : ''}
    ${b.kurz ? `<p class="muted" style="font-size:12.5px;margin-top:10px;font-family:'Literata',Georgia,serif">In Kürze: ${esc(b.kurz)}</p>` : ''}
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-primary" data-neu-notiz style="flex:1">${ICON.plus} Notiz anlegen</button>
      <button class="btn" data-alle-notizen>Alle Notizen (${b.notizen.length})</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn" data-lesen style="flex:1">${laeuftHier ? ICON.pause + ' Sitzung beenden' : ICON.play + ' Sitzung starten'}</button>
      <button class="btn" data-sitzungen>Sitzungen (${b.sessions.length})</button>
    </div>`;

  $('[data-alle-notizen]', root).onclick = () => notizListe(b, { alle: true }, neuMalen);
  $('[data-lesen]', root).onclick = () => { laeuftHier ? sitzungBeenden() : sitzungStarten(b.id); neuMalen(); };

/* ---------- Seiten 2 und 3: Themenfelder und Arten ---------- */
function seiteGruppen(b, root, art, neuMalen) {
  const nachThema = art === 'thema';
  const map = new Map();
  b.notizen.forEach(n => {
    const key = (nachThema ? n.themaId : n.artId) || '__ohne';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(n);
  });
  const gruppen = Array.from(map.entries()).sort((a, c) => c[1].length - a[1].length);

  root.innerHTML = `
    <div class="section-head" style="padding:0">
      <h2>${nachThema ? 'Themenfelder in diesem Buch' : 'Notizen nach Art'}</h2>
      <button class="btn btn-sm" data-neu>${ICON.plus} Notiz</button>
    </div>
    ${gruppen.length ? '' : `<div class="empty" style="margin:8px 0 0"><strong>Noch keine Notizen</strong>${nachThema
      ? 'Sobald du Notizen anlegst und ihnen ein Themenfeld gibst, sammeln sie sich hier.'
      : 'Zitat, Gedanke, Frage, Kritik – hier liegen sie später nach Art sortiert.'}</div>`}
    <div data-liste style="margin-top:10px"></div>`;

  const liste = $('[data-liste]', root);
  gruppen.forEach(([key, notizen]) => {
    const ohne = key === '__ohne';
    const name = ohne ? (nachThema ? 'Ohne Themenfeld' : 'Ohne Art') : (nachThema ? themaName(key) : artName(key));
    const farbe = !nachThema && !ohne ? artFarbe(key) : null;
    const seiten = notizen.map(n => seiteZahl(n.seite)).filter(x => isFinite(x)).sort((a, c) => a - c);
    const row = document.createElement('button');
    row.className = 'grouprow';
    row.innerHTML = `
      ${farbe ? `<span class="chip" style="border-color:${farbe};color:${farbe};background:transparent;padding:3px 9px"><span class="swatch" style="background:${farbe}"></span></span>` : ''}
      <span class="grow">
        <span class="gname">${esc(name)}</span>
        <span class="gmeta">${notizen.length} ${notizen.length === 1 ? 'Notiz' : 'Notizen'}${seiten.length ? ' · S. ' + seiten[0] + (seiten.length > 1 ? '–' + seiten[seiten.length - 1] : '') : ''}</span>
      </span>
      <span class="count num">${notizen.length}</span>
      <span class="chev">${ICON.chev}</span>`;
    row.onclick = () => notizListe(b, nachThema ? { themaId: ohne ? null : key } : { artId: ohne ? null : key }, neuMalen);
    liste.appendChild(row);
  });

  $('[data-neu]', root).onclick = () => notizBearbeiten(b, null, {}, neuMalen);
}

/* ---------- Seite 4: alle Notizen, nach Seitenzahl ---------- */
function seiteAlleNotizen(b, root, neuMalen) {
  const notizen = b.notizen.slice().sort((a, c) => seiteZahl(a.seite) - seiteZahl(c.seite));
  root.innerHTML = `
    <div class="section-head" style="padding:0">
      <h2>Alle Notizen (${b.notizen.length})</h2>

/* ---------- Seite 5: alle Fotos des Buches ---------- */
function seiteGalerie(b, root, neuMalen) {
  const bilder = [];
  b.notizen.slice().sort((a, c) => seiteZahl(a.seite) - seiteZahl(c.seite))
    .forEach(n => n.bilder.forEach(x => bilder.push({ id: x.id, src: x.src, seite: n.seite, notiz: n })));
  root.innerHTML = `
    <div class="section-head" style="padding:0">
      <h2>Galerie (${pl(bilder.length, 'Foto', 'Fotos')})</h2>
      ${bilder.length ? `<span class="eyebrow">aus ${pl(b.notizen.filter(n => n.bilder.length).length, 'Notiz', 'Notizen')}</span>` : ''}
    </div>
    ${bilder.length
      ? `<div class="gal" data-g style="margin-top:10px"></div>
         <p class="hinweis">Tippen zeigt das Foto groß; von dort geht es zur Notiz.</p>`
      : `<div class="empty" style="margin:8px 0 0"><strong>Noch keine Fotos</strong>Fotografiere in einer Notiz eine Seite ab – alle Bilder des Buches sammeln sich hier.</div>`}`;

  const g = $('[data-g]', root);
  if (!g) return;
  bilder.forEach((bi, i) => {
    const btn = document.createElement('button');
    btn.innerHTML = `<img src="${bi.src}" alt="Foto${bi.seite ? ' zu Seite ' + esc(seiteText(bi.seite)) : ''}">
      ${bi.seite ? `<span class="cap">S. ${esc(seiteText(bi.seite))}</span>` : ''}`;
    btn.onclick = () => bildGrossMitNotiz(b, bilder, i, neuMalen);
    g.appendChild(btn);
  });
}

function notizListe(b, filter, neuMalen) {
  const node = document.createElement('div');
  node.className = 'overlay';
  const titel = filter.alle ? 'Alle Notizen'
    : ('themaId' in filter) ? (filter.themaId ? themaName(filter.themaId) : 'Ohne Themenfeld')
      : (filter.artId ? artName(filter.artId) : 'Ohne Art');
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif">${esc(titel)}</div><div class="ovl-sub">${esc(b.titel)}</div></div>
      <button class="icon-btn" data-neu>${ICON.plus}</button>
    </div>
    <div class="ovl-body" style="padding:12px 14px 40px" data-liste></div>`;

  const passt = n => filter.alle ? true
    : ('themaId' in filter) ? ((n.themaId || null) === filter.themaId)
      : ((n.artId || null) === filter.artId);

  const malen = () => {
    const liste = $('[data-liste]', node);
    const notizen = b.notizen.filter(passt).sort((a, c) => seiteZahl(a.seite) - seiteZahl(c.seite));
    liste.innerHTML = notizen.length ? '' : `<div class="empty"><strong>Leer</strong>Hier ist noch keine Notiz.</div>`;
    notizen.forEach(n => liste.appendChild(notizKarte(b, n, () => { malen(); if (neuMalen) neuMalen(); })));
    if (neuMalen) neuMalen();
  };

  $('[data-back]', node).onclick = () => layerSchliessen();
  $('[data-neu]', node).onclick = () => notizBearbeiten(b, null, {
    themaId: 'themaId' in filter ? filter.themaId : undefined,
    artId: 'artId' in filter ? filter.artId : undefined
  }, malen);

  layerOeffnen(node);
  malen();
}

function notizKarte(b, n, neuMalen) {
  const node = document.createElement('div');
  node.className = 'note';
  const istZitat = artName(n.artId).toLowerCase() === 'zitat';
  node.innerHTML = `
    <div class="note-top">
      ${n.seite ? `<span class="note-page">S. ${esc(seiteText(n.seite))}</span>` : ''}
      ${n.artId ? `<span class="arttag" style="background:color-mix(in srgb,${artFarbe(n.artId)} 20%,transparent);color:${artFarbe(n.artId)}">${esc(artName(n.artId))}</span>` : ''}
      ${n.themaId ? `<span class="themetag">${esc(themaName(n.themaId))}</span>` : ''}
      <span style="flex:1"></span>
      <button class="icon-btn" data-edit style="width:28px;height:28px">${ICON.edit}</button>
    </div>
    <div class="note-text ${istZitat ? 'quote' : ''}">${esc(n.text) || '<span style="color:var(--text-3)">(kein Text)</span>'}</div>
    ${n.bilder.length ? `<div class="note-thumbs">${n.bilder.map((x, i) => `<img src="${x.src}" data-bild="${i}" alt="Foto ${i + 1}">`).join('')}</div>` : ''}`;
  $('[data-edit]', node).onclick = () => notizBearbeiten(b, n, {}, neuMalen);
  $$('[data-bild]', node).forEach(im => im.onclick = () => bildGross(n.bilder, +im.dataset.bild, null));
  return node;
}

/* ---------- Notiz anlegen und bearbeiten ---------- */
function notizBearbeiten(b, notiz, vorgabe, neuMalen) {
  const neu = !notiz;
  const n = notiz || {
    id: uid(), seite: null,
    themaId: vorgabe.themaId !== undefined ? vorgabe.themaId : null,
    artId: vorgabe.artId !== undefined ? vorgabe.artId : (DB.arten[0] ? DB.arten[0].id : null),
    text: '', bilder: [], erstellt: Date.now(), geaendert: Date.now()
  };
  const bilder = n.bilder.slice();
  let artId = n.artId;

  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif">${neu ? 'Neue Notiz' : 'Notiz'}</div><div class="ovl-sub">${esc(b.titel)}</div></div>
      ${neu ? '' : `<button class="icon-btn" data-del>${ICON.trash}</button>`}
      <button class="btn btn-primary btn-sm" data-ok>Sichern</button>
    </div>
    <div class="ovl-body" style="padding:14px 14px 40px">
      <div class="grid2">
        <div class="field"><label>Seite</label>
          <input type="text" inputmode="text" data-seite value="${esc(seiteText(n.seite))}" placeholder="42 oder 35-36">
        </div>
        <div class="field"><label>Themenfeld</label>
          <input type="text" data-thema list="themenListe" value="${esc(n.themaId ? themaName(n.themaId) : '')}" placeholder="z.B. Entfremdung">
        </div>
      </div>
      <datalist id="themenListe">${DB.themen.map(t => `<option value="${esc(t.name)}">`).join('')}</datalist>
      <div class="field">
        <label>Art</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap" data-arten></div>
      </div>
      <div class="field">
        <label>Text</label>
        <textarea data-text style="min-height:150px;font-family:'Literata',Georgia,serif;line-height:1.65" placeholder="Zitat, Gedanke, Frage …">${esc(n.text)}</textarea>
      </div>
      <div class="field">
        <label>Fotos</label>
        <div class="shots" data-shots></div>
      </div>
    </div>`;

  const artenMalen = () => {
    const wrap = $('[data-arten]', node);
    wrap.innerHTML = DB.arten.map(a =>
      `<button class="chip" data-art="${a.id}" aria-pressed="${a.id === artId}" style="${a.id === artId ? `border-color:var(--${a.farbe});color:var(--${a.farbe});background:color-mix(in srgb,var(--${a.farbe}) 15%,transparent)` : ''}">
        <span class="swatch" style="background:var(--${a.farbe})"></span>${esc(a.name)}</button>`).join('')
      + `<button class="chip" data-neue-art>${ICON.plus} Art</button>`;
    $$('[data-art]', wrap).forEach(x => x.onclick = () => { artId = (artId === x.dataset.art) ? null : x.dataset.art; artenMalen(); });
    $('[data-neue-art]', wrap).onclick = () => {
      const s = blatt('Neue Art', `
        <div class="field"><label>Name</label><input type="text" data-n placeholder="z.B. Sonstiges"></div>
        <button class="btn btn-primary btn-block" data-ok>Anlegen</button>`);
      $('[data-ok]', s).onclick = () => {
        const name = $('[data-n]', s).value.trim();
        if (!name) return;
        const a = { id: uid(), name, farbe: ART_FARBEN[DB.arten.length % 8] };
        aendern(() => DB.arten.push(a));
        artId = a.id;
        layerSchliessen(); artenMalen();
      };
    };
  };

  const shotsMalen = () => {
    const wrap = $('[data-shots]', node);
    wrap.innerHTML = bilder.map((x, i) => `
      <div class="shot"><img src="${x.src}" data-gross="${i}" alt="Foto ${i + 1}"><button class="x" data-weg="${i}" aria-label="Foto entfernen">${ICON.x}</button></div>`).join('')
      + `<button class="addshot" data-kamera>${ICON.cam}Kamera</button>
         <button class="addshot" data-galerie>${ICON.img}Galerie</button>`;
    $$('[data-weg]', wrap).forEach(x => x.onclick = e => { e.stopPropagation(); bilder.splice(+x.dataset.weg, 1); shotsMalen(); });
    $$('[data-gross]', wrap).forEach(x => x.onclick = () => bildGross(bilder, +x.dataset.gross, w => {
      const i = bilder.indexOf(w); if (i >= 0) bilder.splice(i, 1); shotsMalen();
    }));
    $('[data-kamera]', wrap).onclick = () => kameraOeffnen(neue => { neue.forEach(src => bilder.push({ id: uid(), src, ts: Date.now() })); shotsMalen(); });
    $('[data-galerie]', wrap).onclick = () => bilderWaehlen(neue => { neue.forEach(src => bilder.push({ id: uid(), src, ts: Date.now() })); shotsMalen(); });
  };

  $('[data-back]', node).onclick = () => layerSchliessen();
  $('[data-ok]', node).onclick = () => {
    const text = $('[data-text]', node).value.trim();
    if (!text && !bilder.length) { toast('Ohne Text und ohne Foto gibt es nichts zu sichern.'); return; }
    aendern(() => {
      const roheSeite = $('[data-seite]', node).value.trim();
      n.seite = roheSeite || null;
      n.themaId = themaFindenOderAnlegen($('[data-thema]', node).value);
      n.artId = artId;
      n.text = text;
      n.bilder = bilder;
      n.geaendert = Date.now();
      if (neu) b.notizen.push(n);
    });
    layerSchliessen();
    if (neuMalen) neuMalen();
    toast(neu ? 'Notiz angelegt.' : 'Notiz gesichert.');
  };
  if (!neu) $('[data-del]', node).onclick = async () => {
    const ok = await bestaetigen('Notiz löschen?', 'Text und ' + n.bilder.length + ' Foto(s) sind dann weg.', 'Löschen', true);
    if (!ok) return;
    aendern(() => { b.notizen = b.notizen.filter(x => x.id !== n.id); });
    layerSchliessen();
    if (neuMalen) neuMalen();
  };

  layerOeffnen(node);
  artenMalen();
  shotsMalen();
}
/* ============================================================
   Seite 4: Lesen – Stoppuhr und Sitzungen
   ============================================================ */
let uhrTick = null;

function laufenderTimer() { return DB.einstellungen.timer || null; }
function timerMinuten(t) { return (Date.now() - t.startTs) / 60000; }

function seiteLesen(b, root, neuMalen) {
  const t = laufenderTimer();
  const laeuftHier = t && t.buchId === b.id;
  const min = buchMinuten(b);
  const gelesen = buchSeitenGelesen(b);
  const tempo = buchTempo(b);
  const letzte = b.sessions.slice().sort((x, y) => (x.datum < y.datum ? 1 : -1))[0];
  const stand = b.sessions.reduce((m, s) => Math.max(m, s.bis || 0), 0);
  const rest = (b.seiten && stand) ? Math.max(0, b.seiten - stand) : null;
  const restZeit = (rest != null && tempo) ? rest / tempo * 60 : null;

  root.innerHTML = `
    <div class="card" style="padding:14px;margin-bottom:14px">
      <div class="eyebrow" style="text-align:center">${laeuftHier ? 'läuft' : (min ? 'bisher gelesen' : 'Stoppuhr')}</div>
      <div class="timer-big" data-uhr>00:00:00</div>
      <div class="btn-row" style="justify-content:center;margin-top:10px">
        <button class="btn ${laeuftHier ? 'btn-danger' : 'btn-primary'}" data-uhr-btn style="min-width:170px">
          ${laeuftHier ? ICON.pause + ' Sitzung beenden' : ICON.play + ' Sitzung starten'}
        </button>
      </div>
      ${t && !laeuftHier ? `<p class="hinweis" style="text-align:center;padding-bottom:0">Eine Stoppuhr läuft gerade bei „${esc((buchById(t.buchId) || {}).titel || 'einem anderen Buch')}“.</p>` : ''}
    </div>

    <div class="factgrid" style="margin-top:0">
      <div class="fact"><div class="k">Lesezeit</div><div class="v">${min ? fmtDauer(min) : '–'}</div></div>
      <div class="fact"><div class="k">Seiten gelesen</div><div class="v">${gelesen || '–'}</div></div>
      <div class="fact"><div class="k">Tempo</div><div class="v">${tempo ? fmtZahl(tempo) + ' <small>S./h</small>' : '–'}</div></div>
      <div class="fact"><div class="k">Stand</div><div class="v">${stand ? 'S. ' + stand : '–'}</div></div>
      <div class="fact"><div class="k">Rest</div><div class="v">${rest != null ? rest + ' <small>S.</small>' : '–'}</div></div>
      <div class="fact"><div class="k">Noch etwa</div><div class="v" style="font-size:12.5px">${restZeit ? fmtDauer(restZeit) : '–'}</div></div>
    </div>

    <div class="section-head" style="padding:0;margin:18px 0 9px">
      <h2>Sitzungen (${b.sessions.length})</h2>
      <button class="btn btn-sm" data-neu-session>${ICON.plus} Eintragen</button>
    </div>
    <div class="list-card" data-sessions></div>`;

  const uhrMalen = () => {
    const tt = laufenderTimer();
    const el = $('[data-uhr]', root);
    if (!el) return;
    if (!tt || tt.buchId !== b.id) { el.textContent = min ? fmtDauer(min) : '00:00:00'; return; }
    const s = Math.floor((Date.now() - tt.startTs) / 1000);
    el.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':');
  };
  uhrMalen();
  clearInterval(uhrTick);
  if (laeuftHier) uhrTick = setInterval(uhrMalen, 1000);

  $('[data-uhr-btn]', root).onclick = () => {
    if (laeuftHier) {
      const minuten = Math.max(1, Math.round(timerMinuten(t)));
      aendern(() => { DB.einstellungen.timer = null; });
      clearInterval(uhrTick);
      sessionBearbeiten(b, null, { minuten, von: stand || null }, neuMalen);
    } else {
      aendern(() => {
        DB.einstellungen.timer = { buchId: b.id, startTs: Date.now() };
        if (b.status === 'offen') b.status = 'lese';
      });
      neuMalen();
    }
  };
  $('[data-neu-session]', root).onclick = () => sessionBearbeiten(b, null, { von: stand || null }, neuMalen);

  const wrap = $('[data-sessions]', root);
  const sess = b.sessions.slice().sort((x, y) => (x.datum < y.datum ? 1 : x.datum > y.datum ? -1 : 0));
  if (!sess.length) {
    wrap.innerHTML = `<div class="hinweis" style="padding:16px 14px">Noch keine Sitzung. Starte die Stoppuhr oder trage eine vergangene Sitzung von Hand ein – beides lässt sich später korrigieren.</div>`;
  }
  sess.forEach(s => {
    const row = document.createElement('button');
    row.className = 'rowline';
    row.style.width = '100%';
    row.style.textAlign = 'left';
    row.innerHTML = `
      <span class="grow">
        <span class="rn num">${fmtDatum(s.datum)}</span>
        <span class="rm">${fmtDauer(s.minuten)}${(s.von != null && s.bis != null) ? ' · S. ' + s.von + '–' + s.bis : ''}${s.notiz ? ' · ' + esc(s.notiz) : ''}</span>
      </span>
      <span class="chev">${ICON.chev}</span>`;
    row.onclick = () => sessionBearbeiten(b, s, {}, neuMalen);
    wrap.appendChild(row);
  });
}

/* „nachSitzung“ heisst: die Stoppuhr wurde gerade beendet. Dann darf das
   Blatt nicht stillschweigend verschwinden – die gelesene Zeit wäre weg. */
function sessionBearbeiten(b, session, vorgabe, neuMalen, nachSitzung) {
  const neu = !session;
  const s0 = session || {
    id: uid(), datum: heute(), minuten: vorgabe.minuten || 0,
    von: vorgabe.von != null ? vorgabe.von : null,
    bis: vorgabe.bis != null ? vorgabe.bis : null,
    notiz: vorgabe.notiz || ''
  };
  if (vorgabe && vorgabe.datum) s0.datum = vorgabe.datum;
  let gespeichert = false;
  const s = blatt(neu ? 'Sitzung eintragen' : 'Sitzung ändern', `
    <div class="grid2">
      <div class="field"><label>Datum</label><input type="date" data-datum value="${s0.datum}"></div>
      <div class="field"><label>Dauer in Minuten</label><input type="number" data-min value="${s0.minuten || ''}" placeholder="45"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Seite von</label><input type="number" data-von value="${s0.von == null ? '' : s0.von}"></div>
      <div class="field"><label>Seite bis</label><input type="number" data-bis value="${s0.bis == null ? '' : s0.bis}"></div>
    </div>
    <div class="field"><label>Notiz</label><input type="text" data-notiz value="${esc(s0.notiz || '')}" placeholder="z.B. im Zug, laut gelesen"></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary" data-ok style="flex:1">${neu ? 'Eintragen' : 'Sichern'}</button>
      ${neu ? '' : `<button class="btn btn-danger" data-del>${ICON.trash}</button>`}
    </div>`, {
    fokus: false,
    onClose: () => {
      if (gespeichert || !nachSitzung) return;
      /* Die Felder liegen noch im abgehängten Blatt – der Stand geht also
         nicht verloren, falls nachgetragen wird. */
      const stand = {
        datum: $('[data-datum]', s).value || heute(),
        minuten: num($('[data-min]', s).value) || 0,
        von: num($('[data-von]', s).value),
        bis: num($('[data-bis]', s).value),
        notiz: $('[data-notiz]', s).value.trim()
      };
      setTimeout(() => sitzungVerwerfenFragen(b, stand, neuMalen), 60);
    }
  });

  $('[data-ok]', s).onclick = () => {
    const minuten = num($('[data-min]', s).value) || 0;
    if (minuten <= 0) { toast('Wie lange war die Sitzung?'); return; }
    aendern(() => {
      s0.datum = $('[data-datum]', s).value || heute();
      s0.minuten = minuten;
      s0.von = num($('[data-von]', s).value);
      s0.bis = num($('[data-bis]', s).value);
      s0.notiz = $('[data-notiz]', s).value.trim();
      if (neu) b.sessions.push(s0);
      if (b.status === 'offen') b.status = 'lese';
      if (b.seiten && s0.bis && s0.bis >= b.seiten) b.status = 'gelesen';
    });
    gespeichert = true;
    layerSchliessen();
    /* Eine eingetragene Sitzung wird sofort weggeschrieben, nicht erst beim
       nächsten Takt der Selbstsicherung. */
    Store.sichern(true);
    if (neuMalen) neuMalen();
  };
  if (!neu) $('[data-del]', s).onclick = async () => {
    const ok = await bestaetigen('Sitzung löschen?', fmtDatum(s0.datum) + ', ' + fmtDauer(s0.minuten), 'Löschen', true);
    if (!ok) return;
    aendern(() => { b.sessions = b.sessions.filter(x => x.id !== s0.id); });
    gespeichert = true;
    layerSchliessen();
    Store.sichern(true);
    if (neuMalen) neuMalen();
  };
}

/* Weggezogen, ohne einzutragen: nachfragen statt die Zeit verfallen lassen. */
function sitzungVerwerfenFragen(b, stand, neuMalen) {
  const dauer = stand.minuten > 0 ? fmtDauer(stand.minuten) : 'Die Sitzung';
  const s = blatt('Nicht eingetragen', `
    <p class="muted" style="font-size:13.5px;line-height:1.6;margin-bottom:16px">
      ${esc(dauer)}${stand.minuten > 0 ? ' Lesezeit' : ''} an „${esc(b.titel)}“ ist noch nicht eingetragen.
      Verworfen taucht sie nirgends mehr auf – weder im Protokoll noch im Tagesziel.
    </p>
    <div class="btn-row">
      <button class="btn btn-primary" data-nach style="flex:1">Nachtragen</button>
      <button class="btn btn-danger" data-weg style="flex:1">Verwerfen</button>
    </div>`, { fokus: false });
  $('[data-nach]', s).onclick = () => {
    layerSchliessen();
    setTimeout(() => sessionBearbeiten(b, null, stand, neuMalen, true), 60);
  };
  $('[data-weg]', s).onclick = () => { layerSchliessen(); toast('Sitzung verworfen.'); };
}

/* ============================================================
   Diagramme
   ============================================================ */
let tipEl = null;
function tipZeigen(e, titel, wert) {
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
  tipEl.innerHTML = `<div class="tt">${esc(titel)}</div><div class="tv">${esc(wert)}</div>`;
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  const x = clamp((e.clientX || 0) - r.width / 2, 8, window.innerWidth - r.width - 8);
  const y = Math.max(8, (e.clientY || 0) - r.height - 14);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function tipWeg() { if (tipEl) tipEl.hidden = true; }
document.addEventListener('scroll', tipWeg, true);

function karte(titel, cap, inhaltHtml, legende, tabelle) {
  const d = document.createElement('div');
  d.className = 'chart';
  d.innerHTML = `
    <div class="chart-head"><h3>${esc(titel)}</h3>${cap ? `<div class="cap">${cap}</div>` : ''}</div>
    ${inhaltHtml}
    ${legende ? `<div class="legend">${legende}</div>` : ''}
    ${tabelle ? `<details><summary>Als Tabelle</summary><div class="chart-scroll">${tabelle}</div></details>` : ''}`;
  d.addEventListener('pointerover', e => {
    const el = e.target.closest('[data-tip]');
    if (el) tipZeigen(e, el.dataset.tipT || '', el.dataset.tip);
  });
  d.addEventListener('pointermove', e => {
    const el = e.target.closest('[data-tip]');
    if (el) tipZeigen(e, el.dataset.tipT || '', el.dataset.tip); else tipWeg();
  });
  d.addEventListener('pointerleave', tipWeg);
  return d;
}

/* Waagerechte Balken, notfalls gestapelt. */
function balken(items, opts) {
  opts = opts || {};
  const max = Math.max(1, ...items.map(i => i.segmente ? i.segmente.reduce((s, x) => s + x.wert, 0) : i.wert));
  return `<div class="bars">` + items.map(i => {
    const segs = i.segmente || [{ wert: i.wert, farbe: i.farbe || 'var(--s1)', name: i.label }];
    return `<div class="barrow">
      <div class="blab" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="btrack">
        ${segs.filter(s => s.wert > 0).map(s => `<div class="bseg" style="width:${s.wert / max * 100}%;background:${s.farbe}"
            data-tip="${esc(s.name || i.label)}: ${esc(opts.fmt ? opts.fmt(s.wert) : fmtZahl(s.wert))}" data-tip-t="${esc(i.label)}"></div>`).join('')}
      </div>
      <div class="bval">${i.anzeige != null ? esc(i.anzeige) : esc(opts.fmt ? opts.fmt(i.wert) : fmtZahl(i.wert))}</div>
    </div>`;
  }).join('') + `</div>`;
}
function tabelleHtml(kopf, zeilen) {
  return `<table><thead><tr>${kopf.map((k, i) => `<th${i ? ' class="n"' : ''}>${esc(k)}</th>`).join('')}</tr></thead><tbody>`
    + zeilen.map(z => `<tr>${z.map((c, i) => `<td${i ? ' class="n"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')
    + `</tbody></table>`;
}

/* Senkrechte Balken über die Zeit (SVG). */
function zeitBalken(punkte, fmt) {
  const W = 320, H = 120, padL = 4, padB = 20;
  const max = Math.max(1, ...punkte.map(p => p.wert));
  const bw = (W - padL) / Math.max(1, punkte.length);
  const breite = Math.min(bw * 0.68, 26);
  const bars = punkte.map((p, i) => {
    const h = p.wert / max * (H - padB - 6);
    const x = padL + i * bw + (bw - breite) / 2, y = H - padB - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${breite.toFixed(1)}" height="${Math.max(h, p.wert ? 2 : 0).toFixed(1)}" rx="3" fill="var(--s1)"
      data-tip="${esc(fmt(p.wert))}" data-tip-t="${esc(p.label)}"></rect>`;
  }).join('');
  const schritte = Math.ceil(punkte.length / 6);
  const achse = punkte.map((p, i) => (i % schritte === 0 || i === punkte.length - 1)
    ? `<text x="${padL + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--text-3)">${esc(p.kurz)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    <line x1="0" y1="${H - padB}" x2="${W}" y2="${H - padB}" stroke="var(--grid)" stroke-width="1"/>
    <line x1="0" y1="${(H - padB) / 2}" x2="${W}" y2="${(H - padB) / 2}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"/>
    ${bars}${achse}
    <text x="2" y="10" font-size="9" fill="var(--text-3)">${esc(fmt(max))}</text>
  </svg>`;
}

/* Kumulierte Linie mit Fläche (SVG). */
function linie(punkte, fmt) {
  const W = 320, H = 120, padB = 20;
  const max = Math.max(1, ...punkte.map(p => p.wert));
  const x = i => punkte.length > 1 ? i / (punkte.length - 1) * (W - 8) + 4 : W / 2;
  const y = v => H - padB - (v / max) * (H - padB - 8);
  const d = punkte.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.wert).toFixed(1)).join(' ');
  const flaeche = d + ` L ${x(punkte.length - 1).toFixed(1)} ${H - padB} L ${x(0).toFixed(1)} ${H - padB} Z`;
  const letzter = punkte[punkte.length - 1];
  const schritte = Math.ceil(punkte.length / 6);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    <line x1="0" y1="${H - padB}" x2="${W}" y2="${H - padB}" stroke="var(--grid)" stroke-width="1"/>
    <path d="${flaeche}" fill="var(--s3)" opacity=".13"/>
    <path d="${d}" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${punkte.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.wert).toFixed(1)}" r="${i === punkte.length - 1 ? 4 : 3.2}"
        fill="${i === punkte.length - 1 ? 'var(--s3)' : 'var(--chart-surface)'}" stroke="var(--s3)" stroke-width="2"
        data-tip="${esc(fmt(p.wert))}" data-tip-t="${esc(p.label)}"/>`).join('')}
    <text x="${x(punkte.length - 1) - 4}" y="${Math.max(12, y(letzter.wert) - 9)}" text-anchor="end" font-size="10" fill="var(--text-2)" font-family="IBM Plex Mono, monospace">${esc(fmt(letzter.wert))}</text>
    ${punkte.map((p, i) => (i % schritte === 0 || i === punkte.length - 1)
      ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--text-3)">${esc(p.kurz)}</text>` : '').join('')}
  </svg>`;
}

function monatsListe(von, bis) {
  const out = [];
  const d = new Date(von.getFullYear(), von.getMonth(), 1);
  const ende = new Date(bis.getFullYear(), bis.getMonth(), 1);
  while (d <= ende && out.length < 72) {
    out.push({ key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: MONATE[d.getMonth()] + ' ' + d.getFullYear(), kurz: MONATE[d.getMonth()] });
    d.setMonth(d.getMonth() + 1);
  }
  return out;
}

let uebersichtAllePlaene = false;
let uebersichtUnter = 'zahlen';

/* ===== Vorhang: eine Ebene am Finger auf- und zuziehen =====
   Vorbild ist der Kartenstapel beim Stöbern: die Fläche folgt der Hand 1:1,
   eine kurze Schwelle oder ein Schwung entscheidet beim Loslassen. Statt zu
   verschieben wird hier von oben aufgedeckt – die Kante liegt unter der
   Fingerkuppe, der Inhalt bleibt an seinem Platz. */
function vorhangSchwelle(hoehe) { return Math.max(96, (hoehe || 640) * 0.14); }

/* Während eine Ebene am Finger hängt, wird der Grund dahinter unscharf –
   ansteigend mit dem Weg, damit man sieht, wie weit man ist. */
let unschaerfeEl = null;
function unschaerfeSetzen(f, weich) {
  const a = clamp(f, 0, 1);
  if (a <= 0.001) {
    if (!unschaerfeEl) return;
    const el = unschaerfeEl;
    unschaerfeEl = null;
    el.style.transition = weich ? 'backdrop-filter .2s ease,-webkit-backdrop-filter .2s ease,opacity .2s ease' : '';
    el.style.backdropFilter = 'blur(0px)';
    el.style.webkitBackdropFilter = 'blur(0px)';
    el.style.opacity = '0';
    setTimeout(() => { if (el.isConnected) el.remove(); }, weich ? 220 : 0);
    return;
  }
  if (!unschaerfeEl) {
    unschaerfeEl = document.createElement('div');
    unschaerfeEl.className = 'unschaerfe';
    document.body.appendChild(unschaerfeEl);
  }
  const px = (a * 9).toFixed(2) + 'px';
  unschaerfeEl.style.transition = weich ? 'backdrop-filter .22s ease,-webkit-backdrop-filter .22s ease' : 'none';
  unschaerfeEl.style.backdropFilter = 'blur(' + px + ')';
  unschaerfeEl.style.webkitBackdropFilter = 'blur(' + px + ')';
  unschaerfeEl.style.opacity = '1';
}
function unschaerfeWeg() { unschaerfeSetzen(0, true); }

function vorhangSetzen(el, y) {
  const h = el.clientHeight || window.innerHeight || 640;
  const k = clamp(y, 0, h);
  const f = k / h;
  el.style.transition = 'none';
  /* Undurchsichtig wie ein Tuch – nur die Kante wirft einen Schatten auf das,
     was noch darunter liegt. */
  el.style.clipPath = 'inset(0px 0px ' + (h - k).toFixed(1) + 'px 0px)';
  el.style.transform = 'translateY(' + (-(1 - f) * 6).toFixed(1) + 'px)';
  el.style.filter = 'drop-shadow(0 7px 16px rgba(0,0,0,.42))';
  el.style.opacity = '1';
  unschaerfeSetzen(f);
  return h;
}

function vorhangLoesen(el, auf, fertig) {
  const h = el.clientHeight || window.innerHeight || 640;
  el.style.transition = 'clip-path .26s cubic-bezier(.2,.8,.3,1),'
    + 'transform .26s cubic-bezier(.2,.8,.3,1),opacity .2s ease';
  el.style.clipPath = auf ? 'inset(0px 0px 0px 0px)' : 'inset(0px 0px ' + h + 'px 0px)';
  el.style.transform = auf ? 'translateY(0px)' : 'translateY(-6px)';
  unschaerfeSetzen(auf ? 1 : 0, true);
  setTimeout(() => {
    if (auf && el.isConnected) {
      el.style.transition = ''; el.style.clipPath = '';
      el.style.transform = ''; el.style.opacity = ''; el.style.filter = '';
      el.classList.remove('zieht');
    }
    /* Liegt die Ebene ganz oben, verdeckt sie den Grund ohnehin. */
    unschaerfeWeg();
    if (fertig) fertig();
  }, auf ? 280 : 240);
}

/* Zurückschieben von unten nach oben. Damit das Blättern in der Liste heil
   bleibt, beginnt der Zug an der Kopfzeile oder dort, wo nichts mehr zu
   scrollen ist. */
/* Eine Ebene vom linken Rand nach rechts wegziehen – wie das Zurückwischen
   auf dem Telefon. Sie folgt 1:1, der Grund dahinter wird dabei wieder scharf.
   Der Zug beginnt bewusst am Rand: mitten auf der Fläche blättern Karten,
   Seiten und Bahnen. */
function ebeneZiehen(node) {
  let x0 = null, y0 = 0, zieht = false, ab = 0, breite = 1, weg = 0;
  let letztX = 0, letztT = 0, tempo = 0;

  const setzen = (x) => {
    node.style.transition = 'none';
    node.style.transform = 'translateX(' + x.toFixed(1) + 'px)';
    node.style.willChange = 'transform';
    unschaerfeSetzen(1 - clamp(x / breite, 0, 1));
  };

  node.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || window.__zieht) { x0 = null; return; }
    const t = e.touches[0];
    /* Nur vom linken Rand aus. */
    if (t.clientX > 30) { x0 = null; return; }
    x0 = t.clientX; y0 = t.clientY;
    zieht = false; weg = 0;
    breite = node.getBoundingClientRect().width || window.innerWidth || 360;
    letztX = x0; letztT = Date.now(); tempo = 0;
  }, { passive: true });

  node.addEventListener('touchmove', e => {
    if (x0 == null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (!zieht) {
      if (dx < -8 || (dy > 16 && dy > Math.abs(dx))) { x0 = null; return; }
      if (dx < 12) return;
      zieht = true; ab = dx; window.__zieht = true;
      unschaerfeSetzen(1);
    }
    e.preventDefault();
    const jetzt = Date.now();
    if (jetzt > letztT) { tempo = (t.clientX - letztX) / (jetzt - letztT); letztX = t.clientX; letztT = jetzt; }
    weg = Math.max(0, dx - ab);
    setzen(weg);
  }, { passive: false });

  const los = () => {
    if (x0 == null) return;
    x0 = null;
    if (!zieht) return;
    zieht = false;
    const zu = weg > Math.max(80, breite * 0.26) || tempo > 0.45;
    node.style.transition = 'transform .26s cubic-bezier(.2,.8,.3,1)';
    if (zu) {
      node.style.transform = 'translateX(' + Math.ceil(breite) + 'px)';
      unschaerfeSetzen(0, true);
      setTimeout(() => { window.__zieht = false; layerSchliessen(); }, 200);
    } else {
      node.style.transform = 'translateX(0)';
      unschaerfeSetzen(1, true);
      setTimeout(() => {
        window.__zieht = false;
        node.style.transition = ''; node.style.transform = ''; node.style.willChange = '';
        unschaerfeWeg();
      }, 270);
    }
  };
  node.addEventListener('touchend', los, { passive: true });
  node.addEventListener('touchcancel', los, { passive: true });
}

function vorhangHochBinden(node, koerper) {
  let y0 = null, x0 = 0, zieht = false, ab = 0, hoehe = 1, zu = false;
  let letztY = 0, letztT = 0, tempo = 0;

  const darf = (ziel) => {
    if (ziel && ziel.closest && ziel.closest('.ovl-head')) return true;
    if (!koerper) return true;
    const rest = koerper.scrollHeight - koerper.clientHeight;
    return rest <= 4 || koerper.scrollTop >= rest - 4;
  };
  const fertig = () => { window.__zieht = false; y0 = null; zieht = false; };

  node.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || window.__zieht || !darf(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX;
    zieht = false; zu = false;
    hoehe = node.clientHeight || window.innerHeight || 640;
    letztY = y0; letztT = Date.now(); tempo = 0;
  }, { passive: true });

  node.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const t = e.touches[0], dy = t.clientY - y0, dx = Math.abs(t.clientX - x0);
    if (!zieht) {
      if (dy > 6 || (dx > 14 && dx > Math.abs(dy))) { y0 = null; return; }
      if (dy > -10) return;
      zieht = true; ab = dy; window.__zieht = true;
      node.classList.add('zieht');
    }
    e.preventDefault();
    const jetzt = Date.now();
    if (jetzt > letztT) {
      tempo = (t.clientY - letztY) / (jetzt - letztT);
      letztY = t.clientY; letztT = jetzt;
    }
    const y = hoehe + (dy - ab);
    zu = (hoehe - y) > vorhangSchwelle(hoehe) || tempo < -0.45;
    vorhangSetzen(node, y);
  }, { passive: false });

  const los = () => {
    if (y0 == null) return;
    if (!zieht) { fertig(); return; }
    const schliessen = zu;
    vorhangLoesen(node, !schliessen, () => { if (schliessen) layerSchliessen(); });
    fertig();
  };
  node.addEventListener('touchend', los, { passive: true });
  node.addEventListener('touchcancel', los, { passive: true });
}

/* Die Übersicht liegt nicht mehr in der Tableiste, sondern hinter dem
   Fortschritt im Kopf – antippen oder von dort nach unten ziehen. */
function uebersichtOeffnen(gezogen) {
  if (ueOffen) return null;
  const node = document.createElement('div');
  node.className = 'overlay' + (gezogen ? ' zieht' : '');
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif">Übersicht</div>
        <div class="ovl-sub" data-sub></div></div>
    </div>
    <div class="ovl-body shell" style="padding:12px 0 40px" data-body></div>`;
  const body = $('[data-body]', node);
  const malen = () => {
    const bs = buecherAktiv();
    const gel = bs.filter(b => b.status === 'gelesen').length;
    $('[data-sub]', node).textContent = (aktiverPlan() ? aktiverPlan().name + ' · ' : '')
      + gel + ' von ' + pl(bs.length, 'Werk', 'Werken') + ' gelesen';
    uebersichtMalen(body, malen);
  };
  $('[data-back]', node).onclick = () => layerSchliessen();
  /* Wieder wegschieben: von unten nach oben, derselbe Vorhang rückwärts. */
  vorhangHochBinden(node, body);
  layerOeffnen(node, () => { ueOffen = null; });
  ueOffen = malen;
  malen();
  return node;
}

function uebersichtMalen(root, neuMalen) {
  const unter = [['zahlen', 'Zahlen'], ['zusammen', 'Zusammenfassungen'], ['autoren', 'Autoren'], ['tage', 'Tage']];
  root.innerHTML = `
    <div class="chiprow">
      ${unter.map(([k, l]) => `<button class="chip" data-ub="${k}" aria-pressed="${uebersichtUnter === k}">${l}</button>`).join('')}
    </div>
    <div id="ueInhalt" style="margin-top:14px"></div>`;
  $$('[data-ub]', root).forEach(c => c.onclick = () => {
    uebersichtUnter = c.dataset.ub;
    (neuMalen || viewMalen)();
  });
  const ziel = $('#ueInhalt', root);
  if (uebersichtUnter === 'zahlen') zahlenMalen(ziel);
  else if (uebersichtUnter === 'zusammen') zusammenfassungenMalen(ziel);
  else if (uebersichtUnter === 'autoren') autorenMalen(ziel);
  else tageMalen(ziel);
}

/* Kleine Punktreihe für den Schwierigkeitsgrad. */
function stufeHtml(n) {
  if (!n) return '';
  return '<span class="stufe" title="Schwierigkeit ' + n + ' von 5">' +
    [1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'an' : ''}"></i>`).join('') + '</span>';
}
const STUFEN = { 1: 'leicht', 2: 'überschaubar', 3: 'fordernd', 4: 'schwer', 5: 'sehr schwer' };

/* Je Block die Bücher, jedes zum Auf- und Zuklappen. */
function zusammenfassungenMalen(root) {
  const bloecke = bloeckeSortiert();
  if (!bloecke.length) {
    root.innerHTML = `<div class="empty"><strong>Nichts zusammenzufassen</strong>Sobald Blöcke und Bücher da sind, stehen hier alle Beschreibungen untereinander.</div>`;
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'section';
  root.appendChild(wrap);
  bloecke.forEach((blk, i) => {
    const bs = buecherIn(blk.id);
    if (!bs.length) return;
    wrap.insertAdjacentHTML('beforeend',
      `<div class="blockkopf"><h3>${String(i + 1).padStart(2, '0')} · ${esc(blk.name)}</h3><span class="eyebrow">${pl(bs.length, 'Werk', 'Werke')}</span></div>`);
    bs.forEach(b => {
      const d = document.createElement('details');
      d.className = 'akk';
      d.innerHTML = `
        <summary>
          <span class="grow" style="flex:1;min-width:0">
            <span class="at">${esc(b.titel)}</span>
            ${b.kurz ? `<span class="ak">${esc(b.kurz)}</span>` : ''}
            <span class="am">
              <span>${esc(b.autor)}</span>
              ${b.jahr != null ? `<span class="num">${esc(jahrText(b.jahr))}</span>` : ''}
              ${b.seiten ? `<span class="num">${b.seitenUnsicher ? '~' : ''}${b.seiten} S.</span>` : ''}
              ${b.schwierigkeit ? stufeHtml(b.schwierigkeit) : ''}
            </span>
          </span>
          <span class="chev">${ICON.chev}</span>
        </summary>
        <div class="ab">${b.beschreibung ? esc(b.beschreibung).replace(/\n/g, '<br>') : '<em style="color:var(--text-3)">Noch keine Beschreibung.</em>'}</div>`;
      d.querySelector('.ab').addEventListener('click', () => buchOeffnen(b.id));
      wrap.appendChild(d);
    });
  });
}

/* ---------- Autoren ---------- */
function ersterSatz(text, max) {
  if (!text) return '';
  const m = String(text).match(/^[^.!?]*[.!?]/);
  let t = (m ? m[0] : String(text)).trim();
  if (max && t.length > max) t = t.slice(0, max - 1).replace(/\s+\S*$/, '') + '…';
  return t;
}

/* Autoren aus einer Buchmenge, mit Lebensdaten, Biographie und Einflüssen. */
function autorenIndex(buecher) {
  const map = new Map();
  buecher.forEach(b => {
    const liste = buchAutoren(b);
    (liste.length ? liste : [{ name: 'Ohne Autor', geb: null, gest: null, bio: '', einfluss: [] }]).forEach(a => {
      const name = a.name || 'Ohne Autor';
      if (!map.has(name)) map.set(name, { name, buecher: [], geb: null, gest: null, bio: '', einfluss: [] });
      const e = map.get(name);
      if (!e.buecher.includes(b)) e.buecher.push(b);
      if (e.geb == null && a.geb != null) e.geb = a.geb;
      if (e.gest == null && a.gest != null) e.gest = a.gest;
      if (!e.bio && a.bio) e.bio = a.bio;
      (a.einfluss || []).forEach(x => { if (!e.einfluss.includes(x)) e.einfluss.push(x); });
    });
  });
  return map;
}
/* Namen aus der Einflussliste auf die Autoren der Liste abbilden. */
function autorAufloesen(map, name) {
  if (map.has(name)) return name;
  const treffer = Array.from(map.keys()).filter(k => k === name || k.startsWith(name + ' ') || k.startsWith(name + ','));
  return treffer.length === 1 ? treffer[0] : null;
}
/* Wen hat wer beeinflusst – die Umkehrung der Einflussangaben. */
function einflussAufIndex(map) {
  const inv = new Map();
  map.forEach(a => a.einfluss.forEach(q => {
    const ziel = autorAufloesen(map, q);
    if (!ziel) return;
    if (!inv.has(ziel)) inv.set(ziel, []);
    if (!inv.get(ziel).includes(a.name)) inv.get(ziel).push(a.name);
  }));
  return inv;
}

function autorenMalen(root) {
  const bloecke = bloeckeSortiert();
  const alle = autorenIndex(buecherAktiv());
  const inv = einflussAufIndex(alle);

  const wrap = document.createElement('div');
  wrap.className = 'section';
  wrap.innerHTML = `
    <div class="section-head"><h2>Autoren</h2><span class="eyebrow">${alle.size}</span></div>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn" data-netz style="flex:1">${ICON.tags} Vernetzung</button>
      <button class="btn" data-zeit style="flex:1">${ICON.chart} Zeitstrahl</button>
    </div>`;
  root.appendChild(wrap);
  $('[data-netz]', wrap).onclick = () => netzOeffnen();
  $('[data-zeit]', wrap).onclick = () => zeitstrahlOeffnen();

  if (!alle.size) {
    wrap.insertAdjacentHTML('beforeend',
      `<div class="empty" style="margin:0"><strong>Noch keine Autoren</strong>Sie ergeben sich aus den Büchern deiner Liste.</div>`);
    return;
  }

  const gezeigt = new Set();
  bloecke.forEach((blk, i) => {
    const bs = buecherIn(blk.id);
    if (!bs.length) return;
    const namen = [];
    bs.forEach(b => buchAutoren(b).forEach(a => {
      const n = a.name || 'Ohne Autor';
      if (!namen.includes(n)) namen.push(n);
    }));
    if (!namen.length) return;
    wrap.insertAdjacentHTML('beforeend',
      `<div class="blockkopf"><h3>${String(i + 1).padStart(2, '0')} · ${esc(blk.name)}</h3><span class="eyebrow">${pl(namen.length, 'Autor', 'Autoren')}</span></div>`);
    namen.forEach(n => {
      gezeigt.add(n);
      wrap.appendChild(autorZeile(alle.get(n), alle, inv, bs));
    });
  });

  /* Autoren aus Büchern ohne gültigen Block */
  const rest = Array.from(alle.values()).filter(a => !gezeigt.has(a.name));
  if (rest.length) {
    wrap.insertAdjacentHTML('beforeend', `<div class="blockkopf"><h3>Ohne Block</h3><span class="eyebrow">${rest.length}</span></div>`);
    rest.forEach(a => wrap.appendChild(autorZeile(a, alle, inv, null)));
  }
}

function autorZeile(a, alle, inv, nurAusBlock) {
  if (!a) return document.createElement('div');
  const lebt = lebensdaten(a.geb, a.gest);
  const werke = nurAusBlock ? a.buecher.filter(b => nurAusBlock.includes(b)) : a.buecher;
  const wirkt = (inv.get(a.name) || []).length;
  const kurz = ersterSatz(a.bio, 160);

  const node = document.createElement('div');
  node.className = 'arow';
  node.innerHTML = `
    <button class="apane" data-auf>
      <span class="ai">
        <span class="an">${esc(a.name)}</span>
        <span class="am">
          ${lebt ? `<span class="num">${esc(lebt)}</span>` : ''}
          <span>${pl(werke.length, 'Werk', 'Werke')}</span>
          <span>${werke.filter(b => b.status === 'gelesen').length} gelesen</span>
          ${wirkt ? `<span style="color:var(--wirkt)">wirkt auf ${wirkt}</span>` : ''}
        </span>
      </span>
      <span class="chev">${ICON.chev}</span>
    </button>
    <div class="apane">
      <span class="ai">
        <span class="kt">In Kürze</span>
        <span class="kx">${kurz ? esc(kurz) : '<em style="color:var(--text-3)">Noch keine Biographie.</em>'}</span>
      </span>
    </div>`;
  $('[data-auf]', node).onclick = () => autorOeffnen(a, alle, inv);
  return node;
}

/* Ein Autor als eigene Ansicht: Biographie, Einflüsse, Werke. */
function autorOeffnen(a, alle, inv) {
  const node = document.createElement('div');
  node.className = 'overlay';
  node.innerHTML = `
    <div class="ovl-head">
      <button class="icon-btn" data-back>${ICON.back}</button>
      <div class="grow"><div class="ovl-title serif" data-t></div><div class="ovl-sub" data-s></div></div>
      <button class="icon-btn" data-bio aria-label="Bearbeiten">${ICON.edit}</button>
    </div>
    <div class="ovl-body" style="padding:14px 14px 40px" data-b></div>`;

  const malen = () => {
    const frisch = autorenIndex(buecherAktiv());
    const inv2 = einflussAufIndex(frisch);
    const akt = frisch.get(a.name) || a;
    $('[data-t]', node).textContent = akt.name;
    $('[data-s]', node).textContent = [lebensdaten(akt.geb, akt.gest), pl(akt.buecher.length, 'Werk', 'Werke')].filter(Boolean).join(' · ');

    const von = akt.einfluss;
    const auf = inv2.get(akt.name) || [];
    const chip = (n, klickbar) => `<span class="en${klickbar ? ' link' : ''}"${klickbar ? ` data-spring="${esc(n)}"` : ''}>${esc(n)}</span>`;

    const b = $('[data-b]', node);
    b.innerHTML = `
      ${akt.bio
        ? `<p class="desc">${esc(akt.bio).replace(/\n/g, '<br>')}</p>`
        : `<div class="empty" style="margin:0"><strong>Noch keine Biographie</strong>Ein paar Sätze zum Leben – wer war das, und woraus kommt dieses Buch?</div>`}
      <div class="einfluss" style="margin-top:16px">
        <div>
          <div class="eg">Beeinflusst von</div>
          <div class="er">${von.length
        ? von.map(n => chip(n, !!autorAufloesen(frisch, n))).join('')
        : '<span class="en" style="opacity:.6">nichts eingetragen</span>'}</div>
        </div>
        <div class="wirkt">
          <div class="eg">Wirkt auf</div>
          <div class="er">${auf.length
        ? auf.map(n => chip(n, true)).join('')
        : '<span class="en" style="opacity:.6">niemanden in dieser Liste</span>'}</div>
        </div>
      </div>
      <div class="section-head" style="margin:20px 0 9px"><h2>Werke in deinen Listen</h2><span class="eyebrow">${akt.buecher.length}</span></div>
      <div data-werke></div>`;

    const w = $('[data-werke]', b);
    akt.buecher.forEach(x => {

          <span class="gname serif">${esc(x.titel)}</span>

        </span><span class="chev">${ICON.chev}</span>`;

    $$('[data-spring]', b).forEach(x => x.onclick = () => {

  $('[data-back]', node).onclick = () => layerSchliessen();
  $('[data-bio]', node).onclick = () => autorBearbeiten(a, () => { malen(); viewMalen(); });
